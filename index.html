. 오른손 규칙으로 AB는 아래쪽, CD는 위쪽으로 힘을 받아 앞에서 볼 때 시계 반대 방향으로 돈다. [코일의 극으로] A→B→C→D로 흐르는 전류를 오른손으로 감아쥐면 엄지가 아래쪽을 향하므로 코일의 아랫면이 N극이 된다. 아랫면 N극은 왼쪽 N극에 밀리고 오른쪽 S극에 끌려 오른쪽으로 돌아가므로 역시 시계 반대 방향이다. ㄴ. 전류 세기는 회전 속력만 바꾼다. ㄷ. 자기장의 방향만 바꾸면 회전 방향이 반대가 된다.", "stimulus_group": "SG-E10"}, {"id": "전기와자기:G-016", "sub": "G", "type_id": "G05", "review_group": "RG26", "role": "main", "difficulty": "상", "format": "5지선다", "stem": "그림 (가)는 왼쪽 N극과 오른쪽 S극 사이에 놓인 사각형 코일 ABCD에 A→B→C→D 방향으로 전류가 흐를 때 AB는 아래쪽, CD는 위쪽으로 힘을 받는 모습이다. (나)는 (가)에서 자석의 두 극을 서로 바꾸고, 전류도 D→C→B→A 방향으로 바꾸어 흘린 것이다. (나)에 대한 설명으로 옳은 것은? (단, A, D는 앞쪽, B, C는 뒤쪽이고 코일은 AB와 나란한 축을 중심으로 돌 수 있다.)", "figure_svg": "<svg style=\"background:#fff\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 520 260\" fill=\"none\" stroke=\"#000\" stroke-width=\"1.5\" font-size=\"13\" font-family=\"sans-serif\"><text x=\"10\" y=\"20\" fill=\"#000\" stroke=\"none\">(가) 왼쪽 N, 오른쪽 S, 전류 A→B→C→D<\/text><text x=\"10\" y=\"40\" fill=\"#000\" stroke=\"none\">(나) 왼쪽 S, 오른쪽 N, 전류 D→C→B→A<\/text><g transform=\"translate(0,20) scale(1,0.95)\"><rect x=\"30\" y=\"70\" width=\"70\" height=\"140\" fill=\"#000\" fill-opacity=\"0.08\"/><text x=\"65.0\" y=\"145.0\" fill=\"#000\" stroke=\"none\" font-size=\"16\" text-anchor=\"middle\">S<\/text><rect x=\"420\" y=\"70\" width=\"70\" height=\"140\" fill=\"#000\" fill-opacity=\"0.35\"/><text x=\"455.0\" y=\"145.0\" fill=\"#000\" stroke=\"none\" font-size=\"16\" text-anchor=\"middle\">N<\/text><polygon points=\"175,175 215,105 345,105 305,175\" stroke-width=\"2\"/><line x1=\"225\" y1=\"205\" x2=\"295\" y2=\"75\" stroke-dasharray=\"5 4\" stroke-width=\"1\"/><text x=\"300\" y=\"72\" fill=\"#000\" stroke=\"none\" font-size=\"11\">회전축<\/text><text x=\"159\" y=\"191\" fill=\"#000\" stroke=\"none\" font-size=\"14\">A<\/text><text x=\"199\" y=\"99\" fill=\"#000\" stroke=\"none\" font-size=\"14\">B<\/text><text x=\"353\" y=\"99\" fill=\"#000\" stroke=\"none\" font-size=\"14\">C<\/text><text x=\"313\" y=\"191\" fill=\"#000\" stroke=\"none\" font-size=\"14\">D<\/text><line x1=\"320.03861061643164\" y1=\"148.6824314212446\" x2=\"329.96138938356836\" y2=\"131.3175685787554\" stroke-width=\"2\"/><polygon points=\"330.0,131.3 330.0,139.3 323.1,135.3\" fill=\"#000\" stroke=\"none\"/><line x1=\"290.0\" y1=\"105.0\" x2=\"270.0\" y2=\"105.0\" stroke-width=\"2\"/><polygon points=\"270.0,105.0 276.9,101.0 276.9,109.0\" fill=\"#000\" stroke=\"none\"/><line x1=\"199.96138938356833\" y1=\"131.3175685787554\" x2=\"190.03861061643167\" y2=\"148.6824314212446\" stroke-width=\"2\"/><polygon points=\"190.0,148.7 190.0,140.7 196.9,144.7\" fill=\"#000\" stroke=\"none\"/><line x1=\"230.0\" y1=\"175.0\" x2=\"250.0\" y2=\"175.0\" stroke-width=\"2\"/><polygon points=\"250.0,175.0 243.1,179.0 243.1,171.0\" fill=\"#000\" stroke=\"none\"/><text x=\"200\" y=\"232\" fill=\"#000\" stroke=\"none\" font-size=\"11\">앞(D, A 쪽)에서 바라보는 사람<\/text><\/g><text x=\"10\" y=\"255\" fill=\"#000\" stroke=\"none\" font-size=\"11\">그림은 (나)의 모습이다.<\/text><\/svg>", "choices": ["AB와 CD는 같은 방향으로 힘을 받는다.", "BC는 아래쪽으로 힘을 받는다.", "앞(D, A 쪽)에서 볼 때 코일은 (가)와 반대인 시계 방향으로 회전한다.", "AB는 위쪽으로 힘을 받고, 코일은 앞에서 볼 때 시계 방향으로 회전한다.", "AB는 아래쪽으로 힘을 받고, 코일은 앞에서 볼 때 시계 반대 방향으로 회전한다."], "answer": [5], "explanation": "(가)에서 AB 아래·CD 위이므로 앞에서 볼 때 시계 반대 방향으로 돈다. (나)는 전류의 방향과 자기장의 방향을 모두 바꾸었으므로 각 변이 받는 힘의 방향은 (가)와 같다. 따라서 AB는 아래쪽, CD는 위쪽으로 힘을 받고 코일은 여전히 시계 반대 방향으로 회전한다. BC와 DA는 자기장과 나란하여 힘을 받지 않는다."}, {"id": "전기와자기:G-017", "sub": "G", "type_id": "G05", "review_group": "RG26", "role": "reserve", "difficulty": "상", "format": "서술형", "stem": "그림은 왼쪽 N극과 오른쪽 S극 사이에 사각형 코일 ABCD를 자기장과 나란하게(수평으로) 놓고 D→C→B→A 방향으로 전류를 흘린 모습이다. A, D는 앞쪽, B, C는 뒤쪽이며, 코일은 AB와 나란한 회전축을 중심으로 돌 수 있다. 앞(D, A 쪽)에서 볼 때 코일이 회전하는 방향을 쓰고, 그 까닭을 서술하시오. (단, 까닭은 AB와 CD가 받는 힘을 이용하거나, 코일에 생기는 극과 자석의 극을 이용하여 서술한다.)", "figure_svg": "<svg style=\"background:#fff\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 520 245\" fill=\"none\" stroke=\"#000\" stroke-width=\"1.5\" font-size=\"13\" font-family=\"sans-serif\"><rect x=\"30\" y=\"70\" width=\"70\" height=\"140\" fill=\"#000\" fill-opacity=\"0.35\"/><text x=\"65.0\" y=\"145.0\" fill=\"#000\" stroke=\"none\" font-size=\"16\" text-anchor=\"middle\">N<\/text><rect x=\"420\" y=\"70\" width=\"70\" height=\"140\" fill=\"#000\" fill-opacity=\"0.08\"/><text x=\"455.0\" y=\"145.0\" fill=\"#000\" stroke=\"none\" font-size=\"16\" text-anchor=\"middle\">S<\/text><polygon points=\"175,175 215,105 345,105 305,175\" stroke-width=\"2\"/><line x1=\"225\" y1=\"205\" x2=\"295\" y2=\"75\" stroke-dasharray=\"5 4\" stroke-width=\"1\"/><text x=\"300\" y=\"72\" fill=\"#000\" stroke=\"none\" font-size=\"11\">회전축<\/text><text x=\"159\" y=\"191\" fill=\"#000\" stroke=\"none\" font-size=\"14\">A<\/text><text x=\"199\" y=\"99\" fill=\"#000\" stroke=\"none\" font-size=\"14\">B<\/text><text x=\"353\" y=\"99\" fill=\"#000\" stroke=\"none\" font-size=\"14\">C<\/text><text x=\"313\" y=\"191\" fill=\"#000\" stroke=\"none\" font-size=\"14\">D<\/text><line x1=\"320.03861061643164\" y1=\"148.6824314212446\" x2=\"329.96138938356836\" y2=\"131.3175685787554\" stroke-width=\"2\"/><polygon points=\"330.0,131.3 330.0,139.3 323.1,135.3\" fill=\"#000\" stroke=\"none\"/><line x1=\"290.0\" y1=\"105.0\" x2=\"270.0\" y2=\"105.0\" stroke-width=\"2\"/><polygon points=\"270.0,105.0 276.9,101.0 276.9,109.0\" fill=\"#000\" stroke=\"none\"/><line x1=\"199.96138938356833\" y1=\"131.3175685787554\" x2=\"190.03861061643167\" y2=\"148.6824314212446\" stroke-width=\"2\"/><polygon points=\"190.0,148.7 190.0,140.7 196.9,144.7\" fill=\"#000\" stroke=\"none\"/><line x1=\"230.0\" y1=\"175.0\" x2=\"250.0\" y2=\"175.0\" stroke-width=\"2\"/><polygon points=\"250.0,175.0 243.1,179.0 243.1,171.0\" fill=\"#000\" stroke=\"none\"/><text x=\"200\" y=\"232\" fill=\"#000\" stroke=\"none\" font-size=\"11\">앞(D, A 쪽)에서 바라보는 사람<\/text><\/svg>", "answer": "시계 방향. [변의 힘] 자기장은 오른쪽이고 AB에는 뒤에서 앞으로, CD에는 앞에서 뒤로 전류가 흐르므로 AB는 위쪽, CD는 아래쪽으로 힘을 받아 시계 방향으로 돈다. [극] D→C→B→A로 흐르는 전류에 의해 코일의 윗면이 N극, 아랫면이 S극이 되고, 윗면 N극이 오른쪽 S극에 끌리고 왼쪽 N극에 밀려 시계 방향으로 돈다.", "scoring": "상(3점): 시계 방향을 쓰고 두 방식 중 하나로 근거(두 변의 반대 방향 힘, 또는 코일 극과 자석 극의 인력·척력)를 옳게 서술. 중(2점): 방향과 근거 중 일부(예: 한 변의 힘만)만 서술. 하(1점): 방향만 맞음. 두 변이 같은 방향의 힘을 받는다고 쓰면 근거 점수 없음.", "explanation": "전류 A→B→C→D일 때(시계 반대 방향)와 비교하면 전류의 방향만 반대로 바뀌었으므로 회전 방향도 반대가 된다. 두 풀이 방식 모두 정답으로 인정한다(TD02).", "stimulus_group": "SG-E10"}, {"id": "전기와자기:G-018", "sub": "G", "type_id": "G05", "review_group": "RG26", "role": "reserve", "difficulty": "중", "format": "5지선다", "stem": "그림과 같이 왼쪽 N극과 오른쪽 S극 사이에 수평으로 놓인 사각형 코일에 전류를 흘렸더니, 코일은 아랫면이 N극, 윗면이 S극인 전자석이 되었다. 앞에서 볼 때 코일이 처음 회전하는 방향과 그 까닭을 옳게 짝지은 것은? (단, 코일은 앞뒤 방향의 축을 중심으로 돌 수 있다.)", "figure_svg": "<svg style=\"background:#fff\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 480 200\" fill=\"none\" stroke=\"#000\" stroke-width=\"1.5\" font-size=\"13\" font-family=\"sans-serif\"><rect x=\"30\" y=\"50\" width=\"70\" height=\"120\" fill=\"#000\" fill-opacity=\"0.35\"/><text x=\"65.0\" y=\"115.0\" fill=\"#000\" stroke=\"none\" font-size=\"16\" text-anchor=\"middle\">N<\/text><rect x=\"380\" y=\"50\" width=\"70\" height=\"120\" fill=\"#000\" fill-opacity=\"0.08\"/><text x=\"415.0\" y=\"115.0\" fill=\"#000\" stroke=\"none\" font-size=\"16\" text-anchor=\"middle\">S<\/text><rect x=\"150\" y=\"104\" width=\"180\" height=\"12\" fill=\"#000\" fill-opacity=\"0.15\"/><text x=\"240\" y=\"96\" fill=\"#000\" stroke=\"none\" font-size=\"12\" text-anchor=\"middle\">윗면: S극<\/text><text x=\"240\" y=\"136\" fill=\"#000\" stroke=\"none\" font-size=\"12\" text-anchor=\"middle\">아랫면: N극<\/text><circle cx=\"240\" cy=\"110\" r=\"3\" fill=\"#000\" stroke=\"none\"/><text x=\"240\" y=\"190\" fill=\"#000\" stroke=\"none\" font-size=\"11\" text-anchor=\"middle\">앞에서 본 모습(가운데 점이 회전축)<\/text><\/svg>", "choices": ["시계 방향, 아랫면의 N극이 왼쪽 N극에 밀리고 오른쪽 S극에 끌리기 때문", "시계 방향, 아랫면의 N극이 왼쪽 N극에 끌리기 때문", "회전하지 않는다, 코일과 자석 사이에 전기력만 작용하기 때문", "회전하지 않고 코일 전체가 위로 떠오른다, 아랫면 N극이 바닥에 밀리기 때문", "시계 반대 방향, 아랫면의 N극이 왼쪽 N극에 밀리고 오른쪽 S극에 끌리기 때문"], "answer": [5], "explanation": "코일의 아랫면 N극은 왼쪽 자석의 N극과는 밀어 내고 오른쪽 자석의 S극과는 끌어당긴다. 그래서 아랫면이 오른쪽을 향하도록, 앞에서 볼 때 시계 반대 방향으로 돈다. (변의 힘으로 풀어도 왼쪽 변은 아래쪽, 오른쪽 변은 위쪽으로 힘을 받아 같은 결론이다.)"}, {"id": "전기와자기:G-019", "sub": "G", "type_id": "G06", "review_group": "RG27", "role": "main", "difficulty": "하", "format": "5지선다", "stem": "전동기에는 코일이 반 바퀴 돌 때마다 코일에 흐르는 전류의 방향을 바꾸어 주는 장치가 있다. 이 장치가 하는 역할로 옳은 것은?", "choices": ["코일에 흐르는 전류의 세기를 크게 한다.", "코일이 한 방향으로 계속 회전하게 한다.", "반 바퀴마다 자석의 극을 바꾸어 준다.", "전기 에너지를 열에너지로 바꾸어 준다.", "반 바퀴마다 코일의 회전 방향을 바꾸어 준다."], "answer": [2], "explanation": "코일이 반 바퀴 돌면 두 변의 위치가 바뀌어, 전류 방향이 그대로라면 코일을 반대로 돌리는 힘이 작용한다. 반 바퀴마다 전류의 방향을 바꾸어 주면 코일이 계속 같은 방향으로 회전한다. 이 장치는 전류의 세기나 자석의 극을 바꾸지 않는다."}, {"id": "전기와자기:G-020", "sub": "G", "type_id": "G06", "review_group": "RG27", "role": "main", "difficulty": "중", "format": "합답형", "stem": "그림은 전동기의 구조를 나타낸 것이다. 코일의 양 끝은 정류자에 연결되어 있고, 정류자는 브러시를 통해 전원과 연결된다. 이에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?", "bogi": ["ㄱ. 정류자는 코일이 반 바퀴 돌 때마다 코일에 흐르는 전류의 방향을 바꾸어 준다.", "ㄴ. 정류자는 코일에 흐르는 전류의 세기를 크게 하여 코일을 더 빨리 돌게 한다.", "ㄷ. 정류자가 없이 코일의 양 끝을 전원에 직접 연결하면 코일은 한 방향으로 계속 돌지 못하고 흔들리다 멈춘다."], "figure_svg": "<svg style=\"background:#fff\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 480 240\" fill=\"none\" stroke=\"#000\" stroke-width=\"1.5\" font-size=\"13\" font-family=\"sans-serif\"><rect x=\"30\" y=\"40\" width=\"70\" height=\"120\" fill=\"#000\" fill-opacity=\"0.35\"/><text x=\"65.0\" y=\"105.0\" fill=\"#000\" stroke=\"none\" font-size=\"16\" text-anchor=\"middle\">N<\/text><rect x=\"380\" y=\"40\" width=\"70\" height=\"120\" fill=\"#000\" fill-opacity=\"0.08\"/><text x=\"415.0\" y=\"105.0\" fill=\"#000\" stroke=\"none\" font-size=\"16\" text-anchor=\"middle\">S<\/text><polygon points=\"170,140 210,70 330,70 290,140\" stroke-width=\"2\"/><path d=\"M238,174.13 A16,16 0 0,0 238,205.87 L238,198.77 A9,9 0 0,1 238,181.23 Z\" stroke-width=\"2\" fill=\"#000\" fill-opacity=\"0.12\"/><path d=\"M242,174.13 A16,16 0 0,1 242,205.87 L242,198.77 A9,9 0 0,0 242,181.23 Z\" stroke-width=\"2\" fill=\"#000\" fill-opacity=\"0.12\"/><line x1=\"232\" y1=\"140\" x2=\"232\" y2=\"176.14\"/><line x1=\"248\" y1=\"140\" x2=\"248\" y2=\"176.14\"/><rect x=\"210\" y=\"183\" width=\"14\" height=\"14\" fill=\"#000\" fill-opacity=\"0.3\"/><rect x=\"256\" y=\"183\" width=\"14\" height=\"14\" fill=\"#000\" fill-opacity=\"0.3\"/><text x=\"240\" y=\"228\" fill=\"#000\" stroke=\"none\" font-size=\"11\" text-anchor=\"middle\">정류자<\/text><text x=\"196\" y=\"214\" fill=\"#000\" stroke=\"none\" font-size=\"11\" text-anchor=\"middle\">브러시<\/text><text x=\"284\" y=\"214\" fill=\"#000\" stroke=\"none\" font-size=\"11\" text-anchor=\"middle\">브러시<\/text><line x1=\"210\" y1=\"190\" x2=\"140\" y2=\"190\"/><line x1=\"270\" y1=\"190\" x2=\"340\" y2=\"190\"/><text x=\"240\" y=\"60\" fill=\"#000\" stroke=\"none\" font-size=\"11\" text-anchor=\"middle\">코일<\/text><\/svg>", "choices": ["ㄱ", "ㄴ", "ㄱ, ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ"], "answer": [4], "explanation": "ㄱ. 옳다. 정류자와 브러시는 반 바퀴마다 코일의 전류 방향을 바꾸어 같은 방향의 회전을 유지한다. ㄴ. 정류자는 전류의 세기를 바꾸지 않는다. ㄷ. 옳다. 정류자가 없으면 반 바퀴 뒤 코일을 반대로 돌리는 힘을 받아 제자리에서 흔들리다 멈춘다.", "textbook_tags": {"mode": "include_only", "books": ["오투", "체크체크", "지학사", "동아", "천재정"]}}, {"id": "전기와자기:G-021", "sub": "G", "type_id": "G06", "review_group": "RG27", "role": "main", "difficulty": "최상", "format": "5지선다", "stem": "그림은 왼쪽 N극과 오른쪽 S극 사이에서 사각형 코일 ABCD에 A→B→C→D 방향으로 전류가 흘러, AB는 아래쪽, CD는 위쪽으로 힘을 받아 앞에서 볼 때 시계 반대 방향으로 회전하기 시작하는 모습이다. 반 바퀴마다 전류의 방향을 바꾸어 주는 장치가 없다고 할 때, 코일이 반 바퀴 돌아 AB가 오른쪽(처음 CD 자리), CD가 왼쪽에 왔을 때에 대한 설명으로 옳은 것은? (단, A, D는 처음에 앞쪽에 있었고, 코일은 AB와 나란한 축을 중심으로 돈다.)", "figure_svg": "<svg style=\"background:#fff\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 520 245\" fill=\"none\" stroke=\"#000\" stroke-width=\"1.5\" font-size=\"13\" font-family=\"sans-serif\"><rect x=\"30\" y=\"70\" width=\"70\" height=\"140\" fill=\"#000\" fill-opacity=\"0.35\"/><text x=\"65.0\" y=\"145.0\" fill=\"#000\" stroke=\"none\" font-size=\"16\" text-anchor=\"middle\">N<\/text><rect x=\"420\" y=\"70\" width=\"70\" height=\"140\" fill=\"#000\" fill-opacity=\"0.08\"/><text x=\"455.0\" y=\"145.0\" fill=\"#000\" stroke=\"none\" font-size=\"16\" text-anchor=\"middle\">S<\/text><polygon points=\"175,175 215,105 345,105 305,175\" stroke-width=\"2\"/><line x1=\"225\" y1=\"205\" x2=\"295\" y2=\"75\" stroke-dasharray=\"5 4\" stroke-width=\"1\"/><text x=\"300\" y=\"72\" fill=\"#000\" stroke=\"none\" font-size=\"11\">회전축<\/text><text x=\"159\" y=\"191\" fill=\"#000\" stroke=\"none\" font-size=\"14\">A<\/text><text x=\"199\" y=\"99\" fill=\"#000\" stroke=\"none\" font-size=\"14\">B<\/text><text x=\"353\" y=\"99\" fill=\"#000\" stroke=\"none\" font-size=\"14\">C<\/text><text x=\"313\" y=\"191\" fill=\"#000\" stroke=\"none\" font-size=\"14\">D<\/text><line x1=\"190.03861061643167\" y1=\"148.6824314212446\" x2=\"199.96138938356833\" y2=\"131.3175685787554\" stroke-width=\"2\"/><polygon points=\"200.0,131.3 200.0,139.3 193.1,135.3\" fill=\"#000\" stroke=\"none\"/><line x1=\"270.0\" y1=\"105.0\" x2=\"290.0\" y2=\"105.0\" stroke-width=\"2\"/><polygon points=\"290.0,105.0 283.1,109.0 283.1,101.0\" fill=\"#000\" stroke=\"none\"/><line x1=\"329.96138938356836\" y1=\"131.3175685787554\" x2=\"320.03861061643164\" y2=\"148.6824314212446\" stroke-width=\"2\"/><polygon points=\"320.0,148.7 320.0,140.7 326.9,144.7\" fill=\"#000\" stroke=\"none\"/><line x1=\"250.0\" y1=\"175.0\" x2=\"230.0\" y2=\"175.0\" stroke-width=\"2\"/><polygon points=\"230.0,175.0 236.9,171.0 236.9,179.0\" fill=\"#000\" stroke=\"none\"/><text x=\"200\" y=\"232\" fill=\"#000\" stroke=\"none\" font-size=\"11\">앞(D, A 쪽)에서 바라보는 사람<\/text><\/svg>", "choices": ["AB는 위쪽으로 힘을 받으므로 코일은 시계 반대 방향으로 계속 회전한다.", "AB와 CD가 모두 아래쪽으로 힘을 받아 코일 전체가 아래로 내려간다.", "AB와 CD 모두 힘을 받지 않으므로 코일은 처음 속력 그대로 계속 회전한다.", "코일에 흐르는 전류가 세지므로 코일은 처음보다 더 빨리 회전한다.", "AB는 여전히 아래쪽으로 힘을 받으므로, 오른쪽에 온 AB가 내려가는 시계 방향으로 되돌리는 힘이 작용하여 코일은 제자리에서 흔들린다."], "answer": [5], "explanation": "코일이 회전축(AB와 나란한 축)을 중심으로 돌아도 AB 속의 전류는 여전히 앞쪽 끝 A에서 뒤쪽 끝 B 방향(종이면으로 들어가는 방향)으로 흐르고, 자기장도 오른쪽 그대로이다. 따라서 AB는 계속 아래쪽, CD는 계속 위쪽으로 힘을 받는다. 그런데 반 바퀴 뒤 AB는 오른쪽, CD는 왼쪽에 있으므로 오른쪽 변이 내려가고 왼쪽 변이 올라가는 시계 방향의 회전, 즉 처음과 반대로 돌리는 힘이 작용한다. 그래서 코일은 한 방향으로 계속 돌지 못하고 제자리에서 흔들린다. 반 바퀴마다 전류 방향을 바꾸면 AB가 위쪽 힘을 받아 시계 반대 방향 회전이 이어진다.", "stimulus_group": "SG-E10"}, {"id": "전기와자기:G-022", "sub": "G", "type_id": "G06", "review_group": "RG27", "role": "reserve", "difficulty": "상", "format": "서술형", "stem": "에나멜선을 감아 만든 코일을 둥근 자석 위의 클립 받침에 걸쳐 간이 전동기를 만들었다. 코일 양 끝의 에나멜 피복은 한쪽 끝은 완전히 벗기고, 다른 쪽 끝은 위쪽 절반만 벗겼다.<br>(1) 한쪽 끝을 반만 벗기면 코일이 한 방향으로 계속 회전할 수 있는 까닭을 서술하시오.<br>(2) 양쪽 끝을 모두 완전히 벗기면 코일이 어떻게 움직이는지 서술하시오.", "answer": "(1) 코일이 반 바퀴 도는 동안에만 전류가 흘러 회전시키는 힘을 받고, 반대 방향의 힘을 받게 되는 나머지 반 바퀴 동안은 피복이 닿아 전류가 흐르지 않으므로 힘을 받지 않고 관성으로 계속 돌기 때문이다. (2) 반 바퀴 돈 뒤 코일이 반대 방향의 힘을 받아 한 방향으로 계속 돌지 못하고 제자리에서 흔들린다(앞뒤로 움직이다 멈춘다).", "scoring": "(1) 3점: \"반 바퀴 동안만 전류가 흐른다(나머지 반 바퀴는 끊긴다)\"와 \"반대 방향 힘을 받지 않고 관성으로 돈다\"를 모두 서술. 하나만 쓰면 2점. (2) 2점: 반대 방향 힘을 받아 흔들린다(계속 돌지 못한다). \"더 빨리 돈다\"는 0점.", "explanation": "간이 전동기에서 반만 벗긴 피복은 정류자처럼 반 바퀴마다 전류를 끊어, 코일을 반대로 돌리는 힘이 작용하지 않게 한다.", "textbook_tags": {"mode": "include_only", "books": ["지학사", "천재정"]}}, {"id": "전기와자기:G-023", "sub": "G", "type_id": "G06", "review_group": "RG27", "role": "reserve", "difficulty": "하", "format": "단답형", "stem": "전동기에서 브러시와 맞닿아 회전하면서, 코일이 반 바퀴 돌 때마다 코일에 흐르는 전류의 방향을 바꾸어 주는 장치의 이름을 쓰시오.", "answer": "정류자", "scoring": "정류자(2점). \"브러시\"만 쓰면 0점.", "explanation": "정류자는 브러시와 함께 반 바퀴마다 코일 전류의 방향을 바꾸어 코일이 한 방향으로 계속 회전하게 한다.", "textbook_tags": {"mode": "include_only", "books": ["오투", "체크체크", "지학사", "동아", "천재정"]}}, {"id": "전기와자기:G-024", "sub": "G", "type_id": "G07", "review_group": "RG28", "role": "main", "difficulty": "하", "format": "보기형(ㄱㄴㄷㄹ)", "stem": "다음 중 전동기를 이용하는 기구만을 <보기>에서 있는 대로 고른 것은?", "bogi": ["ㄱ. 선풍기", "ㄴ. 세탁기", "ㄷ. 전기난로", "ㄹ. LED 스탠드"], "choices": ["ㄱ, ㄴ", "ㄱ, ㄷ", "ㄴ, ㄹ", "ㄷ, ㄹ", "ㄱ, ㄴ, ㄷ"], "answer": [1], "explanation": "선풍기와 세탁기는 전동기로 날개나 통을 돌린다. 전기난로는 전기 에너지를 열에너지로, LED 스탠드는 빛에너지로 바꾸며 전동기를 쓰지 않는다."}, {"id": "전기와자기:G-025", "sub": "G", "type_id": "G07", "review_group": "RG28", "role": "main", "difficulty": "중", "format": "5지선다", "stem": "스피커는 영구 자석과 진동판에 붙은 코일로 이루어져 있다. 스피커에 대한 설명으로 옳은 것은?", "choices": ["스피커는 전동기를 이용하여 진동판을 회전시켜 소리를 낸다.", "코일에 흐르는 전류의 세기와 방향이 계속 바뀌면서 코일이 자석으로부터 받는 힘이 바뀌어 진동판이 떨린다.", "소리를 크게 하려면 코일에 흐르는 전류를 약하게 한다.", "자석이 없어도 코일에 전류만 흐르면 진동판이 떨린다.", "스피커는 소리 에너지를 전기 에너지로 바꾸는 장치이다."], "answer": [2], "explanation": "스피커는 자기장 속에서 전류가 흐르는 코일이 받는 힘을 이용하지만 전동기를 쓰지는 않는다. 전류의 세기와 방향이 바뀌면 힘의 크기와 방향이 바뀌어 코일과 진동판이 떨리고 소리가 난다. 전류가 셀수록 크게 떨려 소리가 커진다. 자석이 없으면 힘을 받지 않는다. 스피커는 전기 에너지를 소리 에너지로 바꾼다."}, {"id": "전기와자기:G-026", "sub": "G", "type_id": "G07", "review_group": "RG28", "role": "main", "difficulty": "중", "format": "합답형", "stem": "다음은 전기 기구의 작동 원리에 대한 학생들의 설명이다. 옳은 것만을 <보기>에서 있는 대로 고른 것은?", "bogi": ["ㄱ. 자기 부상 열차와 MRI는 자기장 속에서 코일이 받는 힘으로 회전하는 전동기를 이용한다.", "ㄴ. 스피커는 자기장 속에서 코일이 받는 힘을 이용하지만, 전동기를 이용하지는 않는다.", "ㄷ. 선풍기와 드론은 전동기를 이용하며, 전기 에너지를 운동 에너지로 바꾼다."], "choices": ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "answer": [4], "explanation": "ㄱ. 자기 부상 열차와 MRI는 전자석을 이용하는 장치이다. ㄴ. 옳다. 스피커는 코일이 받는 힘으로 진동판을 떨게 할 뿐 회전하는 전동기는 없다. ㄷ. 옳다. 전동기는 전기 에너지를 운동 에너지로 바꾸며 선풍기·드론에 쓰인다."}, {"id": "전기와자기:G-027", "sub": "G", "type_id": "G07", "review_group": "RG28", "role": "reserve", "difficulty": "중", "format": "서술형", "stem": "종이컵 바닥에 코일을 붙이고 코일 가까이에 자석을 놓은 뒤, 코일에 소리 신호 전류를 흘려 간이 스피커를 만들었다. 이 스피커에서 나는 소리를 더 크게 하는 방법을 두 가지 서술하시오.", "answer": "코일에 흐르는 전류의 세기를 크게 한다. 더 센 자석을 사용한다. (자석을 코일에 더 가까이 놓기, 코일을 감은 수 늘리기도 인정)", "scoring": "각 2점(서로 다른 방법 두 가지). 인정 답: 코일에 흐르는 전류의 세기를 크게 한다(음량을 키운다), 더 센 자석을 쓴다, 자석을 코일에 더 가까이 놓는다, 코일을 감은 수를 늘린다. \"저항을 크게 한다\", \"전류를 약하게 한다\"는 0점. \"자석의 극을 바꾼다\"는 0점(소리 크기와 무관).", "explanation": "코일이 받는 힘이 클수록 진동판이 크게 떨려 소리가 커진다. 힘은 전류가 셀수록, 자석이 셀수록 크다."}, {"id": "전기와자기:G-028", "sub": "G", "type_id": "G07", "review_group": "RG28", "role": "reserve", "difficulty": "하", "format": "단답형", "stem": "전동기는 전기 에너지를 주로 어떤 에너지로 바꾸는 장치인지 쓰시오.", "answer": "운동 에너지", "scoring": "운동 에너지(2점). \"역학적 에너지\"도 인정. \"전기 에너지\", const ITEMS = {};

function eligible(q) {

const LV = { "하": 0, "중": 1, "상": 2, "최상": 3 };
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function pickSet(unitKeys, n, mainOnly) {
  // 재출제 예비 문항은 아껴 두고, 한 세트에 같은 지문·같은 묶음이 겹치지 않게 고른다.
  const pool = shuffle(Object.values(ITEMS).filter(q => unitKeys.includes(q.unit) && eligible(q) &&
    !S.seen[q.id] && (!mainOnly || q.role === "main")));
  const out = [], stim = new Set(), grp = new Set();
  for (const q of pool) {
    if (out.length >= n) break;
    const g = q.unit + q.review_group;
    if (grp.has(g) || (q.stimulus_group && stim.has(q.stimulus_group))) continue;
    out.push(q); grp.add(g); if (q.stimulus_group) stim.add(q.stimulus_group);
  }
  return out.sort((a, b) => (LV[a.difficulty] || 0) - (LV[b.difficulty] || 0));
}

function dueReviews(all) {
  const now = Date.now();
  return Object.entries(S.reviews).filter(([, r]) => !r.done && (all || r.due <= now));
}
function pickReview(gkey, r) {
  const [unit, rg] = gkey.split("|");
  const avoid = new Set(r.stims || []);
  const cands = Object.values(ITEMS).filter(q => q.unit === unit && q.review_group === rg && eligible(q) &&
    !S.seen[q.id] && !(q.stimulus_group && avoid.has(q.stimulus_group)));
  cands.sort((a, b) => (a.role === "reserve" ? 0 : 1) - (b.role === "reserve" ? 0 : 1));

function stats(unitKey) {

}

function unitTitle(k) { const u = DATA.units.find(u => u.key === k); return u ? u.title.replace(/^중2 과학\s*·?\s*/, "") : k; }
function choiceText(c) { return Array.isArray(c) ? c.join(", ") : String(c); }
const NO = "①②③④⑤⑥⑦";

function show() {
  const q = RUN.qs[RUN.i];
  const card = renderQ(q);
  const picked = new Set();
  let done = false;
  app.replaceChildren(el("header", {}, el("h1", {}, RUN.title), el("button", { class: "ghost", onclick: () => { if (confirm("그만 풀고 처음 화면으로 갈까요? 푼 문항은 저장돼요.")) home(); } }, "나가기")), card);

  if (isChoice(q)) {
    const list = el("div", { class: "choices" });
    const btns = q.choices.map((c, i) => el("button", { class: "choice", onclick: () => {
      if (done) return;
      if (multi(q)) { picked.has(i + 1) ? picked.delete(i + 1) : picked.add(i + 1); btns[i].classList.toggle("sel"); submit.disabled = !picked.size; }
      else { picked.clear(); picked.add(i + 1); grade(); }
    } }, el("span", { class: "no" }, NO[i]), el("span", {}, choiceText(c))));
    list.append(...btns); card.append(list);
    const submit = el("button", { class: "primary", onclick: grade }, "답 확인");
    submit.disabled = true;
    setFoot(multi(q) ? [submit] : []);
    if (multi(q)) card.append(el("p", { class: "muted" }, `알맞은 것을 ${q.answer.length}개 고르세요.`));
    function grade() {
      done = true;
      const ok = q.answer.length === picked.size && q.answer.every(a => picked.has(a));
      btns.forEach((b, i) => { if (q.answer.includes(i + 1)) b.classList.add("right"); else if (picked.has(i + 1)) b.classList.add("wrong"); });
      finish(ok ? "right" : "wrong", ok ? "정답이에요" : `오답이에요 · 정답 ${q.answer.map(a => NO[a - 1]).join(", ")}`);
    }
  } else {
    const ta = el("textarea", { placeholder: "답을 적어 보세요" });
    card.append(ta);
    setFoot([el("button", { class: "primary", onclick: () => {
      ta.disabled = true;
      const fb = el("div", { class: "feedback self" }, el("b", {}, "모범 답안"), choiceText(q.answer));
      if (q.scoring) fb.append(el("b", {}, "\n채점 기준"), scoringText(q.scoring));
      card.append(fb);
      if (q.explanation) card.append(el("div", { class: "feedback self" }, el("b", {}, "해설"), q.explanation));
      setFoot(["right", "half", "wrong"].map(r => el("button", { class: r === "right" ? "primary" : "", onclick: () => { record(q, r, RUN.mode); RUN.res.push(r); next(); } },
        r === "right" ? "다 맞았어요" : r === "half" ? "일부 맞았어요" : "틀렸어요")));
    } }, "모범 답안 보기")]);
  }

  function finish(result, msg) {
    record(q, result, RUN.mode); RUN.res.push(result);
    card.append(el("div", { class: "feedback " + (result === "right" ? "ok" : "bad") }, el("b", {}, msg), q.explanation || ""));
    setFoot([el("button", { class: "primary", onclick: next }, RUN.i + 1 < RUN.qs.length ? "다음 문제" : "결과 보기")]);
  }
  window.scrollTo(0, 0);
}
function scoringText(s) {
  if (typeof s === "string") return s;
  if (Array.isArray(s)) return s.map(x => typeof x === "string" ? "· " + x : "· " + Object.values(x).join(" / ")).join("\n");
  const lines = [];
  if (s.total) lines.push(`총 ${s.total}점`);
  (s.criteria || []).forEach(c => lines.push(`· ${c.desc || c.element || Object.values(c).join(" / ")}${c.points != null ? ` (${c.points}점)` : ""}`));
  if (s.rule) lines.push("· " + s.rule);
  if (s.accepted && s.accepted.length) lines.push("· 인정하는 답: " + [].concat(s.accepted).join(", "));
  if (s.partial) lines.push("· 부분 점수: " + s.partial);
  Object.entries(s).filter(([k]) => !["total", "criteria", "rule", "accepted", "partial"].includes(k))
    .forEach(([k, v]) => lines.push(`· ${k}: ${typeof v === "object" ? JSON.stringify(v) : v}`));
  return lines.join("\n");
}
function next() { RUN.i++; if (RUN.i < RUN.qs.length) show(); else result(); }

function result() {
  const n = RUN.res.length, right = RUN.res.filter(r => r === "right").length;
  const wrong = RUN.qs.filter((q, i) => RUN.res[i] !== "right");
  setFoot([el("button", { class: "primary", onclick: home }, "처음으로")]);
  app.replaceChildren(
    el("header", {}, el("h1", {}, RUN.title + " 결과")),
    el("div", { class: "card" }, el("div", { class: "score" }, `${right} / ${n}`),
      el("p", { class: "muted" }, wrong.length ? `틀린 ${wrong.length}개 유형은 내일 같은 유형의 다른 문제로 다시 나와요.` : "모두 맞혔어요.")),
    wrong.length ? el("div", { class: "card list" }, el("h2", {}, "다시 볼 유형"),
      wrong.map(q => el("div", {}, `${unitTitle(q.unit)} · ${subName(q)}`))) : "");
  window.scrollTo(0, 0);
}
function subName(q) { const u = DATA.units.find(u => u.key === q.unit); return (u && u.subs[q.sub]) || q.sub; }

function report() {
  const rows = {};
  S.log.forEach(l => { const k = l.unit + "|" + l.sub; rows[k] = rows[k] || { n: 0, ok: 0 }; rows[k].n++; if (l.result === "right") rows[k].ok++; });
  setFoot([el("button", { onclick: exportLog }, "결과 내보내기"), el("button", { class: "primary", onclick: home }, "처음으로")]);
  app.replaceChildren(
    el("header", {}, el("h1", {}, "내 기록")),
    el("div", { class: "card" }, el("p", { class: "muted" }, `지금까지 ${S.log.length}문항을 풀었어요. 기록은 이 기기의 브라우저에만 저장돼요.`)),
    ...DATA.units.map(u => el("div", { class: "card list" }, el("h2", {}, u.title),
      Object.entries(u.subs).map(([k, name]) => {
        const r = rows[u.key + "|" + k];
        return el("div", { class: "row" }, el("span", { class: "grow" }, name),
          el("span", { class: "muted" }, r ? `${r.ok}/${r.n} (${Math.round(100 * r.ok / r.n)}%)` : "아직 안 풂"));
      }))));
  window.scrollTo(0, 0);
}
function exportLog() {
  const blob = new Blob([JSON.stringify({ book: S.book, exported: new Date().toISOString(), log: S.log, reviews: S.reviews }, null, 1)], { type: "application/json" });
  const a = el("a", { href: URL.createObjectURL(blob), download: "과학연습기록_" + new Date().toISOString().slice(0, 10) + ".json" });
  document.body.append(a); a.click(); a.remove();
}

home();
</script>
</body>
