ine x1=\"421.5\" y1=\"132\" x2=\"428.5\" y2=\"132\"/><circle cx=\"40\" cy=\"172\" r=\"8\"/><line x1=\"35\" y1=\"172\" x2=\"45\" y2=\"172\"/><line x1=\"40\" y1=\"167\" x2=\"40\" y2=\"177\"/><text x=\"54\" y=\"177\" fill=\"#000\" stroke=\"none\" font-size=\"12\">원자핵의 (+)전하<\/text><circle cx=\"220\" cy=\"172\" r=\"6\" fill=\"#000\" fill-opacity=\"0.15\"/><line x1=\"216.5\" y1=\"172\" x2=\"223.5\" y2=\"172\"/><text x=\"232\" y=\"177\" fill=\"#000\" stroke=\"none\" font-size=\"12\">전자<\/text><\/svg>", "choices": ["ㄱ", "ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "answer": [3], "explanation": "마찰 전 A, B는 각각 (+)전하 6개와 전자 6개를 가져 전기를 띠지 않았다. 마찰 후 A는 전자 4개, B는 전자 8개이므로 전자 2개가 A에서 B로 이동하였다. ㄱ. 옳다. ㄴ. A는 전자를 잃어 (+)전하의 양이 더 많으므로 (+)전하를 띤다. ㄷ. 옳다. A는 (+), B는 (-)전하를 띠어 서로 다른 전하이므로 끌어당긴다."}, {"id": "전기와자기:A-003", "sub": "A", "type_id": "A01", "review_group": "RG01", "role": "main", "difficulty": "중", "format": "서술형", "stem": "고무풍선을 털가죽으로 문질렀더니 고무풍선이 (-)전하를 띠었다. 마찰 전에는 두 물체 모두 전기를 띠지 않았던 까닭과, 마찰 후 털가죽이 띠는 전하의 종류를 <u>전자의 이동<\/u>을 이용하여 서술하시오.", "answer": "마찰 전에는 각 물체 속 원자핵의 (+)전하량과 전자의 (-)전하량이 같아 전기를 띠지 않았다. 문지르는 동안 전자가 털가죽에서 고무풍선으로 이동하여, 전자를 잃은 털가죽은 (+)전하를 띠고 전자를 얻은 고무풍선은 (-)전하를 띤다.", "scoring": "상(3점): ① 마찰 전 (+)전하량과 (-)전하량이 같아 전기를 띠지 않음, ② 전자가 털가죽에서 고무풍선으로 이동, ③ 털가죽은 전자를 잃어 (+)전하를 띰을 모두 서술. 중(2점): ②와 ③만 서술하거나 ①을 '전하가 없었다'로 씀. 하(1점): 털가죽이 (+)전하를 띤다는 결론만 씀. 원자핵(또는 (+)전하)이 이동한다고 쓰면 0점.", "explanation": "마찰 전후를 전자 이동으로 설명한다. 털가죽은 전자를 잃었으므로 (+)전하를 띤다. 마찰 전에도 전하가 없었던 것이 아니라 (+)와 (-)의 양이 같았던 것이다."}, {"id": "전기와자기:A-004", "sub": "A", "type_id": "A02", "review_group": "RG01", "role": "reserve", "difficulty": "상", "format": "5지선다", "stem": "마찰 전 전기를 띠지 않던 물체 A와 B에는 각각 원자핵의 (+)전하 7개와 전자 7개가 있었다. 두 물체를 서로 문지른 뒤 A는 (+)전하를 띠었고, 이동한 전자는 3개였다. 마찰 후 A와 B에 있는 (+)전하와 전자의 개수를 옳게 나타낸 것은? (단, 원자핵의 (+)전하 1개와 전자 1개의 전하량은 같다.)", "choices": ["A: (+)전하 4개, 전자 7개 / B: (+)전하 10개, 전자 7개", "A: (+)전하 7개, 전자 4개 / B: (+)전하 7개, 전자 10개", "A: (+)전하 7개, 전자 0개 / B: (+)전하 7개, 전자 14개", "A: (+)전하 7개, 전자 4개 / B: (+)전하 7개, 전자 7개", "A: (+)전하 7개, 전자 10개 / B: (+)전하 7개, 전자 4개"], "answer": [2], "explanation": "A가 (+)전하를 띠었으므로 A가 전자 3개를 잃고 B가 3개를 얻었다. 원자핵의 (+)전하는 이동하지 않으므로 두 물체 모두 7개 그대로이다. A의 전자 7-3=4개, B의 전자 7+3=10개이다. ① 원자핵의 (+)전하가 이동한 것으로 보았다. ③ 전자를 모두 잃은 것으로 보았다. ④ 잃은 전자 수만큼 B가 얻어야 하는데 B의 전자 수가 그대로이다. ⑤ 전자의 이동 방향을 반대로 보아 A를 (-)전하로 만들었다."}, {"id": "전기와자기:A-005", "sub": "A", "type_id": "A01", "review_group": "RG01", "role": "reserve", "difficulty": "하", "format": "단답형", "stem": "서로 다른 두 물체를 문지를 때 한 물체에서 다른 물체로 이동하는 입자의 이름을 쓰고, 이 입자를 얻은 물체가 띠는 전하의 종류를 쓰시오.", "answer": "전자, (-)전하", "scoring": "전자, (-)전하 두 가지를 모두 맞게 써야 정답(1점). 하나만 맞으면 부분 점수 없음(0점).", "explanation": "마찰할 때 이동하는 입자는 전자이며, 전자를 얻은 물체는 (-)전하를, 잃은 물체는 (+)전하를 띤다."}, {"id": "전기와자기:A-006", "sub": "A", "type_id": "A03", "review_group": "RG02", "role": "main", "difficulty": "중", "format": "5지선다", "stem": "실에 매단 대전체 A~E를 두 개씩 가까이 하였을 때 서로 작용하는 힘을 표로 나타낸 것이다. 같은 종류의 전하를 띠는 대전체끼리 옳게 짝지은 것은?", "table": {"h": ["가까이 한 대전체", "A와 B", "B와 C", "C와 D", "D와 E"], "r": [["작용하는 힘", "밀어 냄", "끌어당김", "끌어당김", "밀어 냄"]]}, "choices": ["B, C", "A의 전하 종류를 모르므로 정할 수 없다.", "A, D", "C, E", "A, C"], "answer": [3], "explanation": "A의 전하를 □라고 하면, A와 B가 밀어 내므로 B는 □, B와 C가 끌어당기므로 C는 □와 반대, C와 D가 끌어당기므로 D는 □, D와 E가 밀어 내므로 E는 □이다. 따라서 A, B, D, E가 같은 전하이고 C만 다르다. ① B와 C는 끌어당기므로 다른 전하이다. ② A를 (+)나 (-) 어느 쪽으로 가정해도 같은 전하끼리의 짝은 달라지지 않는다. ④·⑤ C는 나머지 넷과 다른 전하이다."}, {"id": "전기와자기:A-007", "sub": "A", "type_id": "A04", "review_group": "RG02", "role": "main", "difficulty": "하", "format": "5지선다", "stem": "털가죽으로 빨대 A와 빨대 B를 각각 문질렀다. 이에 대한 설명으로 옳은 것은?", "choices": ["빨대 A와 빨대 B를 가까이 하면 서로 끌어당긴다.", "빨대 A와 빨대 B를 가까이 하면 서로 밀어 낸다.", "빨대 A와 털가죽을 가까이 하면 서로 밀어 낸다.", "빨대 A와 털가죽은 같은 종류의 전하를 띤다.", "문지르는 동안 털가죽에서 전자가 새로 생겨 빨대로 옮겨 갔다."], "answer": [2], "explanation": "같은 털가죽으로 문지른 두 빨대는 같은 종류의 전하를 띠므로 서로 밀어 낸다. ① 같은 전하끼리는 밀어 낸다. ③·④ 빨대와 털가죽 사이에서는 전자가 이동하여 서로 다른 전하를 띠므로 끌어당긴다. ⑤ 전자는 새로 생기지 않고 이동할 뿐이다."}, {"id": "전기와자기:A-008", "sub": "A", "type_id": "A04", "review_group": "RG02", "role": "main", "difficulty": "상", "format": "서술형", "stem": "가는 비닐 끈 다발(뜨개)과 플라스틱 막대를 각각 같은 털가죽으로 문지른 뒤 뜨개를 막대 위로 놓으면 뜨개가 공중에 떠 있다. 학생 ㉮는 털가죽 대신 뜨개와 플라스틱 막대를 서로 직접 문질렀더니 뜨개가 막대에 달라붙었다. 학생 ㉮의 방법으로 뜨개를 띄울 수 없는 까닭을 두 물체가 띠는 전하와 힘을 이용하여 서술하시오.", "answer": "뜨개와 막대를 서로 문지르면 둘 사이에서 전자가 이동하여 두 물체가 서로 다른 종류의 전하를 띠므로 끌어당기는 힘이 작용한다. 같은 털가죽으로 각각 문지르면 두 물체가 같은 종류의 전하를 띠어 밀어 내는 힘이 작용하므로 뜨개가 뜬다.", "scoring": "상(3점): ① 서로 문지르면 다른 종류의 전하를 띠어 끌어당김, ② 같은 털가죽으로 각각 문지르면 같은 종류의 전하를 띠어 밀어 냄을 모두 서술. 중(2점): ①만 서술. 하(1점): '전하가 달라서'처럼 힘(인력)을 쓰지 않음. 서로 문지르면 같은 전하가 된다고 쓰면 0점.", "explanation": "서로 문지른 두 물체는 다른 전하를 띠어 끌어당기고, 같은 천으로 각각 문지른 두 물체는 같은 전하를 띠어 밀어 낸다."}, {"id": "전기와자기:A-009", "sub": "A", "type_id": "A03", "review_group": "RG02", "role": "reserve", "difficulty": "상", "format": "보기형(ㄱㄴㄷ)", "stem": "실에 매단 대전체 A~D를 두 개씩 가까이 하였더니 A와 B는 서로 끌어당기고, B와 C는 서로 밀어 내고, C와 D는 서로 끌어당겼다. 이에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?", "bogi": ["ㄱ. A와 C는 같은 종류의 전하를 띤다.", "ㄴ. B와 D를 가까이 하면 서로 밀어 낸다.", "ㄷ. A가 (+)전하를 띠면 D도 (+)전하를 띤다."], "choices": ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ"], "answer": [2], "explanation": "A의 전하를 □라고 하면 B는 □와 반대, C는 B와 같으므로 □와 반대, D는 C와 반대이므로 □이다. ㄱ. A와 C는 서로 다른 전하이다. ㄴ. B와 D는 다른 전하이므로 끌어당긴다. ㄷ. 옳다. A와 D는 같은 전하이다."}, {"id": "전기와자기:A-010", "sub": "A", "type_id": "A04", "review_group": "RG02", "role": "reserve", "difficulty": "중", "format": "5지선다", "stem": "명주 헝겊으로 고무풍선 두 개를 각각 문질렀더니 두 풍선이 모두 (-)전하를 띠었다. 이에 대한 설명으로 옳지 <u>않은<\/u> 것은?", "choices": ["명주 헝겊은 (+)전하를 띤다.", "문지르는 동안 전자는 명주 헝겊에서 풍선으로 이동하였다.", "풍선과 명주 헝겊을 가까이 하면 서로 끌어당긴다.", "두 풍선을 가까이 하면 서로 다른 전하를 띠어 끌어당긴다.", "(-)전하를 띤 풍선에도 원자핵의 (+)전하가 있다."], "answer": [4], "explanation": "① 명주 헝겊은 전자를 잃어 (+)전하를 띤다. ② 풍선이 (-)전하를 띠었으므로 전자는 헝겊에서 풍선으로 이동하였다. ③ 풍선(-)과 헝겊(+)은 끌어당긴다. ④ 옳지 않다. 같은 헝겊으로 문지른 두 풍선은 같은 (-)전하를 띠어 서로 밀어 낸다. ⑤ 대전체에도 두 종류의 전하가 모두 있으며 (-)전하가 더 많을 뿐이다."}, {"id": "전기와자기:A-011", "sub": "A", "type_id": "A05", "review_group": "RG03", "role": "main", "difficulty": "하", "format": "5지선다", "stem": "다음 중 마찰 전기와 관련된 현상이 <u>아닌<\/u> 것은?", "choices": ["머리를 빗으면 머리카락이 빗에 달라붙는다.", "건조한 날 스웨터를 벗을 때 '타닥' 소리가 난다.", "음식을 덮은 비닐 랩이 손에 달라붙는다.", "자석이 냉장고 문에 붙어 떨어지지 않는다.", "건조한 겨울날 자동차 문손잡이를 잡을 때 손이 따끔하다."], "answer": [4], "explanation": "①·②·③·⑤는 두 물체가 마찰하여 전기를 띠거나, 대전된 몸에서 전하가 순간적으로 이동하는 현상이다. ④ 자석이 냉장고 문(철)에 붙는 것은 자석의 자기력 때문이다."}, {"id": "전기와자기:A-012", "sub": "A", "type_id": "A05", "review_group": "RG03", "role": "main", "difficulty": "중", "format": "보기형(ㄱㄴㄷ)", "stem": "생활 속 현상에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?", "bogi": ["ㄱ. 고무장갑을 끼고 병뚜껑을 돌리면 잘 열리는 것은 마찰 전기 때문이다.", "ㄴ. 털가죽으로 문지른 플라스틱 자를 빈 알루미늄 캔에 닿지 않게 가까이 하면 캔이 끌려오는데, 이는 정전기 유도 현상이다.", "ㄷ. 마찰 전기는 물체에 머물러 있는 전기이므로 정전기라고도 한다."], "choices": ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ"], "answer": [5], "explanation": "ㄱ. 고무장갑을 끼면 손과 뚜껑 사이의 마찰력이 커져 뚜껑이 잘 열린다. 마찰 전기와는 관계없다. ㄴ. 옳다. 대전된 자를 문지르지 않은 캔에 가까이 하면 캔 속 전자가 이동하여 캔이 끌려오므로 정전기 유도 현상이다. ㄷ. 옳다. 마찰 전기는 흐르지 않고 물체에 머물러 있어 정전기라고도 한다."}, {"id": "전기와자기:A-013", "sub": "A", "type_id": "A05", "review_group": "RG03", "role": "main", "difficulty": "중", "format": "5지선다", "stem": "다음은 생활 속에서 관찰한 현상 (가)~(라)이다.<br>(가) 털가죽으로 문지른 고무풍선이 그 털가죽에 달라붙었다.<br>(나) 털가죽으로 문지른 플라스틱 빗을 바닥에 놓인 빈 금속 캔에 닿지 않게 가까이 하였더니 캔이 빗 쪽으로 굴러왔다.<br>(다) 자석으로 한쪽 방향으로 여러 번 문지른 쇠못에 클립이 달라붙었다.<br>(라) 미끄러운 바닥에 고무 매트를 깔았더니 덜 미끄러졌다.<br>(가)~(라)의 원인을 옳게 짝지은 것은?", "choices": ["(가) 마찰 전기, (나) 마찰 전기, (다) 자기력, (라) 마찰력", "(가) 마찰 전기, (나) 정전기 유도, (다) 마찰 전기, (라) 마찰력", "(가) 마찰 전기, (나) 정전기 유도, (다) 자기력, (라) 마찰력", "(가) 정전기 유도, (나) 마찰 전기, (다) 자기력, (라) 마찰력", "(가) 마찰 전기, (나) 정전기 유도, (다) 자기력, (라) 마찰 전기"], "answer": [3], "explanation": "(가) 서로 문지른 풍선과 털가죽이 다른 전하를 띠어 끌어당기는 마찰 전기 현상이다. (나) 캔은 문지르지 않았고, 대전된 빗 때문에 캔 속 전자가 이동하여 끌려오는 정전기 유도 현상이다. (다) 자석으로 문지른 쇠못이 자석의 성질을 띠는 자기력 현상이다. (라) 고무 매트가 마찰력을 크게 하는 현상이다. ① (나)는 직접 문지르지 않은 물체이므로 마찰 전기가 아니다. ② (다)는 자기력이다. ④ (가)와 (나)를 맞바꾸었다. ⑤ (라)는 마찰력이다."}, {"id": "전기와자기:A-014", "sub": "A", "type_id": "A10", "review_group": "RG03", "role": "reserve", "difficulty": "하", "format": "5지선다", "stem": "털가죽으로 문지른 플라스틱 판 위에 알루미늄 접시를 올려놓고, 네온전구의 한쪽 끝을 접시에 대었더니 네온전구가 순간적으로 반짝 빛났다.<br>이에 대한 설명으로 옳은 것은?", "choices": ["네온전구는 손을 뗄 때까지 계속 켜져 있다.", "네온전구가 빛난 것은 원자핵이 이동했기 때문이다.", "전자가 이동하는 짧은 순간에만 네온전구에 전류가 흐른다.", "네온전구를 오래 켜 두려면 플라스틱 판을 더 크게 하면 된다.", "네온전구 안에서 전자가 새로 만들어져 빛이 난다."], "answer": [3], "explanation": "마찰 전기는 순간적으로 전자가 이동할 때만 전류가 흐르므로 네온전구가 잠깐 빛난다. 계속 켜 두려면 전지나 전원 장치처럼 전압을 계속 유지해 주는 장치가 필요하다. ① 잠깐만 켜진다. ② 이동하는 것은 전자이다. ④ 판을 크게 해도 전하가 한 번 이동하면 끝나므로 계속 켜지지 않는다. ⑤ 전자는 새로 생기지 않는다.", "textbook_tags": {"mode": "include_only", "books": ["천재임"]}}, {"id": "전기와자기:A-015", "sub": "A", "type_id": "A05", "review_group": "RG03", "role": "reserve", "difficulty": "중", "format": "서술형", "stem": "건조한 겨울철에는 문손잡이를 잡을 때 손이 따끔한 일이 자주 일어난다. (1) 겨울철에 이런 일이 자주 일어나는 까닭과 (2) 이를 줄이는 방법 한 가지를 서술하시오.", "answer": "(1) 건조하면 옷이나 몸에 생긴 마찰 전기가 공기 중으로 잘 빠져나가지 못하고 몸에 쌓여 있다가, 금속 손잡이에 닿는 순간 전하가 한꺼번에 이동하기 때문이다. (2) 가습기를 틀어 실내 습도를 높인다. 또는 문손잡이를 잡기 전에 정전기 방지 패드에 손을 대어 미리 전하를 흘려보낸다.", "scoring": "상(3점): (1) 공기가 건조하여 몸이나 옷에 생긴 마찰 전기가 공기 중으로 잘 빠져나가지 못하고 쌓인다는 내용과 (2) 타당한 방법 한 가지(가습기로 습도 높이기, 손에 보습제 바르기, 정전기 방지 패드에 먼저 손대기, 열쇠 등 다른 금속을 먼저 손잡이에 닿게 하기 등)를 모두 서술. 금속에 닿는 순간 전하가 한꺼번에 이동한다는 설명은 있으면 좋으나 필수 요소는 아님. 중(2점): (1)에서 '건조해서'만 쓰고 전하가 쌓인다는 내용이 없으나 (2)는 옳음, 또는 (1)은 옳고 (2)가 없거나 틀림. 하(1점): (2)만 옳고 (1)이 없거나 틀림, 또는 (1)에 '건조해서'만 쓰고 (2)가 없음. 0점: (1)·(2) 모두 틀림.", "explanation": "습기가 적으면 마찰 전기가 사라지지 않고 쌓인다. 습도를 높이거나 미리 전하를 흘려보내면 따끔함을 줄일 수 있다."}, {"id": "전기와자기:A-016", "sub": "A", "type_id": "A06", "review_group": "RG04", "role": "main", "difficulty": "하", "format": "5지선다", "stem": "그림과 같이 대전되지 않은 금속 막대의 A 끝에 (-)대전체를 닿지 않게 가까이 하였다. 이때 금속 막대의 A 부분과 B 부분이 띠는 전하를 옳게 짝지은 것은?", "figure_svg": "<svg style=\"background:#fff\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 380 150\" fill=\"none\" stroke=\"#000\" stroke-width=\"1.5\" font-size=\"13\" font-family=\"sans-serif\"><rect x=\"20\" y=\"70\" width=\"80\" height=\"22\" rx=\"4\" fill=\"#000\" fill-opacity=\"0.12\"/><text x=\"60\" y=\"62\" fill=\"#000\" stroke=\"none\" font-size=\"12\" text-anchor=\"middle\">(-)대전체<\/text><rect x=\"130\" y=\"66\" width=\"220\" height=\"30\" rx=\"15\"/><text x=\"140\" y=\"116\" fill=\"#000\" stroke=\"none\" font-size=\"14\">A<\/text><text x=\"335\" y=\"116\" fill=\"#000\" stroke=\"none\" font-size=\"14\">B<\/text><line x1=\"240\" y1=\"96\" x2=\"240\" y2=\"122\" stroke-width=\"3\"/><text x=\"240\" y=\"140\" fill=\"#000\" stroke=\"none\" font-size=\"12\" text-anchor=\"middle\">대전되지 않은 금속 막대(절연 받침 위)<\/text><\/svg>", "choices": ["A: (+)전하, B: (-)전하", "A: (-)전하, B: (+)전하", "A: (+)전하, B: (+)전하", "A: (-)전하, B: (-)전하", "A, B 모두 전기를 띠지 않는다."], "answer": [1], "explanation": "(-)대전체가 금속 막대 속 전자를 밀어 내므로 전자가 B 쪽으로 이동한다. 그 결과 대전체와 가까운 A는 (+)전하, 먼 B는 (-)전하를 띤다. ② 가까운 쪽이 대전체와 같은 전하라고 맞바꾸었다. ③·④ 전자는 막대 안에서 한쪽으로 치우칠 뿐이므로 양 끝은 서로 다른 전하를 띤다. ⑤ 대전체를 가까이 한 동안에는 전자가 이동하여 양 끝이 전하를 띤다.", "stimulus_group": "SG-E01"}, {"id": "전기와자기:A-017", "sub": "A", "type_id": "A06", "review_group": "RG04", "role": "main", "difficulty": "상", "format": "보기형(ㄱㄴㄷㄹ)", "stem": "(+)전하를 띤 플라스틱 막대를 대전되지 않은 빈 알루미늄 캔에 닿지 않게 가까이 하였다. 이에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?", "bogi": ["ㄱ. 캔 속의 전자는 막대 쪽으로 이동한다.", "ㄴ. 막대의 (+)전하가 캔으로 건너간다.", "ㄷ. 캔은 막대 쪽으로 끌려온다.", "ㄹ. 캔 전체의 전자 수가 늘어난다."], "choices": ["ㄱ, ㄴ", "ㄱ, ㄷ", "ㄴ, ㄹ", "ㄱ, ㄷ, ㄹ", "ㄴ, ㄷ, ㄹ"], "answer": [2], "explanation": "ㄱ. 옳다. (+)대전체가 전자를 끌어당기므로 캔 속 전자는 막대 쪽으로 이동한다. ㄴ. 막대와 캔은 닿지 않았으므로 전하가 건너가지 않는다. 전자는 캔 안에서만 이동한다. ㄷ. 옳다. 캔에서 막대와 가까운 쪽에 (-)전하가 모이므로 캔은 막대 쪽으로 끌려온다. ㄹ. 전자는 캔 안에서 자리만 옮겼으므로 캔 전체의 전자 수는 변하지 않는다."}, {"id": "전기와자기:A-018", "sub": "A", "type_id": "A06", "review_group": "RG04", "role": "main", "difficulty": "중", "format": "서술형", "stem": "(-)전하를 띤 고무풍선을 대전되지 않은 금속 캔 옆에 닿지 않게 가까이 하면 캔이 풍선 쪽으로 굴러온다. 풍선 대신 (+)전하를 띤 막대를 가까이 해도 캔이 막대 쪽으로 끌려오는 까닭을 <u>캔 속 전자의 이동<\/u>을 포함하여 서술하시오.", "answer": "(+)전하를 띤 막대를 가까이 하면 캔 속 전자가 막대 쪽으로 끌려와 막대와 가까운 쪽은 (-)전하, 먼 쪽은 (+)전하를 띤다. 가까운 쪽에 막대와 다른 종류의 전하가 생기므로 끌어당기는 힘이 작용하여 캔이 막대 쪽으로 끌려온다. 따라서 대전체의 전하 종류와 상관없이 캔은 대전체 쪽으로 끌려온다.", "scoring": "상(3점): ① 전자가 막대 쪽으로 이동, ② 가까운 쪽이 (-)(다른 종류) 전하를 띰, ③ 다른 전하 사이의 인력으로 끌려옴을 모두 서술. 중(2점): ①·② 중 하나와 ③을 서술. 하(1점): '정전기 유도 때문'만 씀. 막대에서 캔으로 전하가 건너간다고 쓰면 0점.", "explanation": "정전기 유도에서는 대전체와 가까운 쪽에 항상 다른 종류의 전하가 유도되므로 대전체의 전하 종류와 관계없이 끌려온다."}, {"id": "전기와자기:A-019", "sub": "A", "type_id": "A06", "review_group": "RG04", "role": "reserve", "difficulty": "중", "format": "5지선다", "stem": "대전되지 않은 금속 막대의 한쪽 끝에 (-)대전체를 닿지 않게 가까이 하였다. 이에 대한 설명으로 옳지 <u>않은<\/u> 것은?", "choices": ["막대 속 전자는 대전체에서 먼 쪽으로 이동한다.", "대전체와 가까운 쪽 끝은 (+)전하를 띤다.", "막대 속 원자핵은 이동하지 않는다.", "막대 전체의 전자 수는 변하지 않는다.", "가까운 쪽 끝에 생긴 (+)전하의 양이 먼 쪽 끝에 생긴 (-)전하의 양보다 많다."], "answer": [5], "explanation": "①~④는 옳은 설명이다. ⑤ 옳지 않다. 가까운 쪽에서 빠져나간 전자가 그대로 먼 쪽으로 옮겨 갔으므로 양 끝에 생긴 전하의 양은 같다."}, {"id": "전기와자기:A-020", "sub": "A", "type_id": "A06", "review_group": "RG04", "role": "reserve", "difficulty": "하", "format": "단답형", "stem": "(+)대전체를 대전되지 않은 금속구에 닿지 않게 가까이 하였다. 이때 금속구 안에서 이동하는 입자의 이름과, 그 입자가 이동하는 방향(대전체 쪽 또는 대전체 반대쪽)을 쓰시오.", "answer": "전자, 대전체 쪽", "scoring": "전자, 대전체 쪽 두 가지를 모두 맞게 써야 정답(1점). 하나만 맞으면 부분 점수 없음(0점).", "explanation": "(+)대전체가 금속구 속 전자를 끌어당기므로 전자가 대전체 쪽으로 이동한다. 원자핵은 이동하지 않는다."}, {"id": "전기와자기:A-021", "sub": "A", "type_id": "A07", "review_group": "RG05", "role": "main", "difficulty": "중", "format": "5지선다", "stem": "그림과 같이 서로 맞닿아 있는 대전되지 않은 금속구 A, B의 A 쪽에 (-)대전체를 닿지 않게 가까이 하였다. 대전체를 그대로 둔 채 A와 B를 떼어 놓은 뒤 대전체를 치웠다. 이때 A와 B가 띠는 전하를 옳게 짝지은 것은?", "figure_svg": "<svg style=\"background:#fff\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 260 170\" fill=\"none\" stroke=\"#000\" stroke-width=\"1.5\" font-size=\"13\" font-family=\"sans-serif\"><rect x=\"15\" y=\"62\" width=\"70\" height=\"22\" rx=\"4\" fill=\"#000\" fill-opacity=\"0.12\"/><text x=\"50\" y=\"54\" fill=\"#000\" stroke=\"none\" font-size=\"12\" text-anchor=\"middle\">(-)대전체<\/text><circle cx=\"140\" cy=\"73\" r=\"32\"/><circle cx=\"204\" cy=\"73\" r=\"32\"/><text x=\"140\" y=\"78\" fill=\"#000\" stroke=\"none\" font-size=\"14\" text-anchor=\"middle\">A<\/text><text x=\"204\" y=\"78\" fill=\"#000\" stroke=\"none\" font-size=\"14\" text-anchor=\"middle\">B<\/text><line x1=\"140\" y1=\"105\" x2=\"140\" y2=\"140\" stroke-width=\"3\"/><line x1=\"204\" y1=\"105\" x2=\"204\" y2=\"140\" stroke-width=\"3\"/><line x1=\"110\" y1=\"140\" x2=\"234\" y2=\"140\"/><text x=\"172\" y=\"160\" fill=\"#000\" stroke=\"none\" font-size=\"12\" text-anchor=\"middle\">절연 손잡이가 달린 금속구<\/text><\/svg>", "choices": ["A: (+)전하, B: (-)전하", "A: (-)전하, B: (+)전하", "A, B 모두 전기를 띠지 않는다.", "A: (+)전하, B: (+)전하", "A: (-)전하, B: (-)전하"], "answer": [1], "explanation": "(-)대전체가 전자를 밀어 내므로 A의 전자가 B 쪽으로 이동하여 A는 (+), B는 (-)전하를 띤다. 이 상태에서 떼어 놓으면 전자가 돌아갈 길이 없으므로 대전체를 치워도 A는 (+), B는 (-)전하를 계속 띤다. ② 가까운 쪽이 같은 전하라고 맞바꾸었다. ③ 떼어 놓은 뒤에는 중성으로 돌아가지 않는다. ④·⑤ 한 구가 잃은 전자를 다른 구가 얻었으므로 두 구는 서로 반대 전하를 띤다.", "stimulus_group": "SG-E01"}, {"id": "전기와자기:A-022", "sub": "A", "type_id": "A07", "review_group": "RG05", "role": "main", "difficulty": "상", "format": "보기형(ㄱㄴㄷ)", "stem": "그림과 같이 서로 맞닿아 있는 대전되지 않은 같은 크기의 금속구 A, B 중 A 쪽에 (+)대전체를 닿지 않게 가까이 하였다. 대전체를 그대로 둔 채 A와 B를 떼어 놓은 뒤 대전체를 치웠다. 이에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?", "bogi": ["ㄱ. 떼어 놓은 뒤 A에 있는 전자 수는 B에 있는 전자 수보다 많다.", "ㄴ. 대전체를 치운 뒤 A와 B를 다시 가까이 하면 서로 밀어 낸다.", "ㄷ. 금속구를 떼어 놓지 않고 금속 막대 하나에 대전체를 가까이 했다가 치우기만 하면, 막대는 다시 전기를 띠지 않는다."], "figure_svg": "<svg style=\"background:#fff\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 260 170\" fill=\"none\" stroke=\"#000\" stroke-width=\"1.5\" font-size=\"13\" font-family=\"sans-serif\"><rect x=\"15\" y=\"62\" width=\"70\" height=\"22\" rx=\"4\" fill=\"#000\" fill-opacity=\"0.12\"/><text x=\"50\" y=\"54\" fill=\"#000\" stroke=\"none\" font-size=\"12\" text-anchor=\"middle\">(+)대전체<\/text><circle cx=\"140\" cy=\"73\" r=\"32\"/><circle cx=\"204\" cy=\"73\" r=\"32\"/><text x=\"140\" y=\"78\" fill=\"#000\" stroke=\"none\" font-size=\"14\" text-anchor=\"middle\">A<\/text><text x=\"204\" y=\"78\" fill=\"#000\" stroke=\"none\" font-size=\"14\" text-anchor=\"middle\">B<\/text><line x1=\"140\" y1=\"105\" x2=\"140\" y2=\"140\" stroke-width=\"3\"/><line x1=\"204\" y1=\"105\" x2=\"204\" y2=\"140\" stroke-width=\"3\"/><line x1=\"110\" y1=\"140\" x2=\"234\" y2=\"140\"/><text x=\"172\" y=\"160\" fill=\"#000\" stroke=\"none\" font-size=\"12\" text-anchor=\"middle\">절연 손잡이가 달린 금속구<\/text><\/svg>", "choices": ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ"], "answer": [4], "explanation": "(+)대전체가 전자를 끌어당기므로 B의 전자가 A 쪽으로 이동한다. 떼어 놓으면 A는 (-), B는 (+)전하를 계속 띤다. ㄱ. 옳다. 대전체 쪽으로 끌려온 전자만큼 A의 전자가 B보다 많다. ㄴ. A와 B는 서로 다른 전하를 띠므로 다시 가까이 하면 끌어당긴다. ㄷ. 옳다. 금속 막대 하나에 대전체를 가까이 했다가 치우기만 하면, 치우친 전자가 다시 고르게 퍼져 막대는 전기를 띠지 않는다.", "stimulus_group": "SG-E01"}, {"id": "전기와자기:A-023", "sub": "A", "type_id": "A07", "review_group": "RG05", "role": "main", "difficulty": "최상", "format": "5지선다", "stem": "다음은 정전기 유도 실험 과정이다.<br>(가) 서로 맞닿아 있는 대전되지 않은 금속구 A, B 중 A 쪽에 (-)대전체를 닿지 않게 가까이 한다.<br>(나) 대전체를 그대로 둔 채 A와 B를 떼어 놓은 뒤 대전체를 치운다.<br>(다) B를 대전되지 않은 검전기의 금속판에 닿지 않게 가까이 한다.<br>(다)에서 검전기의 금속판과 금속박의 전하, 금속박의 모습을 옳게 나타낸 것은?", "choices": ["금속판 (+)전하, 금속박 (-)전하, 금속박이 벌어진다.", "금속판 (-)전하, 금속박 (+)전하, 금속박이 벌어진다.", "금속판 (+)전하, 금속박 (-)전하, 금속박이 오므라든다.", "금속판과 금속박 모두 전기를 띠지 않아 금속박은 움직이지 않는다.", "금속판 (+)전하, 금속박 (+)전하, 금속박이 벌어진다."], "answer": [1], "explanation": "(가)에서 (-)대전체가 전자를 밀어 내 A의 전자가 B로 이동한다. (나)에서 떼어 놓았으므로 B는 (-)전하를 띤 채 남는다. (다)에서 (-)전하를 띤 B가 금속판의 전자를 밀어 내어 전자가 금속박으로 이동하므로 금속판은 (+), 금속박은 (-)전하를 띠고, 두 금속박이 같은 전하끼리 밀어 내어 벌어진다. ② B를 (+)로 보았거나 가까운 쪽을 같은 전하로 보았다. ③ 두 금속박이 같은 전하를 띠면 밀어 내므로 벌어진다. ④ 떼어 놓은 B는 전하를 띤 채 남는다. ⑤ 금속판과 금속박은 서로 다른 전하를 띤다."}, {"id": "전기와자기:A-024", "sub": "A", "type_id": "A07", "review_group": "RG05", "role": "reserve", "difficulty": "중", "format": "서술형", "stem": "실험 Ⅰ에서는 금속 막대 하나의 한쪽 끝에 (-)대전체를 가까이 했다가 치웠고, 실험 Ⅱ에서는 맞닿은 금속구 A, B의 A 쪽에 (-)대전체를 가까이 한 채 A와 B를 떼어 놓은 뒤 대전체를 치웠다. 대전체를 치운 뒤 실험 Ⅰ의 막대와 실험 Ⅱ의 금속구 A가 각각 전기를 띠는지 쓰고, 두 결과가 다른 까닭을 전자의 이동으로 서술하시오.", "answer": "실험 Ⅰ의 막대는 전기를 띠지 않고, 실험 Ⅱ의 A는 (+)전하를 띤다. 실험 Ⅰ에서는 대전체를 치우면 한쪽으로 몰렸던 전자가 막대 안에서 다시 고르게 퍼진다. 실험 Ⅱ에서는 A에서 B로 이동한 전자가 두 구를 떼어 놓아 A로 돌아올 수 없으므로 A는 전자가 부족한 (+)전하 상태로 남는다.", "scoring": "상(3점): ① Ⅰ 막대는 전기를 띠지 않음, ② Ⅱ의 A는 (+)전하, ③ Ⅰ은 전자가 고르게 되돌아가고 Ⅱ는 떼어 놓아 전자가 돌아올 수 없다는 까닭을 모두 서술. 중(2점): ①·②만 맞고 까닭이 불완전. 하(1점): 한 가지 결과만 맞음.", "explanation": "물체가 하나이면 대전체를 치울 때 전자가 되돌아가고, 두 물체를 떼어 놓으면 되돌아갈 길이 끊긴다."}, {"id": "전기와자기:A-025", "sub": "A", "type_id": "A07", "review_group": "RG05", "role": "reserve", "difficulty": "상", "format": "5지선다", "stem": "그림과 같이 대전되지 않은 금속 막대의 P 끝에 (+)대전체를 닿지 않게 가까이 하고, Q 끝 가까이에 대전되지 않은 가벼운 은박 구를 실에 매달아 두었다. 이때 은박 구에서 막대와 가까운 쪽이 띠는 전하와 은박 구의 움직임을 옳게 짝지은 것은?", "figure_svg": "<svg style=\"background:#fff\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 380 145\" fill=\"none\" stroke=\"#000\" stroke-width=\"1.5\" font-size=\"13\" font-family=\"sans-serif\"><rect x=\"15\" y=\"80\" width=\"70\" height=\"22\" rx=\"4\" fill=\"#000\" fill-opacity=\"0.12\"/><text x=\"50\" y=\"72\" fill=\"#000\" stroke=\"none\" font-size=\"12\" text-anchor=\"middle\">(+)대전체<\/text><rect x=\"105\" y=\"76\" width=\"170\" height=\"30\" rx=\"15\"/><text x=\"110\" y=\"126\" fill=\"#000\" stroke=\"none\" font-size=\"14\">P<\/text><text x=\"262\" y=\"126\" fill=\"#000\" stroke=\"none\" font-size=\"14\">Q<\/text><line x1=\"190\" y1=\"106\" x2=\"190\" y2=\"135\" stroke-width=\"3\"/><line x1=\"300\" y1=\"20\" x2=\"340\" y2=\"20\" stroke-width=\"3\"/><line x1=\"300\" y1=\"20\" x2=\"300\" y2=\"78\"/><circle cx=\"300\" cy=\"91\" r=\"13\"/><text x=\"318\" y=\"118\" fill=\"#000\" stroke=\"none\" font-size=\"12\">은박 구<\/text><\/svg>", "choices": ["(-)전하, 막대 쪽으로 끌려온다.", "(+)전하, 막대에서 밀려난다.", "(+)전하, 막대 쪽으로 끌려온다.", "전기를 띠지 않으며 움직이지 않는다.", "(-)전하, 막대에서 밀려난다."], "answer": [1], "explanation": "(+)대전체가 막대 속 전자를 P 쪽으로 끌어당기므로 P는 (-), Q는 (+)전하를 띤다. (+)전하를 띤 Q가 은박 구 속 전자를 끌어당기므로 은박 구에서 Q와 가까운 쪽은 (-)전하를 띠고, 다른 전하끼리 끌어당겨 은박 구는 막대 쪽으로 끌려온다. ② 은박 구의 가까운 쪽 전하를 처음 대전체의 (+) 기준으로 같게 정했다. ③ 가까운 쪽이 (+)이면 Q(+)와 밀어 내야 하므로 모순이다. ④ 대전체가 은박 구에 직접 가깝지 않아도 막대를 통해 유도가 일어난다. ⑤ 다른 전하끼리는 끌어당긴다."}, {"id": "전기와자기:A-026", "sub": "A", "type_id": "A08", "review_group": "RG06", "role": "main", "difficulty": "하", "format": "5지선다", "stem": "그림과 같이 대전되지 않은 검전기의 금속판에 (+)대전체를 닿지 않게 가까이 하였더니 금속박이 벌어졌다. 이에 대한 설명으로 옳은 것은?", "figure_svg": "<svg style=\"background:#fff\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 260 210\" fill=\"none\" stroke=\"#000\" stroke-width=\"1.5\" font-size=\"13\" font-family=\"sans-serif\"><rect x=\"95\" y=\"8\" width=\"70\" height=\"20\" rx=\"4\" fill=\"#000\" fill-opacity=\"0.12\"/><text x=\"172\" y=\"23\" fill=\"#000\" stroke=\"none\" font-size=\"12\">(+)대전체<\/text><line x1=\"85\" y1=\"48\" x2=\"175\" y2=\"48\" stroke-width=\"3\"/><text x=\"185\" y=\"52\" fill=\"#000\" stroke=\"none\" font-size=\"12\">금속판<\/text><line x1=\"130\" y1=\"48\" x2=\"130\" y2=\"150\"/><path d=\"M75,95 L75,200 L185,200 L185,95 Q130,70 75,95 z\" stroke-width=\"1\"/><line x1=\"130\" y1=\"150\" x2=\"112\" y2=\"185\" stroke-width=\"2\"/><line x1=\"130\" y1=\"150\" x2=\"148\" y2=\"185\" stroke-width=\"2\"/><line x1=\"150\" y1=\"172\" x2=\"192\" y2=\"172\" stroke-width=\"0.8\"/><text x=\"195\" y=\"176\" fill=\"#000\" stroke=\"none\" font-size=\"12\">금속박<\/text><\/svg>", "choices": ["금속판은 (+)전하를 띤다.", "금속박의 (+)전하가 금속판으로 이동한다.", "대전체를 치워도 금속박은 계속 벌어져 있다.", "금속판과 금속박은 같은 종류의 전하를 띤다.", "전자가 금속박에서 금속판 쪽으로 이동한다."], "answer": [5], "explanation": "(+)대전체가 전자를 끌어당기므로 전자가 금속박에서 금속판 쪽으로 이동한다. 금속판은 (-), 금속박은 (+)전하를 띠고, 두 금속박이 같은 (+)전하끼리 밀어 내 벌어진다. ① 금속판은 대전체와 다른 (-)전하를 띤다. ② 이동하는 것은 전자이다. ③ 대전체를 치우면 전자가 고르게 퍼져 금속박이 오므라든다. ④ 금속판과 금속박은 서로 다른 전하를 띤다.", "stimulus_group": "SG-E02"}, {"id": "전기와자기:A-027", "sub": "A", "type_id": "A09", "review_group": "RG06", "role": "main", "difficulty": "중", "format": "보기형(ㄱㄴㄷㄹ)", "stem": "검전기를 이용하여 알 수 있는 것으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?", "bogi": ["ㄱ. 물체가 대전되었는지 여부", "ㄴ. 두 대전체를 같은 거리에서 가까이 할 때, 어느 쪽의 전하량이 더 많은지", "ㄷ. 대전체가 가진 전자의 정확한 개수", "ㄹ. (-)전하로 대전되어 있는 검전기를 이용할 때, 대전체가 띤 전하의 종류"], "choices": ["ㄱ, ㄹ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ", "ㄱ, ㄴ, ㄹ", "ㄴ, ㄷ, ㄹ"], "answer": [4], "explanation": "ㄱ. 옳다. 금속박이 벌어지는지로 대전 여부를 안다. ㄴ. 옳다. 같은 검전기에 같은 거리에서 가까이 할 때 금속박이 더 많이 벌어질수록 전하량이 많다. ㄷ. 금속박이 벌어진 정도로 전하량의 많고 적음을 비교할 수 있을 뿐 전자의 정확한 개수는 알 수 없다. ㄹ. 옳다. 전하를 알고 있는 대전된 검전기에 물체를 가까이 하여 금속박이 더 벌어지는지 오므라드는지로 전하의 종류를 알 수 있다."}, {"id": "전기와자기:A-028", "sub": "A", "type_id": "A09", "review_group": "RG06", "role": "main", "difficulty": "상", "format": "5지선다", "stem": "(-)전하로 대전되어 금속박이 벌어져 있는 검전기의 금속판에 (+)대전체를 닿지 않게 천천히 가까이 하였더니 금속박이 오므라들었다. 이에 대한 설명으로 옳은 것은?", "figure_svg": "<svg style=\"background:#fff\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 260 210\" fill=\"none\" stroke=\"#000\" stroke-width=\"1.5\" font-size=\"13\" font-family=\"sans-serif\"><rect x=\"95\" y=\"8\" width=\"70\" height=\"20\" rx=\"4\" fill=\"#000\" fill-opacity=\"0.12\"/><text x=\"172\" y=\"23\" fill=\"#000\" stroke=\"none\" font-size=\"12\">(+)대전체<\/text><line x1=\"85\" y1=\"48\" x2=\"175\" y2=\"48\" stroke-width=\"3\"/><text x=\"185\" y=\"52\" fill=\"#000\" stroke=\"none\" font-size=\"12\">금속판<\/text><line x1=\"130\" y1=\"48\" x2=\"130\" y2=\"150\"/><path d=\"M75,95 L75,200 L185,200 L185,95 Q130,70 75,95 z\" stroke-width=\"1\"/><line x1=\"130\" y1=\"150\" x2=\"127\" y2=\"188\" stroke-width=\"2\"/><line x1=\"130\" y1=\"150\" x2=\"133\" y2=\"188\" stroke-width=\"2\"/><line x1=\"150\" y1=\"172\" x2=\"192\" y2=\"172\" stroke-width=\"0.8\"/><text x=\"195\" y=\"176\" fill=\"#000\" stroke=\"none\" font-size=\"12\">금속박<\/text><\/svg>", "choices": ["금속박이 오므라든 것은 검전기 전체가 전기를 띠지 않게 되었기 때문이다.", "대전체의 (+)전하가 금속판을 지나 금속박으로 이동하였다.", "금속박에 있던 전자의 일부가 금속판 쪽으로 이동하여 금속박의 (-)전하량이 줄었다.", "같은 검전기에 (+)대전체 대신 (-)대전체를 가까이 해도 금속박은 오므라든다.", "검전기에 대전된 전하량이 많을수록 처음 금속박이 덜 벌어져 있다."], "answer": [3], "explanation": "(+)대전체가 검전기 속 전자를 금속판 쪽으로 끌어당기므로 금속박의 전자가 줄어 금속박 사이의 밀어 내는 힘이 약해지고 금속박이 오므라든다. ① 검전기 안에서 전자의 위치만 바뀌었을 뿐 검전기 전체의 전하량은 그대로이다. ② 대전체와 검전기는 닿지 않았고, 이동하는 것은 전자이다. ④ (-)대전체를 가까이 하면 전자가 금속박 쪽으로 더 밀려와 금속박이 더 벌어진다. ⑤ 전하량이 많을수록 금속박이 더 많이 벌어진다.", "stimulus_group": "SG-E02"}, {"id": "전기와자기:A-029", "sub": "A", "type_id": "A08", "review_group": "RG06", "role": "reserve", "difficulty": "중", "format": "5지선다", "stem": "대전되지 않은 검전기의 금속판에 (-)대전체를 닿지 않게 가까이 하였다. 이때 검전기 안에서 전자가 이동하는 방향과 금속박이 띠는 전하를 옳게 짝지은 것은?", "choices": ["금속판 → 금속박, (-)전하", "금속박 → 금속판, (+)전하", "대전체 → 금속판, (-)전하", "(+)전하가 금속박 → 금속판으로 이동, (-)전하", "금속판 → 금속박, 금속판과 같은 (+)전하"], "answer": [1], "explanation": "(-)대전체가 금속판의 전자를 밀어 내므로 전자가 금속판에서 금속박으로 이동한다. 금속판은 (+), 금속박은 (-)전하를 띤다. ② 전자의 이동 방향과 금속박 전하를 모두 반대로 보았다. ③ 닿지 않았으므로 대전체에서 전자가 건너오지 않는다. ④ 이동하는 것은 전자이다. ⑤ 금속판과 금속박은 서로 다른 전하를 띤다."}, {"id": "전기와자기:A-030", "sub": "A", "type_id": "A09", "review_group": "RG06", "role": "reserve", "difficulty": "중", "format": "5지선다", "stem": "(+)전하로 대전되어 금속박이 벌어져 있는 검전기의 금속판에 대전체 X를 닿지 않게 가까이 하였더니 금속박이 더 많이 벌어졌다. X가 띤 전하의 종류와 그 까닭을 옳게 짝지은 것은?", "choices": ["(+)전하, 금속박의 전자가 금속판 쪽으로 더 끌려가 금속박의 (+)전하량이 많아졌기 때문이다.", "(-)전하, 금속판의 전자가 금속박으로 밀려와 금속박의 (+)전하량이 많아졌기 때문이다.", "(+)전하, X의 (+)전하가 금속박으로 건너왔기 때문이다.", "(-)전하, 검전기 전체의 전하량이 늘었기 때문이다.", "알 수 없다. 대전된 검전기로는 전하의 종류를 알 수 없기 때문이다."], "answer": [1], "explanation": "X가 (+)이면 검전기 속 전자를 금속판 쪽으로 끌어당겨 금속박의 전자가 더 줄어든다. 금속박의 (+)전하량이 많아져 더 벌어진다. ② (-)대전체가 전자를 금속박으로 밀어 내면 금속박의 (+)전하량이 줄어 오므라든다. ③ 닿지 않았으므로 전하가 건너오지 않는다. ④ 검전기 전체의 전하량은 변하지 않는다. ⑤ 전하를 알고 있는 대전된 검전기를 이용하면 전하의 종류를 알 수 있다."}, {"id": "전기와자기:A-031", "sub": "B", "type_id": "B01", "review_group": "RG07", "role": "main", "difficulty": "하", "format": "5지선다", "stem": "전류에 대한 설명으로 옳은 것은?", "choices": ["전류의 방향과 전자의 이동 방향은 같다.", "전자는 전지의 (+)극에서 나와 (-)극으로 들어간다.", "전류는 전지의 (+)극에서 나와 (-)극 쪽으로 흐른다.", "전류는 전구를 지나면서 쓰여 전구 뒤쪽 도선에서는 줄어든다.", "전지의 두 극을 바꾸어 연결하면 전구에 불이 켜지지 않는다."], "answer": [3], "explanation": "③ 옳다. 전류는 전지의 (+)극에서 나와 회로를 따라 (-)극 쪽으로 흐른다고 약속한다. ① 전자는 전류와 반대 방향으로 이동한다. ② 전자는 (-)극 쪽에서 (+)극 쪽으로 이동한다. ④ 전류는 회로를 따라 돌며 전구를 지나도 줄어들지 않는다. ⑤ 전지의 극을 바꾸면 전류의 방향만 바뀌고 전구는 그대로 켜진다."}, {"id": "전기와자기:A-032", "sub": "B", "type_id": "B02", "review_group": "RG07", "role": "main", "difficulty": "중", "format": "보기형(ㄱㄴㄷㄹ)", "stem": "그림 (가)와 (나)는 도선 속 원자핵과 전자의 모습을 모형으로 나타낸 것이다. (나)의 화살표는 전자가 움직이는 방향이다. 이에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?", "bogi": ["ㄱ. (가)는 전류가 흐르지 않는 상태로, 전자가 움직이지 않고 멈춰 있다.", "ㄴ. (나)에서 도선의 왼쪽 끝은 전지의 (+)극 쪽에 연결되어 있다.", "ㄷ. (나)에서 전류는 도선의 왼쪽에서 오른쪽으로 흐른다.", "ㄹ. (나)에서 원자핵도 전자와 같은 방향으로 이동한다."], "figure_svg": "<svg style=\"background:#fff\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 520 245\" fill=\"none\" stroke=\"#000\" stroke-width=\"1.5\" font-size=\"13\" font-family=\"sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#000\" stroke=\"none\"/><\/marker><\/defs><text x=\"4\" y=\"65\" fill=\"#000\" stroke=\"none\">(가)<\/text><rect x=\"40\" y=\"20\" width=\"380\" height=\"80\" rx=\"6\"/><circle cx=\"80\" cy=\"45\" r=\"10\"/><line x1=\"75\" y1=\"45\" x2=\"85\" y2=\"45\"/><line x1=\"80\" y1=\"40\" x2=\"80\" y2=\"50\"/><circle cx=\"155\" cy=\"45\" r=\"10\"/><line x1=\"150\" y1=\"45\" x2=\"160\" y2=\"45\"/><line x1=\"155\" y1=\"40\" x2=\"155\" y2=\"50\"/><circle cx=\"230\" cy=\"45\" r=\"10\"/><line x1=\"225\" y1=\"45\" x2=\"235\" y2=\"45\"/><line x1=\"230\" y1=\"40\" x2=\"230\" y2=\"50\"/><circle cx=\"305\" cy=\"45\" r=\"10\"/><line x1=\"300\" y1=\"45\" x2=\"310\" y2=\"45\"/><line x1=\"305\" y1=\"40\" x2=\"305\" y2=\"50\"/><circle cx=\"380\" cy=\"45\" r=\"10\"/><line x1=\"375\" y1=\"45\" x2=\"385\" y2=\"45\"/><line x1=\"380\" y1=\"40\" x2=\"380\" y2=\"50\"/><circle cx=\"60\" cy=\"80\" r=\"6\" fill=\"#000\" fill-opacity=\"0.15\"/><line x1=\"56.5\" y1=\"80\" x2=\"63.5\" y2=\"80\"/><line x1=\"56.8\" y1=\"86.4\" x2=\"50.7\" y2=\"98.6\" stroke-width=\"1\" marker-end=\"url(#ar)\"/><circle cx=\"115\" cy=\"70\" r=\"6\" fill=\"#000\" fill-opacity=\"0.15\"/><line x1=\"111.5\" y1=\"70\" x2=\"118.5\" y2=\"70\"/><line x1=\"119.2\" y1=\"75.8\" x2=\"127.1\" y2=\"86.9\" stroke-width=\"1\" marker-end=\"url(#ar)\"/><circle cx=\"170\" cy=\"85\" r=\"6\" fill=\"#000\" fill-opacity=\"0.15\"/><line x1=\"166.5\" y1=\"85\" x2=\"173.5\" y2=\"85\"/><line x1=\"165.8\" y1=\"79.2\" x2=\"157.8\" y2=\"68.1\" stroke-width=\"1\" marker-end=\"url(#ar)\"/><circle cx=\"230\" cy=\"75\" r=\"6\" fill=\"#000\" fill-o  - 전지", "물레방아 - 전지", "밸브(수도꼭지) - 전구", "수도관 - 전류"], "answer": [2], "explanation": "펌프는 물을 높은 곳으로 올려 높이 차를 유지하므로 전압을 유지하는 전지에 해당한다. 물의 높이 차는 전압, 물의 흐름은 전류, 물레방아는 전구, 밸브(수도꼭지)는 스위치, 수도관은 전선에 해당한다. ① 높이 차는 전압이다. ③ 물레방아는 전구이다. ④ 밸브는 스위치이다. ⑤ 수도관은 전선이다."}, {"id": "전기와자기:A-037", "sub": "B", "type_id": "B04", "review_group": "RG08", "role": "main", "difficulty": "중", "format": "보기형(ㄱㄴㄷㄹ)", "stem": "전압에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?", "bogi": ["ㄱ. 전압은 회로에 전류를 흐르게 하는 능력이다.", "ㄴ. 전압의 단위로는 A(암페어)를 쓴다.", "ㄷ. 전지는 전자를 만들어 도선에 공급한다.", "ㄹ. 전지는 전압을 유지하여 도선 속 전자가 계속 이동하게 한다."], "choices": ["ㄱ, ㄹ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ", "ㄱ, ㄴ, ㄹ", "ㄴ, ㄷ, ㄹ"], "answer": [1], "explanation": "ㄱ. 옳다. 전압은 회로에 전류를 흐르게 하는 능력(원인)이다. ㄴ. 전압의 단위는 V(볼트)이고, A(암페어)는 전류의 단위이다. ㄷ. 전자는 도선 속에 원래 있으며, 전지가 전자를 만들어 내는 것이 아니다. ㄹ. 옳다. 전지는 전압을 유지하여 도선 속 전자가 계속 한 방향으로 이동하게 한다."}, {"id": "전기와자기:A-038", "sub": "B", "type_id": "B03", "review_group": "RG08", "role": "main", "difficulty": "중", "format": "5지선다", "stem": "수로 모형에서 펌프의 작동을 멈추면 물의 높이 차가 없어져 곧 물레방아가 멈춘다. 이 현상에 대응하는 전기 회로의 설명으로 가장 옳은 것은?", "choices": ["전지를 빼면 전압이 없어져 전류가 흐르지 않으므로 전구가 꺼진다.", "전지를 빼면 전자를 만들어 공급할 수 없으므로 전구가 꺼진다.", "전지를 빼면 전류(물의 높이 차)가 없어져 전압(물의 흐름)이 멈춘다.", "전구를 빼면 전지가 멈추므로 전류가 흐르지 않는다.", "스위치를 빼도 전지가 있으면 전구는 계속 켜진다."], "answer": [1], "explanation": "펌프는 전지, 물의 높이 차는 전압, 물의 흐름은 전류, 물레방아는 전구에 해당한다. 펌프를 멈추는 것은 전지를 빼는 것과 같고, 높이 차(전압)가 없어지면 물의 흐름(전류)이 멈추어 물레방아(전구)가 멈춘다. ② 전자는 도선에 원래 있으며 전지는 전자를 만들지 않는다. ③ 높이 차는 전압, 물의 흐름은 전류이다. ④ 물레방아(전구)가 아니라 펌프(전지)를 멈춘 상황이다. ⑤ 회로 일부가 끊기면 전류가 흐르지 않는다."}, {"id": "전기와자기:A-039", "sub": "B", "type_id": "B04", "review_group": "RG08", "role": "reserve", "difficulty": "하", "format": "5지선다", "stem": "다음 설명의 ㉠~㉢에 알맞은 말을 옳게 짝지은 것은?<br>· 전하의 흐름을 ( ㉠ )라고 한다.<br>· 회로에 ( ㉠ )를 흐르게 하는 능력을 ( ㉡ )이라고 한다.<br>· ( ㉠ )의 흐름을 방해하는 정도를 ( ㉢ )이라고 한다.", "choices": ["㉠ 전류, ㉡ 전압, ㉢ 저항", "㉠ 전압, ㉡ 전류, ㉢ 저항", "㉠ 전류, ㉡ 저항, ㉢ 전압", "㉠ 저항, ㉡ 전압, ㉢ 전류", "㉠ 전압, ㉡ 저항, ㉢ 전류"], "answer": [1], "explanation": "전하의 흐름은 전류, 전류를 흐르게 하는 능력은 전압, 전류의 흐름을 방해하는 정도는 저항이다. ② 전류와 전압을 맞바꾸었다. ③ 전압과 저항을 맞바꾸었다. ④·⑤ 세 용어를 뒤섞었다."}, {"id": "전기와자기:A-040", "sub": "B", "type_id": "B03", "review_group": "RG08", "role": "reserve", "difficulty": "중", "format": "보기형(ㄱㄴㄷ)", "stem": "수로 모형을 이용하여 전기 회로를 설명한 내용으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?", "bogi": ["ㄱ. 펌프가 물을 더 높이 올려 물의 높이 차가 커지는 것은 전지의 전압이 커지는 것에 해당한다.", "ㄴ. 물레방아를 돌린 물의 양이 줄어드는 것처럼 전구를 지난 전류는 줄어든다.", "ㄷ. 밸브를 잠그는 것은 스위치를 열어 회로를 끊는 것에 해당한다."], "choices": ["ㄱ", "ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "answer": [3], "explanation": "ㄱ. 옳다. 펌프가 물을 더 높이 올려 높이 차를 크게 하는 것은 전지의 전압이 큰 것에 해당한다. ㄴ. 물레방아를 지나도 흐르는 물의 양이 줄지 않듯이 전구를 지나도 전류는 줄지 않는다. ㄷ. 옳다. 밸브를 잠그면 물이 흐르지 않으므로 스위치를 열어 회로를 끊으면 전류가 흐르지 않는 것에 해당한다."}, {"id": "전기와자기:A-041", "sub": "C", "type_id": "C01", "review_group": "RG09", "role": "main", "difficulty": "하", "format": "5지선다", "stem": "저항에 대한 설명으로 옳은 것은?", "choices": ["저항은 도선의 길이가 길수록 작아진다.", "같은 물질로 만든 도선은 길이와 굵기가 달라도 저항이 같다.", "1 Ω은 1 A의 전류를 흐르게 할 때 1 V를 만들어 내는 전지를 뜻한다.", "같은 니크롬선에 걸어 주는 전압을 크게 하면 니크롬선의 저항도 커진다.", "1 Ω은 도선에 1 V의 전압을 걸었을 때 1 A의 전류가 흐르는 도선의 저항이다."], "answer": [5], "explanation": "① 저항은 길이에 비례하므로 길수록 커진다. ② 같은 물질이라도 길이가 길거나 굵기가 가늘면 저항이 커진다. ③ Ω은 도선(저항)의 단위이지 전지를 나타내지 않는다. ④ 같은 니크롬선의 저항은 일정하며, 전압을 크게 하면 전류가 커진다. ⑤ 옳다."}, {"id": "전기와자기:A-042", "sub": "C", "type_id": "C02", "review_group": "RG09", "role": "main", "difficulty": "중", "format": "5지선다", "stem": "길이가 L, 단면적이 S인 니크롬선의 저항은 4 Ω이다. 표는 같은 물질로 만든 니크롬선 A~E의 길이와 단면적을 나타낸 것이다. 저항이 가장 큰 니크롬선과 그 저항값을 옳게 짝지은 것은?", "table": {"h": ["니크롬선", "A", "B", "C", "D", "E"], "r": [["길이", "L", "2L", "3L", "3L", "L"], ["단면적", "2S", "S", "2S", "S", "S"]]}, "choices": ["A, 8 Ω", "B, 8 Ω", "C, 6 Ω", "D, 12 Ω", "E, 4 Ω"], "answer": [4], "explanation": "같은 물질이면 저항은 길이에 비례하고 단면적에 반비례한다. 기준 4 Ω에 (길이 배수)÷(단면적 배수)를 곱하면 A=4×1÷2=2 Ω, B=4×2÷1=8 Ω, C=4×3÷2=6 Ω, D=4×3÷1=12 Ω, E=4×1÷1=4 Ω이다. 따라서 D가 12 Ω으로 가장 크다. ① 저항이 단면적에 비례한다고 보아 A를 가장 크다고 했다. ② B는 두 번째로 크다. ③ 길이가 3L로 같은 C와 D 중 단면적이 큰 C를 골랐다. 단면적이 클수록 저항은 작다. ⑤ E는 기준과 같은 4 Ω이다."}, {"id": "전기와자기:A-043", "sub": "C", "type_id": "C02", "review_group": "RG09", "role": "main", "difficulty": "상", "format": "단답형", "stem": "같은 물질로 만든 니크롬선 A와 B가 있다. A의 길이는 B의 2배이고, A의 저항은 B의 저항의 4배이다. A와 B의 단면적의 비(A : B)를 가장 간단한 정수비로 쓰시오.", "answer": "1 : 2", "explanation": "저항은 길이에 비례하고 단면적에 반비례한다. R_A/R_B = (L_A/L_B)÷(S_A/S_B)이므로 4 = 2÷(S_A/S_B), S_A/S_B = 1/2이다. 따라서 A : B = 1 : 2이다. 길이만으로는 2배이므로, 나머지 2배는 A가 더 가늘기 때문이다."}, {"id": "전기와자기:A-044", "sub": "C", "type_id": "C01", "review_group": "RG09", "role": "reserve", "difficulty": "중", "format": "보기형(ㄱㄴㄷ)", "stem": "저항에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?", "bogi": ["ㄱ. 같은 물질이라도 길이와 굵기가 다르면 저항이 다르다.", "ㄴ. 저항이 생기는 까닭은 도선 속을 이동하는 전자가 원자와 부딪히기 때문이다.", "ㄷ. 같은 니크롬선에 걸어 주는 전압을 2배로 하면 니크롬선의 저항도 2배가 된다."], "choices": ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ"], "answer": [3], "explanation": "ㄱ. 옳다. 같은 물질이라도 길이가 길수록, 굵기가 가늘수록 저항이 크다. ㄴ. 옳다. 도선 속을 이동하는 전자가 원자와 부딪혀 움직임을 방해받기 때문에 저항이 생긴다. ㄷ. 같은 니크롬선의 저항은 일정하므로 전압을 2배로 하면 전류가 2배가 될 뿐 저항은 변하지 않는다."}, {"id": "전기와자기:A-045", "sub": "C", "type_id": "C01", "review_group": "RG09", "role": "reserve", "difficulty": "하", "format": "5지선다", "stem": "도선에 저항이 생기는 까닭으로 가장 옳은 것은?", "choices": ["전자가 전지에서 멀어질수록 미는 힘이 약해지기 때문이다.", "도선 속을 이동하는 전자가 원자와 부딪혀 움직임을 방해받기 때문이다.", "도선 속 원자핵이 전자와 반대 방향으로 움직이기 때문이다.", "전구를 지나면서 전류가 쓰여 없어지기 때문이다.", "도선 속 전자의 수가 길이에 따라 줄어들기 때문이다."], "answer": [2], "explanation": "저항은 이동하는 전자가 물질 속 원자와 부딪혀 움직임을 방해받기 때문에 생긴다. 원자의 배열이 물질마다 달라 물질에 따라 저항이 다르다. ① 거리와 관계없는 내용이다. ③ 원자핵은 움직이지 않는다. ④ 전류는 회로에서 줄어들지 않는다. ⑤ 전자 수가 줄지 않는다.", "textbook_tags": {"mode": "include_only", "books": ["천재임", "천재정"]}}, {"id": "전기와자기:A-046", "sub": "C", "type_id": "C03", "review_group": "RG10", "role": "main", "difficulty": "하", "format": "5지선다", "stem": "다음은 옴의 법칙에 대한 설명이다. ㉠, ㉡에 알맞은 말을 옳게 짝지은 것은?<br>· 저항이 일정할 때 전류의 세기는 전압에 ( ㉠ )한다.<br>· 전압이 일정할 때 전류의 세기는 저항에 ( ㉡ )한다.", "choices": ["㉠ 비례, ㉡ 반비례", "㉠ 반비례, ㉡ 비례", "㉠ 비례, ㉡ 비례", "㉠ 반비례, ㉡ 반비례", "㉠ 비례, ㉡ 관계없음"], "answer": [1], "explanation": "V=IR에서 R이 일정하면 I는 V에 비례하고, V가 일정하면 I는 R에 반비례한다. ② 비례와 반비례를 맞바꾸었다. ③ 저항이 클수록 전류가 세다고 본 것이다. ④·⑤ 전압과 전류는 비례한다."}, {"id": "전기와자기:A-047", "sub": "C", "type_id": "C04", "review_group": "RG10", "role": "main", "difficulty": "중", "format": "5지선다", "stem": "저항이 30 Ω인 니크롬선에 6 V의 전압을 걸었다. 니크롬선에 흐르는 전류의 세기는 몇 mA인가?", "choices": ["0.2 mA", "5 mA", "20 mA", "200 mA", "180 mA"], "answer": [4], "explanation": "I=V/R=6 V/30 Ω=0.2 A이고, 1 A=1000 mA이므로 200 mA이다. ① A 값을 mA로 바꾸지 않았다. ② 저항÷전압(30÷6)으로 계산하였다. ③ 단위를 바꿀 때 자릿수를 잘못 옮겼다. ⑤ 전압과 저항을 곱하였다."}, {"id": "전기와자기:A-048", "sub": "C", "type_id": "C04", "review_group": "RG10", "role": "main", "difficulty": "상", "format": "단답형", "stem": "어떤 니크롬선에 3 V의 전압을 걸었더니 150 mA의 전류가 흘렀다. (1) 이 니크롬선의 저항은 몇 Ω인지 쓰고, (2) 같은 니크롬선에 9 V의 전압을 걸 때 흐르는 전류의 세기는 몇 A인지 쓰시오.", "answer": "(1) 20 Ω (2) 0.45 A", "scoring": "총 4점. (1) 20 Ω 2점(Ω 누락 시 1점, 0.05 Ω처럼 I÷V로 구하면 0점). (2) 0.45 A 2점: 단위 없이 0.45만 써도 인정, 450 mA로 쓰면 발문이 A 단위를 요구하므로 1점. 일관 오류: (1)의 저항값이 틀렸어도 그 값으로 (2)를 I=V÷R로 일관되게 계산했으면 (2) 1점.", "explanation": "(1) 150 mA=0.15 A이므로 R=V/I=3 V/0.15 A=20 Ω이다. (2) 같은 니크롬선의 저항은 20 Ω으로 일정하므로 I=9 V/20 Ω=0.45 A이다. 전압이 3배가 되었으므로 전류도 3배(0.15 A×3)가 된다고 구해도 된다."}, {"id": "전기와자기:A-049", "sub": "C", "type_id": "C03", "review_group": "RG10", "role": "main", "difficulty": "중", "format": "보기형(ㄱㄴㄷ)", "stem": "그림 (가)~(다)는 전기 회로에서 측정한 값의 관계를 그래프로 나타낸 것이다. 이에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?", "bogi": ["ㄱ. 전압이 일정할 때 저항과 전류의 관계는 (다)와 같다.", "ㄴ. 저항이 일정할 때 전압과 전류의 관계는 (가)와 같다.", "ㄷ. 전압이 일정할 때 저항과 전류의 관계는 (나)와 같다."], "figure_svg": "<svg xmlns:xlink=\"http://www.w3.org/1999/xlink\" width=\"432pt\" height=\"172.8pt\" viewBox=\"0 0 432 172.8\" xmlns=\"http://www.w3.org/2000/svg\" version=\"1.1\" style=\"background:#fff\">\n <metadata>\n  <rdf:RDF xmlns:dc=\"http://purl.org/dc/elements/1.1/\" xmlns:cc=\"http://creativecommons.org/ns#\" xmlns:rdf=\"http://www.w3.org/1999/02/22-rdf-syntax-ns#\">\n   <cc:Work>\n    <dc:type rdf:resource=\"http://purl.org/dc/dcmitype/StillImage\"/>\n    <dc:date>2026-10-26T19:47:28.442111<\/dc:date>\n    <dc:format>image/svg+xml<\/dc:form 6 240.200187 35.989188 \nC 240.706509 36.495511 241.393327 36.78 242.109375 36.78 \nz\n\" clip-path=\"url(#pc9d20d003c)\" style=\"stroke: #000000; stroke-width: 2; stroke-linejoin: miter\"/>\n   <\/g>\n  <\/g>\n <\/g>\n <defs>\n  <clipPath id=\"pc9d20d003c\">\n   <rect x=\"9.297375\" y=\"0\" width=\"341.892\" height=\"204.96\"/>\n  <\/clipPath>\n <\/defs>\n<\/svg>\n", "choices": ["전류계는 니크롬선과 나란히 병렬로 연결해야 한다.", "조작 변인은 니크롬선의 길이이다.", "전류계는 니크롬선과 직렬로 연결한다.", "통제 변인은 전원 장치의 전압이다.", "전압을 높이면 니크롬선의 저항이 커지므로 전류는 일정하다."], "answer": [3], "explanation": "③ 옳다. 전류를 재는 장치(전류계)는 회로에 직렬로 연결한다. ① 병렬로 연결하는 것은 전압계이다. ② 이 실험에서 바꾸는 것(조작 변인)은 전압이다. ④ 니크롬선의 길이·굵기·물질이 통제 변인이다. ⑤ 같은 니크롬선의 저항은 일정하며, 전압을 높이면 전류가 비례하여 커진다.", "stimulus_group": "SG-E05"}, {"id": "전기와자기:A-059", "sub": "C", "type_id": "C07", "review_group": "RG12", "role": "main", "difficulty": "하", "format": "단답형", "stem": "표는 어떤 니크롬선에 걸어 준 전압에 따라 흐르는 전류의 세기를 측정한 결과이다. ㉠에 알맞은 값과 이 니크롬선의 저항을 쓰시오.", "table": {"h": ["전압(V)", "1.5", "3.0", "4.5", "6.0"], "r": [["전류(A)", "0.1", "0.2", "㉠", "0.4"]]}, "answer": "㉠ 0.3, 저항 15 Ω", "scoring": "총 2점. ㉠ 0.3 1점: 단위 A는 생략해도 인정(0.3 A도 정답). 저항 15 Ω 1점: Ω을 빠뜨리면 0점, 0.067 Ω처럼 I÷V로 구하면 0점. 두 값은 따로 채점한다. 일관 오류: 저항을 잘못 구했어도 ㉠은 표의 비례 관계로 정해지므로 ㉠이 0.3이면 ㉠ 1점을 준다.", "explanation": "전압이 1.5 V씩 커질 때 전류가 0.1 A씩 커지므로 전류는 전압에 비례한다. 4.5 V는 1.5 V의 3배이므로 ㉠=0.1 A×3=0.3 A이다. 저항=1.5 V÷0.1 A=15 Ω이다."}, {"id": "전기와자기:A-060", "sub": "C", "type_id": "C07", "review_group": "RG12", "role": "main", "difficulty": "상", "format": "서술형", "stem": "표는 같은 굵기의 니크롬선 (가)와 (나)에 걸어 준 전압에 따라 흐르는 전류의 세기를 측정한 결과이다. (나)의 길이는 (가)의 2배이다. 이 실험 결과로부터 알 수 있는 결론을 (1) 전압과 전류의 관계, (2) 니크롬선의 길이와 전류의 관계로 나누어 서술하시오.", "table": {"h": ["전압(V)", "2", "4", "6"], "r": [["(가)의 전류(mA)", "100", "200", "300"], ["(나)의 전류(mA)", "50", "100", "150"]]}, "answer": "(1) 같은 니크롬선에서 전류의 세기는 전압에 비례한다. (2) 같은 전압을 걸 때 길이가 긴 (나)에는 (가)의 절반의 전류가 흐른다. 즉, 길이가 길수록 저항이 커서 전류가 약하게 흐른다.", "scoring": "상(3점): (1) 전류는 전압에 비례, (2) 같은 전압에서 긴 니크롬선에 약한 전류가 흐름(저항이 큼)을 모두 서술. 중(2점): 한 가지만 옳게 서술. 하(1점): '전압이 커지면 전류가 커진다'처럼 비례를 쓰지 않음. 긴 니크롬선에 전류가 더 세다고 쓰면 (2)는 0점.", "explanation": "(가)는 2 V에서 100 mA이므로 20 Ω, (나)는 2 V에서 50 mA이므로 40 Ω이다. 길이가 2배이면 저항이 2배가 되어 같은 전압에서 전류는 절반이 된다."}, {"id": "전기와자기:A-061", "sub": "C", "type_id": "C07", "review_group": "RG12", "role": "reserve", "difficulty": "하", "format": "5지선다", "stem": "니크롬선의 길이에 따른 전류의 세기를 알아보기 위해 같은 물질, 같은 굵기의 니크롬선을 길이만 다르게 하여 같은 전압을 걸고 전류를 측정하였다. 이 실험의 조작 변인은?", "choices": ["전원 장치의 전압", "니크롬선에 흐르는 전류의 세기", "니크롬선의 길이", "니크롬선의 굵기", "니크롬선의 물질"], "answer": [3], "explanation": "실험에서 일부러 다르게 한 것(조작 변인)은 니크롬선의 길이이다. 전압·굵기·물질은 같게 유지한 통제 변인이고, 전류의 세기는 측정한 결과(종속 변인)이다."}, {"id": "전기와자기:A-062", "sub": "C", "type_id": "C07", "review_group": "RG12", "role": "reserve", "difficulty": "중", "format": "보기형(ㄱㄴㄷ)", "stem": "그림과 같이 회로를 꾸미고 니크롬선에 걸린 전압과 흐르는 전류를 측정하였다. 이에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?", "bogi": ["ㄱ. 전류계는 니크롬선과 직렬로 연결되어 있다.", "ㄴ. 같은 니크롬선에 걸어 주는 전압을 2배로 하면 전류도 2배가 된다.", "ㄷ. 길이만 2배인 니크롬선으로 바꾸고 같은 전압을 걸면 전류도 2배가 된다."], "figure_svg": "<svg xmlns:xlink=\"http://www.w3.org/1999/xlink\" width=\"351.189375pt\" height=\"204.96pt\" viewBox=\"0 0 351.189375 204.96\" xmlns=\"http://www.w3.org/2000/svg\" version=\"1.1\" style=\"background:#fff\">\n <metadata>\n  <rdf:RDF xmlns:dc=\"http://purl.org/dc/elements/1.1/\" xmlns:cc=\"http://creativecommons.org/ns#\" xmlns:rdf=\"http://www.w3.org/1999/02/22-rdf-syntax-ns#\">\n   <cc:Work>\n    <dc:type rdf:resource=\"http://purl.org/dc/dcmitype/StillImage\"/>\n    <dc:date>2026-10-26T19:47:42.335176<\/dc:date>\n    <dc:format>image/svg+xml<\/dc:format>\n    <dc:creator>\n     <cc:Agent>\n      <dc:title>Matplotlib v3.10.3, https://matplotlib.org/<\/dc:title>\n     <\/cc:Agent>\n    <\/dc:creator>\n   <\/cc:Work>\n  <\/rdf:RDF>\n <\/metadata>\n <defs>\n  <style type=\"text/css\">*{stroke-linejoin: round; stroke-linecap: butt}<\/style>\n <\/defs>\n <g id=\"figure_1\">\n  <g id=\"patch_1\">\n   <path d=\"M 0 204.96 \nL 351.189375 204.96 \nL 351.189375 0 \nL 0 0 \nz\n\" styl  \nz\n\" clip-path=\"url(#pe0b6eee107)\" style=\"stroke: #000000; stroke-width: 2; stroke-linejoin: miter\"/>\n   <\/g>\n   <g id=\"patch_7\">\n    <path d=\"M 242.109375 36.78 \nC 242.825423 36.78 243.512241 36.495511 244.018563 35.989188 \nC 244.524886 35.482866 244.809375 34.796048 244.809375 34.08 \nC 244.809375 33.363952 244.524886 32.677134 244.018563 32.170812 \nC 243.512241 31.664489 242.825423 31.38 242.109375 31.38 \nC 241.393327 31.38 240.706509 31.664489 240.200187 32.170812 \nC 239.693864 32.677134 239.409375 33.363952 239.409375 34.08 \nC 239.409375 34.796048 239.693864 35.482866 240.200187 35.989188 \nC 240.706509 36.495511 241.393327 36.78 242.109375 36.78 \nz\n\" clip-path=\"url(#pe0b6eee107)\" style=\"stroke: #000000; stroke-width: 2; stroke-linejoin: miter\"/>\n   <\/g>\n  <\/g>\n <\/g>\n <defs>\n  <clipPath id=\"pe0b6eee107\">\n   <rect x=\"9.297375\" y=\"0\" width=\"341.892\" height=\"204.96\"/>\n  <\/clipPath>\n <\/defs>\n<\/svg>\n", "choices": ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ"], "answer": [3], "explanation": "ㄱ. 옳다. 전류계(A)는 니크롬선과 직렬로 연결되어 있다. ㄴ. 옳다. 같은 니크롬선의 저항은 일정하므로 전압을 2배로 하면 전류도 2배가 된다. ㄷ. 길이를 2배로 하면 저항이 2배가 되므로 같은 전압에서 전류는 절반이 된다.", "stimulus_group": "SG-E05"}, {"id": "전기와자기:A-063", "sub": "C", "type_id": "C08", "review_group": "RG13", "role": "main", "difficulty": "하", "format": "5지선다", "stem": "다음 중 반도체로만 짝지은 것은?", "choices": ["구리, 철", "고무, 유리", "규소, 알루미늄", "나무, 천연고무", "규소, 저마늄"], "answer": [5], "explanation": "규소와 저마늄은 반도체이다. ① 구리·철은 도체이다. ② 고무·유리는 부도체이다. ③ 알루미늄은 금속으로 도체이다. ④ 나무·천연고무는 부도체이다."}, {"id": "전기와자기:A-064", "sub": "C", "type_id": "C08", "review_group": "RG13", "role": "main", "difficulty": "중", "format": "보기형(ㄱㄴㄷ)", "stem": "도체, 부도체, 반도체에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?", "bogi": ["ㄱ. 전선의 피복은 전류가 잘 흐르도록 도체로 만든다.", "ㄴ. 도체는 저항이 작아 전류가 잘 흐른다.", "ㄷ. 반도체는 조건에 따라 전류의 흐름을 조절할 수 있다."], "choices": ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ"], "answer": [5], "explanation": "ㄱ. 전선의 피복은 전류가 새어 나가지 않도록 부도체(플라스틱, 고무)로 만든다. ㄴ. 옳다. 금속과 같은 도체는 저항이 작아 전류가 잘 흐른다. ㄷ. 옳다. 반도체는 저항이 도체와 부도체의 중간 정도이며, 조건에 따라 전류의 흐름을 조절할 수 있어 전자 기기에 쓰인다."}, {"id": "전기와자기:A-065", "sub": "C", "type_id": "C08", "review_group": "RG13", "role": "main", "difficulty": "중", "format": "서술형", "stem": "가정에서 쓰는 전선은 안쪽의 구리 선을 플라스틱으로 감싼 구조로 되어 있다. 구리와 플라스틱을 각각 사용하는 까닭을 <u>저항<\/u>이라는 말을 넣어 서술하시오.", "answer": "구리는 저항이 작은 도체여서 전류가 잘 흐르므로 전선 안쪽에 쓴다. 플라스틱은 저항이 매우 큰 부도체여서 전류가 거의 흐르지 않으므로, 전선을 감싸 전류가 밖으로 새어 나가거나 감전되는 것을 막는다.", "scoring": "상(3점): 구리=저항이 작은 도체(전류가 잘 흐름), 플라스틱=저항이 큰 부도체(전류가 새지 않게·감전 방지)를 모두 서술. 중(2점): 둘 중 하나만 옳거나 '저항'을 쓰지 않음. 하(1점): '구리는 전기가 통하고 플라스틱은 안 통한다'만 씀. 플라스틱을 도체로 쓰면 0점.", "explanation": "도체(구리)는 전류가 지나는 길, 부도체(플라스틱)는 안전을 위한 피복이다."}, {"id": "전기와자기:A-066", "sub": "C", "type_id": "C08", "review_group": "RG13", "role": "reserve", "difficulty": "하", "format": "5지선다", "stem": "표는 물질을 도체, 부도체, 반도체로 분류한 것이다. ㉠~㉢에 알맞은 물질을 옳게 짝지은 것은? (단, 알루미늄, 유리, 규소 중에서 고른다.)", "table": {"h": ["구분", "도체", "부도체", "반도체"], "r": [["특징", "저항이 작아 전류가 잘 흐른다.", "저항이 매우 커 전류가 거의 흐르지 않는다.", "저항이 중간 정도이며 조건에 따라 전류의 흐름을 조절할 수 있다."], ["물질", "㉠", "㉡", "㉢"]]}, "choices": ["㉠ 알루미늄, ㉡ 유리, ㉢ 규소", "㉠ 유리, ㉡ 알루미늄, ㉢ 규소", "㉠ 규소, ㉡ 유리, ㉢ 알루미늄", "㉠ 알루미늄, ㉡ 규소, ㉢ 유리", "㉠ 유리, ㉡ 규소, ㉢ 알루미늄"], "answer": [1], "explanation": "알루미늄은 금속으로 저항이 작은 도체, 유리는 저항이 매우 큰 부도체, 규소는 저항이 중간 정도인 반도체이다. ② 도체와 부도체를 맞바꾸었다. ③ 규소를 도체로 보았다. ④ 규소를 부도체로, 유리를 반도체로 보았다. ⑤ 세 가지를 모두 잘못 분류하였다."}, {"id": "전기와자기:A-067", "sub": "C", "type_id": "C08", "review_group": "RG13", "role": "reserve", "difficulty": "하", "format": "5지선다", "stem": "도체, 부도체, 반도체에 대한 설명으로 옳지 <u>않은<\/u> 것은?", "choices": ["구리, 철, 알루미늄은 도체이다.", "고무, 플라스틱, 나무는 부도체이다.", "반도체는 저항이 도체와 부도체의 중간 정도이다.", "반도체는 언제나 전류가 잘 흐르며 전류의 흐름을 조절할 수 없다.", "스마트폰 같은 전자 기기의 부품에는 반도체가 많이 쓰인다."], "answer": [4], "explanation": "④ 옳지 않다. 반도체는 조건에 따라 전류의 흐름을 조절할 수 있어 전자 기기의 부품에 쓰인다. ①·②·③·⑤는 옳은 설명이다."}, {"id": "전기와자기:D-001", "sub": "D", "type_id": "D01", "review_group": "RG14", "role": "main", "difficulty": "하", "format": "5지선다", "stem": "저항의 직렬연결과 병렬연결에 대한 설명으로 옳은 것은?", "choices": ["저항을 직렬로 많이 연결할수록 회로 전체의 저항은 작아진다.", "직렬연결된 각 저항에는 전원의 전압이 똑같이 걸린다.", "병렬연결된 각 저항에는 전원의 전압과 같은 크기의 전압이 걸린다.", "직렬연결된 전구 중 하나가 끊어져도 나머지 전구는 계속 켜져 있다.", "저항을 직렬로 연결하면 각 저항의 저항값이 커진다."], "answer": [3], "explanation": "① 직렬로 연결하면 저항의 길이가 길어지는 효과가 있어 전체 저항이 커진다. ② 직렬연결에서는 전원의 전압이 각 저항에 나뉘어 걸린다. ③ 옳다. 병렬연결된 각 저항의 양 끝은 전원의 양 끝에 바로 연결되므로 전원 전압과 같은 전압이 걸린다. ④ 직렬연결은 전류가 흐르는 길이 하나뿐이어서 하나가 끊어지면 모든 전구가 꺼진다. ⑤ 각 저항의 저항값은 그대로이고, 회로 전체의 저항이 커지는 것이다."}, {"id": "전기와자기:D-002", "sub": "D", "type_id": "D02", "review_group": "RG14", "role": "main", "difficulty": "중", "format": "5지선다", "stem": "그림은 전압이 같은 전지와 똑같은 전구를 사용하여 꾸민 회로 (가)~(다)를 나타낸 것이다. 전구 A, B, D의 밝기를 옳게 비교한 것은? (단, 전지의 내부 저항과 전선의 저항은 무시한다.)", "figure_svg": "<svg xmlns:xlink=\"http://www.w3.org/1999/xlink\" width=\"462.06pt\" height=\"279.36pt\" viewBox=\"0 0 462.06 279.36\" xmlns=\"http://www.w3.org/2000/svg\" version=\"1.1\" style=\"background:#fff\">\n <metadata>\n  <rdf:RDF xmlns:dc=\"http://purl.org/dc/elements/1.1/\" xmlns:cc=\"http://creativecommons.org/ns#\" xmlns:rdf=\"http://www.w3.org/1999/02/22-rdf-syntax-ns#\">\n   <cc:Work>\n    <dc:type rdf:resource=\"http://purl.org/dc/dcmitype/StillImage\"/>\n    <dc:date>2026-10-26T19:47:43.910451<\/dc:date>\n    <dc:format>image/svg+xml<\/dc:format>\n    <dc:creator>\n     <cc:Agent>\n      <dc:title>Matplotlib v3.10.3, https://matplotlib.org/<\/dc:title>\n     <\/cc:Agent>\n    <\/dc:creator>\n   <\/cc:Work>\n  <\/rdf:RDF>\n <\/metadata>\n <defs>\n  <style type=\"text/css\">*{stroke-linejoin: round; stroke-linecap: butt}<\/style>\n <\/defs>\n <g id=\"figure_1\">\n  <g id=\"patch_1\">\n   <path d=\"M 0 279.36 \nL 462.06 279.36 \nL 462.06 0 \nL 0 0 \nz\n\" style=\"fill: #ffffff\"/>\n  <\/g>\n  <g id=\"axes_1\">\n   <g id=\"patch_2\">\n    <path d=\"M 42.48 153.48 \nC 47.253656 153.48 51.832438 151.583406 55.207922 148.207922 \nC 58.583406 144.832438 60.48 140.253656 60.48 135.48 \nC 60.48 130.706344 58.583406 126.127562 55.207922 122.752078 \nC 51.832438 119.376594 47.2536 ple SD Gothic Neo','Noto Sans KR',sans-serif'Malgun Gothic'; text-anchor: middle\" x=\"38.16\" y=\"109.619688\" transform=\"rotate(-0 38.16 109.619688)\">+<\/text>\n   <\/g>\n   <g id=\"text_3\">\n    <text style=\"font-size: 14px; font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif'Malgun Gothic'; text-anchor: middle\" x=\"68.4\" y=\"109.619688\" transform=\"rotate(-0 68.4 109.619688)\">−<\/text>\n   <\/g>\n   <g id=\"text_4\">\n    <text style=\"font-size: 12px; font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif'Malgun Gothic'; text-anchor: middle\" x=\"53.28\" y=\"174.74625\" transform=\"rotate(-0 53.28 174.74625)\">(가)<\/text>\n   <\/g>\n   <g id=\"text_5\">\n    <text style=\"font-size: 12px; font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif'Malgun Gothic'; text-anchor: middle\" x=\"182.88\" y=\"13.843125\" transform=\"rotate(-0 182.88 13.843125)\">Q<\/text>\n   <\/g>\n   <g id=\"text_6\">\n    <text style=\"font-size: 12px; font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif'Malgun Gothic'; text-anchor: middle\" x=\"229.68\" y=\"13.843125\" transform=\"rotate(-0 229.68 13.843125)\">R<\/text>\n   <\/g>\n   <g id=\"text_7\">\n    <text style=\"font-size: 14px; font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif'Malgun Gothic'; text-anchor: middle\" x=\"201.96\" y=\"109.619688\" transform=\"rotate(-0 201.96 109.619688)\">+<\/text>\n   <\/g>\n   <g id=\"text_8\">\n    <text style=\"font-size: 14px; font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif'Malgun Gothic'; text-anchor: middle\" x=\"232.2\" y=\"109.619688\" transform=\"rotate(-0 232.2 109.619688)\">−<\/text>\n   <\/g>\n   <g id=\"text_9\">\n    <text style=\"font-size: 12px; font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif'Malgun Gothic'; text-anchor: middle\" x=\"217.08\" y=\"174.74625\" transform=\"rotate(-0 217.08 174.74625)\">(나)<\/text>\n   <\/g>\n  <\/g>\n <\/g>\n <defs>\n  <clipPath id=\"p60d2e651c9\">\n   <rect x=\"0\" y=\"0\" width=\"286.56\" height=\"182.16\"/>\n  <\/clipPath>\n <\/defs>\n<\/svg>\n", "answer": "P가 Q보다 밝다. (나)에서는 두 전구 Q, R가 직렬로 연결되어 전지의 전압이 두 전구에 나뉘어 걸리므로 Q에 걸리는 전압이 P보다 작다. (또는 직렬연결로 회로 전체의 저항이 커져 Q에 흐르는 전류가 P에 흐르는 전류보다 약하다.)", "scoring": "상(3점): 'P가 Q보다 밝다'와 까닭(전압이 나뉘어 Q에 걸리는 전압이 작음, 또는 전체 저항이 커져 Q에 흐르는 전류가 약함)을 모두 서술. 두 표현 중 하나만 써도 만점. 중(2점): 밝기 비교는 옳으나 까닭이 '직렬이라서'처럼 전압·전류를 쓰지 않음. 하(1점): 밝기 비교만 옳음. 0점: Q가 더 밝거나 같다고 씀. '각 전구의 저항이 커져서'를 까닭으로 쓰면 까닭 점수를 주지 않음.", "explanation": "같은 전구는 걸리는 전압이 클수록(흐르는 전류가 셀수록) 밝다. (가)의 P에는 전지 전압 전체가, (나)의 Q에는 그 절반이 걸린다.", "stimulus_group": "SG-E06"}, {"id": "전기와자기:D-005", "sub": "D", "type_id": "D03", "review_group": "RG14", "role": "reserve", "difficulty": "중", "format": "5지선다", "stem": "그림 (가)와 (나)는 같은 전지와 똑같은 전구로 꾸민 회로이다. (가)에서 전구 B를, (나)에서 전구 D를 각각 소켓에서 빼냈을 때에 대한 설명으로 옳은 것은?", "figure_svg": "<svg xmlns:xlink=\"http://www.w3.org/1999/xlink\" width=\"321.66pt\" height=\"218.16pt\" viewBox=\"0 0 321.66 218.16\" xmlns=\"http://www.w3.org/2000/svg\" version=\"1.1\" style=\"background:#fff\">\n <metadata>\n  <rdf:RDF xmlns:dc=\"http://purl.org/dc/elements/1.1/\" xmlns:cc=\"http://creativecommons.org/ns#\" xmlns:rdf=\"http://www.w3.org/1999/02/22-rdf-syntax-ns#\">\n   <cc:Work>\n    <dc:type rdf:resource=\"http://purl.org/dc/dcmitype/StillImage\"/>\n    <dc:date>2026-10-26T19:47:49.588198<\/dc:date>\n    <dc:format>image/svg+xml<\/dc:format>\n    <dc:creator>\n     <cc:Agent>\n      <dc:title>Matplotlib v3.10.3, https://matplotlib.org/<\/dc:title>\n     <\/cc:Agent>\n    <\/dc:creator>\n   <\/cc:Work>\n  <\/rdf:RDF>\n <\/metadata>\n <defs>\n  <style type=\"text/css\">*{stroke-linejoin: round; stroke-linecap: butt}<\/style>\n <\/defs>\n <g id=\"figure_1\">\n  <g id=\"patch_1\">\n   <path d=\"M 0 218.16 \nL 321.66 218.16 \nL 321.66 0 \nL 0 0 \nz\n\" style=\"fill: #ffffff\"/>\n  <\/g>\n  <g id=\"axes_1\">\n   <g id=\"patch_2\">\n    <path d=\"M 4 36\"/>\n  <\/clipPath>\n <\/defs>\n<\/svg>\n", "answer": "R₁에 걸린 전압은 1 A × 6 Ω = 6 V이고, R₂는 R₁과 병렬이므로 R₂에도 6 V가 걸려 R₂에 흐르는 전류는 6 V ÷ 3 Ω = 2 A이다. R₀에는 두 갈래 전류의 합인 1 A + 2 A = 3 A가 흐르므로 R₀에 걸린 전압은 3 A × 2 Ω = 6 V이다. 따라서 전원 장치의 전압은 6 V + 6 V = 12 V이다.", "scoring": "상(3점): ① 병렬 묶음 전압 6 V, ② R₂ 전류 2 A, ③ R₀ 전류 3 A와 R₀ 전압 6 V, ④ 전원 전압 12 V를 모두 풀이와 함께 서술. 중(2점): ①②는 옳으나 R₀ 전류를 1 A로 잡는 등 ③에서 틀려 최종값이 틀림. ①~③은 옳고 ④의 덧셈만 틀리면 중. 하(1점): ①만 옳음. 최종값만 쓰고 풀이가 없으면 하.", "explanation": "병렬 묶음에서 갈래 전압이 같다는 것과, 본선(R₀)에는 갈래 전류의 합이 흐른다는 것을 차례로 써서 푼다. 합성 저항 공식은 필요 없다.", "textbook_tags": {"mode": "include_only", "books": ["오투"]}}, {"id": "전기와자기:D-011", "sub": "D", "type_id": "D04", "review_group": "RG15", "role": "reserve", "difficulty": "중", "format": "서술형", "stem": "그림과 같이 저항 R₁(10 Ω)과 R₂(20 Ω)를 전압이 6 V인 전원에 직렬로 연결하였다. 회로에 흐르는 전류의 세기와 R₁, R₂에 걸리는 전압 V₁, V₂를 각각 구하고, V₁ : V₂를 풀이 과정과 함께 서술하시오. (단, 전선의 저항은 무시한다.)", "figure_svg": "<svg xmlns:xlink=\"http://www.w3.org/1999/xlink\" width=\"239.76pt\" height=\"169.56pt\" viewBox=\"0 0 239.76 169.56\" xmlns=\"http://www.w3.org/2000/svg\" version=\"1.1\" style=\"background:#fff\">\n <metadata>\n  <rdf:RDF xmlns:dc=\"http://purl.org/dc/elements/1.1/\" xmlns:cc=\"http://creativecommons.org/ns#\" xmlns:rdf=\"http://www.w3.org/1999/02/22-rdf-syntax-ns#\">\n   <cc:Work>\n    <dc:type rdf:resource=\"http://purl.org/dc/dcmitype/StillImage\"/>\n    <dc:date>2026-10-26T19:48:00.086593<\/dc:date>\n    <dc:format>image/svg+xml<\/dc:format>\n    <dc:creator>\n     <cc:Agent>\n      <dc:title>Matplotlib v3.10.3, https://matplotlib.org/<\/dc:title>\n     <\/cc:Agent>\n    <\/dc:creator>\n   <\/cc:Work>\n  <\/rdf:RDF>\n <\/metadata>\n <defs>\n  <style type=\"text/css\">*{stroke-linejoin: round; stroke-linecap: butt}<\/style>\n <\/defs>\n <g id=\"figure_1\">\n  <g id=\"patch_1\">\n   <path d=\"M 0 169.56 \nL 239.76 169.56 \nL 239.76 0 \nL 0 0 \nz\n\" style=\"fill: #ffffff\"/>\n  <\/g>\n  <g id=\"axes_1\">\n   <g id=\"line2d_1\">\n    <path d=\"M 4.68 137.28 \nL 4.
