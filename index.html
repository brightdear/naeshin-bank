r><\/defs><path d=\"M110,60 L110,210 M270,60 L270,210\"/><path d=\"M110,60 L180,60 M200,60 L270,60\"/><path d=\"M185,20 L185,95 M195,20 L195,95\"/><line x1=\"200\" y1=\"35\" x2=\"240\" y2=\"30\" stroke-width=\"1\"/><text x=\"244\" y=\"34\" fill=\"#000\" stroke=\"none\">A<\/text><circle cx=\"190\" cy=\"117\" r=\"22\" fill=\"#000\" fill-opacity=\"0.15\"/><line x1=\"212\" y1=\"117\" x2=\"240\" y2=\"150\" stroke-width=\"1\"/><text x=\"244\" y=\"154\" fill=\"#000\" stroke=\"none\">B<\/text><text x=\"130\" y=\"190\" fill=\"#000\" stroke=\"none\">C<\/text><path d=\"M110,210 Q190,222 270,210\" stroke-width=\"3\"/><line x1=\"266\" y1=\"213\" x2=\"300\" y2=\"226\" stroke-width=\"1\"/><text x=\"304\" y=\"230\" fill=\"#000\" stroke=\"none\">D<\/text><\/svg>", "choices": ["A - 숨관, B - 폐(허파), C - 흉강, D - 가로막", "A - 숨관, B - 가로막, C - 폐(허파), D - 흉강", "A - 숨관가지, B - 흉강, C - 폐(허파), D - 갈비뼈", "A - 숨관, B - 폐(허파), C - 흉강, D - 갈비뼈", "A - 폐(허파), B - 허파꽈리, C - 흉강, D - 가로막"], "answer": [1], "explanation": "관 A는 숨관, 고무풍선 B는 폐(허파), 병 속 공간 C는 흉강, 고무막 D는 가로막에 해당한다. ② 고무풍선은 가로막이 아니라 폐이다. ③ 병 속 공간은 흉강이다. ④ 이 모형에는 갈비뼈에 해당하는 부분이 없으며 고무막은 가로막이다. ⑤ 관은 숨관에 해당한다.", "stimulus_group": "SG-D-호흡운동모형"}, {"id": "동물과에너지:D-017", "sub": "D", "type_id": "D04", "review_group": "RG21", "role": "main", "difficulty": "중", "format": "보기형(ㄱㄴㄷ)", "stem": "그림은 사람의 호흡 운동을 알아보기 위한 모형이다. 이 모형은 밑면을 잘라 낸 투명한 병에 관 A를 꽂고, 관 끝에 고무풍선 B를 단 뒤, 병의 밑면을 고무막 D로 막아 만든 것이며, C는 병 속 공간이다. 이 모형에는 갈비뼈에 해당하는 부분이 없고, 가로막에 해당하는 고무막만 있다.<br>그림은 고무막 D를 아래로 당긴 모습이다. 이때에 대한 설명으로 옳은 것만을 &lt;보기&gt;에서 있는 대로 고른 것은?", "bogi": ["ㄱ. C의 부피가 커지고 압력이 낮아진다.", "ㄴ. B가 작아진다.", "ㄷ. 숨을 들이쉴 때 가로막이 내려가는 것에 해당한다."], "figure_svg": "<svg style=\"background:#fff\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 380 285\" fill=\"none\" stroke=\"#000\" stroke-width=\"1.5\" font-size=\"13\" font-family=\"'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#000\" stroke=\"none\"/><\/marker><\/defs><path d=\"M110,60 L110,210 M270,60 L270,210\"/><path d=\"M110,60 L180,60 M200,60 L270,60\"/><path d=\"M185,20 L185,95 M195,20 L195,95\"/><line x1=\"200\" y1=\"35\" x2=\"240\" y2=\"30\" stroke-width=\"1\"/><text x=\"244\" y=\"34\" fill=\"#000\" stroke=\"none\">A<\/text><circle cx=\"190\" cy=\"129\" r=\"34\" fill=\"#000\" fill-opacity=\"0.15\"/><line x1=\"224\" y1=\"129\" x2=\"240\" y2=\"150\" stroke-width=\"1\"/><text x=\"244\" y=\"154\" fill=\"#000\" stroke=\"none\">B<\/text><text x=\"130\" y=\"190\" fill=\"#000\" stroke=\"none\">C<\/text><path d=\"M110,210 Q190,260 270,210\" stroke-width=\"3\"/><line x1=\"190\" y1=\"240\" x2=\"190\" y2=\"270\" marker-end=\"url(#ar)\" stroke-width=\"2\"/><text x=\"200\" y=\"264\" fill=\"#000\" stroke=\"none\" font-size=\"11\">아래로 당김<\/text><line x1=\"266\" y1=\"218\" x2=\"300\" y2=\"236\" stroke-width=\"1\"/><text x=\"304\" y=\"240\" fill=\"#000\" stroke=\"none\">D<\/text><\/svg>", "choices": ["ㄴ", "ㄷ", "ㄱ, ㄴ", "ㄱ, ㄷ", "ㄱ, ㄴ, ㄷ"], "answer": [4], "explanation": "ㄱ. 옳다. 고무막을 당기면 병 속 공간(흉강)의 부피가 커져 압력이 낮아진다. ㄴ. 병 속 압력이 낮아지면 관을 통해 바깥 공기가 들어가 고무풍선(폐)이 부푼다. ㄷ. 옳다. 고무막을 당기는 것은 들숨 때 가로막이 내려가는 것에 해당한다.", "stimulus_group": "SG-D-호흡운동모형"}, {"id": "동물과에너지:D-018", "sub": "D", "type_id": "D04", "review_group": "RG21", "role": "main", "difficulty": "상", "format": "5지선다", "stem": "그림은 사람의 호흡 운동을 알아보기 위한 모형이다. 이 모형은 밑면을 잘라 낸 투명한 병에 관 A를 꽂고, 관 끝에 고무풍선 B를 단 뒤, 병의 밑면을 고무막 D로 막아 만든 것이며, C는 병 속 공간이다. 이 모형에는 갈비뼈에 해당하는 부분이 없고, 가로막에 해당하는 고무막만 있다.<br>이 모형에 대한 설명으로 옳은 것은?", "figure_svg": "<svg style=\"background:#fff\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 380 245\" fill=\"none\" stroke=\"#000\" stroke-width=\"1.5\" font-size=\"13\" font-family=\"'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#000\" stroke=\"none\"/><\/marker><\/defs><path d=\"M110,60 L110,210 M270,60 L270,210\"/><path d=\"M110,60 L180,60 M200,60 L270,60\"/><path d=\"M185,20 L185,95 M195,20 L195,95\"/><line x1=\"200\" y1=\"35\" x2=\"240\" y2=\"30\" stroke-width=\"1\"/><text x=\"244\" y=\"34\" fill=\"#000\" stroke=\"none\">A<\/text><circle cx=\"190\" cy=\"117\" r=\"22\" fill=\"#000\" fill-opacity=\"0.15\"/><line x1=\"212\" y1=\"117\" x2=\"240\" y2=\"150\" stroke-width=\"1\"/><text x=\"244\" y=\"154\" fill=\"#000\" stroke=\"none\">B<\/text><text x=\"130\" y=\"190\" fill=\"#000\" stroke=\"none\">C<\/text><path d=\"M110,210 Q190,222 270,210\" stroke-width=\"3\"/><line x1=\"266\" y1=\"213\" x2=\"300\" y2=\"226\" stroke-width=\"1\"/><text x=\"304\" y=\"230\" fill=\"#000\" stroke=\"none\">D<\/text><\/svg>", "choices": ["고무막 D를 위로 밀어 올리면 고무풍선 B가 부푼다.", "이 모형으로 숨을 들이쉴 때 갈비뼈가 올라가는 움직임도 나타낼 수 있다.", "고무막 D를 당기면 고무풍선 B가 먼저 부풀고, 그 결과 C의 압력이 낮아진다.", "병을 옆에서 손으로 눌러 C의 부피를 줄이면 고무풍선 B가 부푼다.", "고무막 D에 작은 구멍이 나 있으면, D를 당겨도 고무풍선 B가 거의 부풀지 않는다."], "answer": [5], "explanation": "① 고무막을 밀어 올리면 C의 부피가 작아지고 압력이 높아져 풍선이 작아진다(날숨). ② 이 모형에는 갈비뼈에 해당하는 부분이 없으므로 갈비뼈의 움직임은 나타낼 수 없다. ③ C의 부피가 먼저 커져 압력이 낮아지고, 그 결과 풍선 속으로 공기가 들어가 부푼다. ④ C의 부피가 줄면 압력이 높아져 풍선은 작아진다. ⑤ 옳다. 구멍으로 바깥 공기가 C에 바로 들어오면 C의 압력이 낮아지지 않아 풍선 안팎의 압력 차가 생기지 않는다.", "stimulus_group": "SG-D-호흡운동모형"}, {"id": "동물과에너지:D-019", "sub": "D", "type_id": "D04", "review_group": "RG21", "role": "reserve", "difficulty": "중", "format": "서술형", "stem": "그림은 사람의 호흡 운동을 알아보기 위한 모형이다. 이 모형은 밑면을 잘라 낸 투명한 병에 관 A를 꽂고, 관 끝에 고무풍선 B를 단 뒤, 병의 밑면을 고무막 D로 막아 만든 것이며, C는 병 속 공간이다. 이 모형에는 갈비뼈에 해당하는 부분이 없고, 가로막에 해당하는 고무막만 있다.<br>고무막 D를 손으로 잡아 아래로 당기면 고무풍선 B는 어떻게 되는지 쓰고, 그 까닭을 C의 <u>부피<\/u>와 <u>압력<\/u>의 변화를 이용하여 서술하시오.", "figure_svg": "<svg style=\"background:#fff\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 380 285\" fill=\"none\" stroke=\"#000\" stroke-width=\"1.5\" font-size=\"13\" font-family=\"'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#000\" stroke=\"none\"/><\/marker><\/defs><path d=\"M110,60 L110,210 M270,60 L270,210\"/><path d=\"M110,60 L180,60 M200,60 L270,60\"/><path d=\"M185,20 L185,95 M195,20 L195,95\"/><line x1=\"200\" y1=\"35\" x2=\"240\" y2=\"30\" stroke-width=\"1\"/><text x=\"244\" y=\"34\" fill=\"#000\" stroke=\"none\">A<\/text><circle cx=\"190\" cy=\"129\" r=\"34\" fill=\"#000\" fill-opacity=\"0.15\"/><line x1=\"224\" y1=\"129\" x2=\"240\" y2=\"150\" stroke-width=\"1\"/><text x=\"244\" y=\"154\" fill=\"#000\" stroke=\"none\">B<\/text><text x=\"130\" y=\"190\" fill=\"#000\" stroke=\"none\">C<\/text><path d=\"M110,210 Q190,260 270,210\" stroke-width=\"3\"/><line x1=\"190\" y1=\"240\" x2=\"190\" y2=\"270\" marker-end=\"url(#ar)\" stroke-width=\"2\"/><text x=\"200\" y=\"264\" fill=\"#000\" stroke=\"none\" font-size=\"11\">아래로 당김<\/text><line x1=\"266\" y1=\"218\" x2=\"300\" y2=\"236\" stroke-width=\"1\"/><text x=\"304\" y=\"240\" fill=\"#000\" stroke=\"none\">D<\/text><\/svg>", "answer": "고무풍선 B가 부푼다. 고무막을 당기면 병 속 공간 C의 부피가 커져 압력이 낮아지므로, 상대적으로 압력이 높은 바깥 공기가 관 A를 통해 고무풍선 안으로 들어오기 때문이다.", "scoring": "총 3점. 고무풍선 B가 부푼다 1점 + C의 부피가 커진다 1점 + C의 압력이 낮아져 바깥 공기가 관 A로 들어온다 1점. 풍선이 작아진다고 쓰면 0점.", "explanation": "모형의 고무막 당기기는 들숨 때 가로막이 내려가는 것에 해당한다.", "stimulus_group": "SG-D-호흡운동모형"}, {"id": "동물과에너지:D-020", "sub": "D", "type_id": "D04", "review_group": "RG21", "role": "reserve", "difficulty": "중", "format": "5지선다", "stem": "그림은 갈비뼈의 움직임을 알아보기 위한 모형이다. 비닐로 된 통 안에 관 A와 고무풍선 B를 넣고, 통 벽에 쇠고리 E를 여러 개 달아 E를 위로 들어 올리면 통의 벽이 바깥으로 벌어져 통 속 공간이 넓어지도록 만들었다. 통의 밑면은 고무막 D로 막혀 있다.<br>쇠고리 E를 위로 들어 올릴 때에 대한 설명으로 옳은 것은? (단, 고무막 D는 움직이지 않는다.)", "figure_svg": "<svg style=\"background:#fff\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 380 245\" fill=\"none\" stroke=\"#000\" stroke-width=\"1.5\" font-size=\"13\" font-family=\"'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#000\" stroke=\"none\"/><\/marker><\/defs><path d=\"M110,60 L110,210 M270,60 L270,210\" stroke-dasharray=\"4 3\"/><ellipse cx=\"190\" cy=\"90\" rx=\"84\" ry=\"7\" stroke-width=\"2.5\"/><ellipse cx=\"190\" cy=\"130\" rx=\"84\" ry=\"7\" stroke-width=\"2.5\"/><ellipse cx=\"190\" cy=\"170\" rx=\"84\" ry=\"7\" stroke-width=\"2.5\"/><line x1=\"276\" y1=\"130\" x2=\"310\" y2=\"130\" stroke-width=\"1\"/><text x=\"314\" y=\"134\" fill=\"#000\" stroke=\"none\">E<\/text><path d=\"M110,60 L180,60 M200,60 L270,60\"/><path d=\"M185,20 L185,95 M195,20 L195,95\"/><line x1=\"200\" y1=\"35\" x2=\"240\" y2=\"30\" stroke-width=\"1\"/><text x=\"244\" y=\"34\" fill=\"#000\" stroke=\"none\">A<\/text><circle cx=\"190\" cy=\"117\" r=\"22\" fill=\"#000\" fill-opacity=\"0.15\"/><line x1=\"212\" y1=\"117\" x2=\"240\" y2=\"150\" stroke-width=\"1\"/><text x=\"244\" y=\"154\" fill=\"#000\" stroke=\"none\">B<\/text><text x=\"130\" y=\"190\" fill=\"#000\" stroke=\"none\">C<\/text><path d=\"M110,210 Q190,222 270,210\" stroke-width=\"3\"/><line x1=\"266\" y1=\"213\" x2=\"300\" y2=\"226\" stroke-width=\"1\"/><text x=\"304\" y=\"230\" fill=\"#000\" stroke=\"none\">D<\/text><\/svg>", "choices": ["통 속 압력이 높아져 B가 작아진다.", "B가 부풀며, 이는 숨을 들이쉴 때 갈비뼈가 올라가는 것에 해당한다.", "B가 작아지며, 이는 숨을 내쉴 때에 해당한다.", "통 속 부피는 변하지 않고 B만 부푼다.", "E는 사람 몸의 가로막에 해당한다."], "answer": [2], "explanation": "쇠고리를 들어 올리면 통 속 공간(흉강)이 넓어져 압력이 낮아지고, 바깥 공기가 들어와 풍선(폐)이 부푼다. 이는 들숨 때 갈비뼈가 올라가는 것에 해당한다. ① 압력은 낮아진다. ③ 풍선은 부풀며 들숨에 해당한다. ④ 통 속 부피가 커지기 때문에 풍선이 부푼다. ⑤ E는 갈비뼈, D가 가로막에 해당한다.", "textbook_tags": {"mode": "include_only", "books": ["오투", "비상"]}}, {"id": "동물과에너지:D-021", "sub": "D", "type_id": "D06", "review_group": "RG22", "role": "main", "difficulty": "하", "format": "5지선다", "stem": "그림은 허파꽈리와 그 주변을 둘러싼 모세혈관 사이에서 기체가 이동하는 모습을 나타낸 것이다. ㉠과 ㉡은 기체의 이동 방향이고, 혈액은 A에서 B 쪽으로 흐른다.<br>이에 대한 설명으로 옳은 것은?", "figure_svg": "<svg style=\"background:#fff\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 380 215\" fill=\"none\" stroke=\"#000\" stroke-width=\"1.5\" font-size=\"13\" font-family=\"'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#000\" stroke=\"none\"/><\/marker><\/defs><circle cx=\"190\" cy=\"80\" r=\"55\" fill=\"#000\" fill-opacity=\"0.06\"/><text x=\"190\" y=\"70\" fill=\"#000\" stroke=\"none\" font-size=\"12\" text-anchor=\"middle\">허파꽈리<\/text><path d=\"M30,170 Q190,110 350,170\" stroke-width=\"8\"/><text x=\"20\" y=\"195\" fill=\"#000\" stroke=\"none\">A<\/text><text x=\"352\" y=\"195\" fill=\"#000\" stroke=\"none\">B<\/text><line x1=\"60\" y1=\"200\" x2=\"110\" y2=\"190\" marker-end=\"url(#ar)\" stroke-width=\"1\"/><line x1=\"270\" y1=\"190\" x2=\"320\" y2=\"200\" marker-end=\"url(#ar)\" stroke-width=\"1\"/><text x=\"190\" y=\"208\" fill=\"#000\" stroke=\"none\" font-size=\"11\" text-anchor=\"middle\">혈액의 흐름: A → B (모세혈관)<\/text><line x1=\"170\" y1=\"100\" x2=\"170\" y2=\"132\" marker-end=\"url(#ar)\" stroke-width=\"2\"/><text x=\"150\" y=\"122\" fill=\"#000\" stroke=\"none\">㉠<\/text><line x1=\"212\" y1=\"134\" x2=\"212\" y2=\"102\" marker-end=\"url(#ar)\" stroke-width=\"2\"/><text x=\"220\" y=\"122\" fill=\"#000\" stroke=\"none\">㉡<\/text><\/svg>", "choices": ["㉠은 이산화 탄소의 이동이다.", "B 쪽 혈액은 A 쪽 혈액보다 산소가 많다.", "기체가 이동할 때 에너지가 필요하다.", "산소 농도는 허파꽈리보다 A 쪽 모세혈관이 더 높다.", "기체는 농도가 낮은 곳에서 높은 곳으로 이동한다."], "answer": [2], "explanation": "① ㉠은 허파꽈리에서 모세혈관으로 가는 산소의 이동이다. ② 옳다. 기체 교환으로 산소를 받은 B 쪽 혈액의 산소가 더 많다. ③ 기체 교환은 확산으로 일어나며 에너지가 필요 없다. ④ 산소 농도는 허파꽈리가 모세혈관보다 높아서 산소가 모세혈관으로 확산된다. ⑤ 확산은 농도가 높은 곳에서 낮은 곳으로 일어난다."}, {"id": "동물과에너지:D-022", "sub": "D", "type_id": "D06", "review_group": "RG22", "role": "main", "difficulty": "상", "format": "보기형(ㄱㄴㄷ)", "stem": "그래프는 몸의 네 부분 (가)~(라)의 산소 농도를 상댓값으로 나타낸 것이다. (가)~(라)는 각각 허파꽈리, 폐로 들어가는 모세혈관의 혈액, 폐에서 나가는 모세혈관의 혈액, 조직 세포 중 하나이다.<br>이에 대한 설명으로 옳은 것만을 &lt;보기&gt;에서 있는 대로 고른 것은?", "passage": "(나)의 혈액이 (가)를 둘러싼 모세혈관을 지나면 (다)가 된다.", "bogi": ["ㄱ. 산소는 (가)에서 (나)의 혈액 쪽으로 확산된다.", "ㄴ. 네 곳 가운데 이산화 탄소 농도가 가장 높은 곳은 (라)이다.", "ㄷ. (라)와 모세혈관 사이의 기체 교환은 확산이 아니라 에너지를 쓰는 이동이다."], "figure_svg": "<svg xmlns:xlink=\"http://www.w3.org/1999/xlink\" width=\"288pt\" height=\"194.4pt\" viewBox=\"0 0 288 194.4\" xmlns=\"http://www.w3.org/2000/svg\" version=\"1.1\" style=\"background:#fff\">\n <metadata>\n  <rdf:RDF xmlns:dc=\"http://purl.org/dc/elements/1.1/\" xmlns:cc=\"http://creativecommons.org/ns#\" xmlns:rdf=\"http://www.w3.org/1999/02/22-rdf-syntax-ns#\">\n   <cc:Work>\n    <dc:type rdf:resource=\"http://purl.org/dc/dcmitype/StillImage\"/>\n    <dc:date>2026-10-26T20:07:57.241185<\/dc:date>\n    <dc:format>image/svg+xml<\/dc:format>\n    <dc:creator>\n     <cc:Agent>\n      <dc:title>Matplotlib v3.10.3, https://matplotlib.org/<\/dc:title>\n     <\/cc:Agent>\n    <\/dc:creator>\n   <\/cc:Work>\n  <\/rdf:RDF>\n <\/metadata>\n <defs>\n  <style type=\"text/css\">*{stroke-linejoin: round; stroke-linecap: butt}<\/style>\n <\/defs>\n <g id=\"figure_1\">\n  <g id=\"patch_1\">\n   <path d=\"M 0 194.4 \nL 288 194.4 \nL 288 0 \nL 0 0 \nz\n\" style=\"fill: #ffffff\"/>\n  <\/g>\n  <g id=\"axes_1\">\n   <g id=\"patch_2\">\n    <path d=\"M 49.64 149.92992 \nL 276.12 149.92992 \nL 276.12 17.4 \nL 49.64 17.4 \nz\n\" style=\"fill: #ffffff\"/>\n   <\/g>\n   <g id=\"patch_3\">\n    <path d=\"M 65.817143 149.92992 \nL 98.171429 149.92992 \nL 98.171429 33.808466 \nL 65.817143 33.808466 \nz\n\" clip-path=\"url(#p17c61e060a)\" style=\"fill: #bfbfbf; stroke: #000000; stroke-width: 1.2; stroke-linejoin: miter\"/>\n   <\/g>\n   <g id=\"patch_4\">\n    <path d=\"M 119.740952 149.92992 \nL 152.095238 149.92992 \nL 152.095238 96.917952 \nL 119.740952 96.917952 \ " transform=\"rotate(-0 243.765714 162.018514)\">(라)<\/text>\n     <\/g>\n    <\/g>\n   <\/g>\n   <g id=\"matplotlib.axis_2\">\n    <g id=\"text_5\">\n     <text style=\"font-size: 11px; font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif'Malgun Gothic'; text-anchor: end\" x=\"59.64\" y=\"14.799531\" transform=\"rotate(-0 59.64 14.799531)\">산소 농도<\/text>\n    <\/g>\n   <\/g>\n   <g id=\"patch_7\">\n    <path d=\"M 49.64 149.92992 \nL 49.64 17.4 \n\" style=\"fill: none; stroke: #000000; stroke-linejoin: miter; stroke-linecap: square\"/>\n   <\/g>\n   <g id=\"patch_8\">\n    <path d=\"M 49.64 149.92992 \nL 276.12 149.92992 \n\" style=\"fill: none; stroke: #000000; stroke-linejoin: miter; stroke-linecap: square\"/>\n   <\/g>\n   <g id=\"text_6\">\n    <text style=\"font-size: 8px; font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif'Malgun Gothic'; text-anchor: middle\" x=\"162.88\" y=\"177.380957\" transform=\"rotate(-0 162.88 177.380957)\">(막대 높이는 상댓값)<\/text>\n   <\/g>\n  <\/g>\n <\/g>\n <defs>\n  <clipPath id=\"p17c61e060a\">\n   <rect x=\"49.64\" y=\"17.4\" width=\"226.48\" height=\"132.52992\"/>\n  <\/clipPath>\n <\/defs>\n<\/svg>\n", "choices": ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "answer": [3], "explanation": "(가)는 허파꽈리, (나)는 폐로 들어가는 혈액, (다)는 폐에서 나가는 혈액, (라)는 조직 세포이다. ㄱ. 옳다. 산소는 농도가 높은 허파꽈리에서 낮은 모세혈관 혈액으로 확산된다. ㄴ. 옳다. 이산화 탄소 농도는 산소와 반대로 조직 세포 > 모세혈관 > 허파꽈리 순이므로 (라)가 가장 높다. ㄷ. 조직 세포와 모세혈관 사이의 기체 교환도 확산으로 일어난다."}, {"id": "동물과에너지:D-023", "sub": "D", "type_id": "D07", "review_group": "RG22", "role": "main", "difficulty": "중", "format": "5지선다", "stem": "허파꽈리와 모세혈관 사이의 기체 교환은 확산으로 일어난다. 다음 중 확산의 예로 가장 적절한 것은?", "choices": ["햇볕이 비친 뒤 운동장의 물웅덩이가 말라 없어졌다.", "냉동실에 넣어 둔 드라이아이스의 크기가 점점 작아졌다.", "방 한쪽에서 뿌린 향수 냄새가 잠시 뒤 방 전체에서 났다.", "그릇에 담아 둔 얼음이 녹아 물이 되었다.", "빨랫줄에 넌 젖은 수건이 바싹 말랐다."], "answer": [3], "explanation": "확산은 물질을 이루는 입자가 스스로 움직여 농도가 높은 곳에서 낮은 곳으로 퍼져 나가는 현상이다. ③ 향수 입자가 방 전체로 퍼지는 것이 확산이다. ①⑤는 증발, ②는 승화, ④는 융해로 물질의 상태가 변하는 현상이다."}, {"id": "동물과에너지:D-024", "sub": "D", "type_id": "D07", "review_group": "RG22", "role": "reserve", "difficulty": "중", "format": "서술형", "stem": "오랫동안 담배를 피우면 허파꽈리의 벽이 손상되어 이웃한 허파꽈리끼리 합쳐져 크기가 큰 주머니가 될 수 있다. 이런 사람은 조금만 움직여도 숨이 가쁘다. 그 까닭을 <u>표면적<\/u>과 <u>기체 교환<\/u>을 포함하여 서술하시오.", "answer": "작은 허파꽈리 여러 개가 합쳐져 큰 주머니가 되면 공기와 닿는 전체 표면적이 줄어든다. 그러면 허파꽈리와 모세혈관 사이에서 기체 교환이 잘 일어나지 않아 몸에 필요한 산소를 충분히 받아들이지 못하므로 숨이 가쁘다.", "scoring": "총 2점. 공기와 닿는 표면적이 줄어든다 1점 + 기체 교환(산소 흡수)이 잘 일어나지 않는다 1점. 표면적이 늘어난다고 쓰면 0점.", "explanation": "같은 부피라도 작은 주머니로 많이 나뉠수록 표면적이 넓다. 허파꽈리가 합쳐지면 표면적이 줄어 확산되는 산소의 양이 줄어든다."}, {"id": "동물과에너지:D-025", "sub": "D", "type_id": "D06", "review_group": "RG22", "role": "reserve", "difficulty": "상", "format": "5지선다", "stem": "그림은 온몸의 조직 세포와 그 옆을 지나는 모세혈관 사이에서 기체가 이동하는 모습을 나타낸 것이다. ㉠과 ㉡은 기체의 이동 방향이다.<br>이에 대한 설명으로 옳은 것은?", "figure_svg": "<svg style=\"background:#fff\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 380 200\" fill=\"none\" stroke=\"#000\" stroke-width=\"1.5\" font-size=\"13\" font-family=\"'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#000\" stroke=\"none\"/><\/marker><\/defs><rect x=\"120\" y=\"120\" width=\"140\" height=\"70\" rx=\"10\" fill=\"#000\" fill-opacity=\"0.06\"/><text x=\"190\" y=\"165\" fill=\"#000\" stroke=\"none\" font-size=\"12\" text-anchor=\"middle\">조직 세포<\/text><path d=\"M30,60 L350,60\" stroke-width=\"8\"/><text x=\"190\" y=\"40\" fill=\"#000\" stroke=\"none\" font-size=\"11\" text-anchor=\"middle\">모세혈관 (혈액의 흐름 →)<\/text><line x1=\"170\" y1=\"70\" x2=\"170\" y2=\"116\" marker-end=\"url(#ar)\" stroke-width=\"2\"/><text x=\"150\" y=\"98\" fill=\"#000\" stroke=\"none\">㉠<\/text><line x1=\"212\" y1=\"116\" x2=\"212\" y2=\"70\" marker-end=\"url(#ar)\" stroke-width=\"2\"/><text x=\"220\" y=\"98\" fill=\"#000\" stroke=\"none\">㉡<\/text><\/svg>", "choices": ["㉠은 이산화 탄소, ㉡은 산소의 이동이다.", "이 모세혈관을 지나고 난 혈액은 지나기 전보다 산소가 많다.", "조직 세포의 산소 농도는 모세혈관 혈액보다 높다.", "이곳에서의 기체 교환은 폐에서와 달리 확산으로 일어나지 않는다.", "㉠의 기체는 조직 세포에서 세포호흡에 쓰이고, ㉡의 기체는 세포호흡 결과 생긴다."], "answer": [5], "explanation": "① ㉠은 모세혈관에서 조직 세포로 가는 산소, ㉡은 조직 세포에서 모세혈관으로 가는 이산화 탄소이다. ② 조직에 산소를 주었으므로 지나고 난 혈액은 산소가 적다. ③ 조직 세포는 산소를 계속 써서 산소 농도가 모세혈관 혈액보다 낮다. ④ 조직에서의 기체 교환도 확산으로 일어난다. ⑤ 옳다."}, {"id": "동물과에너지:E-001", "sub": "E", "type_id": "E01", "review_group": "RG23", "role": "main", "difficulty": "하", "format": "5지선다", "stem": "3대 영양소가 세포호흡에 쓰일 때 생기는 노폐물에 대한 설명으로 옳은 것은?", "choices": ["탄수화물이 분해될 때에도 암모니아가 생긴다.", "요소는 암모니아보다 독성이 강하다.", "탄수화물, 단백질, 지방이 분해될 때 공통으로 물과 이산화 탄소가 생긴다.", "물은 콩팥에서 오줌으로만 몸 밖으로 나간다.", "단백질이 분해될 때 생기는 노폐물은 암모니아뿐이다."], "answer": [3], "explanation": "① 암모니아는 질소가 들어 있는 단백질이 분해될 때만 생긴다. ② 암모니아가 독성이 강하고, 간에서 바뀐 요소는 독성이 약하다. ③ 옳다. 3대 영양소는 모두 분해되어 물과 이산화 탄소를 만든다. ④ 물은 콩팥에서 오줌으로, 폐에서 날숨으로도 나간다. ⑤ 단백질이 분해되면 물, 이산화 탄소, 암모니아가 생긴다."}, {"id": "동물과에너지:E-002", "sub": "E", "type_id": "E01", "review_group": "RG23", "role": "main", "difficulty": "중", "format": "보기형(ㄱㄴㄷ)", "stem": "그림은 영양소가 조직 세포에서 분해될 때 생기는 노폐물 (가)~(다)와 이들이 몸 밖으로 나가는 경로를 나타낸 것이다. A와 B는 각각 기관이다. 이에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?", "bogi": ["ㄱ. (가)는 이산화 탄소, (나)는 물이다.", "ㄴ. A는 배설계에 속하는 기관이다.", "ㄷ. A에서 (다)는 독성이 약한 물질로 바뀐다.", "ㄹ. B에서 (다)가 요소로 바뀐다."], "figure_svg": "<svg style=\"background:#fff\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 540 200\" fill=\"none\" stroke=\"#000\" stroke-width=\"1.5\" font-size=\"13\" font-family=\"'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif\"><defs><marker id=\"mkE002\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#000\" stroke=\"none\"/><\/marker><\/defs><rect x=\"8\" y=\"22\" width=\"104\" height=\"32\" rx=\"4\"/><text x=\"18\" y=\"43\" fill=\"#000\" stroke=\"none\" font-size=\"12\">탄수화물, 지방<\/text><rect x=\"8\" y=\"100\" width=\"104\" height=\"32\" rx=\"4\"/><text x=\"38\" y=\"121\" fill=\"#000\" stroke=\"none\" font-size=\"12\">단백질<\/text><line x1=\"112\" y1=\"38\" x2=\"150\" y2=\"38\" marker-end=\"url(#mkE002)\"/><text x=\"152\" y=\"42\" fill=\"#000\" stroke=\"none\" font-size=\"12\">세포호흡 → (가), (나)<\/text><line x1=\"112\" y1=\"116\" x2=\"150\" y2=\"116\" marker-end=\"url(#mkE002)\"/><text x=\"152\" y=\"120\" fill=\"#000\" stroke=\"none\" font-size=\"12\">세포호흡 → (가), (나), (다)<\/text><line x1=\"330\" y1=\"10\" x2=\"330\" y2=\"190\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/><text x=\"342\" y=\"30\" fill=\"#000\" stroke=\"none\" font-size=\"12\">(가) → 폐 → 날숨<\/text><text x=\"342\" y=\"62\" fill=\"#000\" stroke=\"none\" font-size=\"12\">(나) → 폐 → 날숨<\/text><text x=\"370\" y=\"82\" fill=\"#000\" stroke=\"none\" font-size=\"12\">→ 콩팥 → 오줌<\/text><text x=\"342\" y=\"122\" fill=\"#000\" stroke=\"none\" font-size=\"12\">(다) →<\/text><rect x=\"392\" y=\"106\" width=\"30\" height=\"24\" rx=\"3\"/><text x=\"401\" y=\"123\" fill=\"#000\" stroke=\"none\" font-size=\"12\">A<\/text><text x=\"428\" y=\"123\" fill=\"#000\" stroke=\"none\" font-size=\"12\">→ 요소 →<\/text><rect x=\"492\" y=\"106\" width=\"30\" height=\"24\" rx=\"3\"/><text x=\"501\" y=\"123\" fill=\"#000\" stroke=\"none\" font-size=\"12\">B<\/text><line x1=\"507\" y1=\"130\" x2=\"507\" y2=\"150\" marker-end=\"url(#mkE002)\"/><text x=\"507\" y=\"168\" fill=\"#000\" stroke=\"none\" font-size=\"12\" text-anchor=\"middle\">오줌<\/text><\/svg>", "choices": ["ㄱ, ㄴ", "ㄱ, ㄷ", "ㄴ, ㄹ", "ㄱ, ㄷ, ㄹ", "ㄴ, ㄷ, ㄹ"], "answer": [2], "explanation": "(가)는 폐로만 나가므로 이산화 탄소, (나)는 폐와 콩팥으로 나가므로 물, (다)는 단백질에서만 생기므로 암모니아이다. A는 간, B는 콩팥이다. ㄱ. 옳다. ㄴ. 간(A)은 소화계에 속한다. ㄷ. 옳다. 독성이 강한 암모니아는 간에서 독성이 약한 요소로 바뀐다. ㄹ. 콩팥(B)은 요소를 걸러 오줌으로 내보낼 뿐, 암모니아를 요소로 바꾸는 곳은 간이다."}, {"id": "동물과에너지:E-003", "sub": "E", "type_id": "E01", "review_group": "RG23", "role": "main", "difficulty": "상", "format": "서술형", "stem": "단백질이 세포에서 분해될 때 생긴 암모니아가 몸 밖으로 나가기까지의 과정을 서술하시오. (단, 암모니아가 바뀌는 장소와 그 까닭, 몸 밖으로 내보내는 기관을 모두 포함한다.)", "answer": "단백질이 분해되면 독성이 강한 암모니아가 생긴다. 암모니아는 혈액을 따라 간으로 운반되어 독성이 약한 요소로 바뀐다. 요소는 혈액을 따라 콩팥으로 운반되어 걸러지고, 오줌에 섞여 몸 밖으로 나간다.", "scoring": "총 3점. ① 암모니아는 독성이 강하다 1점 ② 간에서 독성이 약한 요소로 바뀐다 1점 ③ 요소가 콩팥에서 걸러져 오줌으로 나간다 1점. 요소가 콩팥에서 만들어진다고 쓰거나 요소가 암모니아보다 독하다고 쓰면 해당 항목 0점.", "explanation": "암모니아→간(요소로 전환, 독성 감소)→혈액→콩팥(여과)→오줌. 장소를 간과 콩팥으로 정확히 구분해야 한다."}, {"id": "동물과에너지:E-004", "sub": "E", "type_id": "E01", "review_group": "RG23", "role": "reserve", "difficulty": "하", "format": "단답형", "stem": "다음 빈칸에 알맞은 말을 쓰시오.<br>단백질이 분해될 때 생긴 암모니아는 독성이 강하므로 ( ㉠ )에서 독성이 약한 ( ㉡ )(으)로 바뀐 뒤 콩팥에서 걸러져 오줌으로 나간다.", "answer": "㉠ 간, ㉡ 요소", "scoring": "총 2점. ㉠ 간 1점, ㉡ 요소 1점. ㉠에 콩팥을 쓰면 0점.", "explanation": "암모니아를 요소로 바꾸는 곳은 간이고, 콩팥은 요소를 걸러 내보낸다."}, {"id": "동물과에너지:E-005", "sub": "E", "type_id": "E01", "review_group": "RG23", "role": "reserve", "difficulty": "중", "format": "5지선다", "stem": "표는 영양소가 분해될 때 생기는 노폐물을 정리한 것이다. ㉠~㉤ 중 옳지 않은 것은?", "table": {"h": ["노폐물", "생기는 영양소", "몸 밖으로 나가는 경로"], "r": [["이산화 탄소", "탄수화물, 지방, 단백질", "㉠ 폐에서 날숨으로 나간다."], ["물", "㉡ 탄수화물, 지방, 단백질", "㉢ 콩팥에서 오줌으로만 나간다."], ["암모니아", "㉣ 단백질", "㉤ 간에서 요소로 바뀐 뒤 콩팥에서 오줌으로 나간다."]]}, "choices": ["㉠", "㉡", "㉢", "㉣", "㉤"], "answer": [3], "explanation": "① ㉠ 이산화 탄소는 순환계를 따라 폐로 가서 날숨으로 나간다. ② ㉡ 물은 3대 영양소에서 공통으로 생긴다. ③ ㉢ 옳지 않다. 물은 오줌뿐 아니라 날숨으로도 나간다. ④ ㉣ 암모니아는 질소가 든 단백질에서만 생긴다. ⑤ ㉤ 암모니아는 간에서 요소로 바뀌고 콩팥에서 걸러진다."}, {"id": "동물과에너지:E-006", "sub": "E", "type_id": "E02", "review_group": "RG24", "role": "main", "difficulty": "중", "format": "5지선다", "stem": "그림은 사람의 배설 기관을 나타낸 것이다. E와 F는 콩팥에 연결된 혈관이다. A~F에 대한 설명으로 옳은 것은?", "figure_svg": "<svg style=\"background:#fff\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 370 300\" fill=\"none\" stroke=\"#000\" stroke-width=\"1.5\" font-size=\"13\" font-family=\"'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif\"><text x=\"128\" y=\"18\" fill=\"#000\" stroke=\"none\" font-size=\"11\">대동맥<\/text><text x=\"194\" y=\"18\" fill=\"#000\" stroke=\"none\" font-size=\"11\">대정맥<\/text><line x1=\"170\" y1=\"25\" x2=\"170\" y2=\"210\" stroke-width=\"3\"/><line x1=\"190\" y1=\"25\" x2=\"190\" y2=\"210\" stroke-width=\"3\" stroke-dasharray=\"6 3\"/><ellipse cx=\"100\" cy=\"100\" rx=\"32\" ry=\"50\"/><ellipse cx=\"260\" cy=\"100\" rx=\"32\" ry=\"50\"/><line x1=\"170\" y1=\"88\" x2=\"132\" y2=\"88\"/><line x1=\"132\" y1=\"112\" x2=\"190\" y2=\"112\" stroke-dasharray=\"6 3\"/><line x1=\"170\" y1=\"88\" x2=\"228\" y2=\"88\"/><line x1=\"190\" y1=\"112\" x2=\"228\" y2=\"112\" stroke-dasharray=\"6 3\"/><path d=\"M100,150 C100,190 150,205 162,232\"/><path d=\"M260,150 C260,190 210,205 198,232\"/><ellipse cx=\"180\" cy=\"245\" rx=\"28\" ry=\"20\"/><line x1=\"180\" y1=\"265\" x2=\"180\" y2=\"295\" stroke-width=\"2\"/><line x1=\"150\" y1=\"76\" x2=\"152\" y2=\"87\" stroke-width=\"0.8\"/><text x=\"140\" y=\"72\" fill=\"#000\" stroke=\"none\" font-size=\"13\">E<\/text><line x1=\"150\" y1=\"125\" x2=\"152\" y2=\"113\" stroke-width=\"0.8\"/><text x=\"142\" y=\"138\" fill=\"#000\" stroke=\"none\" font-size=\"13\">F<\/text><line x1=\"76\" y1=\"72\" x2=\"46\" y2=\"56\" stroke-width=\"0.8\"/><text x=\"32\" y=\"58\" fill=\"#000\" stroke=\"none\" font-size=\"13\">A<\/text><line x1=\"123\" y1=\"197\" x2=\"98\" y2=\"216\" stroke-width=\"0.8\"/><text x=\"86\" y=\"228\" fill=\"#000\" stroke=\"none\" font-size=\"13\">B<\/text><line x1=\"205\" y1=\"239\" x2=\"232\" y2=\"224\" stroke-width=\"0.8\"/><text x=\"236\" y=\"226\" fill=\"#000\" stroke=\"none\" font-size=\"13\">C<\/text><line x1=\"179\" y1=\"283\" x2=\"156\" y2=\"283\" stroke-width=\"0.8\"/><text x=\"142\" y=\"288\" fill=\"#000\" stroke=\"none\" font-size=\"13\">D<\/text><text x=\"226\" y=\"292\" fill=\"#000\" stroke=\"none\" font-size=\"10\">(혈관: 실선 동맥, 점선 정맥)<\/text><\/svg>", "choices": ["A는 혈액 속 요소 등의 노폐물을 걸러 오줌을 만든다.", "B는 C에 모인 오줌을 몸 밖으로 내보낸다.", "C에서 오줌이 만들어진다.", "F를 통해 A에서 만들어진 오줌이 C로 운반된다.", "이 기관계는 소화되지 않은 음식물 찌꺼기도 몸 밖으로 내보낸다."], "answer": [1], "explanation": "A는 콩팥, B는 오줌관, C는 방광, D는 요도, E는 콩팥동맥, F는 콩팥정맥이다. ① 옳다. ② B(오줌관)는 콩팥에서 만든 오줌을 방광으로 보내고, 몸 밖으로 내보내는 것은 D(요도)이다. ③ C(방광)는 오줌을 모아 두는 곳이다. ④ F(콩팥정맥)에는 걸러진 혈액이 흐르며, 오줌은 B를 지나 C로 간다. ⑤ 찌꺼기를 대변으로 내보내는 것은 소화계가 담당한다.", "stimulus_group": "SG-E-배설기관그림"}, {"id": "동물과에너지:E-007", "sub": "E", "type_id": "E02", "review_group": "RG24", "role": "main", "difficulty": "중", "format": "보기형(ㄱㄴㄷ)", "stem": "그림은 사람의 배설 기관을 나타낸 것이다. E와 F는 콩팥에 연결된 혈관이다. 이에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?", "bogi": ["ㄱ. 요소의 농도는 E의 혈액이 F의 혈액보다 높다.", "ㄴ. F에는 A에서 만들어진 오줌이 흐른다.", "ㄷ. A에서 만들어진 오줌은 B를 지나 C에 모였다가 D를 통해 몸 밖으로 나간다."], "figure_svg": "<svg style=\"background:#fff\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 370 300\" fill=\"none\" stroke=\"#000\" stroke-width=\"1.5\" font-size=\"13\" font-family=\"'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif\"><text x=\"128\" y=\"18\" fill=\"#000\" stroke=\"none\" font-size=\"11\">대동맥<\/text><text x=\"194\" y=\"18\" fill=\"#000\" stroke=\"none\" font-size=\"11\">대정맥<\/text><line x1=\"170\" y1=\"25\" x2=\"170\" y2=\"210\" stroke-width=\"3\"/><line x1=\"190\" y1=\"25\" x2=\"190\" y2=\"210\" stroke-width=\"3\" stroke-dasharray=\"6 3\"/><ellipse cx=\"100\" cy=\"100\" rx=\"32\" ry=\"50\"/><ellipse cx=\"260\" cy=\"100\" rx=\"32\" ry=\"50\"/><line x1=\"170\" y1=\"88\" x2=\"132\" y2=\"88\"/><line x1=\"132\" y1=\"112\" x2=\"190\" y2=\"112\" stroke-dasharray=\"6 3\"/><line x1=\"170\" y1=\"88\" x2=\"228\" y2=\"88\"/><line x1=\"190\" y1=\"112\" x2=\"228\" y2=\"112\" stroke-dasharray=\"6 3\"/><path d=\"M100,150 C100,190 150,205 162,232\"/><path d=\"M260,150 C260,190 210,205 198,232\"/><ellipse cx=\"180\" cy=\"245\" rx=\"28\" ry=\"20\"/><line x1=\"180\" y1=\"265\" x2=\"180\" y2=\"295\" stroke-width=\"2\"/><line x1=\"150\" y1=\"76\" x2=\"152\" y2=\"87\" stroke-width=\"0.8\"/><text x=\"140\" y=\"72\" fill=\"#000\" stroke=\"none\" font-size=\"13\">E<\/text><line x1=\"150\" y1=\"125\" x2=\"152\" y2=\"113\" stroke-width=\"0.8\"/><text x=\"142\" y=\"138\" fill=\"#000\" stroke=\"none\" font-size=\"13\">F<\/text><line x1=\"76\" y1=\"72\" x2=\"46\" y2=\"56\" stroke-width=\"0.8\"/><text x=\"32\" y=\"58\" fill=\"#000\" stroke=\"none\" font-size=\"13\">A<\/text><line x1=\"123\" y1=\"197\" x2=\"98\" y2=\"216\" stroke-width=\"0.8\"/><text x=\"86\" y=\"228\" fill=\"#000\" stroke=\"none\" font-size=\"13\">B<\/text><line x1=\"205\" y1=\"239\" x2=\"232\" y2=\"224\" stroke-width=\"0.8\"/><text x=\"236\" y=\"226\" fill=\"#000\" stroke=\"none\" font-size=\"13\">C<\/text><line x1=\"179\" y1=\"283\" x2=\"156\" y2=\"283\" stroke-width=\"0.8\"/><text x=\"142\" y=\"288\" fill=\"#000\" stroke=\"none\" font-size=\"13\">D<\/text><text x=\"226\" y=\"292\" fill=\"#000\" stroke=\"none\" font-size=\"10\">(혈관: 실선 동맥, 점선 정맥)<\/text><\/svg>", "choices": ["ㄱ", "ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "answer": [3], "explanation": "ㄱ. 옳다. 콩팥동맥(E)으로 들어온 혈액은 콩팥에서 요소가 걸러진 뒤 콩팥정맥(F)으로 나가므로 F의 요소 농도가 더 낮다. ㄴ. F에는 걸러진 혈액이 흐르고, 오줌은 콩팥깔때기에 모여 오줌관(B)으로 나간다. ㄷ. 옳다. 콩팥(A)→오줌관(B)→방광(C)→요도(D).", "stimulus_group": "SG-E-배설기관그림"}, {"id": "동물과에너지:E-008", "sub": "E", "type_id": "E06", "review_group": "RG24", "role": "main", "difficulty": "중", "format": "순서배열", "stem": "콩팥동맥을 따라 콩팥으로 들어온 요소가 토리에서 걸러진 뒤 오줌에 섞여 몸 밖으로 나갈 때까지 거치는 구조를 <보기>에서 골라 <u>토리부터<\/u> 순서대로 나열하시오. (단, 거치지 않는 구조는 제외한다.)", "bogi": ["ㄱ. 방광", "ㄴ. 세뇨관", "ㄷ. 토리", "ㄹ. 오줌관", "ㅁ. 보먼주머니", "ㅂ. 콩팥깔때기", "ㅅ. 요도", "ㅇ. 콩팥정맥"], "answer": "ㄷ → ㅁ → ㄴ → ㅂ → ㄹ → ㄱ → ㅅ (ㅇ은 제외)", "scoring": "총 2점. 2점: ㄷ → ㅁ → ㄴ → ㅂ → ㄹ → ㄱ → ㅅ (토리 포함, 콩팥정맥 제외)을 모두 옳게 씀. 1점: 나머지 순서는 맞으나 토리(ㄷ)를 빼고 보먼주머니(ㅁ)부터 쓴 경우, 또는 콩팥깔때기(ㅂ) 하나만 빠뜨린 경우(콩팥깔때기를 그림으로만 다루는 교과서 고려). 0점: 콩팥정맥(ㅇ)을 넣거나 방광과 오줌관의 순서를 바꾼 경우, 두 가지 이상 틀린 경우.", "explanation": "토리에서 보먼주머니로 여과된 요소는 세뇨관을 지나 콩팥깔때기에 모이고, 오줌관→방광→요도로 나간다. 콩팥정맥은 걸러진 혈액이 나가는 길이므로 오줌의 경로가 아니다."}, {"id": "동물과에너지:E-009", "sub": "E", "type_id": "E02", "review_group": "RG24", "role": "reserve", "difficulty": "중", "format": "서술형", "stem": "소화되지 않은 음식물 찌꺼기를 항문을 통해 대변으로 내보내는 것은 배설이라고 하지 않는다. 그 까닭을 배설의 뜻과 관련지어 서술하시오.", "answer": "배설은 세포에서 영양소가 분해될 때 생겨 혈액에 들어온 노폐물(요소 등)을 몸 밖으로 내보내는 것이다. 대변은 흡수되지 않은 음식물 찌꺼기로 세포에서 생긴 노폐물이 아니며, 소화계를 통해 나가는 것이므로 배설이 아니다.", "scoring": "총 2점. ① 배설은 세포에서 생긴 노폐물을 몸 밖으로 내보내는 것이다 1점 ② 대변은 흡수되지 않은 음식물 찌꺼기로 세포에서 생긴 노폐물이 아니다(소화계가 내보냄) 1점.", "explanation": "배설과 배출(소화계)을 구분하는 문항."}, {"id": "동물과에너지:E-010", "sub": "E", "type_id": "E06", "review_group": "RG24", "role": "reserve", "difficulty": "상", "format": "5지선다", "stem": "건강한 사람의 콩팥동맥을 따라 들어와 토리에서 보먼주머니로 여과된 포도당 한 분자가 이동하는 경로로 가장 적절한 것은?", "choices": ["토리 → 보먼주머니 → 세뇨관 → 방광", "토리 → 보먼주머니 → 세뇨관 → 콩팥깔때기 → 오줌관", "토리 → 모세혈관 → 세뇨관 → 콩팥깔때기", "토리 → 세뇨관 → 보먼주머니 → 모세혈관", "토리 → 보먼주머니 → 세뇨관 → 모세혈관"], "answer": [5], "explanation": "① 건강한 사람은 포도당을 모두 재흡수하므로 방광까지 가지 않으며, 세뇨관과 방광 사이에는 콩팥깔때기와 오줌관도 있다. ② 건강한 사람은 포도당을 모두 재흡수하므로 포도당이 오줌관까지 가지 않는다. ③ 포도당은 모세혈관에서 세뇨관으로 분비되는 물질이 아니다. ④ 여과된 물질은 보먼주머니를 거쳐 세뇨관으로 가므로 순서가 바뀌었다. ⑤ 옳다. 토리에서 보먼주머니로 여과된 포도당은 세뇨관을 지나는 동안 모세혈관으로 모두 재흡수된다."}, {"id": "동물과에너지:E-011", "sub": "E", "type_id": "E03", "review_group": "RG25", "role": "main", "difficulty": "하", "format": "5지선다", "stem": "그림은 네프론과 그 주변의 혈관을 나타낸 것이다. A~C의 이름을 옳게 짝지은 것은?", "figure_svg": "<svg style=\"background:#fff\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 470 265\" fill=\"none\" stroke=\"#000\" stroke-width=\"1.5\" font-size=\"13\" font-family=\"'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif\"><defs><marker id=\"mkE011\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#000\" stroke=\"none\"/><\/marker><\/defs><path d=\"M82,113 L62,62 L140,62 C155,62 155,80 170,80 C200,80 200,180 230,180 C260,180 260,80 290,80 C320,80 320,180 350,180 C380,180 430,185 440,160 C450,135 445,70 456,40\" stroke-width=\"2\"/><text x=\"388\" y=\"32\" fill=\"#000\" stroke=\"none\" font-size=\"10\">콩팥정맥 쪽<\/text><circle cx=\"90\" cy=\"130\" r=\"44\"/><circle cx=\"90\" cy=\"130\" r=\"18\" fill=\"#000\" fill-opacity=\"0.2\"/><path d=\"M78,123 q6,-9 12,0 q6,9 12,0\" stroke-width=\"1\"/><path d=\"M78,137 q6,-9 12,0 q6 arker-end=\"url(#mkE013)\"/><text x=\"176\" y=\"116\" fill=\"#000\" stroke=\"none\" font-size=\"13\">㉡<\/text><line x1=\"290\" y1=\"84\" x2=\"290\" y2=\"120\" stroke-width=\"1.5\" marker-end=\"url(#mkE013)\"/><text x=\"296\" y=\"116\" fill=\"#000\" stroke=\"none\" font-size=\"13\">㉢<\/text><\/svg>", "answer": "(1) 토리(A)로 들어가는 혈관이 나오는 혈관보다 굵어 토리 안의 혈압이 높게 유지되므로, 혈액 속 물질이 보먼주머니(B)로 잘 밀려 나가 여과가 잘 일어난다. (2) 혈구, 단백질. 크기가 커서 토리에서 보먼주머니로 빠져나가지 못하기 때문이다.", "scoring": "총 5점. (1) 2점: 토리 안의 혈압이 높다 1점 + 물질이 보먼주머니로 잘 밀려 나가 여과가 잘 된다 1점. (2) 3점: 혈구 1점, 단백질 1점, 크기가 커서 빠져나가지 못한다 1점. 포도당·요소·물을 쓰면 그 성분 0점.", "explanation": "여과는 토리의 높은 혈압으로 크기가 작은 물질이 보먼주머니로 이동하는 과정이다. 혈구·단백질은 크기가 커서 여과되지 않는다.", "stimulus_group": "SG-E-네프론그림"}, {"id": "동물과에너지:E-014", "sub": "E", "type_id": "E03", "review_group": "RG25", "role": "main", "difficulty": "중", "format": "5지선다", "stem": "오줌이 만들어지는 과정에 대한 설명으로 옳지 않은 것은?", "choices": ["토리의 높은 혈압으로 크기가 작은 물질이 보먼주머니로 이동한다.", "요소는 토리에서 여과되어 세뇨관을 지나 오줌으로 나간다.", "물과 무기염류는 세뇨관에서 대부분 재흡수된다.", "분비는 모세혈관에서 세뇨관으로 물질이 이동하는 과정이다.", "포도당과 아미노산은 여과되지 않고 혈액에 남는다."], "answer": [5], "explanation": "① 여과에 대한 옳은 설명이다. ② 요소는 크기가 작아 여과되어 오줌으로 나간다. ③ 물과 무기염류는 대부분 재흡수되고 일부가 오줌으로 나간다. ④ 분비의 방향은 모세혈관→세뇨관이다. ⑤ 옳지 않다. 포도당·아미노산은 크기가 작아 여과된 뒤 세뇨관에서 모두 재흡수된다."}, {"id": "동물과에너지:E-015", "sub": "E", "type_id": "E03", "review_group": "RG25", "role": "reserve", "difficulty": "하", "format": "단답형", "stem": "다음 빈칸에 알맞은 말을 쓰시오.<br>네프론에서 물질이 세뇨관에서 모세혈관으로 다시 흡수되는 과정을 ( ㉠ ), 여과되지 않고 혈액에 남은 노폐물이 모세혈관에서 세뇨관으로 이동하는 과정을 ( ㉡ )(이)라고 한다.", "answer": "㉠ 재흡수, ㉡ 분비", "scoring": "총 2점. ㉠ 재흡수 1점, ㉡ 분비 1점. 두 말을 바꾸어 쓰면 0점.", "explanation": "재흡수는 세뇨관→모세혈관, 분비는 모세혈관→세뇨관이다."}, {"id": "동물과에너지:E-016", "sub": "E", "type_id": "E03", "review_group": "RG25", "role": "reserve", "difficulty": "중", "format": "보기형(ㄱㄴㄷ)", "stem": "네프론에서 오줌이 만들어지는 과정에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?", "bogi": ["ㄱ. 보먼주머니로 여과된 액체는 모두 오줌이 된다.", "ㄴ. 네프론은 토리, 보먼주머니, 세뇨관으로 이루어져 있다.", "ㄷ. 물과 무기염류는 여과된 뒤 모두 재흡수된다."], "choices": ["ㄱ", "ㄴ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ"], "answer": [2], "explanation": "ㄱ. 여과액의 대부분은 세뇨관에서 재흡수되고 일부만 오줌이 된다. ㄴ. 옳다. ㄷ. 물과 무기염류는 대부분 재흡수되고 일부는 오줌으로 나간다."}, {"id": "동물과에너지:E-017", "sub": "E", "type_id": "E04", "review_group": "RG26", "role": "main", "difficulty": "상", "format": "보기형(ㄱㄴㄷ)", "stem": "표는 건강한 사람의 혈장, 보먼주머니 속 여과액, 오줌에 들어 있는 물질 A~C를 비교한 것이다. A~C는 각각 단백질, 포도당, 요소 중 하나이다. 이에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?", "bogi": ["ㄱ. A는 크기가 커서 토리에서 보먼주머니로 여과되지 않는다.", "ㄴ. B는 세뇨관에서 모세혈관으로 모두 재흡수된다.", "ㄷ. 오줌에서 C의 농도가 높은 것은 C가 세뇨관에서 재흡수되기 때문이다.", "ㄹ. 건강한 사람의 오줌에서 B가 검출되는 것은 정상이다."], "table": {"h": ["물질", "혈장", "여과액", "오줌"], "r": [["A", "있음", "없음", "없음"], ["B", "있음", "있음(혈장과 농도 비슷)", "없음"], ["C", "있음", "있음(혈장과 농도 비슷)", "있음(혈장보다 농도가 매우 높음)"]]}, "choices": ["ㄱ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄹ", "ㄱ, ㄷ, ㄹ"], "answer": [2], "explanation": "A는 여과되지 않으므로 단백질, B는 여과되지만 오줌에 없으므로 포도당, C는 오줌에서 농축되므로 요소이다. ㄱ. 옳다. ㄴ. 옳다. ㄷ. 요소가 농축되는 것은 세뇨관에서 물이 대부분 재흡수되기 때문이다. ㄹ. 건강한 사람의 오줌에는 포도당이 없다."}, {"id": "동물과에너지:E-018", "sub": "E", "type_id": "E05", "review_group": "RG26", "role": "main", "difficulty": "상", "format": "서술형", "stem": "표는 세 사람 (가)~(다)의 오줌을 검사한 결과이다. (가)는 건강한 사람이다.<br>(나)와 (다)는 네프론에서 오줌이 만들어지는 과정 중 어느 과정에 이상이 있는지 각각 쓰고, 그렇게 판단한 까닭을 서술하시오.", "table": {"h": ["사람", "포도당", "단백질"], "r": [["(가)", "검출 안 됨", "검출 안 됨"], ["(나)", "검출됨", "검출 안 됨"], ["(다)", "검출 안 됨", "검출됨"]]}, "answer": "(나) 재흡수 과정. 포도당은 여과된 뒤 세뇨관에서 모두 재흡수되어야 하는데, 오줌에서 검출되었으므로 재흡수가 제대로 일어나지 않았다. (다) 여과 과정. 단백질은 크기가 커서 여과되지 않아야 하는데 오줌에서 검출되었으므로 토리에서 보먼주머니로 여과되었다.", "scoring": "총 4점. (나) 재흡수 1점 + 까닭(포도당은 모두 재흡수되어야 하는데 오줌에서 검출) 1점, (다) 여과 1점 + 까닭(단백질은 크기가 커 여과되지 않아야 하는데 오줌에서 검출) 1점. (나)를 여과 이상, (다)를 재흡수 이상으로 바꿔 쓰면 해당 항목 0점. 당뇨처럼 혈당이 높은 경우를 덧붙여도 감점하지 않음.", "explanation": "오줌에 포도당 → 재흡수 이상, 단백질 → 여과 이상(sci_checklist)."}, {"id": "동물과에너지:E-019", "sub": "E", "type_id": "E05", "review_group": "RG26", "role": "main", "difficulty": "최상", "format": "보기형(ㄱㄴㄷ)", "stem": "그림은 네프론에서 시료를 채취한 위치 Ⅰ~Ⅲ을, 표는 세 사람 갑~병의 시료 Ⅰ~Ⅲ에 베네딕트 용액(당 검출, 가열)과 단백질 검출 용액(수산화 나트륨 수용액+황산 구리 수용액)을 각각 넣었을 때의 색깔을 나타낸 것이다. 병은 건강한 사람이다. 이에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은? (단, Ⅰ에서 채취한 혈액은 혈구를 걸러 낸 혈장으로 검사하였고, ㉠~㉢은 물질이 이동하는 과정이다.)", "passage": "베네딕트 반응: 황적색(당 있음), 청색(당 없음) / 단백질 검출 반응: 보라색(단백질 있음), 청색(단백질 없음)", "bogi": ["ㄱ. 갑은 ㉡ 과정에서 포도당이 모두 재흡수되지 못하고 일부가 오줌으로 나왔다.", "ㄴ. 을은 ㉠ 과정에서 크기가 큰 물질이 이동하였다.", "ㄷ. 갑의 Ⅱ에서 단백질이 검출되지 않은 것은 단백질이 세뇨관에서 모두 재흡수되었기 때문이다.", "ㄹ. 을의 Ⅲ에서 당이 검출되지 않은 것은 포도당이 ㉠ 과정에서 이동하지 않았기 때문이다."], "table": {"h": ["사람", "Ⅰ (베네딕트 / 단백질)", "Ⅱ (베네딕트 / 단백질)", "Ⅲ (베네딕트 / 단백질)"], "r": [["갑", "황적색 / 보라색", "황적색 / 청색", "황적색 / 청색"], ["을", "황적색 / 보라색", "황적색 / 보라색", "청색 / 보라색"], ["병", "황적색 / 보라색", "황적색 / 청색", "청색 / 청색"]]}, "figure_svg": "<svg style=\"background:#fff\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 470 265\" fill=\"none\" stroke=\"#000\" stroke-width=\"1.5\" font-size=\"13\" font-family=\"'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif\"><defs><marker id=\"mkE019\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#000\" stroke=\"none\"/><\/marker><\/defs><path d=\"M82,113 L62,62 L140,62 C155,62 155,80 170,80 C200,80 200,180 230,180 C260,180 260,80 290,80 C320,80 320,180 350,180 C380,180 430,185 440,160 C450,135 445,70 456,40\" stroke-width=\"2\"/><text x=\"388\" y=\"32\" fill=\"#000\" stroke=\"none\" font-size=\"10\">콩팥정맥 쪽<\/text><circle cx=\"90\" cy=\"130\" r=\"44\"/><circle cx=\"90\" cy=\"130\" r=\"18\" fill=\"#000\" fill-opacity=\"0.2\"/><path d=\"M78,123 q6,-9 12,0 q6,9 12,0\" stroke-width=\"1\"/><path d=\"M78,137 q6,-9 12,0 q6,9 12,0\" stroke-width=\"1\"/><line x1=\"8\" y1=\"165\" x2=\"74\" y2=\"138\" stroke-width=\"5\"/><path d=\"M133,122 L416,122 L416,240 L400,240 L400,138 L133,138 Z\" fill=\"#fff\" stroke=\"none\"/><line x1=\"133\" y1=\"122\" x2=\"416\" y2=\"122\" stroke-width=\"1.5\"/><line x1=\"133\" y1=\"138\" x2=\"400\" y2=\"138\" stroke-width=\"1.5\"/><line x1=\"416\" y1=\"122\" x2=\"416\" y2=\"240\" stroke-width=\"1.5\"/><line "Ⅰ은 토리로 들어가는 혈액의 혈장, Ⅱ는 보먼주머니 속 여과액, Ⅲ은 세뇨관 끝(오줌)이다. 병(정상)과 비교하면 갑은 Ⅲ에서 당이 검출되므로 재흡수 이상, 을은 Ⅱ·Ⅲ에서 단백질이 검출되므로 여과 이상이다. ㄱ. 옳다. 갑은 Ⅱ에서 당이 검출되어 포도당이 여과되었는데 Ⅲ(오줌)에서도 당이 검출되므로, ㉡(재흡수) 과정에서 포도당이 모두 재흡수되지 못하고 일부가 오줌으로 나왔다. ㄴ. 옳다. 을은 Ⅱ에서 단백질이 검출되므로 크기가 큰 단백질이 ㉠(여과) 과정에서 보먼주머니로 이동하였다. ㄷ. Ⅱ는 세뇨관을 지나기 전이므로 재흡수와 관계없다. 단백질이 Ⅱ에 없는 것은 크기가 커서 여과되지 않았기 때문이다. ㄹ. 을의 Ⅱ에서 당이 검출되므로 포도당은 여과되었고, Ⅲ에서 검출되지 않는 것은 세뇨관에서 모두 재흡수되었기 때문이다.", "stimulus_group": "SG-E-네프론그림"}, {"id": "동물과에너지:E-020", "sub": "E", "type_id": "E04", "review_group": "RG26", "role": "reserve", "difficulty": "하", "format": "5지선다", "stem": "건강한 사람의 오줌에서 검출되지 않는 물질로만 짝지은 것은?", "choices": ["물, 요소", "요소, 무기염류", "포도당, 단백질", "물, 포도당", "단백질, 무기염류"], "answer": [3], "explanation": "건강한 사람의 오줌에는 물, 요소, 무기염류가 들어 있고, 포도당과 단백질은 없다. ④ 물은 오줌에 들어 있다. ⑤ 무기염류는 일부가 오줌으로 나간다."}, {"id": "동물과에너지:E-021", "sub": "E", "type_id": "E05", "review_group": "RG26", "role": "reserve", "difficulty": "중", "format": "5지선다", "stem": "이 결과에 대한 해석으로 가장 적절한 것은?", "passage": "오줌 검사지는 오줌에 특정 물질이 들어 있으면 해당 칸의 색이 바뀌어 '양성'으로 나타난다. 어떤 사람의 오줌을 검사하였더니 포도당 칸은 양성, 단백질 칸은 음성으로 나타났다.", "choices": ["여과 과정에 이상이 있을 가능성이 크다.", "세뇨관에서 모세혈관으로 포도당이 모두 이동하지 못하였다.", "혈구와 단백질도 함께 보먼주머니로 여과되었다.", "건강한 사람도 오줌에 포도당이 들어 있으므로 정상이다.", "혈액 속 녹말이 토리에서 여과되었다."], "answer": [2], "explanation": "① 포도당이 나오는 것은 재흡수 이상이다. 여과 이상이면 단백질이 검출된다. ② 옳다. ③ 단백질 칸이 음성이므로 단백질은 여과되지 않았다. ④ 건강한 사람의 오줌에는 포도당이 없다. ⑤ 녹말은 포도당으로 분해되어 흡수되므로 혈액에 녹말은 없다."}, {"id": "동물과에너지:F-001", "sub": "F", "type_id": "F01", "review_group": "RG27", "role": "main", "difficulty": "하", "format": "단답형", "stem": "다음은 세포호흡을 나타낸 것이다. ㉠~㉢에 알맞은 말을 쓰시오.<br>영양소 + ( ㉠ ) → 물 + ( ㉡ ) + 에너지<br>세포호흡은 세포 속 ( ㉢ )에서 일어난다.", "answer": "㉠ 산소, ㉡ 이산화 탄소, ㉢ 마이토콘드리아", "scoring": "총 3점. 빈칸당 1점. ㉢은 '마이토콘드리아', '미토콘드리아' 모두 정답. ㉠과 ㉡을 바꾸어 쓰면 두 칸 모두 0점.", "explanation": "세포호흡은 조직 세포의 마이토콘드리아에서 영양소가 산소와 반응해 물과 이산화 탄소로 분해되며 에너지를 얻는 과정이다."}, {"id": "동물과에너지:F-002", "sub": "F", "type_id": "F01", "review_group": "RG27", "role": "main", "difficulty": "하", "format": "5지선다", "stem": "세포호흡에 대한 설명으로 옳은 것은?", "choices": ["폐에서만 일어난다.", "이산화 탄소와 물을 이용하여 양분을 만든다.", "영양소 중 탄수화물만 이용된다.", "잠을 자는 동안에는 일어나지 않는다.", "온몸의 조직 세포에서 일어나며, 생명 활동에 필요한 에너지를 얻는다."], "answer": [5], "explanation": "① 세포호흡은 온몸의 살아 있는 조직 세포에서 일어난다. ② 이산화 탄소와 물로 양분을 만드는 것은 광합성이다. ③ 탄수화물, 단백질, 지방이 모두 이용될 수 있다. ④ 자는 동안에도 생명 유지를 위해 세포호흡이 계속 일어난다. ⑤ 옳다."}, {"id": "동물과에너지:F-003", "sub": "F", "type_id": "F02", "review_group": "RG27", "role": "main", "difficulty": "중", "format": "보기형(ㄱㄴㄷ)", "stem": "세포호흡으로 얻은 에너지의 이용에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?", "bogi": ["ㄱ. 에너지의 일부는 열로 방출되어 체온을 유지하는 데 쓰인다.", "ㄴ. 허파꽈리와 모세혈관 사이에서 기체가 확산될 때에도 쓰인다.", "ㄷ. 두뇌 활동, 소리 내기, 성장 등에 쓰인다.", "ㄹ. 잠을 자는 동안에도 생명 유지를 위해 쓰인다."], "choices": ["ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄷ, ㄹ", "ㄴ, ㄷ, ㄹ", "ㄱ, ㄴ, ㄷ, ㄹ"], "answer": [3], "explanation": "ㄱ. 옳다. ㄴ. 기체 교환은 농도 차이에 따른 확산으로 일어나며 에너지가 필요 없다. ㄷ. 옳다. ㄹ. 옳다. 자는 동안에도 심장 박동, 호흡, 체온 유지 등에 에너지가 쓰인다."}, {"id": "동물과에너지:F-004", "sub": "F", "type_id": "F01", "review_group": "RG27", "role": "main", "difficulty": "중", "format": "5지선다", "stem": "(가)와 (나)에 대한 설명으로 옳은 것은?", "passage": "(가) 갈비뼈와 가로막의 움직임으로 공기가 폐로 들어오고 나간다.<br>(나) 조직 세포에서 영양소가 산소와 반응하여 분해되면서 에너지를 얻는다.", "choices": ["(가)를 통해 생명 활동에 필요한 에너지가 직접 만들어진다.", "(나)는 폐의 허파꽈리에서만 일어난다.", "(나)에서는 이산화 탄소가 쓰이고 산소가 만들어진다.", "(가)는 (나)에 필요한 산소를 몸 안으로 들이고, (나)에서 생긴 이산화 탄소를 몸 밖으로 내보내는 데 필요하다.", "(가)와 (나)는 모두 갈비뼈와 가로막의 움직임으로 일어난다."], "answer": [4], "explanation": "(가)는 호흡 운동, (나)는 세포호흡이다. ① 에너지는 세포호흡(나)에서 얻는다. ② 세포호흡은 온몸의 조직 세포에서 일어난다. ③ 세포호흡에는 산소가 쓰이고 이산화 탄소가 생긴다. ④ 옳다. ⑤ 갈비뼈·가로막 움직임과 관계있는 것은 (가)뿐이다."}, {"id": "동물과에너지:F-005", "sub": "F", "type_id": "F01", "review_group": "RG27", "role": "reserve", "difficulty": "상", "format": "서술형", "stem": "사람이 숨을 오래 참을 수 없는 까닭을 세포호흡의 반응물, 생성물, 에너지와 관련지어 서술하시오.", "answer": "세포호흡에는 영양소와 함께 산소가 필요한데, 숨을 참으면 산소가 몸 안으로 들어오지 않아 조직 세포에서 세포호흡이 제대로 일어나지 못하고 생명 활동에 필요한 에너지를 얻을 수 없다. 또 세포호흡으로 생긴 이산화 탄소가 몸 밖으로 나가지 못해 몸 안에 쌓인다.", "scoring": "총 3점. ① 산소는 세포호흡의 반응물로 필요하다 1점 ② 세포호흡이 일어나지 못해 에너지를 얻지 못한다 1점 ③ 생성물인 이산화 탄소를 내보내지 못해 몸에 쌓인다 1점.", "explanation": "숨쉬기의 궁극적 목적은 세포호흡으로 에너지를 얻는 것이다."}, {"id": "동물과에너지:F-006", "sub": "F", "type_id": "F02", "review_group": "RG27", "role": "reserve", "difficulty": "중", "format": "5지선다", "stem": "세포호흡으로 얻은 에너지는 여러 생명 활동에 쓰인다. 이 가운데 가장 많은 양의 에너지가 쓰이는 활동은?", "choices": ["근육 운동", "두뇌 활동", "소리 내기", "성장", "체온 유지"], "answer": [5], "explanation": "세포호흡으로 얻은 에너지는 근육 운동, 두뇌 활동, 소리 내기, 성장 등에 쓰이고, 상당 부분이 열로 방출되어 체온을 유지하는 데 쓰인다. 천재 교과서에서는 체온 유지에 가장 많은 에너지가 쓰인다고 다룬다.", "textbook_tags": {"mode": "include_only", "books": ["천재(정대홍)", "천재(임성숙)"]}}, {"id": "동물과에너지:F-007", "sub": "F", "type_id": "F03", "review_group": "RG28", "role": "main", "difficulty": "하", "format": "5지선다", "stem": "기관과 그 기관이 속한 기관계를 옳게 짝지은 것은?", "choices": ["심장 - 호흡계", "간 - 배설계", "항문 - 배설계", "숨관 - 배설계", "콩팥 - 배설계"], "answer": [5], "explanation": "① 심장은 순환계이다. ② 간은 요소를 만들지만 소화계에 속한다. ③ 항문은 소화계로, 찌꺼기를 내보내는 것은 배설이 아니다. ④ 숨관은 호흡계이다. ⑤ 옳다."}, {"id": "동물과에너지:F-008", "sub": "F", "type_id": "F03", "review_group": "RG28", "role": "main", "difficulty": "상", "format": "보기형(ㄱㄴㄷ)", "stem": "그림은 사람의 몸에서 기관계 A~D가 함께 작용하는 모습을 나타낸 것이다. (가)~(라)는 물질의 이동이다. 이에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?", "bogi": ["ㄱ. (가)는 A에서 흡수된 영양소이고, (나)는 B에서 흡수된 산소이다.", "ㄴ. (다)는 조직 세포의 세포호흡으로 생긴 이산화 탄소로, C를 통해 B로 운반된다.", "ㄷ. (라)에 들어 있는 요소는 D에서 암모니아로부터 만들어진다.", "ㄹ. C는 영양소만 운반하고 기체는 운반하지 않는다."], "figure_svg": "<svg style=\"background:#fff\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 480 300\" fill=\"none\" stroke=\"#000\" stroke-width=\"1.5\" font-size=\"13\" font-family=\"'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif\"><defs><marker id=\"mkF008\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#000\" stroke=\"none\"/><\/marker><\/defs><rect x=\"20\" y=\"40\" width=\"100\" height=\"44\" rx=\"5\"/><text x=\"65.0\" y=\"67.0\" fill=\"#000\" stroke=\"none\" font-size=\"14\">A<\/text><rect x=\"360\" y=\"40\" width=\"100\" height=\"44\" rx=\"5\"/><text x=\"405.0\" y=\"67.0\" fill=\"#000\" stroke=\"none\" font-size=\"14\">B<\/text><rect x=\"190\" y=\"120\" width=\"100\" height=\"44\" rx=\"5\"/><text x=\"235.0\" y=\"147.0\" fill=\"#000\" stroke=\"none\" font-size=\"14\">C<\/text><rect x=\"360\" y=\"210\" width=\"100\" height=\"44\" rx=\"5\"/><text x=\"405.0\" y=\"237.0\" fill=\"#000\" stroke=\"none\" font-size=\"14\">D<\/text><rect x=\"190\" y=\"230\" width=\"100\" height=\"44\" rx=\"5\"/><text x=\"213\" y=\"257\" fill=\"#000\" stroke=\"none\" font-size=\"13\">조직 세포<\/text><text x=\"20\" y=\"22\" fill=\"#000\" stroke=\"none\" font-size=\"12\">음식물<\/text><line x1=\"44\" y1=\"26\" x2=\"54\" y2=\"40\" marker-end=\"url(#mkF008)\"/><text x=\"380\" y=\"22\" fill=\"#000\" stroke=\"none\" font-size=\"12\">공기<\/text><line x1=\"400\" y1=\"26\" x2=\"404\" y2=\"40\" marker-end=\"url(#mkF008)\"/><line x1=\"430\" y1=\"40\" x2=\"436\" y2=\"24\" marker-end=\"url(#mkF008)\"/><line x1=\"120\" y1=\"72\" x2=\"196\" y2=\"122\" marker-end=\"url(#mkF008)\"/><text x=\"140\" y=\"112\" fill=\"#000\" stroke=\"none\" font-size=\"12\">(가)<\/text><line x1=\"360\" y1=\"66\" x2=\"290\" y2=\"124\" marker-end=\"url(#mkF008)\"/><text x=\"316\" y=\"82\" fill=\"#000\" stroke=\"none\" font-size=\"12\">(나)<\/text><line x1=\"290\" y1=\"138\" x2=\"364\" y2=\"80\" marker-end=\"url(#mkF008)\"/><text x=\"332\" y=\"124\" fill=\"#000\" stroke=\"none\" font-size=\"12\">(다)<\/text><line x1=\"290\" y1=\"156\" x2=\"364\" y2=\"214\" marker-end=\"url(#mkF008)\"/><text x=\"318\" y=\"200\" fill=\"#000\" stroke=\"none\" font-size=\"12\">(라)<\/text><line x1=\"230\" y1=\"164\" x2=\"230\" y2=\"228\" marker-end=\"url(#mkF008)\"/><line x1=\"250\" y1=\"228\" x2=\"250\" y2=\"166\" marker-end=\"url(#mkF008)\"/><line x1=\"410\" y1=\"254\" x2=\"410\" y2=\"284\" marker-end=\"url(#mkF008)\"/><text x=\"418\" y=\"280\" fill=\"#000\" stroke=\"none\" font-size=\"12\">오줌<\/text><\/svg>", "choices": ["ㄱ, ㄴ", "ㄱ, ㄷ", "ㄴ, ㄹ", "ㄱ, ㄴ, ㄷ", "ㄱ, ㄷ, ㄹ"], "answer": [1], "explanation": "A는 음식물을 받아들이는 소화계, B는 공기가 드나드는 호흡계, C는 물질을 운반하는 순환계, D는 오줌을 내보내는 배설계이다. ㄱ. 옳다. ㄴ. 옳다. ㄷ. 암모니아를 요소로 바꾸는 곳은 간(소화계)이고, 배설계(D)는 요소를 걸러 내보낸다. ㄹ. 순환계는 영양소뿐 아니라 산소, 이산화 탄소, 요소 등도 운반한다."}, {"id": "동물과에너지:F-009", "sub": "F", "type_id": "F03", "review_group": "RG28", "role": "main", "difficulty": "상", "format": "보기형(ㄱㄴㄷ)", "stem": "표는 서로 다른 기관 (가)~(다)를 지나기 전과 비교하여 지난 뒤 혈액에서 특징적으로 많아지거나 적어지는 물질을 나타낸 것이다. (가)~(다)는 각각 작은창자, 폐, 콩팥 중 하나이다. 이에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?", "bogi": ["ㄱ. (가)는 소화계에 속한다.", "ㄴ. (나)를 지난 혈액은 심장으로 돌아간 뒤 온몸의 조직 세포로 산소를 운반한다.", "ㄷ. (다)에서 요소가 만들어진다."], "table": {"h": ["기관", "많아지는 물질", "적어지는 물질"], "r": [["(가)", "포도당, 아미노산", "-"], ["(나)", "산소", "이산화 탄소"], ["(다)", "-", "요소"]]}, "choices": ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "answer": [3], "explanation": "(가)는 영양소가 흡수되는 작은창자, (나)는 기체 교환이 일어나는 폐, (다)는 요소가 걸러지는 콩팥이다. ㄱ. 옳다. 작은창자는 소화계이다. ㄴ. 옳다. 폐를 지난 혈액은 폐정맥을 통해 심장으로 돌아간 뒤 온몸으로 나간다. ㄷ. 콩팥에서는 요소가 걸러지므로 혈액 속 요소가 줄어든다. 요소는 간에서 만들어진다."}, {"id": "동물과에너지:F-010", "sub": "F", "type_id": "F03", "review_group": "RG28", "role": "main", "difficulty": "중", "format": "서술형", "stem": "세포가 생명 활동에 필요한 에너지를 얻으려면 소화계, 호흡계, 순환계, 배설계가 함께 작용해야 한다. 그 까닭을 네 기관계의 역할을 모두 포함하여 서술하시오.", "answer": "소화계는 음식물 속 영양소를 소화·흡수하고, 호흡계는 산소를 받아들이며, 순환계는 영양소와 산소를 조직 세포로 운반한다. 세포는 이를 이용해 세포호흡으로 에너지를 얻는다. 이때 생긴 이산화 탄소는 순환계가 호흡계로 운반해 내보내고, 요소 등의 노폐물은 배설계가 걸러 내보낸다. 따라서 어느 하나라도 제대로 작용하지 않으면 세포호흡이 원활하게 일어나지 못한다.", "scoring": "총 5점. 소화계(영양소 흡수)·호흡계(산소 흡수, 이산화 탄소 배출)·순환계(운반)·배설계(요소 등 노폐물 배설)의 역할 각 1점 + '세포호흡에 필요한 물질 공급과 노폐물 제거가 함께 이루어져야 한다'는 통합 결론 1점. 기관계가 서로 독립적이라고 쓰면 결론 0점.", "explanation": "세포호흡을 중심으로 기관계가 통합적으로 작용한다."}, {"id": "동물과에너지:F-011", "sub": "F", "type_id": "F03", "review_group": "RG28", "role": "reserve", "difficulty": "하", "format": "단답형", "stem": "다음 빈칸에 알맞은 기관계의 이름을 쓰시오.<br>음식물 속 영양소는 ( ㉠ )에서 흡수되고, 산소는 ( ㉡ )에서 흡수되며, 이 물질들은 ( ㉢ )을/를 통해 온몸의 조직 세포로 운반된다.", "answer": "㉠ 소화계, ㉡ 호흡계, ㉢ 순환계", "scoring": "총 3점. 빈칸당 1점. ㉠ 소화계, ㉡ 호흡계, ㉢ 순환계.", "explanation": "소화계-영양소 흡수, 호흡계-산소 흡수, 순환계-운반."}, {"id": "동물과에너지:F-012", "sub": "F", "type_id": "F03", "review_group": "RG28", "role": "reserve", "difficulty": "중", "format": "5지선다", "stem": "기관계의 통합적 작용에 대한 설명으로 옳지 않은 것은?", "choices": ["순환계는 영양소, 산소, 이산화 탄소, 요소 등을 운반한다.", "호흡계에 이상이 생기면 조직 세포의 세포호흡에도 영향을 준다.", "산소는 소화계를 통해 몸 안으로 흡수된다.", "배설계는 혈액 속 요소 등의 노폐물을 걸러 몸 밖으로 내보낸다.", "소화계에서 흡수된 영양소는 순환계를 통해 조직 세포로 운반된다."], "answer": [3], "explanation": "③ 옳지 않다. 산소는 호흡계(폐)에서 흡수되어 순환계로 운반된다. 나머지는 옳은 설명이다. ②는 기관계가 서로 연결되어 있음을 나타낸다."}, {"id": "동물과에너지:F-013", "sub": "F", "type_id": "F04", "review_group": "RG29", "role": "main", "difficulty": "중", "format": "5지선다", "stem": "표는 어떤 학생이 여러 활동을 할 때 1분 동안 잰 맥박 수와 호흡 수를 나타낸 것이다. 이에 대한 설명으로 옳은 것은?", "table": {"h": ["활동", "맥박 수(회/분)", "호흡 수(회/분)"], "r": [["휴식", "70", "15"], ["빠르게 걷기", "100", "22"], ["달리기", "140", "36"]]}, "choices": ["활동이 격렬해질수록 맥박 수는 줄어든다.", "달리기를 할 때의 맥박 수는 휴식할 때의 약 3배이다.", "휴식할 때가 빠르게 걷기를 할 때보다 호흡 수가 많다.", "달리기를 할 때 근육 세포의 세포호흡이 활발해져 더 많은 산소와 영양소가 필요하므로 맥박 수와 호흡 수가 늘었다.", "맥박은 대정맥에서 잰 것으로, 심장 박동 수와는 관계없다."], "answer": [4], "explanation": "① 활동이 격렬할수록 맥박 수가 늘어난다. ② 140÷70=2이므로 약 2배이다. ③ 휴식(15회)이 빠르게 걷기(22회)보다 적다. ④ 옳다. ⑤ 맥박은 좌심실 수축으로 생기는 동맥의 박동으로 심장 박동 수와 같다."}, {"id": "동물과에너지:F-014", "sub": "F", "type_id": "F04", "review_group": "RG29", "role": "reserve", "difficulty": "하", "format": "5지선다", "stem": "운동을 할 때 체온이 올라가는 까닭으로 가장 적절한 것은?", "choices": ["호흡 수가 늘어 바깥의 따뜻한 공기가 많이 들어오기 때문이다.", "근육 세포의 세포호흡이 활발해져 열이 많이 나오기 때문이다.", "심장이 늘 같은 빠르기로 뛰기 때문이다.", "소화 기관에서 영양소가 빨리 흡수되기 때문이다.", "땀이 나서 몸의 열이 빠져나가지 못하기 때문이다."], "answer": [2], "explanation": "② 옳다. 운동하면 근육 세포에서 세포호흡이 활발해지고, 이때 에너지의 일부가 열로 방출되어 체온이 오른다. ① 체온 상승은 바깥 공기 때문이 아니다. ③ 운동할 때 심장 박동은 빨라진다. ④ 소화·흡수는 체온 상승의 직접적인 까닭이 아니다. ⑤ 땀은 몸의 열을 내보내는 데 도움을 준다."}, {"id": "동물과에너지:F-015", "sub": "F", "type_id": "F04", "review_group": "RG29", "role": "reserve", "difficulty": "상", "format": "서술형", "stem": "(1) 제자리 뛰기 직후 맥박 수가 늘어난 까닭을 세포호흡과 순환계의 역할을 관련지어 서술하시오.<br>(2) 제자리 뛰기 직후 호흡 수는 휴식할 때와 비교하여 어떻게 달라지는지 쓰고, 그 까닭을 서술하시오.", "passage": "학생이 손목 안쪽에 손가락을 대고 1분 동안 맥박 수를 재었더니 휴식할 때 72회, 제자리 뛰기 2분 직후 128회였다.", "answer": "(1) 운동하면 근육 세포에서 세포호흡이 활발해져 더 많은 산소와 영양소가 필요하다. 심장이 빨리 뛰어 순환계가 산소와 영양소를 근육에 빠르게 공급하고, 늘어난 이산화 탄소를 빠르게 운반하므로 맥박 수가 늘어난다. (2) 호흡 수가 늘어난다. 세포호흡에 필요한 산소를 더 많이 받아들이고, 세포호흡으로 많이 생긴 이산화 탄소를 빠르게 내보내야 하기 때문이다.", "scoring": "총 4점. (1) '운동하면 근육 세포의 세포호흡이 활발해져 산소·영양소가 더 많이 필요하다' 1점 + '심장이 빨리 뛰어 순환계가 산소·영양소를 빠르게 공급(이산화 탄소를 빠르게 운반)한다' 1점. (2) 호흡 수가 늘어난다 1점 + '산소를 더 많이 받아들이고 이산화 탄소를 빨리 내보내야 한다' 1점. '운동을 해서'만 쓰면 해당 까닭 0점. 맥박·호흡이 줄어든다고 쓰면 해당 문항 0점.", "explanation": "맥박은 동맥에서 느껴지는 심장 박동이므로 맥박 수는 심장 박동 수와 같다."}, {"id": "동물과에너지:F-016", "sub": "F", "type_id": "F04", "review_group": "RG29", "role": "reserve", "difficulty": "하", "format": "단답형", "stem": "다음 빈칸에 알맞은 말을 쓰시오.<br>손목에서 느껴지는 맥박은 심장의 ( ㉠ )이/가 수축할 때 혈액이 밀려 나가 ( ㉡ )의 벽이 주기적으로 뛰는 것이다. 운동을 하면 근육 세포에서 ( ㉢ )이/가 활발해져 산소와 영양소가 더 많이 필요하므로 맥박 수가 늘어난다.", "answer": "㉠ 좌심실, ㉡ 동맥, ㉢ 세포호흡", "scoring": "총 3점. 빈칸당 1점. ㉠ 좌심실('심실'만 써도 인정, C-038과 같은 기준), ㉡ 동맥, ㉢ 세포호흡. ㉠에 우심실·심방, ㉡에 정맥을 쓰면 해당 칸 0점.", "explanation": "맥박은 좌심실 수축으로 동맥에 생기는 박동이며 심장 박동 수와 같다. 운동하면 근육 세포의 세포호흡이 활발해져 산소·영양소를 더 빨리 공급해야 하므로 심장 박동과 맥박이 빨라진다."}, {"id": "동물과에너지:F-017", "sub": "F", "type_id": "F04", "review_group": "RG29", "role": "reserve", "difficulty": "중", "format": "보기형(ㄱㄴㄷ)", "stem": "표는 같은 학생이 서로 다른 강도로 운동하였을 때 잰 맥박 수를 나타낸 것이다. 이에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?", "bogi": ["ㄱ. 운동 직후의 맥박 수는 강한 운동을 했을 때가 약한 운동을 했을 때보다 많다.", "ㄴ. 운동 직후 맥박 수가 늘어난 것은 근육에 산소와 영양소를 빠르게 공급하기 위해서이다.", "ㄷ. 심장은 운동 강도와 관계없이 늘 같은 빠르기로 뛴다."], "table": {"h": ["측정 시점", "약한 운동(회/분)", "강한 운동(회/분)"], "r": [["운동 전", "74", "74"], ["운동 직후", "96", "152"], ["운동 끝나고 5분 뒤", "78", "90"]]}, "choices": ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "answer": [3], "explanation": "ㄱ. 옳다(152회>96회). ㄴ. 옳다. 세포호흡이 활발해진 근육에 산소·영양소를 공급하려고 심장 박동이 빨라진다. ㄷ. 맥박 수가 운동 강도와 시점에 따라 달라지므로 심장 박동 빠르기는 일정하지 않다."}, {"id": "동물과에너지:F-018", "sub": "F", "type_id": "F05", "review_group": "RG10", "role": "main", "difficulty": "중", "format": "서술형", "stem": "작은창자의 융털과 폐의 허파꽈리는 구조적으로 공통점이 있다. 이 공통점을 쓰고, 그 공통점이 각 기관의 기능에 유리한 까닭을 서술하시오.", "answer": "공통점: 수가 매우 많아 물질과 닿는 표면적이 넓다(벽이 얇고 모세혈관이 분포한다). 까닭: 표면적이 넓으면 물질 교환이 한꺼번에 많이 일어날 수 있으므로, 융털에서는 영양소를 효율적으로 흡수하고 허파꽈리에서는 기체 교환을 효율적으로 할 수 있다.", "scoring": "총 3점. 공통점 1점: 표면적이 넓다. 융털 1점: 영양소를 효율적으로 흡수한다. 허파꽈리 1점: 기체 교환을 효율적으로 한다. '얇다', '모세혈관이 있다'만 쓰고 표면적을 언급하지 않으면 공통점 0점.", "explanation": "표면적을 넓힌 구조의 공통점은 물질 교환의 효율을 높이는 것이다."}, {"id": "동물과에너지:F-019", "sub": "F", "type_id": "F05", "review_group": "RG10", "role": "reserve", "difficulty": "하", "format": "보기형(ㄱㄴㄷ)", "stem": "같은 크기의 판 (가)와 (나)를 준비하였다. (가)는 표면이 매끈하고, (나)는 표면에 주름과 작은 돌기가 많다. 두 판을 같은 색소 용액에 같은 시간 동안 담갔다 꺼냈더니 (나)에 색소가 더 많이 묻어 나왔다.<br>이 모형 실험과 같은 원리로 설명할 수 있는 우리 몸의 구조만을 &lt;보기&gt;에서 있는 대로 고른 것은?", "bogi": ["ㄱ. 작은창자 안쪽 벽의 주름과 융털", "ㄴ. 수많은 허파꽈리로 이루어진 폐", "ㄷ. 코 안의 털과 끈끈한 액체"], "choices": ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "answer": [3], "explanation": "(나)는 주름과 돌기 때문에 색소 용액과 닿는 표면적이 넓어 색소가 더 많이 묻었다. 즉 이 실험은 '표면적이 넓을수록 물질이 많이 이동한다'는 원리를 보여 준다. ㄱ. 옳다. 주름과 융털은 영양소와 닿는 표면적을 넓혀 흡수를 돕는다. ㄴ. 옳다. 폐는 수많은 허파꽈리로 나뉘어 공기와 닿는 표면적이 넓어 기체 교환에 유리하다. ㄷ. 옳지 않다. 코 안의 털과 끈끈한 액체는 먼지와 세균을 걸러 내는 구조로, 표면적을 넓히는 것과는 관계없다."}]}, {"key": "전기와자기", "title": "Ⅶ 전기와 자기", "subs": {"A": "전기의 발생", "B": "전류와 전압", "C": "저항과 옴의 법칙", "D": "저항", "E": "전기 에너지와 소비 전력", "F": "전류가 만드는 자기장", "G": "자기장 속에서 전류가 받는 힘"}, "items": [{"id": "전기와자기:A-001", "sub": "A", "type_id": "A01", "review_group": "RG01", "role": "main", "difficulty": "하", "format": "5지선다", "stem": "털가죽으로 플라스틱 막대를 문질렀더니 플라스틱 막대가 (-)전하를 띠었다. 이에 대한 설명으로 옳은 것은?", "choices": ["털가죽의 원자핵이 플라스틱 막대로 옮겨 갔다.", "털가죽은 전자를 잃어 (-)전하를 띤다.", "털가죽으로 털가죽을 문질러도 같은 방법으로 대전시킬 수 있다.", "문지르는 동안 플라스틱 막대에서 전자가 새로 만들어졌다.", "전자가 털가죽에서 플라스틱 막대로 이동하였다."], "answer": [5], "explanation": "① 마찰할 때 이동하는 것은 전자뿐이며 원자핵은 이동하지 않는다. ② 전자를 잃은 털가죽은 (+)전하를 띤다. ③ 같은 물질끼리는 전자를 잃는 정도가 같아 전자가 이동하지 않으므로 대전되지 않는다. ④ 전자는 새로 생기지 않고 한 물체에서 다른 물체로 옮겨 갈 뿐이다. ⑤ 옳다. 플라스틱 막대가 (-)전하를 띠었으므로 전자는 털가죽에서 플라스틱 막대로 이동하였다."}, {"id": "전기와자기:A-002", "sub": "A", "type_id": "A02", "review_group": "RG01", "role": "main", "difficulty": "중", "format": "보기형(ㄱㄴㄷ)", "stem": "그림은 마찰 전 전기를 띠지 않던 두 물체 A와 B를 서로 문지른 뒤, 각 물체의 원자핵의 (+)전하와 전자의 개수를 모형으로 나타낸 것이다. 원자핵의 (+)전하 1개와 전자 1개의 전하량은 같다. 이에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?", "bogi": ["ㄱ. 마찰하는 동안 전자는 A에서 B로 이동하였다.", "ㄴ. A는 전자를 잃었으므로 (-)전하를 띤다.", "ㄷ. 마찰 후 A와 B를 가까이 하면 서로 끌어당긴다."], "figure_svg": "<svg style=\"background:#fff\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 470 188\" fill=\"none\" stroke=\"#000\" stroke-width=\"1.5\" font-size=\"13\" font-family=\"sans-serif\"><rect x=\"20\" y=\"30\" width=\"200\" height=\"120\" rx=\"8\"/><text x=\"120\" y=\"22\" fill=\"#000\" stroke=\"none\" font-size=\"14\" text-anchor=\"middle\">A<\/text><circle cx=\"45\" cy=\"52\" r=\"9\"/><line x1=\"40\" y1=\"52\" x2=\"50\" y2=\"52\"/><line x1=\"45\" y1=\"47\" x2=\"45\" y2=\"57\"/><circle cx=\"95\" cy=\"52\" r=\"9\"/><line x1=\"90\" y1=\"52\" x2=\"100\" y2=\"52\"/><line x1=\"95\" y1=\"47\" x2=\"95\" y2=\"57\"/><circle cx=\"145\" cy=\"52\" r=\"9\"/><line x1=\"140\" y1=\"52\" x2=\"150\" y2=\"52\"/><line x1=\"145\" y1=\"47\" x2=\"145\" y2=\"57\"/><circle cx=\"195\" cy=\"52\" r=\"9\"/><line x1=\"190\" y1=\"52\" x2=\"200\" y2=\"52\"/><line x1=\"195\" y1=\"47\" x2=\"195\" y2=\"57\"/><circle cx=\"45\" cy=\"80\" r=\"9\"/><line x1=\"40\" y1=\"80\" x2=\"50\" y2=\"80\"/><line x1=\"45\" y1=\"75\" x2=\"45\" y2=\"85\"/><circle cx=\"95\" cy=\"80\" r=\"9\"/><line x1=\"90\" y1=\"80\" x2=\"100\" y2=\"80\"/><line x1=\"95\" y1=\"75\" x2=\"95\" y2=\"85\"/><circle cx=\"45\" cy=\"110\" r=\"6\" fill=\"#000\" fill-opacity=\"0.15\"/><line x1=\"41.5\" y1=\"110\" x2=\"48.5\" y2=\"110\"/><circle cx=\"95\" cy=\"110\" r=\"6\" fill=\"#000\" fill-opacity=\"0.15\"/><line x1=\"91.5\" y1=\"110\" x2=\"98.5\" y2=\"110\"/><circle cx=\"145\" cy=\"110\" r=\"6\" fill=\"#000\" fill-opacity=\"0.15\"/><line x1=\"141.5\" y1=\"110\" x2=\"148.5\" y2=\"110\"/><circle cx=\"195\" cy=\"110\" r=\"6\" fill=\"#000\" fill-opacity=\"0.15\"/><line x1=\"191.5\" y1=\"11
