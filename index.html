-path=\"url(#p1344e51a00)\" style=\"fill: none; stroke: #000000; stroke-width: 2; stroke-linecap: round\"/>\n   <\/g>\n   <g id=\"line2d_10\">\n    <path d=\"M 109.755 123.78 \nL 109.755 150.78 \n\" clip-path=\"url(#p1344e51a00)\" style=\"fill: none; stroke: #000000; stroke-width: 2; stroke-linecap: round\"/>\n   <\/g>\n   <g id=\"line2d_11\">\n    <path d=\"M 116.505 130.53 \nL 116.505 144.03 \n\" clip-path=\"url(#p1344e51a00)\" style=\"fill: none; stroke: #000000; stroke-width: 2; stroke-linecap: round\"/>\n   <\/g>\n   <g id=\"line2d_12\">\n    <path d=\"M 123.255 123.78 \nL 123.255 150.78 \n\" clip-path=\"url(#p1344e51a00)\" style=\"fill: none; stroke: #000000; stroke-width: 2; stroke-linecap: round\"/>\n   <\/g>\n   <g id=\"line2d_13\">\n    <path d=\"M 130.005 130.53 \nL 130.005 144.03 \n\" clip-path=\"url(#p1344e51a00)\" style=\"fill: none; stroke: #000000; stroke-width: 2; stroke-linecap: round\"/>\n   <\/g>\n   <g id=\"line2d_14\">\n    <path d=\"M 141.48 137.28 \nL 188.28 137.28 \nL 235.08 137.28 \n\" clip-path=\"url(#p1344e51a00)\" style=\"fill: none; stroke: #000000; stroke-width: 2; stroke-linecap: round\"/>\n   <\/g>\n   <g id=\"text_1\">\n    <text style=\"font-size: 12px; font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif'Malgun Gothic'; text-anchor: middle\" x=\"69.48\" y=\"13.843125\" transform=\"rotate(-0 69.48 13.843125)\">R₁ 10 Ω<\/text>\n   <\/g>\n   <g id=\"text_2\">\n    <text style=\"font-size: 12px; font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif'Malgun Gothic'; text-anchor: middle\" x=\"170.28\" y=\"13.843125\" transform=\"rotate(-0 170.28 13.843125)\">R₂ 20 Ω<\/text>\n   <\/g>\n   <g id=\"text_3\">\n    <text style=\"font-size: 14px; font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif'Malgun Gothic'; text-anchor: middle\" x=\"108.36\" y=\"115.019688\" transform=\"rotate(-0 108.36 115.019688)\">+<\/text>\n   <\/g>\n   <g id=\"text_4\">\n    <text style=\"font-size: 14px; font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif'Malgun Gothic'; text-anchor: middle\" x=\"138.6\" y=\"115.019688\" transform=\"rotate(-0 138.6 115.019688)\">−<\/text>\n   <\/g>\n   <g id=\"text_5\">\n    <text style=\"font-size: 12px; font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif'Malgun Gothic'; text-anchor: middle\" x=\"123.48\" y=\"162.016875\" transform=\"rotate(-0 123.48 162.016875)\">6 V<\/text>\n   <\/g>\n  <\/g>\n <\/g>\n <defs>\n  <clipPath id=\"p1344e51a00\">\n   <rect x=\"0\" y=\"0\" width=\"239.76\" height=\"169.56\"/>\n  <\/clipPath>\n <\/defs>\n<\/svg>\n", "answer": "직렬이므로 전체 저항은 10 Ω + 20 Ω = 30 Ω이고, 전류는 6 V ÷ 30 Ω = 0.2 A로 R₁과 R₂에 같게 흐른다. V₁ = 0.2 A × 10 Ω = 2 V, V₂ = 0.2 A × 20 Ω = 4 V이므로 V₁ : V₂ = 1 : 2이다(저항의 비와 같다).", "scoring": "상(3점): 전류 0.2 A, V₁ 2 V, V₂ 4 V, 비 1 : 2를 풀이와 함께 모두 씀. V₁ : V₂를 저항의 비(10 : 20)로 바로 구하거나, 전체 저항 없이 전압 분배로 구한 풀이도 인정. 중(2점): 네 값 중 하나만 틀림(예: 비를 2 : 1로 씀). 하(1점): 전류만 옳거나 네 값 중 둘 이상 틀림. 0점: 두 저항에 모두 6 V가 걸린다고 씀.", "explanation": "직렬 회로에서는 전류가 같고, 전압은 저항에 비례하여 나뉜다. 두 전압의 합(2 V + 4 V)은 전원 전압 6 V와 같다.", "stimulus_group": "SG-E07"}, {"id": "전기와자기:D-012", "sub": "D", "type_id": "D07", "review_group": "RG16", "role": "main", "difficulty": "하", "format": "5지선다", "stem": "생활 속 전기 기구의 연결에 대한 설명으로 옳은 것은?", "choices": ["가정의 전기 기구들은 병렬로 연결되어 각 기구에 같은 전압이 걸린다.", "멀티탭에 꽂은 전기 기구들은 서로 직렬로 연결된다.", "길가의 가로등은 모두 직렬로 연결되어 있다.", "퓨즈는 보호하려는 전기 기구와 병렬로 연결한다.", "가정에서 함께 쓰는 전기 기구들에는 모두 같은 세기의 전류가 흐른다."], "answer": [1], "explanation": "① 옳다. ② 멀티탭에 꽂은 기구들은 병렬로 연결되어 각각 따로 켜고 끌 수 있다. ③ 가로등은 하나가 고장 나도 나머지가 켜지도록 병렬로 연결한다. ④ 퓨즈는 센 전류가 흐를 때 끊어져 회로 전체의 전류를 막아야 하므로 직렬로 연결한다. ⑤ 병렬연결된 기구에는 같은 전압이 걸리고, 전류는 각 기구의 저항에 따라 다르다."}, {"id": "전기와자기:D-013", "sub": "D", "type_id": "D07", "review_group": "RG16", "role": "main", "difficulty": "중", "format": "보기형(ㄱㄴㄷ)", "stem": "다음은 어느 가정의 전기 배선에 대한 설명이다.<br>· 거실 전등, 냉장고, 세탁기가 각각 벽의 콘센트와 스위치에 연결되어 있다.<br>· 배선이 시작되는 곳에 퓨즈가 연결되어 있다.<br>이에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?", "bogi": ["ㄱ. 전등, 냉장고, 세탁기에는 같은 크기의 전압이 걸린다.", "ㄴ. 거실 전등의 스위치를 끄면 냉장고와 세탁기도 작동을 멈춘다.", "ㄷ. 퓨즈는 배선과 직렬로 연결되어 있어 센 전류가 흐르면 끊어져 전체 전류를 막는다."], "choices": ["ㄱ", "ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "answer": [3], "explanation": "가정의 전기 기구는 병렬로 연결된다. ㄱ. 옳다. 병렬연결이므로 각 기구에 같은 전압이 걸린다. ㄴ. 병렬연결된 기구는 독립적으로 작동하므로 전등을 꺼도 냉장고와 세탁기는 계속 작동한다. ㄷ. 옳다. 퓨즈는 직렬로 연결되어 센 전류가 흐르면 녹아 끊어진다."}, {"id": "전기와자기:D-014", "sub": "D", "type_id": "D07", "review_group": "RG16", "role": "main", "difficulty": "중", "format": "서술형", "stem": "멀티탭 하나에 전기난로, 전기 주전자, 헤어드라이어처럼 많은 전류가 흐르는 전기 기구를 한꺼번에 꽂아 사용하면 화재가 날 위험이 있다. 그 까닭을 '연결 방법', '전체 저항', '전체 전류'라는 말을 모두 사용하여 서술하시오.", "answer": "멀티탭에 꽂은 전기 기구들은 병렬로 연결되므로, 꽂는 기구가 많아질수록 회로 전체의 저항이 작아져 멀티탭 전선에 흐르는 전체 전류가 커진다. 전선에 센 전류가 흐르면 열이 많이 발생하여 전선이 과열되고 화재가 날 수 있다.", "scoring": "상(3점): 병렬연결, 전체 저항 감소, 전체 전류 증가, 과열(열 발생)을 모두 인과 순서대로 서술. 중(2점): 세 용어 중 하나가 빠졌거나 과열 언급이 없음. 하(1점): '전류가 많이 흘러서'만 씀. '직렬이라서' 또는 '전체 저항이 커져서'라고 쓰면 해당 요소는 0점.", "explanation": "병렬로 기구를 늘리면 전류가 지나는 길이 늘어나 전체 저항이 작아지고, 각 기구 전류의 합인 전체 전류가 커진다."}, {"id": "전기와자기:D-015", "sub": "D", "type_id": "D07", "review_group": "RG16", "role": "reserve", "difficulty": "하", "format": "5지선다", "stem": "한 줄로 이어진 장식용 전구 줄에서 전구 하나가 끊어지자 나머지 전구가 모두 꺼졌다. 이 전구들의 연결 방법과 그렇게 된 까닭을 옳게 짝지은 것은?", "choices": ["병렬 - 전구마다 전류가 흐르는 길이 따로 있기 때문", "병렬 - 각 전구에 같은 전압이 걸리기 때문", "직렬 - 전류가 흐르는 길이 하나뿐이기 때문", "직렬 - 끊어진 전구 쪽으로 전류가 모두 몰리기 때문", "직렬 - 끊어진 전구의 저항이 0이 되기 때문"], "answer": [3], "explanation": "하나가 끊어지면 모두 꺼지는 것은 직렬연결의 특징이다. 직렬연결은 전류가 흐르는 길이 하나뿐이어서 어느 한 곳이 끊어지면 회로 전체에 전류가 흐르지 않는다. ①② 병렬이라면 전구 하나가 끊어져도 나머지는 켜져 있다. ④ 끊어진 곳으로는 전류가 흐르지 못한다. ⑤ 끊어진 곳은 전류가 전혀 흐르지 못하는 상태이며 저항이 0이 되는 것이 아니다."}, {"id": "전기와자기:D-016", "sub": "D", "type_id": "D07", "review_group": "RG16", "role": "reserve", "difficulty": "중", "format": "5지선다", "stem": "최대 허용 전류가 10 A인 멀티탭에 전기 기구 A, B, C가 꽂혀 함께 작동하고 있으며, 각 기구에 흐르는 전류는 표와 같다. 여기에 기구 하나를 더 꽂아 함께 사용할 때, 멀티탭 전선에 흐르는 전체 전류가 최대 허용 전류를 넘지 않는 기구는? (단, 각 기구에 흐르는 전류는 다른 기구를 꽂아도 변하지 않는다.)", "table": {"h": ["기구", "A", "B", "C"], "r": [["흐르는 전류(A)", "2", "3", "4"]]}, "choices": ["전기 주전자(4 A)", "휴대 전화 충전기(0.5 A)", "전기다리미(3 A)", "헤어드라이어(5 A)", "전기난로(6 A)"], "answer": [2], "explanation": "멀티탭에 꽂은 기구들은 병렬연결이므로 멀티탭 전선에는 각 기구 전류의 합이 흐른다. 지금 전체 전류는 2 A + 3 A + 4 A = 9 A이므로 더 흐를 수 있는 전류는 10 A − 9 A = 1 A이다. 따라서 1 A 이하인 휴대 전화 충전기(0.5 A)만 함께 쓸 수 있다. 나머지 기구를 꽂으면 전체 전류가 10 A를 넘는다."}, {"id": "전기와자기:E-001", "sub": "E", "type_id": "E01", "review_group": "RG17", "role": "main", "difficulty": "하", "format": "5지선다", "stem": "전기 기구와 그 기구에서 전기 에너지가 주로 전환되는 에너지를 옳게 짝지은 것은?", "choices": ["세탁기 - 열에너지", "전기밥솥 - 열에너지", "휴대 전화 배터리 충전 - 열에너지", "전등 - 소리 에너지", "선풍기 - 화학 에너지"], "answer": [2], "explanation": "① 세탁기는 통을 돌리므로 주로 운동 에너지로 전환된다. ② 옳다. ③ 배터리를 충전할 때는 주로 화학 에너지로 전환되어 저장된다. ④ 전등은 주로 빛에너지로 전환된다. ⑤ 선풍기는 날개를 돌리므로 주로 운동 에너지로 전환된다."}, {"id": "전기와자기:E-002", "sub": "E", "type_id": "E01", "review_group": "RG17", "role": "main", "difficulty": "하", "format": "보기형(ㄱㄴㄷ)", "stem": "전기 에너지의 전환에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?", "bogi": ["ㄱ. 선풍기에서 전기 에너지는 운동 에너지로만 전환된다.", "ㄴ. 전기다리미에서 전기 에너지는 주로 열에너지로 전환된다.", "ㄷ. 노트북 배터리를 충전할 때 전기 에너지는 주로 화학 에너지로 전환된다."], "choices": ["ㄱ", "ㄴ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "answer": [4], "explanation": "ㄱ. 선풍기에서 전기 에너지는 주로 운동 에너지로 전환되지만, 전동기가 따뜻해지는 열에너지와 바람 소리 같은 소리 에너지로도 함께 전환된다. ㄴ. 옳다. ㄷ. 옳다."}, {"id": "전기와자기:E-003", "sub": "E", "type_id": "E01", "review_group": "RG17", "role": "main", "difficulty": "하", "format": "5지선다", "stem": "다음은 헤어드라이어를 사용할 때의 에너지 전환을 설명한 것이다.<br>헤어드라이어 안의 전열선에서는 전기 에너지가 주로 ( ㉠ )로 전환되고, 바람을 일으키는 팬에서는 주로 ( ㉡ )로 전환된다. 또 작동하는 동안 '윙' 하는 ( ㉢ )도 함께 발생한다.<br>㉠~㉢에 들어갈 말을 옳게 짝지은 것은?", "choices": ["㉠ 열에너지, ㉡ 운동 에너지, ㉢ 소리 에너지", "㉠ 운동 에너지, ㉡ 열에너지, ㉢ 소리 에너지", "㉠ 열에너지, ㉡ 화학 에너지, ㉢ 빛에너지", "㉠ 빛에너지, ㉡ 운동 에너지, ㉢ 소리 에너지", "㉠ 열에너지, ㉡ 운동 에너지, ㉢ 화학 에너지"], "answer": [1], "explanation": "전열선은 뜨거워져 열에너지를, 팬은 회전하여 운동 에너지를 내며, 작동 소리는 소리 에너지이다. 한 기구에서 여러 에너지로 동시에 전환되는 예이다. ② ㉠과 ㉡을 맞바꿨다. ③ 팬의 회전은 화학 에너지가 아니다. ④ 전열선은 주로 빛이 아니라 열을 낸다. ⑤ 소리는 화학 에너지가 아니다."}, {"id": "전기와자기:E-004", "sub": "E", "type_id": "E01", "review_group": "RG17", "role": "reserve", "difficulty": "중", "format": "서술형", "stem": "전등을 오래 켜 둔 뒤 전등 가까이에 손을 대 보면 따뜻함을 느낄 수 있다. 이 현상을 통해 알 수 있는 전기 기구의 에너지 전환의 특징을 서술하시오.", "answer": "전등에서 전기 에너지는 주로 빛에너지로 전환되지만 일부는 열에너지로도 전환된다. 즉 한 전기 기구에서 전기 에너지는 한 가지가 아닌 여러 형태의 에너지로 동시에 전환된다.", "scoring": "상(3점): 주로 빛에너지로 전환된다는 것과 일부가 열에너지로도 전환되어 여러 에너지로 동시에 전환된다는 일반화를 모두 서술. 중(2점): '빛과 열로 전환된다'만 쓰고 여러 에너지로 동시에 전환된다는 일반화가 없음. 하(1점): '열이 난다'만 씀. '전등은 열에너지로만 전환된다'고 쓰면 0점.", "explanation": "전기 기구는 주된 용도의 에너지 외에 열·소리 등 다른 에너지로도 함께 전환된다."}, {"id": "전기와자기:E-005", "sub": "E", "type_id": "E01", "review_group": "RG17", "role": "reserve", "difficulty": "하", "format": "5지선다", "stem": "전기 에너지가 주로 운동 에너지로 전환되는 기구끼리 옳게 짝지은 것은?", "choices": ["선풍기, 전기난로", "선풍기, 세탁기", "세탁기, 전기밥솥", "전기 주전자, 스피커", "전기다리미, 휴대 전화 충전기"], "answer": [2], "explanation": "선풍기와 세탁기는 전동기가 날개나 통을 돌려 주로 운동 에너지로 전환한다. 전기난로·전기밥솥·전기 주전자·전기다리미는 주로 열에너지, 스피커는 소리 에너지, 휴대 전화 충전은 화학 에너지로 전환한다."}, {"id": "전기와자기:E-006", "sub": "E", "type_id": "E02", "review_group": "RG18", "role": "main", "difficulty": "하", "format": "5지선다", "stem": "어떤 전기 주전자에 '220 V - 1000 W'라고 표시되어 있다. 이에 대한 설명으로 옳은 것은?", "choices": ["1초 동안 1000 W의 전기 에너지를 사용한다.", "220 V의 전원에 연결하면 1초 동안 1000 J의 전기 에너지를 사용한다.", "오래 사용할수록 소비 전력이 커진다.", "1분 동안 1000 J의 전기 에너지를 사용한다는 뜻이다.", "어떤 전압의 전원에 연결해도 소비 전력은 1000 W이다."], "answer": [2], "explanation": "소비 전력은 1초 동안 사용하는 전기 에너지이고 1 W = 1 J/s이다. ① W는 소비 전력의 단위이고 에너지의 단위는 J이다. ② 옳다. ③ 소비 전력은 사용 시간과 관계없다. 오래 쓸수록 커지는 것은 사용한 전기 에너지이다. ④ 1000 W는 1초에 1000 J이므로 1분 동안에는 60000 J을 사용한다. ⑤ 표시된 소비 전력은 정격 전압(220 V)에 연결해 사용할 때의 값이다."}, {"id": "전기와자기:E-007", "sub": "E", "type_id": "E03", "review_group": "RG18", "role": "main", "difficulty": "하", "format": "5지선다", "stem": "소비 전력이 1200 W인 헤어드라이어를 정격 전압에 연결하여 5분 동안 사용하였다. 이때 사용한 전기 에너지는?", "choices": ["240 J", "6000 J", "72000 J", "360000 J", "21600000 J"], "answer": [4], "explanation": "전기 에너지(J) = 소비 전력(W) × 시간(s)이다. 5분 = 300초이므로 1200 W × 300 s = 360000 J이다. ① 소비 전력을 시간으로 나눈 값이다. ② 분을 초로 바꾸지 않고 곱한 값이다. ③ 1분(60초) 동안 사용한 에너지이다. ⑤ 5분을 5시간처럼 18000초로 바꾼 값이다."}, {"id": "전기와자기:E-008", "sub": "E", "type_id": "E03", "review_group": "RG18", "role": "main", "difficulty": "상", "format": "보기형(ㄱㄴㄷ)", "stem": "표는 전기 기구 A~C의 소비 전력과 하루 사용 시간을 나타낸 것이다. 이에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은? (단, 기구는 모두 정격 전압에 연결하여 사용하였다.)", "bogi": ["ㄱ. 1초 동안 사용하는 전기 에너지는 A가 가장 크다.", "ㄴ. 하루 동안 사용한 전기 에너지는 A가 가장 많다.", "ㄷ. C가 하루 동안 사용한 전기 에너지는 240000 J이다."], "table": {"h": ["기구", "소비 전력(W)", "사용 시간(분)"], "r": [["A 전자레인지", "1200", "5"], ["B 선풍기", "100", "90"], ["C 전기장판", "400", "10"]]}, "choices": ["ㄱ", "ㄴ", "ㄷ", "ㄱ, ㄷ", "ㄴ, ㄷ"], "answer": [4], "explanation": "ㄱ. 옳다. 1초 동안 사용하는 전기 에너지는 소비 전력이므로 A(1200 W)가 가장 크다. ㄴ. 사용한 에너지는 A 1200 W × 300 s = 360000 J, B 100 W × 5400 s = 540000 J, C 400 W × 600 s = 240000 J로 B가 가장 많다. 소비 전력이 커도 사용 시간이 짧으면 에너지를 더 적게 쓸 수 있다. ㄷ. 옳다."}, {"id": "전기와자기:E-009", "sub": "E", "type_id": "E03", "review_group": "RG18", "role": "main", "difficulty": "중", "format": "단답형", "stem": "소비 전력이 1500 W인 전기 주전자를 정격 전압에 연결하여 물을 끓였더니 270000 J의 전기 에너지를 사용하였다. 전기 주전자를 사용한 시간은 몇 분인지 구하시오.", "answer": "3분", "explanation": "시간(s) = 전기 에너지(J) ÷ 소비 전력(W) = 270000 J ÷ 1500 W = 180 s이고, 180초 = 3분이다."}, {"id": "전기와자기:E-010", "sub": "E", "type_id": "E04", "review_group": "RG18", "role": "reserve", "difficulty": "중", "format": "5지선다", "stem": "표는 어느 가정에서 하루 동안 사용한 전기 기구의 소비 전력과 사용 시간을 나타낸 것이다. 이 가정에서 하루 동안 세 기구가 사용한 전체 전력량은? (단, 기구는 모두 정격 전압에 연결하여 사용하였다.)", "table": {"h": ["기구", "소비 전력(W)", "사용 시간(h)"], "r": [["냉장고", "100", "24"], ["전등", "20", "5"], ["세탁기", "500", "2"]]}, "choices": ["0.62 kWh", "3.5 kWh", "35 kWh", "210 kWh", "3500 kWh"], "answer": [2], "explanation": "전력량(Wh) = 소비 전력(W) × 사용 시간(h)이다. 냉장고 100 W × 24 h = 2400 Wh, 전등 20 W × 5 h = 100 Wh, 세탁기 500 W × 2 h = 1000 Wh로 합은 3500 Wh이고, 1 kWh = 1000 Wh이므로 3.5 kWh이다. ① 소비 전력의 합(620 W)을 전력량으로 착각한 값이다. ③ 1000이 아니라 100으로 나누었다. ④ 시간을 분으로 바꾸어 곱한 값이다. ⑤ kWh로 바꾸지 않았다.", "textbook_tags": {"mode": "include_only", "books": ["천재임", "체크체크"]}}, {"id": "전기와자기:E-011", "sub": "E", "type_id": "E02", "review_group": "RG18", "role": "reserve", "difficulty": "중", "format": "보기형(ㄱㄴㄷ)", "stem": "어떤 전기난로에 '220 V - 1100 W'라고 표시되어 있다. 이에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?", "bogi": ["ㄱ. 220 V의 전원에 연결하여 사용할 때 소비 전력이 1100 W이다.", "ㄴ. 2분 동안 사용하면 1분 동안 사용할 때보다 소비 전력이 2배가 된다.", "ㄷ. 220 V의 전원에 연결하여 1분 동안 사용하면 66000 J의 전기 에너지를 사용한다."], "choices": ["ㄱ", "ㄴ", "ㄱ, ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ"], "answer": [4], "explanation": "ㄱ. 옳다. 표시된 220 V는 정격 전압, 1100 W는 그 전압에서의 소비 전력이다. ㄴ. 소비 전력은 1초 동안 사용하는 전기 에너지로 사용 시간과 관계없다. 2배가 되는 것은 사용한 전기 에너지이다. ㄷ. 옳다. 1100 W × 60 s = 66000 J이다."}, {"id": "전기와자기:E-012", "sub": "E", "type_id": "E05", "review_group": "RG19", "role": "main", "difficulty": "하", "format": "5지선다", "stem": "전기 에너지를 효율적으로 사용하는 것에 대한 설명으로 옳은 것은?", "choices": ["에너지 소비 효율 등급의 숫자가 클수록 효율이 높은 제품이다.", "같은 일을 하는 제품이라면 에너지 소비 효율 등급이 1등급에 가까운 제품이 효율이 높다.", "밝기가 같다면 소비 전력이 큰 전구를 쓰는 것이 효율적이다.", "전원을 끈 전기 기구는 플러그가 꽂혀 있어도 전기 에너지를 전혀 쓰지 않는다.", "소비 전력이 같은 전구는 밝기도 항상 같다."], "answer": [2], "explanation": "① 1등급에 가까울수록 효율이 높다. ② 옳다. ③ 같은 밝기라면 소비 전력이 작은 전구가 전기 에너지를 덜 쓰므로 효율적이다. ④ 일부 기구는 꺼진 상태에서도 대기 전력을 쓰므로 플러그를 뽑는 것이 좋다. ⑤ 소비 전력이 같아도 빛으로 전환되는 비율이 다르면 밝기가 다르다."}, {"id": "전기와자기:E-013", "sub": "E", "type_id": "E05", "review_group": "RG19", "role": "main", "difficulty": "상", "format": "5지선다", "stem": "표는 전구 A~C를 각각 정격 전압에 연결하여 10초 동안 켰을 때 전환된 빛에너지와 열에너지의 양을 나타낸 것이다. 빛에너지로 전환되는 비율이 가장 큰 전구와 그 전구의 소비 전력을 옳게 짝지은 것은? (단, 전기 에너지는 빛에너지와 열에너지로만 전환된다.)", "table": {"h": ["전구", "빛에너지(J)", "열에너지(J)"], "r": [["A", "40", "160"], ["B", "30", "70"], ["C", "60", "540"]]}, "choices": ["A, 20 W", "C, 60 W", "C, 600 W", "B, 100 W", "B, 10 W"], "answer": [5], "explanation": "10초 동안 사용한 전기 에너지는 A 200 J, B 100 J, C 600 J이므로 소비 전력은 A 20 W, B 10 W, C 60 W이다. 빛으로 전환되는 비율은 A 40/200 = 20 %, B 30/100 = 30 %, C 60/600 = 10 %로 B가 가장 크다. ①은 비율이 두 번째인 A이다. ②③ C는 빛에너지의 양은 가장 많지만 사용한 에너지 중 빛의 비율은 가장 작다. ③④ 10초 동안의 에너지를 시간으로 나누지 않았다."}, {"id": "전기와자기:E-014", "sub": "E", "type_id": "E05", "review_group": "RG19", "role": "main", "difficulty": "상", "format": "보기형(ㄱㄴㄷ)", "stem": "소비 전력이 20 W로 같은 전구 A와 B를 각각 정격 전압에 연결하여 켰더니, 1초 동안 A에서는 4 J, B에서는 2 J의 전기 에너지가 빛에너지로 전환되었다. 이에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은? (단, 전기 에너지는 빛에너지와 열에너지로만 전환된다.)", "bogi": ["ㄱ. 1초 동안 A에서 열에너지로 전환되는 에너지는 16 J이다.", "ㄴ. 소비 전력이 같으므로 A와 B의 밝기는 같다.", "ㄷ. 같은 시간 동안 A에서 발생하는 열에너지가 B에서보다 많다."], "choices": ["ㄱ", "ㄴ", "ㄱ, ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ"], "answer": [1], "explanation": "ㄱ. 옳다. 20 W는 1초에 20 J을 쓰므로 A의 열에너지는 20 J − 4 J = 16 J이다. ㄴ. 소비 전력이 같아도 빛으로 전환되는 양이 A(4 J)가 B(2 J)보다 많으므로 A가 더 밝다. ㄷ. 1초 동안 B의 열에너지는 20 J − 2 J = 18 J로 A(16 J)보다 많다. 소비 전력이 같을 때 빛을 적게 내는 전구가 열을 더 많이 낸다."}, {"id": "전기와자기:E-015", "sub": "E", "type_id": "E05", "review_group": "RG19", "role": "reserve", "difficulty": "하", "format": "5지선다", "stem": "가정에서 전기 에너지를 절약하는 방법으로 옳지 않은 것은?", "choices": ["사용하지 않는 전기 기구의 플러그를 뽑아 둔다.", "같은 밝기라면 소비 전력이 작은 전등을 사용한다.", "에너지 소비 효율 등급이 5등급에 가까운 제품을 고른다.", "냉장고 문을 자주 여닫지 않는다.", "세탁물을 모아서 한꺼번에 세탁한다."], "answer": [3], "explanation": "③ 에너지 소비 효율 등급은 1등급에 가까울수록 효율이 높으므로 1등급에 가까운 제품을 골라야 한다. ① 대기 전력을 줄인다. ② 같은 밝기에서 전기 에너지를 덜 쓴다. ④⑤ 불필요하게 쓰이는 전기 에너지를 줄인다."}, {"id": "전기와자기:E-016", "sub": "E", "type_id": "E05", "review_group": "RG19", "role": "reserve", "difficulty": "중", "format": "5지선다", "stem": "소비 전력이 40 W인 전구를 정격 전압에 연결하면 전기 에너지의 25 %가 빛에너지로, 나머지는 열에너지로 전환된다. 이 전구를 1분 동안 켰을 때 전환된 빛에너지의 양은?", "choices": ["10 J", "160 J", "600 J", "1800 J", "2400 J"], "answer": [3], "explanation": "1분 동안 사용한 전기 에너지는 40 W × 60 s = 2400 J이고, 그중 25 %인 2400 J × 0.25 = 600 J이 빛에너지로 전환된다. ① 1초 동안의 빛에너지이다. ② 소비 전력을 비율로 나눈 값이다. ④ 열에너지로 전환된 양이다. ⑤ 사용한 전기 에너지 전체이다."}, {"id": "전기와자기:F-001", "sub": "F", "type_id": "F01", "review_group": "RG20", "role": "main", "difficulty": "하", "format": "5지선다", "stem": "자석과 자기장에 대한 설명으로 옳은 것은?", "choices": ["자기장의 방향은 나침반 바늘의 S극이 가리키는 방향이다.", "막대자석 주위의 자기장은 자석의 가운데 부분에서 가장 세다.", "자기장은 영구 자석의 주위에만 생긴다.", "자기력은 자석과 자석 사이, 자석과 철로 된 물체 사이에 작용하는 힘이다.", "두 자석의 같은 극끼리는 서로 끌어당긴다."], "answer": [4], "explanation": "① 자기장의 방향은 나침반 바늘 N극이 가리키는 방향이다. ② 막대자석의 자기장은 양 극 근처에서 가장 세다. ③ 전류가 흐르는 도선이나 코일 주위에도 자기장이 생긴다. ④ 옳다. ⑤ 같은 극끼리는 밀어 내고, 다른 극끼리 끌어당긴다."}, {"id": "전기와자기:F-002", "sub": "F", "type_id": "F02", "review_group": "RG20", "role": "main", "difficulty": "중", "format": "합답형", "stem": "그림은 막대자석 주위의 자기장 모양(자기력선)을 나타낸 것이다. 이에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은? (단, 지구 자기장의 영향은 무시한다.)", "bogi": ["ㄱ. P에 나침반을 놓으면 바늘 N극은 오른쪽을 가리킨다.", "ㄴ. Q에서가 P에서보다 자기장이 세다.", "ㄷ. 자기력선은 S극에서 나와 N극으로 들어간다."], "figure_svg": "<svg style=\"background:#fff\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 480 230\" fill=\"none\" stroke=\"#000\" stroke-width=\"1.5\" font-size=\"13\" font-family=\"sans-serif\"><rect x=\"170.0\" y=\"110\" width=\"70.0\" height=\"30\" fill=\"#000\" fill-opacity=\"0.35\"/><text x=\"205.0\" y=\"130.0\" fill=\"#000\" stroke=\"none\" font-size=\"15\" text-anchor=\"middle\">N<\/text><rect x=\"240.0\" y=\"110\" width=\"70.0\" height=\"30\" fill=\"#000\" fill-opacity=\"0.08\"/><text x=\"275.0\" y=\"130.0\" fill=\"#000\" stroke=\"none\" font-size=\"15\" text-anchor=\"middle\">S<\/text><path d=\"M170,115 C140,40 340,40 310,115\"/><path d=\"M170,120 C110,10 370,10 310,120\" stroke-width=\"1\"/><path d=\"M170,135 C140,210 340,210 310,135\"/><path d=\"M170,130 C110,240 370,240 310,130\" stroke-width=\"1\"/><line x1=\"170\" y1=\"125\" x2=\"80\" y2=\"125\"/><line x1=\"310\" y1=\"125\" x2=\"400\" y2=\"125\"/><line x1=\"236\" y1=\"58\" x2=\"246\" y2=\"58\"/><polygon points=\"246.0,58.0 239.9,61.5 239.9,54.5\" fill=\"#000\" stroke=\"none\"/><line x1=\"236\" y1=\"192\" x2=\"246\" y2=\"192\"/><polygon points=\"246.0,192.0 239.9,195.5 239.9,188.5\" fill=\"#000\" stroke=\"none\"/><line x1=\"110\" y1=\"125\" x2=\"100\" y2=\"125\"/><polygon points=\"100.0,125.0 106.1,121.5 106.1,128.5\" fill=\"#000\" stroke=\"none\"/><line x1=\"380\" y1=\"125\" x2=\"370\" y2=\"125\"/><polygon points=\"370.0,125.0 376.1,121.5 376.1,128.5\" fill=\"#000\" stroke=\"none\"/><circle cx=\"240\" cy=\"58\" r=\"4\" fill=\"#000\" stroke=\"none\"/><text x=\"236\" y=\"48\" fill=\"#000\" stroke=\"none\">P<\/text><circle cx=\"150\" cy=\"125\" r=\"4\" fill=\"#000\" stroke=\"none\"/><text x=\"145\" y=\"145\" fill=\"#000\" stroke=\"none\">Q<\/text><\/svg>", "choices": ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "answer": [3], "explanation": "ㄱ. 자기력선은 N극(왼쪽)에서 나와 S극(오른쪽)으로 들어가므로 자석 위 P에서 자기장은 오른쪽이고, 나침반 N극도 오른쪽을 가리킨다. ㄴ. Q는 N극 바로 옆으로 자기력선이 촘촘하여 자석에서 먼 P보다 자기장이 세다. ㄷ. 자기력선은 N극에서 나와 S극으로 들어간다."}, {"id": "전기와자기:F-003", "sub": "F", "type_id": "F02", "review_group": "RG20", "role": "main", "difficulty": "중", "format": "5지선다", "stem": "그림 (가)와 (나)는 막대자석 두 개를 같은 거리만큼 떨어뜨려 서로 다르게 놓은 것이다. 이에 대한 설명으로 옳은 것은? (단, 지구 자기장의 영향은 무시한다.)", "figure_svg": "<svg style=\"background:#fff\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 500 170\" fill=\"none\" stroke=\"#000\" stroke-width=\"1.5\" font-size=\"13\" font-family=\"sans-serif\"><text x=\"10\" y=\"22\" fill=\"#000\" stroke=\"none\">(가)<\/text><rect x=\"40.0\" y=\"50\" width=\"60.0\" height=\"30\" fill=\"#000\" fill-opacity=\"0.08\"/><text x=\"70.0\" y=\"70.0\" fill=\"#000\" stroke=\"none\" font-size=\"15\" text-anchor=\"middle\">S<\/text><rect x=\"100.0\" y=\"50\" width=\"60.0\" height=\"30\" fill=\"#000\" fill-opacity=\"0.35\"/><text x=\"130.0\" y=\"70.0\" fill=\"#000\" stroke=\"none\" font-size=\"15\" text-anchor=\"middle\">N<\/text><rect x=\"220.0\" y=\"50\" width=\"60.0\" height=\"30\" fill=\"#000\" fill-opacity=\"0.08\"/><text x=\"250.0\" y=\"70.0\" fill=\"#000\" stroke=\"none\" font-size=\"15\" text-anchor=\"middle\">S<\/text><rect x=\"280.0\" y=\"50\" width=\"60.0\" height=\"30\" fill=\"#000\" fill-opacity=\"0.35\"/><text x=\"310.0\" y=\"70.0\" fill=\"#000\" stroke=\"none\" font-size=\"15\" text-anchor=\"middle\">N<\/text><text x=\"10\" y=\"122\" fill=\"#000\" stroke=\"none\">(나)<\/text><rect x=\"40.0\" y=\"110\" width=\"60.0\" height=\"30\" fill=\"#000\" fill-opacity=\"0.08\"/><text x=\"70.0\" y=\"130.0\" fill=\"#000\" stroke=\"none\" font-size=\"15\" text-anchor=\"middle\">S<\/text><rect x=\"100.0\" y=\"110\" width=\"60.0\" height=\"30\" fill=\"#000\" fill-opacity=\"0.35\"/><text x=\"130.0\" y=\"130.0\" fill=\"#000\" stroke=\"none\" font-size=\"15\" text-anchor=\"middle\">N<\/text><rect x=\"220.0\" y=\"110\" width=\"60.0\" height=\"30\" fill=\"#000\" fill-opacity=\"0.35\"/><text x=\"250.0\" y=\"130.0\" fill=\"#000\" stroke=\"none\" font-size=\"15\" text-anchor=\"middle\">N<\/text><rect x=\"280.0\" y=\"110\" width=\"60.0\" height=\"30\" fill=\"#000\" fill-opacity=\"0.08\"/><text x=\"310.0\" y=\"130.0\" fill=\"#000\" stroke=\"none\" font-size=\"15\" text-anchor=\"middle\">S<\/text><text x=\"185\" y=\"165\" fill=\"#000\" stroke=\"none\" font-size=\"11\" text-anchor=\"middle\">두 자석 사이의 거리는 같다.<\/text><\/svg>", "choices": ["(가)에서 두 자석 사이의 자기력선은 서로 밀려 휘어지고 이어지지 않는다.", "(나)에서 두 자석 사이의 자기력선은 한 자석에서 다른 자석으로 이어진다.", "(가)에서 두 자석 사이 가운데에 나침반을 놓으면 바늘 N극은 왼쪽을 가리킨다.", "(가)의 두 자석은 서로 끌어당기고, (나)의 두 자석은 서로 밀어 낸다.", "(나)에서 두 자석 사이의 자기력선은 서로 교차한다."], "answer": [4], "explanation": "(가)는 왼쪽 자석의 N극과 오른쪽 자석의 S극이 마주 보므로 서로 끌어당기고, 자기력선이 N극에서 S극으로 이어진다. 두 자석 사이 자기장은 N극에서 S극 쪽, 즉 오른쪽이다. (나)는 N극과 N극이 마주 보므로 서로 밀어 내고, 자기력선은 이어지지 않고 밀려 휘어진다. 자기력선은 서로 교차하지 않는다."}, {"id": "전기와자기:F-004", "sub": "F", "type_id": "F01", "review_group": "RG20", "role": "reserve", "difficulty": "하", "format": "5지선다", "stem": "자석과 자기장에 대한 설명으로 옳지 않은 것은?", "choices": ["자석 주위에 자기력이 작용하는 공간을 자기장이라고 한다.", "어느 지점에 놓은 나침반 바늘 N극이 가리키는 방향이 그 지점의 자기장 방향이다.", "자기력선이 촘촘한 곳일수록 자기장이 세다.", "전류가 흐르는 코일 주위에는 자기장이 생기지 않는다.", "막대자석은 양 극 근처에서 자기장이 가장 세다."], "answer": [4], "explanation": "전류가 흐르는 도선이나 코일 주위에도 자기장이 생긴다. 이것을 이용한 것이 전자석이다. 나머지는 모두 옳은 설명이다."}, {"id": "전기와자기:F-005", "sub": "F", "type_id": "F02", "review_group": "RG20", "role": "reserve", "difficulty": "하", "format": "서술형", "stem": "그림은 막대자석 주위의 자기장 모양(자기력선)과 두 지점 A, B를 나타낸 것이다. A와 B 중 자기장이 더 센 곳을 쓰고, 그렇게 판단한 까닭을 자기력선을 이용하여 서술하시오.", "figure_svg": "<svg style=\"background:#fff\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 420 150\" fill=\"none\" stroke=\"#000\" stroke-width=\"1.5\" font-size=\"13\" font-family=\"sans-serif\"><rect x=\"130.0\" y=\"60\" width=\"80.0\" height=\"30\" fill=\"#000\" fill-opacity=\"0.35\"/><text x=\"170.0\" y=\"80.0\" fill=\"#000\" stroke=\"none\" font-size=\"15\" text-anchor=\"middle\">N<\/text><rect x=\"210.0\" y=\"60\" width=\"80.0\" height=\"30\" fill=\"#000\" fill-opacity=\"0.08\"/><text x=\"250.0\" y=\"80.0\" fill=\"#000\" stroke=\"none\" font-size=\"15\" text-anchor=\"middle\">S<\/text><path d=\"M130,65 C100,0 320,0 290,65\" stroke-width=\"1\"/><path d=\"M130,70 C115,35 305,35 290,70\" stroke-width=\"1\"/><path d=\"M130,85 C115,120 305,120 290,85\" stroke-width=\"1\"/><path d=\"M130,90 C100,155 320,155 290,90\" stroke-width=\"1\"/><line x1=\"130\" y1=\"75\" x2=\"40\" y2=\"75\" stroke-width=\"1\"/><line x1=\"290\" y1=\"75\" x2=\"380\" y2=\"75\" stroke-width=\"1\"/><circle cx=\"118\" cy=\"62\" r=\"4\" fill=\"#000\" stroke=\"none\"/><text x=\"100\" y=\"55\" fill=\"#000\" stroke=\"none\">A<\/text><circle cx=\"210\" cy=\"17\" r=\"4\" fill=\"#000\" stroke=\"none\"/><text x=\"218\" y=\"14\" fill=\"#000\" stroke=\"none\">B<\/text><\/svg>", "answer": "A. A가 B보다 자기력선이 더 촘촘하게 지나가는 곳(자석의 극 가까이)이기 때문이다.", "scoring": "상(3점): A를 쓰고, A에서 자기력선이 더 촘촘하다(간격이 좁다)는 근거를 서술. 중(2점): A를 쓰고 근거로 '극에 가까워서'만 씀. 하(1점): A만 쓰고 근거가 없음. 0점: B를 쓰거나 '자기력선 간격이 넓을수록 세다'고 서술.", "explanation": "자기력선의 간격이 좁을수록(촘촘할수록) 자기장이 세다. A는 N극 가까이로 자기력선이 촘촘하고 B는 자석에서 멀어 간격이 넓다."}, {"id": "전기와자기:F-006", "sub": "F", "type_id": "F03", "review_group": "RG21", "role": "main", "difficulty": "중", "format": "5지선다", "stem": "그림과 같이 코일에 전류가 흐르고 있다. 코일 앞면(그림을 보는 쪽) 도선 위의 화살표는 그 도선에 흐르는 전류의 방향이다. 코일의 왼쪽 끝 A와 오른쪽 끝 B에 생기는 극을 옳게 짝지은 것은?", "figure_svg": "<svg style=\"background:#fff\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 420 200\" fill=\"none\" stroke=\"#000\" stroke-width=\"1.5\" font-size=\"13\" font-family=\"sans-serif\"><path d=\"M130.0,50 A9,30 0 0,0 130.0,110\" stroke-dasharray=\"3 3\" stroke-width=\"1\"/><path d=\"M130.0,50 A9,30 0 0,1 130.0,110\"/><polygon points=\"139.0,73 135.0,82 143.0,82\" fill=\"#000\" stroke=\"none\"/><path d=\"M162.0,50 A9,30 0 0,0 162.0,110\" stroke-dasharray=\"3 3\" stroke-width=\"1\"/><path d=\"M162.0,50 A9,30 0 0,1 162.0,110\"/><polygon points=\"171.0,73 167.0,82 175.0,82\" fill=\"#000\" stroke=\"none\"/><path d=\"M194.0,50 A9,30 0 0,0 194.0,110\" stroke-dasharray=\"3 3\" stroke-width=\"1\"/><path d=\"M194.0,50 A9,30 0 0,1 194.0,110\"/><polygon points=\"203.0,73 199.0,82 207.0,82\" fill=\"#000\" stroke=\"none\"/><path d=\"M226.0,50 A9,30 0 0,0 226.0,110\" stroke-dasharray=\"3 3\" stroke-width=\"1\"/><path d=\"M226.0,50 A9,30 0 0,1 226.0,110\"/><polygon points=\"235.0,73 231.0,82 239.0,82\" fill=\"#000\" stroke=\"none\"/><path d=\"M258.0,50 A9,30 0 0,0 258.0,110\" stroke-dasharray=\"3 3\" stroke-width=\"1\"/><path d=\"M258.0,50 A9,30 0 0,1 258.0,110\"/><polygon points=\"267.0,73 263.0,82 271.0,82\" fill=\"#000\" stroke=\"none\"/><path d=\"M290.0,50 A9,30 0 0,0 290.0,110\" stroke-dasharray=\"3 3\" stroke-width=\"1\"/><path d=\"M290.0,50 A9,30 0 0,1 290.0,110\"/><polygon points=\"299.0,73 295.0,82 303.0,82\" fill=\"#000\" stroke=\"none\"/><text x=\"105\" y=\"85\" fill=\"#000\" stroke=\"none\" font-size=\"15\">A<\/text><text x=\"305\" y=\"85\" fill=\"#000\" stroke=\"none\" font-size=\"15\">B<\/text><line x1=\"130\" y1=\"110\" x2=\"130\" y2=\"160\"/><line x1=\"130\" y1=\"160\" x2=\"205\" y2=\"160\"/><line x1=\"290\" y1=\"110\" x2=\"290\" y2=\"160\"/><line x1=\"290\" y1=\"160\" x2=\"215\" y2=\"160\"/><line x1=\"205\" y1=\"146\" x2=\"205\" y2=\"174\" stroke-width=\"2\"/><line x1=\"215\" y1=\"153\" x2=\"215\" y2=\"167\" stroke-width=\"3\"/><text x=\"191\" y=\"144\" fill=\"#000\" stroke=\"none\" font-size=\"14\">+<\/text><text x=\"221\" y=\"144\" fill=\"#000\" stroke=\"none\" font-size=\"14\">−<\/text><\/svg>", "choices": ["A: N극, B: S극", "A: S극, B: N극", "A: N극, B: N극", "A: S극, B: S극", "A, B 모두 극이 생기지 않는다."], "answer": [1], "explanation": "오른손 네 손가락을 코일 앞면의 전류 방향(위쪽)으로 감아쥐면 엄지는 왼쪽을 가리킨다. 엄지가 가리키는 쪽이 코일 내부 자기장 방향이자 N극이므로 A는 N극, B는 S극이다.", "stimulus_group": "SG-E08"}, {"id": "전기와자기:F-007", "sub": "F", "type_id": "F03", "review_group": "RG21", "role": "main", "difficulty": "상", "format": "5지선다", "stem": "그림과 같이 전류가 흐르는 코일의 축 왼쪽 바깥(a), 코일 내부(b), 축 오른쪽 바깥(c), 코일 위쪽 옆면 바깥(d)에 나침반을 놓았다. 코일 앞면(그림을 보는 쪽) 도선 위의 화살표는 그 도선에 흐르는 전류의 방향이다. a~d에 놓은 나침반 바늘 N극이 가리키는 방향을 옳게 짝지은 것은? (단, 지구 자기장의 영향은 무시한다.)", "figure_svg": "<svg style=\"background:#fff\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 460 210\" fill=\"none\" stroke=\"#000\" stroke-width=\"1.5\" font-size=\"13\" font-family=\"sans-serif\"><path d=\"M150.0,80 A9,30 0 0,0 150.0,140\" stroke-dasharray=\"3 3\" stroke-width=\"1\"/><path d=\"M150.0,80 A9,30 0 0,1 150.0,140\"/><polygon points=\"159.0,117 155.0,108 163.0,108\" fill=\"#000\" stroke=\"none\"/><path d=\"M182.0,80 A9,30 0 0,0 182.0,140\" stroke-dasharray=\"3 3\" stroke-width=\"1\"/><path d=\"M182.0,80 A9,30 0 0,1 182.0,140\"/><polygon points=\"191.0,117 187.0,108 195.0,108\" fill=\"#000\" stroke=\"none\"/><path d=\"M214.0,80 A9,30 0 0,0 214.0,140\" stroke-dasharray=\"3 3\" stroke-width=\"1\"/><path d=\"M214.0,80 A9,30 0 0,1 214.0,140\"/><polygon points=\"223.0,117 219.0,108 227.0,108\" fill=\"#000\" stroke=\"none\"/><path d=\"M246.0,80 A9,30 0 0,0 246.0,140\" stroke-dasharray=\"3 3\" stroke-width=\"1\"/><path d=\"M246.0,80 A9,30 0 0,1 246.0,140\"/><polygon points=\"255.0,117 251.0,108 259.0,108\" fill=\"#000\" stroke=\"none\"/><path d=\"M278.0,80 A9,30 0 0,0 278.0,140\" stroke-dasharray=\"3 3\" stroke-width=\"1\"/><path d=\"M278.0,80 A9,30 0 0,1 278.0,140\"/><polygon points=\"287.0,117 283.0,108 291.0,108\" fill=\"#000\" stroke=\"none\"/><path d=\"M310.0,80 A9,30 0 0,0 310.0,140\" stroke-dasharray=\"3 3\" stroke-width=\"1\"/><path d=\"M310.0,80 A9,30 0 0,1 310.0,140\"/><polygon points=\"319.0,117 315.0,108 323.0,108\" fill=\"#000\" stroke=\"none\"/><circle cx=\"95\" cy=\"110\" r=\"13\"/><text x=\"95\" y=\"90\" fill=\"#000\" stroke=\"none\" font-size=\"13\" text-anchor=\"middle\">a<\/text><circle cx=\"230\" cy=\"110\" r=\"10\"/><text x=\"230\" y=\"74\" fill=\"#000\" stroke=\"none\" font-size=\"13\" text-anchor=\"middle\">b<\/text><circle cx=\"370\" cy=\"110\" r=\"13\"/><text x=\"370\" y=\"90\" fill=\"#000\" stroke=\"none\" font-size=\"13\" text-anchor=\"middle\">c<\/text><circle cx=\"230\" cy=\"40\" r=\"13\"/><text x=\"254\" y=\"44\" fill=\"#000\" stroke=\"none\" font-size=\"13\" text-anchor=\"middle\">d<\/text><line x1=\"150\" y1=\"140\" x2=\"150\" y2=\"185\"/><line x1=\"150\" y1=\"185\" x2=\"225\" y2=\"185\"/><line x1=\"310\" y1=\"140\" x2=\"310\" y2=\"185\"/><line x1=\"310\" y1=\"185\" x2=\"235\" y2=\"185\"/><line x1=\"235\" y1=\"171\" x2=\"235\" y2=\"199\" stroke-width=\"2\"/><line x1=\"225\" y1=\"178\" x2=\"225\" y2=\"192\" stroke-width=\"3\"/><text x=\"241\" y=\"169\" fill=\"#000\" stroke=\"none\" font-size=\"14\">+<\/text><text x=\"211\" y=\"169\" fill=\"#000\" stroke=\"none\" font-size=\"14\">−<\/text><\/svg>", "choices": ["a: 왼쪽, b: 오른쪽, c: 오른쪽, d: 왼쪽", "a: 오른쪽, b: 오른쪽, c: 오른쪽, d: 오른쪽", "a: 왼쪽, b: 왼쪽, c: 왼쪽, d: 오른쪽", "a: 오른쪽, b: 왼쪽, c: 오른쪽, d: 왼쪽", "a: 오른쪽, b: 오른쪽, c: 오른쪽, d: 왼쪽"], "answer": [5], "explanation": "앞면 전류가 아래쪽이므로 오른손 네 손가락을 그 방향으로 감아쥐면 엄지는 오른쪽을 가리킨다. 따라서 코일 오른쪽 끝이 N극, 왼쪽 끝이 S극이고 내부(b) 자기장은 오른쪽이다. 축 위의 바깥 a, c에서도 자기장은 내부와 같은 오른쪽(a는 S극으로 들어가는 쪽, c는 N극에서 나오는 쪽)이다. 옆면 바깥 d에서는 자기장이 N극에서 S극 쪽으로 돌아가므로 내부와 반대인 왼쪽이다."}, {"id": "전기와자기:F-008", "sub": "F", "type_id": "F04", "review_group": "RG21", "role": "main", "difficulty": "상", "format": "5지선다", "stem": "그림과 같이 코일을 전원 장치에 연결하고 코일의 축 오른쪽 바깥에 나침반을 놓았더니, 바늘 N극이 코일 쪽(왼쪽)을 가리켰다. 이 코일은 단자 a로 들어간 전류가 코일 앞면(그림을 보는 쪽) 도선에서 위쪽으로 흐르도록 감겨 있다. 전원 장치의 (+)극에 연결된 단자와 코일 앞면 도선 속 전자의 이동 방향을 옳게 짝지은 것은? (단, 나침반 바늘의 색칠한 쪽이 N극이고, 지구 자기장의 영향은 무시한다.)", "figure_svg": "<svg style=\"background:#fff\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 470 210\" fill=\"none\" stroke=\"#000\" stroke-width=\"1.5\" font-size=\"13\" font-family=\"sans-serif\"><path d=\"M120.0,60 A9,30 0 0,0 120.0,120\" stroke-dasharray=\"3 3\" stroke-width=\"1\"/><path d=\"M120.0,60 A9,30 0 0,1 120.0,120\"/><path d=\"M152.0,60 A9,30 0 0,0 152.0,120\" stroke-dasharray=\"3 3\" stroke-width=\"1\"/><path d=\"M152.0,60 A9,30 0 0,1 152.0,120\"/><path d=\"M184.0,60 A9,30 0 0,0 184.0,120\" stroke-dasharray=\"3 3\" stroke-width=\"1\"/><path d=\"M184.0,60 A9,30 0 0,1 184.0,120\"/><path d=\"M216.0,60 A9,30 0 0,0 216.0,120\" stroke-dasharray=\"3 3\" stroke-width=\"1\"/><path d=\"M216.0,60 A9,30 0 0,1 216.0,120\"/><path d=\"M248.0,60 A9,30 0 0,0 248.0,120\" stroke-dasharray=\"3 3\" stroke-width=\"1\"/><path d=\"M248.0,60 A9,30 0 0,1 248.0,120\"/><path d=\"M280.0,60 A9,30 0 0,0 280.0,120\" stroke-dasharray=\"3 3\" stroke-width=\"1\"/><path d=\"M280.0,60 A9,30 0 0,1 280.0,120\"/><text x=\"100\" y=\"150\" fill=\"#000\" stroke=\"none\" font-size=\"14\">a<\/text><text x=\"296\" y=\"150\" fill=\"#000\" stroke=\"none\" font-size=\"14\">b<\/text><line x1=\"120\" y1=\"120\" x2=\"120\" y2=\"175\"/><line x1=\"280\" y1=\"120\" x2=\"280\" y2=\"175\"/><rect x=\"150\" y=\"160\" width=\"100\" height=\"34\"/><text x=\"200\" y=\"182\" fill=\"#000\" stroke=\"none\" font-size=\"12\" text-anchor=\"middle\">전원 장치<\/text><line x1=\"120\" y1=\"175\" x2=\"150\" y2=\"175\"/><line x1=\"280\" y1=\"175\" x2=\"250\" y2=\"175\"/><circle cx=\"360\" cy=\"90\" r=\"13\"/><polygon points=\"349.0,90.0 360.0,86.0 360.0,94.0\" fill=\"#000\"/><polygon points=\"371.0,90.0 360.0,86.0 360.0,94.0\" fill=\"none\"/><text x=\"360\" y=\"125\" fill=\"#000\" stroke=\"none\" font-size=\"11\" text-anchor=\"middle\">나침반<\/text><\/svg>", "choices": ["a, 위쪽", "a, 아래쪽", "b, 위쪽", "b, 아래쪽", "알 수 없다."], "answer": [2], "explanation": "나침반 N극이 코일 쪽을 가리키므로 코일의 오른쪽 끝은 N극을 끌어당기는 S극이고, 왼쪽 끝이 N극이다. 오른손 엄지를 왼쪽(N극)으로 향하게 감아쥐면 앞면 도선의 전류는 위쪽이다. 이 코일은 a로 들어간 전류가 앞면에서 위쪽으로 흐르므로 전류는 a로 들어간다. 전류는 전원의 (+)극에서 나오므로 (+)극은 a에 연결되어 있다. 전자는 전류와 반대 방향으로 이동하므로 앞면 도선에서 아래쪽으로 이동한다."}, {"id": "전기와자기:F-009", "sub": "F", "type_id": "F04", "review_group": "RG21", "role": "main", "difficulty": "중", "format": "서술형", "stem": "그림과 같이 전류가 흐르는 코일의 축 왼쪽 바깥에 나침반을 놓았더니 바늘 N극이 코일에서 멀어지는 쪽(왼쪽)을 가리켰다. (단, 나침반 바늘의 색칠한 쪽이 N극이고, 지구 자기장의 영향은 무시한다.)<br>(1) 코일의 왼쪽 끝 X에 생긴 극을 쓰시오.<br>(2) 코일과 나침반의 위치는 그대로 두고 나침반 바늘 N극이 오른쪽을 가리키게 하는 방법을 한 가지 서술하시오.", "figure_svg": "<svg style=\"background:#fff\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 430 200\" fill=\"none\" stroke=\"#000\" stroke-width=\"1.5\" font-size=\"13\" font-family=\"sans-serif\"><path d=\"M150.0,60 A9,30 0 0,0 150.0,120\" stroke-dasharray=\"3 3\" stroke-width=\"1\"/><path d=\"M150.0,60 A9,30 0 0,1 150.0,120\"/><path d=\"M182.0,60 A9,30 0 0,0 182.0,120\" stroke-dasharray=\"3 3\" stroke-width=\"1\"/><path d=\"M182.0,60 A9,30 0 0,1 182.0,120\"/><path d=\"M214.0,60 A9,30 0 0,0 214.0,120\" stroke-dasharray=\"3 3\" stroke-width=\"1\"/><path d=\"M214.0,60 A9,30 0 0,1 214.0,120\"/><path d=\"M246.0,60 A9,30 0 0,0 246.0,120\" stroke-dasharray=\"3 3\" stroke-width=\"1\"/><path d=\"M246.0,60 A9,30 0 0,1 246.0,120\"/><path d=\"M278.0,60 A9,30 0 0,0 278.0,120\" stroke-dasharray=\"3 3\" stroke-width=\"1\"/><path d=\"M278.0,60 A9,30 0 0,1 278.0,120\"/><path d=\"M310.0,60 A9,30 0 0,0 310.0,120\" stroke-dasharray=\"3 3\" stroke-width=\"1\"/><path d=\"M310.0,60 A9,30 0 0,1 310.0,120\"/><circle cx=\"80\" cy=\"90\" r=\"13\"/><polygon points=\"69.0,90.0 80.0,86.0 80.0,94.0\" fill=\"#000\"/><polygon points=\"91.0,90.0 80.0,86.0 80.0,94.0\" fill=\"none\"/><text x=\"80\" y=\"125\" fill=\"#000\" stroke=\"none\" font-size=\"11\" text-anchor=\"middle\">나침반<\/text><text x=\"130\" y=\"60\" fill=\"#000\" stroke=\"none\" font-size=\"14\">X<\/text><text x=\"318\" y=\"60\" fill=\"#000\" stroke=\"none\" font-size=\"14\">Y<\/text><line x1=\"150\" y1=\"120\" x2=\"150\" y2=\"165\"/><line x1=\"150\" y1=\"165\" x2=\"225\" y2=\"165\"/><line x1=\"310\" y1=\"120\" x2=\"310\" y2=\"165\"/><line x1=\"310\" y1=\"165\" x2=\"235\" y2=\"165\"/><line x1=\"225\" y1=\"151\" x2=\"225\" y2=\"179\" stroke-width=\"2\"/><line x1=\"235\" y1=\"158\" x2=\"235\" y2=\"172\" stroke-width=\"3\"/><text x=\"211\" y=\"149\" fill=\"#000\" stroke=\"none\" font-size=\"14\">+<\/text><text x=\"241\" y=\"149\" fill=\"#000\" stroke=\"none\" font-size=\"14\">−<\/text><text x=\"230\" y=\"195\" fill=\"#000\" stroke=\"none\" font-size=\"11\" text-anchor=\"middle\">전지<\/text><\/svg>", "answer": "(1) N극 (2) 전지의 (+)극과 (−)극을 바꾸어 연결하여 코일에 흐르는 전류의 방향을 반대로 한다.", "scoring": "(1) 2점: N극. (2) 3점: 코일에 흐르는 전류의 방향을 반대로 하는 방법을 서술(전지의 (+)극과 (−)극을 바꾸어 연결하기, 코일을 감는 방향을 반대로 바꾸기 등 모두 인정). 전류의 세기를 세게 하거나 감은 수를 늘린다고 쓰면 0점(극은 바뀌지 않음).", "explanation": "나침반 N극이 코일에서 밀려나는 방향을 가리키므로 코일의 왼쪽 끝 X는 N극이다(같은 극끼리 밀어 냄). 코일의 극을 바꾸려면 전류의 방향을 바꾸어야 한다. 전류 세기나 감은 수는 자기장의 세기만 바꾼다."}, {"id": "전기와자기:F-010", "sub": "F", "type_id": "F03", "review_group": "RG21", "role": "reserve", "difficulty": "중", "format": "합답형", "stem": "그림과 같이 코일에 전류가 흐르고 있다. 코일 앞면(그림을 보는 쪽) 도선 위의 화살표는 그 도선에 흐르는 전류의 방향이다. 이에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은? (단, 지구 자기장의 영향은 무시한다.)", "bogi": ["ㄱ. 코일 내부의 자기장 방향은 왼쪽이다.", "ㄴ. 코일 바깥의 자기장은 코일의 왼쪽 끝에서 나와 오른쪽 끝으로 들어간다.", "ㄷ. 코일 위쪽 옆면 바깥에 나침반을 놓으면 바늘 N극은 왼쪽을 가리킨다."], "figure_svg": "<svg style=\"background:#fff\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 420 200\" fill=\"none\" stroke=\"#000\" stroke-width=\"1.5\" font-size=\"13\" font-family=\"sans-serif\"><path d=\"M130.0,50 A9,30 0 0,0 130.0,110\" stroke-dasharray=\"3 3\" stroke-width=\"1\"/><path d=\"M130.0,50 A9,30 0 0,1 130.0,110\"/><polygon points=\"139.0,73 135.0,82 143.0,82\" fill=\"#000\" stroke=\"none\"/><path d=\"M162.0,50 A9,30 0 0,0 162.0,110\" stroke-dasharray=\"3 3\" stroke-width=\"1\"/><path d=\"M162.0,50 A9,30 0 0,1 162.0,110\"/><polygon points=\"171.0,73 167.0,82 175.0,82\" fill=\"#000\" stroke=\"none\"/><path d=\"M194.0,50 A9,30 0 0,0 194.0,110\" stroke-dasharray=\"3 3\" stroke-width=\"1\"/><path d=\"M194.0,50 A9,30 0 0,1 194.0,110\"/><polygon points=\"203.0,73 199.0,82 207.0,82\" fill=\"#000\" stroke=\"none\"/><path d=\"M226.0,50 A9,30 0 0,0 226.0,110\" stroke-dasharray=\"3 3\" stroke-width=\"1\"/><path d=\"M226.0,50 A9,30 0 0,1 226.0,110\"/><polygon points=\"235.0,73 231.0,82 239.0,82\" fill=\"#000\" stroke=\"none\"/><path d=\"M258.0,50 A9,30 0 0,0 258.0,110\" stroke-dasharray=\"3 3\" stroke-width=\"1\"/><path d=\"M258.0,50 A9,30 0 0,1 258.0,110\"/><polygon points=\"267.0,73 263.0,82 271.0,82\" fill=\"#000\" stroke=\"none\"/><path d=\"M290.0,50 A9,30 0 0,0 290.0,110\" stroke-dasharray=\"3 3\" stroke-width=\"1\"/><path d=\"M290.0,50 A9,30 0 0,1 290.0,110\"/><polygon points=\"299.0,73 295.0,82 303.0,82\" fill=\"#000\" stroke=\"none\"/><text x=\"105\" y=\"85\" fill=\"#000\" stroke=\"none\" font-size=\"15\">A<\/text><text x=\"305\" y=\"85\" fill=\"#000\" stroke=\"none\" font-size=\"15\">B<\/text><line x1=\"130\" y1=\"110\" x2=\"130\" y2=\"160\"/><line x1=\"130\" y1=\"160\" x2=\"205\" y2=\"160\"/><line x1=\"290\" y1=\"110\" x2=\"290\" y2=\"160\"/><line x1=\"290\" y1=\"160\" x2=\"215\" y2=\"160\"/><line x1=\"205\" y1=\"146\" x2=\"205\" y2=\"174\" stroke-width=\"2\"/><line x1=\"215\" y1=\"153\" x2=\"215\" y2=\"167\" stroke-width=\"3\"/><text x=\"191\" y=\"144\" fill=\"#000\" stroke=\"none\" font-size=\"14\">+<\/text><text x=\"221\" y=\"144\" fill=\"#000\" stroke=\"none\" font-size=\"14\">−<\/text><\/svg>", "choices": ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "answer": [3], "explanation": "앞면 전류가 위쪽이므로 오른손으로 감아쥐면 엄지가 왼쪽을 가리켜 내부 자기장은 왼쪽이고, 왼쪽 끝 A가 N극이다. 바깥 자기장은 N극(A)에서 나와 S극(B)으로 들어간다. 옆면 바깥의 자기장은 내부와 반대인 오른쪽이므로 ㄷ은 틀리다.", "stimulus_group": "SG-E08"}, {"id": "전기와자기:F-011", "sub": "F", "type_id": "F08", "review_group": "RG21", "role": "reserve", "difficulty": "중", "format": "5지선다", "stem": "그림은 종이면에 수직으로 세운 직선 도선에 종이면에서 나오는 방향으로 전류가 흐를 때, 도선의 위쪽(A), 오른쪽(B), 아래쪽(C)에 나침반을 놓은 것을 위에서 내려다본 모습이다. A, B, C에 놓은 나침반 바늘 N극이 가리키는 방향을 옳게 짝지은 것은? (단, 지구 자기장의 영향은 무시한다.)", "figure_svg": "<svg style=\"background:#fff\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 240\" fill=\"none\" stroke=\"#000\" stroke-width=\"1.5\" font-size=\"13\" font-family=\"sans-serif\"><circle cx=\"180\" cy=\"120\" r=\"11\"/><circle cx=\"180\" cy=\"120\" r=\"2.5\" fill=\"#000\" stroke=\"none\"/><text x=\"200\" y=\"135\" fill=\"#000\" stroke=\"none\" font-size=\"11\">도선<\/text><circle cx=\"180\" cy=\"50\" r=\"13\"/><text x=\"206\" y=\"55\" fill=\"#000\" stroke=\"none\" font-size=\"13\" text-anchor=\"middle\">A<\/text><circle cx=\"260\" cy=\"120\" r=\"13\"/><text x=\"286\" y=\"125\" fill=\"#000\" stroke=\"none\" font-size=\"13\" text-anchor=\"middle\">B<\/text><circle cx=\"180\" cy=\"190\" r=\"13\"/><text x=\"206\" y=\"195\" fill=\"#000\" stroke=\"none\" font-size=\"13\" text-anchor=\"middle\">C<\/text><text x=\"180\" y=\"232\" fill=\"#000\" stroke=\"none\" font-size=\"11\" text-anchor=\"middle\">⊙ 전류가 종이면에서 나오는 방향<\/text><\/svg>", "choices": ["A: 왼쪽, B: 위쪽, C: 오른쪽", "A: 왼쪽, B: 위쪽, C: 왼쪽", "A: 오른쪽, B: 아래쪽, C: 왼쪽", "A: 위쪽, B: 오른쪽, C: 아래쪽", "A: 왼쪽, B: 아래쪽, C: 오른쪽"], "answer": [1], "explanation": "오른손 엄지를 전류 방향(종이면에서 나오는 방향)으로 하고 도선을 감아쥐면 네 손가락은 위에서 볼 때 시계 반대 방향으로 돈다. 따라서 도선 위쪽 A에서는 왼쪽, 오른쪽 B에서는 위쪽, 아래쪽 C에서는 오른쪽을 가리킨다. 도선을 사이에 둔 A와 C는 서로 반대 방향이다.", "textbook_tags": {"mode": "include_only", "books": ["오투"]}}, {"id": "전기와자기:F-012", "sub": "F", "type_id": "F05", "review_group": "RG22", "role": "main", "difficulty": "하", "format": "5지선다", "stem": "전류가 흐르는 코일 주위의 자기장을 더 세게 하는 방법으로 옳지 않은 것은?", "choices": ["코일에 흐르는 전류의 세기를 크게 한다.", "코일을 감은 수를 늘린다.", "코일 속에 철심을 넣는다.", "전원 장치의 (+)극과 (−)극을 바꾸어 연결한다.", "전압이 더 큰 전원 장치에 연결한다."], "answer": [4], "explanation": "코일의 자기장은 전류가 셀수록, 감은 수가 많을수록, 철심을 넣을수록 세진다. 전압이 크면 전류가 세지므로 ⑤도 자기장을 세게 한다. 전원의 극을 바꾸어 연결하면 전류의 방향이 바뀌어 자기장의 방향(코일의 극)만 반대로 바뀌고 세기는 그대로이다."}, {"id": "전기와자기:F-013", "sub": "F", "type_id": "F05", "review_group": "RG22", "role": "main", "difficulty": "중", "format": "합답형", "stem": "그림과 같이 코일, 전지, 니크롬선을 연결하고 코일 옆에 나침반을 놓았다. 집게를 니크롬선의 a 지점에 연결했다가 b 지점으로 옮겨 연결하였다. 집게를 b로 옮겼을 때에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은? (단, a에서 b로 옮기면 회로에 연결된 니크롬선의 길이가 길어지고, 지구 자기장의 영향은 무시한다.)", "bogi": ["ㄱ. 회로에 흐르는 전류가 약해져 나침반 바늘이 처음보다 적게 돌아간다.", "ㄴ. 코일의 극이 바뀌어 나침반 바늘이 처음과 반대쪽으로 돌아간다.", "ㄷ. 회로 전체의 저항이 커지므로 코일의 자기장이 더 세진다."], "figure_svg": "<svg style=\"background:#fff\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 480 210\" fill=\"none\" stroke=\"#000\" stroke-width=\"1.5\" font-size=\"13\" font-family=\"sans-serif\"><path d=\"M70.0,40 A9,30 0 0,0 70.0,100\" stroke-dasharray=\"3 3\" stroke-width=\"1\"/><path d=\"M70.0,40 A9,30 0 0,1 70.0,100\"/><path d=\"M98.0,40 A9,30 0 0,0 98.0,100\" stroke-dasharray=\"3 3\" stroke-width=\"1\"/><path d=\"M98.0,40 A9,30 0 0,1 98.0,100\"/><path d=\"M126.0,40 A9,30 0 0,0 126.0,100\" stroke-dasharray=\"3 3\" stroke-width=\"1\"/><path d=\"M126.0,40 A9,30 0 0,1 126.0,100\"/><path d=\"M154.0,40 A9,30 0 0,0 154.0,100\" stroke-dasharray=\"3 3\" stroke-width=\"1\"/><path d=\"M154.0,40 A9,30 0 0,1 154.0,100\"/><path d=\"M182.0,40 A9,30 0 0,0 182.0,100\" stroke-dasharray=\"3 3\" stroke-width=\"1\"/><path d=\"M182.0,40 A9,30 0 0,1 182.0,100\"/><path d=\"M210.0,40 A9,30 0 0,0 210.0,100\" stroke-dasharray=\"3 3\" stroke-width=\"1\"/><path d=\"M210.0,40 A9,30 0 0,1 210.0,100\"/><circle cx=\"290\" cy=\"70\" r=\"13\"/><text x=\"290\" y=\"105\" fill=\"#000\" stroke=\"none\" font-size=\"11\" text-anchor=\"middle\">나침반<\/text><line x1=\"70\" y1=\"100\" x2=\"70\" y2=\"170\"/><line x1=\"70\" y1=\"170\" x2=\"120\" y2=\"170\"/><line x1=\"120\" y1=\"156\" x2=\"120\" y2=\"184\" stroke-width=\"2\"/><line x1=\"130\" y1=\"163\" x2=\"130\" y2=\"177\" stroke-width=\"3\"/><text x=\"106\" y=\"154\" fill=\"#000\" stroke=\"none\" font-size=\"14\">+<\/text><text x=\"136\" y=\"154\" fill=\"#000\" stroke=\"none\" font-size=\"14\">−<\/text><line x1=\"130\" y1=\"170\" x2=\"170\" y2=\"170\"/><polyline points=\"170,170 180,160 190,180 200,160 210,180 220,160 230,180 240,160 250,180 260,160 270,180 280,160 290,180 300,170 330,170\"/><text x=\"300\" y=\"200\" fill=\"#000\" stroke=\"none\" font-size=\"11\" text-anchor=\"middle\">니크롬선<\/text><circle cx=\"200\" cy=\"160\" r=\"3.5\" fill=\"#000\" stroke=\"none\"/><text x=\"186\" y=\"156\" fill=\"#000\" stroke=\"none\" font-size=\"13\">a<\/text><circle cx=\"300\" cy=\"170\" r=\"3.5\" fill=\"#000\" stroke=\"none\"/><text x=\"304\" y=\"162\" fill=\"#000\" stroke=\"none\" font-size=\"13\">b<\/text><polyline points=\"210,100 210,138 200,138 200,157\"/><text x=\"216\" y=\"146\" fill=\"#000\" stroke=\"none\" font-size=\"11\">집게<\/text><\/svg>", "choices": ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "answer": [1], "explanation": "연결된 니크롬선이 길어지면 저항이 커져 전류가 약해진다. 전류가 약해지면 코일의 자기장도 약해져 나침반 바늘이 적게 돌아간다(ㄱ). 전류의 방향은 그대로이므로 코일의 극과 바늘이 도는 쪽은 바뀌지 않는다(ㄴ). 저항이 커지면 전류가 약해져 자기장은 약해진다(ㄷ)."}, {"id": "전기와자기:F-014", "sub": "F", "type_id": "F06", "review_group": "RG22", "role": "main", "difficulty": "중", "format": "5지선다", "stem": "전자석의 특징과 이용에 대한 설명으로 옳은 것은?", "choices": ["전류를 끊어도 자석의 성질이 그대로 남아 있다.", "코일의 전류 방향을 바꾸면 전자석에 붙어 있던 쇠 클립이 밀려난다.", "자기 부상 열차와 MRI는 자기장 속에서 코일이 받는 힘으로 전동기를 돌리는 장치이다.", "전류의 세기를 조절하여 자석의 세기를 바꿀 수 있어, 무거운 고철을 들었다 놓는 기중기에 이용된다.", "코일 속의 철심을 빼면 전자석의 세기가 더 세진다."], "answer": [4], "explanation": "① 전자석은 전류가 흐를 때만 자석이 된다. ② 쇠 클립은 자석이 아니므로 전자석의 극이 바뀌어도 계속 끌려온다. ③ 자기 부상 열차와 MRI는 전자석을 이용한다. ④ 옳다. 전류를 흘리면 고철을 붙이고 전류를 끊으면 놓을 수 있다. ⑤ 철심을 넣으면 자기장이 세지므로 빼면 약해진다."}, {"id": "전기와자기:F-015", "sub": "F", "type_id": "F05", "review_group": "RG22", "role": "reserve", "difficulty": "중", "format": "서술형", "stem": "코일, 전원 장치, 스위치를 연결하고 코일 옆에 나침반을 놓은 뒤 스위치를 닫았더니 나침반 바늘이 조금 돌아갔다. 코일과 나침반의 위치를 바꾸지 않고<br>(1) 나침반 바늘이 처음과 같은 쪽으로 더 많이 돌아가게 하는 방법을 두 가지 서술하시오.<br>(2) 나침반 바늘이 처음과 반대쪽으로 돌아가게 하는 방법을 한 가지 서술하시오.", "answer": "(1) 전류의 세기를 크게 한다(전원 장치의 전압을 높인다), 코일을 감은 수를 늘린다, 코일 속에 철심을 넣는다 중 두 가지. (2) 전원 장치의 (+)극과 (−)극을 바꾸어 연결하여 코일에 흐르는 전류의 방향을 반대로 한다.", "scoring": "(1) 각 2점(서로 다른 방법 두 가지). \"저항이 큰 니크롬선을 연결한다\"는 0점. (2) 2점: 전류의 방향을 반대로 한다. \"전류를 세게 한다\", \"감은 수를 늘린다\"를 (2)에 쓰면 0점.", "explanation": "코일 자기장의 세기는 전류 세기·감은 수·철심으로 커지고, 방향은 전류의 방향을 바꿀 때만 바뀐다."}, {"id": "전기와자기:F-016", "sub": "F", "type_id": "F06", "review_group": "RG22", "role": "reserve", "difficulty": "하", "format": "합답형", "stem": "다음 중 전자석을 이용하는 것만을 <보기>에서 있는 대로 고른 것은?", "bogi": ["ㄱ. 전기난로", "ㄴ. 자기 부상 열차", "ㄷ. 고철을 들어 옮기는 전자석 기중기"], "choices": ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "answer": [4], "explanation": "ㄱ. 전기난로는 전류가 흐를 때 니크롬선 등에서 발생하는 열을 이용하는 기구로, 전자석을 이용하지 않는다. ㄴ. 옳다. 자기 부상 열차는 전자석의 자기력으로 차체를 띄워 움직인다. ㄷ. 옳다. 전자석 기중기는 전류가 흐를 때만 자석이 되는 전자석으로 고철을 들었다 놓는다."}, {"id": "전기와자기:F-017", "sub": "F", "type_id": "F07", "review_group": "RG23", "role": "main", "difficulty": "중", "format": "5지선다", "stem": "그림과 같이 코일에 전류를 흘리고, 코일의 오른쪽에 막대자석을 실은 수레를 N극이 코일 쪽을 향하도록 놓았다. 코일 앞면(그림을 보는 쪽) 도선 위의 화살표는 그 도선에 흐르는 전류의 방향이다. 수레가 움직이는 방향과 이때 작용하는 힘의 종류를 옳게 짝지은 것은? (단, 수레와 바닥 사이의 마찰은 무시한다.)", "figure_svg": "<svg style=\"background:#fff\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 500 200\" fill=\"none\" stroke=\"#000\" stroke-width=\"1.5\" font-size=\"13\" font-family=\"sans-serif\"><path d=\"M80.0,50 A9,30 0 0,0 80.0,110\" stroke-dasharray=\"3 3\" stroke-width=\"1\"/><path d=\"M80.0,50 A9,30 0 0,1 80.0,110\"/><polygon points=\"89.0,73 85.0,82 93.0,82\" fill=\"#000\" stroke=\"none\"/><path d=\"M108.0,50 A9,30 0 0,0 108.0,110\" stroke-dasharray=\"3 3\" stroke-width=\"1\"/><path d=\"M108.0,50 A9,30 0 0,1 108.0,110\"/><polygon points=\"117.0,73 113.0,82 121.0,82\" fill=\"#000\" stroke=\"none\"/><path d=\"M136.0,50 A9,30 0 0,0 136.0,110\" stroke-dasharray=\"3 3\" stroke-width=\"1\"/><path d=\"M136.0,50 A9,30 0 0,1 136.0,110\"/><polygon points=\"145.0,73 141.0,82 149.0,82\" fill=\"#000\" stroke=\"none\"/><path d=\"M164.0,50 A9,30 0 0,0 164.0,110\" stroke-dasharray=\"3 3\" stroke-width=\"1\"/><path d=\"M164.0,50 A9,30 0 0,1 164.0,110\"/><polygon points=\"173.0,73 169.0,82 177.0,82\" fill=\"#000\" stroke=\"none\"/><path d=\"M192.0,50 A9,30 0 0,0 192.0,110\" stroke-dasharray=\"3 3\" stroke-width=\"1\"/><path d=\"M192.0,50 A9,30 0 0,1 192.0,110\"/><polygon points=\"201.0,73 197.0,82 205.0,82\" fill=\"#000\" stroke=\"none\"/><path d=\"M220.0,50 A9,30 0 0,0 220.0,110\" stroke-dasharray=\"3 3\" stroke-width=\"1\"/><path d=\"M220.0,50 A9,30 0 0,1 220.0,110\"/><polygon points=\"229.0,73 225.0,82 233.0,82\" fill=\"#000\" stroke=\"none\"/><text x=\"58\" y=\"85\" fill=\"#000\" stroke=\"none\" font-size=\"14\">A<\/text><text x=\"232\" y=\"85\" fill=\"#000\" stroke=\"none\" font-size=\"14\">B<\/text><rect x=\"280.0\" y=\"65\" width=\"70.0\" height=\"30\" fill=\"#000\" fill-opacity=\"0.35\"/><text x=\"315.0\" y=\"85.0\" fill=\"#000\" stroke=\"none\" font-size=\"15\" text-anchor=\"middle\">N<\/text><rect x=\"350.0\" y=\"65\" width=\"70.0\" height=\"30\" fill=\"#000\" fill-opacity=\"0.08\"/><text x=\"385.0\" y=\"85.0\" fill=\"#000\" stroke=\"none\" font-size=\"15\" text-anchor=\"middle\">S<\/text><circle cx=\"310\" cy=\"108\" r=\"8\"/><circle cx=\"390\" cy=\"108\" r=\"8\"/><text x=\"350\" y=\"135\" fill=\"#000\" stroke=\"none\" font-size=\"11\" text-anchor=\"middle\">수레<\/text><line x1=\"80\" y1=\"110\" x2=\"80\" y2=\"165\"/><line x1=\"80\" y1=\"165\" x2=\"145\" y2=\"165\"/><line x1=\"220\" y1=\"110\" x2=\"220\" y2=\"165\"/><line x1=\"220\" y1=\"165\" x2=\"155\" y2=\"165\"/><line x1=\"145\" y1=\"151\" x2=\"145\" y2=\"179\" stroke-width=\"2\"/><line x1=\"155\" y1=\"158\" x2=\"155\" y2=\"172\" stroke-width=\"3\"/><text x=\"131\" y=\"149\" fill=\"#000\" stroke=\"none\" font-size=\"14\">+<\/text><text x=\"161\" y=\"149\" fill=\"#000\" stroke=\"none\" font-size=\"14\">−<\/text><\/svg>", "choices": ["코일에서 멀어지는 쪽, 자기력", "코일 쪽, 전기력", "코일에서 멀어지는 쪽, 전기력", "움직이지 않는다.", "코일 쪽, 자기력"], "answer": [5], "explanation": "앞면 전류가 위쪽이므로 오른손으로 감아쥐면 엄지가 왼쪽을 가리켜 코일의 왼쪽 끝 A가 N극, 오른쪽 끝 B가 S극이다. 코일의 S극(B)과 자석의 N극이 마주 보므로 서로 끌어당겨 수레는 코일 쪽으로 움직인다. 이 힘은 자석과 전자석 사이의 자기력이다.", "stimulus_group": "SG-E09"}, {"id": "전기와자기:F-018", "sub": "F", "type_id": "F07", "review_group": "RG23", "role": "main", "difficulty": "상", "format": "합답형", "stem": "그림 (가), (나)는 전류가 흐르는 두 코일 X(왼쪽), Y(오른쪽)를 축이 일치하도록 마주 놓은 것이다 _id": "G08", "review_group": "RG23", "role": "reserve", "difficulty": "하", "format": "5지선다", "stem": "전류가 흐르는 코일을 자석 사이에 놓으면 코일이 힘을 받는다. 그 까닭으로 옳은 것은?", "choices": ["코일에 흐르는 전류가 만든 자기장과 자석의 자기장이 서로 작용하기 때문이다.", "코일과 자석 사이에 전기력이 작용하기 때문이다.", "코일에 전류가 흐르기만 하면 자석이 없어도 스스로 힘을 받기 때문이다.", "자석이 코일에 전자를 공급하기 때문이다.", "코일의 저항이 클수록 자석이 코일을 세게 끌어당기기 때문이다."], "answer": [1], "explanation": "전류가 흐르는 코일 주위에는 자기장이 생기고, 이 자기장과 자석의 자기장이 서로 작용하여 코일이 힘(자기력)을 받는다."}, {"id": "전기와자기:G-003", "sub": "G", "type_id": "G01", "review_group": "RG24", "role": "main", "difficulty": "하", "format": "5지선다", "stem": "그림은 두 자석의 N극과 S극 사이에 종이면에 수직으로 놓인 도선에 종이면으로 들어가는 방향으로 전류가 흐르는 모습을 나타낸 것이다. 도선이 받는 힘의 방향으로 옳은 것은?", "figure_svg": "<svg style=\"background:#fff\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 420 180\" fill=\"none\" stroke=\"#000\" stroke-width=\"1.5\" font-size=\"13\" font-family=\"sans-serif\"><rect x=\"40\" y=\"40\" width=\"90\" height=\"100\" fill=\"#000\" fill-opacity=\"0.35\"/><text x=\"85.0\" y=\"95.0\" fill=\"#000\" stroke=\"none\" font-size=\"16\" text-anchor=\"middle\">N<\/text><rect x=\"290\" y=\"40\" width=\"90\" height=\"100\" fill=\"#000\" fill-opacity=\"0.08\"/><text x=\"335.0\" y=\"95.0\" fill=\"#000\" stroke=\"none\" font-size=\"16\" text-anchor=\"middle\">S<\/text><circle cx=\"210\" cy=\"90\" r=\"12\"/><line x1=\"202.2\" y1=\"82.2\" x2=\"217.8\" y2=\"97.8\"/><line x1=\"202.2\" y1=\"97.8\" x2=\"217.8\" y2=\"82.2\"/><text x=\"210\" y=\"125\" fill=\"#000\" stroke=\"none\" font-size=\"11\" text-anchor=\"middle\">도선<\/text><text x=\"210\" y=\"170\" fill=\"#000\" stroke=\"none\" font-size=\"11\" text-anchor=\"middle\">⊗ 전류가 종이면으로 들어가는 방향<\/text><\/svg>", "choices": ["위쪽", "아래쪽", "오른쪽", "왼쪽", "종이면에서 나오는 방향"], "answer": [2], "explanation": "자석 사이 자기장은 N극에서 S극 방향인 오른쪽이다. 오른손 네 손가락을 자기장 방향(오른쪽), 엄지를 전류 방향(종이면으로 들어가는 방향)으로 향하게 하면 손바닥은 아래쪽을 향한다. 따라서 도선은 아래쪽으로 힘을 받는다.", "textbook_tags": {"mode": "include_only", "books": ["오투", "체크체크", "지학사", "비상", "천재임", "천재정"]}}, {"id": "전기와자기:G- 2=\"170\" stroke-width=\"2.5\"/><polygon points=\"315.0,170.0 322.8,165.5 322.8,174.5\" fill=\"#000\" stroke=\"none\"/><text x=\"388\" y=\"175\" fill=\"#000\" stroke=\"none\" font-size=\"14\">c<\/text><text x=\"220\" y=\"226\" fill=\"#000\" stroke=\"none\" font-size=\"11\" text-anchor=\"middle\">× : 종이면으로 들어가는 방향의 자기장<\/text><\/svg>", "choices": ["a: 위쪽, b: 왼쪽, c: 아래쪽", "a: 아래쪽, b: 오른쪽, c: 위쪽", "a: 위쪽, b: 오른쪽, c: 아래쪽", "a: 오른쪽, b: 위쪽, c: 왼쪽", "a, b, c 모두 종이면으로 들어가는 방향"], "answer": [1], "explanation": "네 손가락을 종이면으로 들어가는 방향(자기장), 엄지를 각 도선의 전류 방향으로 향하게 한다. a(전류 오른쪽): 손바닥은 위쪽. b(전류 위쪽): 손바닥은 왼쪽. c(전류 왼쪽): 손바닥은 아래쪽. 전류 방향이 반대인 a와 c는 서로 반대 방향의 힘을 받는다.", "textbook_tags": {"mode": "include_only", "books": ["오투", "체크체크", "지학사", "비상", "천재임", "천재정"]}}, {"id": "전기와자기:G-006", "sub": "G", "type_id": "G03", "review_group": "RG24", "role": "main", "difficulty": "중", "format": "5지선다", "stem": "그림과 같이 오른쪽 방향의 균일한 자기장 속에 길이가 같은 도선을 (가) 자기장에 수직으로, (나) 비스듬히, (다) 자기장과 나란하게 놓고 같은 세기의 전류를 흘렸다. 도선이 받는 힘의 크기를 옳게 비교한 것은?", "figure_svg": "<svg style=\"background:#fff\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 480 200\" fill=\"none\" stroke=\"#000\" stroke-width=\"1.5\" font-size=\"13\" font-family=\"sans-serif\"><line x1=\"30\" y1=\"30\" x2=\"450\" y2=\"30\" stroke-width=\"1\"/><polygon points=\"450.0,30.0 443.1,34.0 443.1,26.0\" fill=\"#000\" stroke=\"none\"/><line x1=\"30\" y1=\"180\" x2=\"450\" y2=\"180\" stroke-width=\"1\"/><polygon points=\"450.0,180.0 443.1,184.0 443.1,176.0\" fill=\"#000\" stroke=\"none\"/><text x=\"240\" y=\"22\" fill=\"#000\" stroke=\"none\" font-size=\"11\" text-anchor=\"middle\">자기장<\/text><text x=\"70\" y=\"60\" fill=\"#000\" stroke=\"none\">(가)<\/text><line x1=\"100\" y1=\"160\" x2=\"100\" y2=\"60\" stroke-width=\"2.5\"/><line x1=\"100\" y1=\"125\" x2=\"100\" y2=\"95\" stroke-width=\"2.5\"/><polygon points=\"100.0,95.0 104.0,101.9 96.0,101.9\" fill=\"#000\" stroke=\"none\"/><text x=\"200\" y=\"60\" fill=\"#000\" stroke=\"none\">(나)<\/text><line x1=\"215\" y1=\"160\" x2=\"285\" y2=\"70\" stroke-width=\"2.5\"/><line x1=\"243\" y1=\"124\" x2=\"262\" y2=\"100\" stroke-width=\"2.5\"/><polygon points=\"262.0,100.0 260.8,107.9 254.6,102.9\" fill=\"#000\" stroke=\"none\"/><text x=\"340\" y=\"60\" fill=\"#000\" stroke=\"none\">(다)<\/text><line x1=\"330\" y1=\"120\" x2=\"430\" y2=\"120\" stroke-width=\"2.5\"/><line x1=\"365\" y1=\"120\" x2=\"395\" y2=\"120\" stroke-width=\"2.5\"/><polygon points=\"395.0,120.0 388.1,124.0 388.1,116.0\" fill=\"#000\" stroke=\"none\"/><\/svg>", "choices": ["(다) > (나) > (가)", "(가) = (나) = (다)", "(가) > (나) = (다)", "(나) > (가) > (다)", "(가) > (나) > (다)"], "answer": [5], "explanation": "도선이 받는 힘은 전류와 자기장이 수직일 때 가장 크고, 기울어질수록 작아지며, 나란하면 힘을 받지 않는다. 따라서 (가) > (나) > (다)이고, (다)는 힘을 받지 않는다.", "textbook_tags": {"mode": "include_only", "books": ["체크체크", "천재정"]}}, {"id": "전기와자기:G-007", "sub": "G", "type_id": "G01", "review_group": "RG24", "role": "reserve", "difficulty": "상", "format": "서술형", "stem": "그림과 같이 위쪽 N극과 아래쪽 S극 사이에 종이면에 수직으로 놓인 도선에 종이면으로 들어가는 방향(⊗)으로 전류가 흐른다. 도선이 받는 힘의 방향을 쓰고, 오른손을 이용하여 방향을 찾는 과정을 서술하시오.", "figure_svg": "<svg style=\"background:#fff\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 220\" fill=\"none\" stroke=\"#000\" stroke-width=\"1.5\" font-size=\"13\" font-family=\"sans-serif\"><rect x=\"130\" y=\"10\" width=\"100\" height=\"50\" fill=\"#000\" fill-opacity=\"0.35\"/><text x=\"180.0\" y=\"40.0\" fill=\"#000\" stroke=\"none\" font-size=\"16\" text-anchor=\"middle\">N<\/text><rect x=\"130\" y=\"160\" width=\"100\" height=\"50\" fill=\"#000\" fill-opacity=\"0.08\"/><text x=\"180.0\" y=\"190.0\" fill=\"#000\" stroke=\"none\" font-size=\"16\" text-anchor=\"middle\">S<\/text><circle cx=\"180\" cy=\"110\" r=\"12\"/><line x1=\"172.2\" y1=\"102.2\" x2=\"187.8\" y2=\"117.8\"/><line x1=\"172.2\" y1=\"117.8\" x2=\"187.8\" y2=\"102.2\"/><text x=\"215\" y=\"115\" fill=\"#000\" stroke=\"none\" font-size=\"11\">도선<\/text><\/svg>", "answer": "왼쪽. 오른손 네 손가락을 자기장 방향인 아래쪽(N극→S극)으로, 엄지를 전류 방향인 종이면으로 들어가는 방향으로 향하게 하면 손바닥이 왼쪽을 향하므로 도선은 왼쪽으로 힘을 받는다.", "scoring": "상(3점): 왼쪽을 쓰고 네 손가락=자기장(아래쪽), 엄지=전류, 손바닥=힘의 대응을 모두 서술. 중(2점): 방향은 맞으나 손가락 대응 중 하나가 빠짐. 하(1점): 방향만 맞음. 자기장을 위쪽(S→N)으로 잡거나 엄지를 자기장에 맞추면 과정 점수 없음.", "explanation": "자석 사이 자기장은 N극에서 S극으로 아래쪽이다. F = I × B 관계(오른손 손바닥 규칙)에 따라 힘은 왼쪽이다.", "textbook_tags": {"mode": "include_only", "books": ["오투", "체크체크", "지학사", "비상", "천재임", "천재정"]}}, {"id": "전기와자기:G-008", "sub": "G", "type_id": "G03", "review_group": "RG24", "role": "reserve", "difficulty": "하", "format": "5지선다", "stem": "자기장 속에 놓인 도선에 전류가 흐를 때 도선이 받는 힘에 대한 설명으로 옳은 것은?", "choices": ["도선이 자기장과 나란할 때 가장 큰 힘을 받는다.", "도선이 자기장에 수직일 때 가장 큰 힘을 받고, 자기장과 나란하면 힘을 받지 않는다.", "힘의 방향은 전류의 세기에 따라 정해진다.", "도선에 흐르는 전류가 셀수록 도선이 받는 힘의 크기가 작아진다.", "도선의 길이가 같으면 전류의 세기와 관계없이 힘의 크기가 같다."], "answer": [2], "explanation": "① 나란하면 힘을 받지 않는다. ② 옳다. ③ 힘의 방향은 전류의 방향과 자기장의 방향이 정한다. ④ 전류가 셀수록 힘이 크다. ⑤ 도선의 길이가 같아도 전류가 셀수록 힘이 크다.", "textbook_tags": {"mode": "include_only", "books": ["체크체크", "천재정"]}}, {"id": "전기와자기:G-009", "sub": "G", "type_id": "G02", "review_group": "RG25", "role": "main", "difficulty": "하", "format": "5지선다", "stem": "자석 사이에 놓인 도선에 전류를 흘렸더니 도선이 왼쪽으로 힘을 받았다. 다른 조건은 그대로 두고 한 가지만 바꾸었을 때, 도선이 오른쪽으로 힘을 받는 경우는?", "choices": ["전류의 세기를 2배로 한다.", "자석의 N극과 S극의 위치를 서로 바꾼다.", "전류의 방향과 자석의 극을 모두 반대로 바꾼다.", "더 센 자석으로 바꾼다.", "니크롬선을 더 길게 연결하여 전류를 약하게 한다."], "answer": [2], "explanation": "힘의 방향은 전류의 방향과 자기장의 방향에 따라 정해진다. 둘 중 하나만 바꾸면 힘의 방향이 반대가 되고, 둘 다 바꾸면 처음과 같다. 전류의 세기나 자석의 세기는 힘의 크기만 바꾼다."}, {"id": "전기와자기:G-010", "sub": "G", "type_id": "G04", "review_group": "RG25", "role": "main", "difficulty": "중", "format": "합답형", "stem": "그림과 같이 위쪽이 N극, 아래쪽이 S극인 말굽자석 사이에 도선 그네의 아랫부분을 넣고 전류를 흘렸더니, 그네의 아랫부분에서 전류가 왼쪽에서 오른쪽으로 흘렀다. 이에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?", "bogi": ["ㄱ. 그네는 종이면으로 들어가는 방향으로 움직인다.", "ㄴ. 전지의 연결 방향과 자석의 극을 모두 반대로 바꾸면 그네는 종이면에서 나오는 방향으로 움직인다.", "ㄷ. 전지를 하나 더 직렬로 연결하여 전류를 세게 하면 그네가 더 크게 움직인다."], "figure_svg": "<svg style=\"background:#fff\" xmlns=\"http://www.w3.org/2000/svg\" viewB "전기와자기:G-011", "sub": "G", "type_id": "G04", "review_group": "RG25", "role": "main", "difficulty": "상", "format": "5지선다", "stem": "그림은 수평으로 놓인 두 레일 위에 알루미늄 막대를 올려놓고, 막대 바로 아래에 N극이 위를 향하도록 자석을 세워 놓은 장치를 위에서 내려다본 것이다. 전원을 연결하였더니 막대에는 그림의 화살표 방향(위쪽 레일에서 아래쪽 레일 쪽)으로 전류가 흘렀다. 막대가 움직이는 방향과, 니크롬선을 더 길게 연결했을 때 막대가 움직이는 빠르기의 변화를 옳게 짝지은 것은? (단, 위에서 내려다볼 때 자석 위쪽의 자기장은 보는 사람 쪽(종이면에서 나오는 방향)을 향하고, 마찰은 무시한다.)", "figure_svg": "<svg style=\"background:#fff\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 480 250\" fill=\"none\" stroke=\"#000\" stroke-width=\"1.5\" font-size=\"13\" font-family=\"sans-serif\"><text x=\"10\" y=\"20\" fill=\"#000\" stroke=\"none\" font-size=\"11\">위에서 내려다본 모습<\/text><line x1=\"60\" y1=\"60\" x2=\"420\" y2=\"60\" stroke-width=\"3\"/><line x1=\"60\" y1=\"170\" x2=\"420\" y2=\"170\" stroke-width=\"3\"/><text x=\"425\" y=\"64\" fill=\"#000\" stroke=\"none\" font-size=\"11\">레일<\/text><line x1=\"260\" y1=\"50\" x2=\"260\" y2=\"180\" stroke-width=\"5\"/><text x=\"268\" y=\"44\" fill=\"#000\" stroke=\"none\" font-size=\"11\">알루미늄 막대<\/text><line x1=\"260\" y1=\"95\" x2=\"260\" y2=\"135\" stroke-width=\"2\"/><polygon points=\"260.0,135.0 255.5,127.2 264.5,127.2\" fill=\"#000\" stroke=\"none\"/><circle cx=\"260\" cy=\"115\" r=\"30\" stroke-dasharray=\"4 3\"/><text x=\"300\" y=\"125\" fill=\"#000\" stroke=\"none\" font-size=\"11\">막대 바로 아래 자석<\/text><polyline points=\"60,60 30,60 30,215 100,215\"/><line x1=\"100\" y1=\"201\" x2=\"100\" y2=\"229\" stroke-width=\"2\"/><line x1=\"110\" y1=\"208\" x2=\"110\" y2=\"222\" stroke-width=\"3\"/><text x=\"86\" y=\"199\" fill=\"#000\" stroke=\"none\" font-size=\"14\">+<\/text><text x=\"116\" y=\"199\" fill=\"#000\" stroke=\"none\" font-size=\"14\">−<\/text><line x1=\"110\" y1=\"215\" x2=\"140\" y2=\"215\"/><polyline points=\"140,215 150,205 160,225 170,205 180,225 190,205 200,225 210,215 230,215\"/><text x=\"185\" y=\"242\" fill=\"#000\" stroke=\"none\" font-size=\"11\" text-anchor=\"middle\">니크롬선<\/text><polyline points=\"230,215 230,190 120,190 120,170\"/><\/svg>", "choices": ["왼쪽, 느려진다", "오른쪽, 느려진다", "왼쪽, 빨라진다", "오른쪽, 빨라진다", "움직이지 않는다, 변화 없다"], "answer": [1], "explanation": "자기장은 종이면에서 나오는 방향, 막대의 전류는 그림의 아래쪽 방향이다. 오른손 네 손가락을 보는 사람 쪽, 엄지를 그림의 아래쪽으로 향하게 하면 손바닥은 왼쪽을 향하므로 막대는 왼쪽으로 움직인다. 니크롬선을 길게 연결하면 저항이 커져 전류가 약해지므로 힘이 작아져 막대는 느리게 움직인다.", "textbook_tags": {"mode": "include_only", "books": ["오투", "체크체크", "지학사", "천재임", "천재정"]}}, {"id": "전기와자기:G-012", "sub": "G", "type_id": "G02", "review_group": "RG25", "role": "reserve", "difficulty": "중", "format": "서술형", "stem": "자석 사이에 놓인 도선에 전류를 흘렸더니 도선이 위쪽으로 힘을 받았다.<br>(1) 도선이 아래쪽으로 힘을 받게 하는 방법을 두 가지 서술하시오.<br>(2) 힘의 방향은 그대로 두고 힘의 크기를 크게 하는 방법을 한 가지 서술하시오.", "answer": "(1) 전류의 방향을 반대로 바꾼다. 자석의 N극과 S극의 위치를 바꾸어 자기장의 방향을 반대로 바꾼다. (2) 전류의 세기를 크게 한다(또는 더 센 자석을 사용한다).", "scoring": "(1) 각 2점. \"전류 방향과 자석 극을 모두 바꾼다\"는 0점(힘의 방향이 처음과 같음). (2) 2점. \"저항을 크게 한다\", \"니크롬선을 길게 한다\"는 0점.", "explanation": "힘의 방향은 전류의 방향과 자기장의 방향 중 하나를 바꾸면 반대가 되고, 둘 다 바꾸면 그대로이다. 힘의 크기는 전류와 자기장이 셀수록 크다."}, {"id": "전기와자기:G-013", "sub": "G", "type_id": "G04", "review_group": "RG25", "role": "reserve", "difficulty": "중", "format": "5지선다", "stem": "그림과 같이 왼쪽 N극과 오른쪽 S극 사이에 알루미늄 포일을 세로로 늘어뜨리고, 포일에 위에서 아래로 전류를 흘렸다. 포일이 휘어지는 방향으로 옳은 것은?", "figure_svg": "<svg style=\"background:#fff\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 210\" fill=\"none\" stroke=\"#000\" stroke-width=\"1.5\" font-size=\"13\" font-family=\"sans-serif\"><rect x=\"30\" y=\"50\" width=\"90\" height=\"110\" fill=\"#000\" fill-opacity=\"0.35\"/><text x=\"75.0\" y=\"110.0\" fill=\"#000\" stroke=\"none\" font-size=\"16\" text-anchor=\"middle\">N<\/text><rect x=\"280\" y=\"50\" width=\"90\" height=\"110\" fill=\"#000\" fill-opacity=\"0.08\"/><text x=\"325.0\" y=\"110.0\" fill=\"#000\" stroke=\"none\" font-size=\"16\" text-anchor=\"middle\">S<\/text><rect x=\"194\" y=\"20\" width=\"12\" height=\"170\" fill=\"#000\" fill-opacity=\"0.12\"/><line x1=\"200\" y1=\"70\" x2=\"200\" y2=\"130\" stroke-width=\"2\"/><polygon points=\"200.0,130.0 195.5,122.2 204.5,122.2\" fill=\"#000\" stroke=\"none\"/><text x=\"215\" y=\"30\" fill=\"#000\" stroke=\"none\" font-size=\"11\">알루미늄 포일<\/text><text x=\"212\" y=\"105\" fill=\"#000\" stroke=\"none\" font-size=\"11\">전류<\/text><\/svg>", "choices": ["종이면에서 나오는 방향", "종이면으로 들어가는 방향", "왼쪽", "오른쪽", "아래쪽"], "answer": [1], "explanation": "자기장은 N극에서 S극으로 오른쪽, 전류는 아래쪽이다. 오른손 네 손가락을 오른쪽, 엄지를 아래쪽으로 향하게 하면 손바닥은 보는 사람 쪽(종이면에서 나오는 방향)을 향한다.", "textbook_tags": {"mode": "include_only", "books": ["오투", "체크체크", "지학사", "천재임", "천재정"]}}, {"id": "전기와자기:G-014", "sub": "G", "type_id": "G05", "review_group": "RG26", "role": "main", "difficulty": "하", "format": "5지선다", "stem": "그림은 왼쪽 N극과 오른쪽 S극 사이에 사각형 코일 ABCD를 자기장과 나란하게(수평으로) 놓고 A→B→C→D 방향으로 전류를 흘린 모습이다. A, D는 앞쪽, B, C는 뒤쪽이며, 코일은 AB와 나란한 회전축을 중심으로 돌 수 있다. 이때 AB는 아래쪽, CD는 위쪽으로 힘을 받는다. 이에 대한 설명으로 옳은 것은?", "figure_svg": "<svg style=\"background:#fff\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 520 245\" fill=\"none\" stroke=\"#000\" stroke-width=\"1.5\" font-size=\"13\" font-family=\"sans-serif\"><rect x=\"30\" y=\"70\" width=\"70\" height=\"140\" fill=\"#000\" fill-opacity=\"0.35\"/><text x=\"65.0\" y=\"145.0\" fill=\"#000\" stroke=\"none\" font-size=\"16\" text-anchor=\"middle\">N<\/text><rect x=\"420\" y=\"70\" width=\"70\" height=\"140\" fill=\"#000\" fill-opacity=\"0.08\"/><text x=\"455.0\" y=\"145.0\" fill=\"#000\" stroke=\"none\" font-size=\"16\" text-anchor=\"middle\">S<\/text><polygon points=\"175,175 215,105 345,105 305,175\" stroke-width=\"2\"/><line x1=\"225\" y1=\"205\" x2=\"295\" y2=\"75\" stroke-dasharray=\"5 4\" stroke-width=\"1\"/><text x=\"300\" y=\"72\" fill=\"#000\" stroke=\"none\" font-size=\"11\">회전축<\/text><text x=\"159\" y=\"191\" fill=\"#000\" stroke=\"none\" font-size=\"14\">A<\/text><text x=\"199\" y=\"99\" fill=\"#000\" stroke=\"none\" font-size=\"14\">B<\/text><text x=\"353\" y=\"99\" fill=\"#000\" stroke=\"none\" font-size=\"14\">C<\/text><text x=\"313\" y=\"191\" fill=\"#000\" stroke=\"none\" font-size=\"14\">D<\/text><line x1=\"190.03861061643167\" y1=\"148.6824314212446\" x2=\"199.96138938356833\" y2=\"131.3175685787554\" stroke-width=\"2\"/><polygon points=\"200.0,131.3 200.0,139.3 193.1,135.3\" fill=\"#000\" stroke=\"none\"/><line x1=\"270.0\" y1=\"105.0\" x2=\"290.0\" y2=\"105.0\" stroke-width=\"2\"/><polygon points=\"290.0,105.0 283.1,109.0 283.1,101.0\" fill=\"#000\" stroke=\"none\"/><line x1=\"329.96138938356836\" y1=\"131.3175685787554\" x2=\"320.03861061643164\" y2=\"148.6824314212446\" stroke-width=\"2\"/><polygon points=\"320.0,148.7 320.0,140.7 326.9,144.7\" fill=\"#000\" stroke=\"none\"/><line x1=\"250.0\" y1=\"175.0\" x2=\"230.0\" y2=\"175.0\" stroke-width=\"2\"/><polygon points=\"230.0,175.0 236.9,171.0 236.9,179.0\" fill=\"#000\" stroke=\"none\"/><text x=\"200\" y=\"232\" fill=\"#000\" stroke=\"none\" font-size=\"11\">앞(D, A 쪽)에서 바라보는 사람<\/text><\/svg>", "choices": ["AB와 CD가 같은 방향으로 힘을 받아 코일 전체가 위로 올라간다.", "앞(D, A 쪽)에서 볼 때 코일은 시계 방향으로 회전한다.", "앞(D, A 쪽)에서 볼 때 코일은 시계 반대 방향으로 회전한다.", "BC와 DA도 힘을 받아 코일이 앞쪽으로 밀려난다.", "AB와 CD가 받는 힘이 서로 반대이므로 힘이 상쇄되어 코일은 움직이지 않는다."], "answer": [3], "explanation": "마주 보는 두 변 AB와 CD는 전류의 방향이 반대이므로 반대 방향의 힘을 받는다. 앞에서 볼 때 왼쪽의 AB는 내려가고 오른쪽의 CD는 올라가므로 코일은 시계 반대 방향으로 회전한다. BC와 DA는 자기장과 나란하여 힘을 받지 않는다. 두 힘은 회전축의 양쪽에 작용하므로 상쇄되지 않고 코일을 돌린다.", "stimulus_group": "SG-E10"}, {"id": "전기와자기:G-015", "sub": "G", "type_id": "G05", "review_group": "RG26", "role": "main", "difficulty": "중", "format": "합답형", "stem": "그림은 왼쪽 N극과 오른쪽 S극 사이에 사각형 코일 ABCD를 자기장과 나란하게(수평으로) 놓고 A→B→C→D 방향으로 전류를 흘린 모습이다. A, D는 앞쪽, B, C는 뒤쪽이며, 코일은 AB와 나란한 회전축을 중심으로 돌 수 있다. 이에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?", "bogi": ["ㄱ. 앞(D, A 쪽)에서 볼 때 코일은 시계 반대 방향으로 회전한다.", "ㄴ. 코일에 흐르는 전류의 세기를 크게 하면 코일의 회전 방향이 반대로 바뀐다.", "ㄷ. 자석의 두 극을 서로 바꾸어 놓으면 코일은 앞에서 볼 때 시계 방향으로 회전한다."], "figure_svg": "<svg style=\"background:#fff\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 520 245\" fill=\"none\" stroke=\"#000\" stroke-width=\"1.5\" font-size=\"13\" font-fam
