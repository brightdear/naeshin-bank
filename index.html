8.561087 \nL 126.52 38.561087 \nL 174.72 38.561087 \nL 222.92 38.561087 \nL 271.12 175.66 \nL 319.32 175.66 \n\" clip-path=\"url(#p8128d3e7c3)\" style=\"fill: none; stroke: #000000; stroke-width: 1.8; stroke-linecap: square\"/>\n   <\/g>\n   <g id=\"patch_3\">\n    <path d=\"M 78.32 175.66 \nL 78.32 17.99625 \n\" style=\"fill: none; stroke: #000000; stroke-linejoin: miter; stroke-linecap: square\"/>\n   <\/g>\n   <g id=\"patch_4\">\n    <path d=\"M 78.32 175.66 \nL 319.32 175.66 \n\" style=\"fill: none; stroke: #000000; stroke-linejoin: miter; stroke-linecap: square\"/>\n   <\/g>\n   <g id=\"text_7\">\n    <text style=\"font-size: 11px; font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif'Malgun Gothic'; text-anchor: middle\" x=\"150.62\" y=\"31.706141\" transform=\"rotate(-0 150.62 31.706141)\">X<\/text>\n   <\/g>\n  <\/g>\n <\/g>\n <defs>\n  <clipPath id=\"p8128d3e7c3\">\n   <rect x=\"78.32\" y=\"17.99625\" width=\"241\" height=\"157.66375\"/>\n  <\/clipPath>\n <\/defs>\n<\/svg>\n", "choices": ["녹말 – 포도당", "단백질 – 아미노산", "지방 – 지방산과 모노글리세리드", "지방 – 아미노산", "녹말 – 엿당"], "answer": [3], "explanation": "X는 입과 위에서는 줄지 않다가 작은창자에서 처음 줄어들므로 지방이다. 지방의 최종 산물은 지방산과 모노글리세리드이다. ①⑤ 녹말은 입에서부터 줄어든다. ② 단백질은 위에서부터 줄어든다. ④ 아미노산은 단백질의 최종 산물이다.", "stimulus_group": "SG-B-소화남은양그래프"}, {"id": "동물과에너지:B-026", "sub": "B", "type_id": "B08", "review_group": "RG09", "role": "main", "difficulty": "중", "format": "5지선다", "stem": "다음은 침의 작용을 알아보는 실험이다.<br>(가) 시험관 A에는 녹말 용액과 증류수를, B에는 녹말 용액과 침을 같은 양씩 넣는다.<br>(나) 두 시험관을 체온과 비슷한 온도의 물에 넣고, 녹말이 충분히 분해될 만큼 시간이 지나도록 둔다.<br>(다) 각 시험관의 용액을 둘로 나누어 아이오딘-아이오딘화 칼륨 용액(녹말 검출)과 베네딕트 용액(당 검출)으로 검출하고, 베네딕트 용액을 넣은 시험관은 가열한다.<br>표의 ㉠~㉣에 들어갈 결과로 옳게 짝 지은 것은?", "table": {"h": ["시험관", "아이오딘-아이오딘화 칼륨 용액", "베네딕트 용액"], "r": [["A", "㉠", "㉡"], ["B", "㉢", "㉣"]]}, "choices": ["㉠ 변화 없음, ㉡ 황적색, ㉢ 청람색, ㉣ 변화 없음", "㉠ 청람색, ㉡ 황적색, ㉢ 변화 없음, ㉣ 황적색", "㉠ 청람색, ㉡ 변화 없음, ㉢ 변화 없음, ㉣ 황적색", "㉠ 청람색, ㉡ 변화 없음, ㉢ 청람색, ㉣ 변화 없음", "㉠ 변화 없음, ㉡ 변화 없음, ㉢ 변화 없음, ㉣ 황적색"], "answer": [3], "explanation": "A에는 녹말이 그대로 남아 ㉠ 청람색, ㉡ 변화 없음이다. B에서는 침의 아밀레이스가 녹말을 엿당으로 분해하여 ㉢ 변화 없음, ㉣ 황적색이다. ① A와 B의 결과를 맞바꾸었다. ② 증류수 시험관 A에서는 당이 생기지 않는다. ④ B에서는 녹말이 분해되어 엿당이 생기므로 청람색이 나타나지 않고 베네딕트 반응이 나타난다. ⑤ 증류수만 넣은 A에는 녹말이 그대로 남아 있다."}, {"id": "동물과에너지:B-027", "sub": "B", "type_id": "B09", "review_group": "RG09", "role": "main", "difficulty": "상", "format": "보기형(ㄱㄴㄷ)", "stem": "다음은 온도에 따른 침의 작용을 알아보는 실험이다.<br>(가) 시험관 A~D에 녹말 용액을 같은 양씩 넣고, A~C에는 침을, D에는 증류수를 같은 양씩 넣는다. 단, C에는 끓였다가 식힌 침을 넣는다.<br>(나) A는 얼음물에, B~D는 체온과 비슷한 온도의 물에 넣어 같은 시간 동안 둔다.<br>(다) 각 시험관에 아이오딘-아이오딘화 칼륨 용액(녹말 검출)을 넣고 색 변화를 관찰한다.<br>이에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?", "bogi": ["ㄱ. A와 B를 비교하면 침 속 효소는 체온과 비슷한 온도에서 녹말을 잘 분해함을 알 수 있다.", "ㄴ. C에서 녹말이 분해되지 않은 것은 침 속 효소가 끓으면서 기능을 잃었기 때문이다.", "ㄷ. 온도가 높을수록 침 속 효소는 녹말을 더 잘 분해한다."], "table": {"h": ["시험관", "A", "B", "C", "D"], "r": [["색 변화", "청람색", "변화 없음", "청람색", "청람색"]]}, "choices": ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "answer": [3], "explanation": "ㄱ. 옳다. 얼음물(A)에서는 녹말이 남았고 체온 범위(B)에서는 분해되었다. ㄴ. 옳다. 끓인 침(C)은 체온 범위에 두어도 녹말을 분해하지 못했다. ㄷ. 옳지 않다. 효소는 체온 범위에서 활발하며, 끓이면 기능을 잃으므로 온도가 높을수록 잘 작용하는 것이 아니다.", "textbook_tags": {"mode": "include_only", "books": ["오투", "동아", "천재(임성숙)", "지학사"]}}, {"id": "동물과에너지:B-028", "sub": "B", "type_id": "B10", "review_group": "RG09", "role": "main", "difficulty": "상", "format": "5지선다", "stem": "다음은 침 속 효소의 특성을 알아보는 실험이다.<br>(가) 시험관 A와 B에는 녹말 용액을, C와 D에는 달걀흰자 용액(단백질)을 같은 양씩 넣는다.<br>(나) A와 C에는 침을, B와 D에는 증류수를 같은 양씩 넣고 체온과 비슷한 온도의 물에 충분한 시간 동안 둔다.<br>(다) A와 B에는 아이오딘-아이오딘화 칼륨 용액(녹말 검출)을, C와 D에는 수산화 나트륨 수용액과 황산 구리 수용액(단백질 검출)을 넣는다.<br>표는 그 결과이다. 이 실험에 대한 설명으로 옳은 것은? (단, 침 자체의 성분은 검출 결과에 영향을 주지 않는다.)", "table": {"h": ["시험관", "A", "B", "C", "D"], "r": [["색 변화", "변화 없음", "청람색", "보라색", "보라색"]]}, "choices": ["침은 녹말과 단백질을 모두 분해한다.", "C와 D의 결과가 같으므로 침은 단백질을 분해하지 못한다.", "B에서는 녹말이 분해되었다.", "이 실험으로 침 속 효소가 체온보다 높은 온도에서 더 잘 작용함을 알 수 있다.", "C에서 보라색이 나타난 것은 침 속에 단백질 소화 효소가 있기 때문이다."], "answer": [2], "explanation": "① A에서만 녹말이 분해되었고 단백질은 분해되지 않았다. ② 옳다. 침을 넣은 C와 증류수를 넣은 D 모두 단백질이 남아 있으므로 침은 단백질을 분해하지 못한다. 즉 효소는 특정 영양소만 분해한다. ③ B는 증류수를 넣은 대조군이므로 녹말이 그대로 남아 청람색이 나타났다. ④ 온도는 이 실험의 변인이 아니다. ⑤ 보라색은 단백질이 분해되지 않고 남아 있다는 뜻이다."}, {"id": "동물과에너지:B-029", "sub": "B", "type_id": "B08", "review_group": "RG09", "role": "reserve", "difficulty": "중", "format": "서술형", "stem": "밥을 삼키지 않고 입안에서 오래 씹으면 점점 단맛이 난다. 그 까닭을 <u>침 속 소화 효소의 이름<\/u>과 <u>분해 전후의 물질<\/u>을 포함하여 서술하시오.", "answer": "침 속의 아밀레이스가 밥에 들어 있는 녹말을 단맛이 나는 엿당으로 분해하기 때문이다.", "scoring": "총 2점. 아밀레이스 1점 + 녹말이 엿당으로 분해된다 1점(산물을 포도당으로 쓰면 이 부분 0점). 침과 관계없이 씹기만 해서라고 쓰면 0점.", "explanation": "침의 아밀레이스는 녹말을 엿당까지 분해한다. 포도당까지의 분해는 작은창자에서 일어난다."}, {"id": "동물과에너지:B-030", "sub": "B", "type_id": "B10", "review_group": "RG09", "role": "reserve", "difficulty": "상", "format": "5지선다", "stem": "녹말, 단백질, 지방이 모두 들어 있는 같은 양의 혼합액 세 개에 소화제 (가)~(다)를 각각 넣고 체온과 비슷한 온도에서 충분한 시간 동안 둔 뒤, 각 영양소가 남아 있는지 검출하였다. 표는 그 결과이다. (○: 검출됨, ×: 검출되지 않음 / 소화제 자체의 성분은 검출 결과에 영향을 주지 않는다.) 가장 여러 종류의 영양소를 분해하는 소화제와, 그 소화제가 분해하지 못하는 영양소를 옳게 짝 지은 것은?", "table": {"h": ["소화제", "녹말", "단백질", "지방"], "r": [["(가)", "×", "○", "○"], ["(나)", "×", "×", "○"], ["(다)", "○", "○", "×"]]}, "choices": ["(가) – 단백질, 지방", "(나) – 지방", "(다) – 녹말, 단백질", "(나) – 녹말, 단백질", "(다) – 지방"], "answer": [2], "explanation": "검출되지 않은(×) 영양소가 소화제에 의해 분해된 영양소이다. (가)는 녹말, (나)는 녹말과 단백질, (다)는 지방을 분해하였으므로 가장 여러 종류를 분해한 것은 (나)이고, (나)가 분해하지 못한 영양소는 지방이다. ① (가)는 한 종류만 분해하였다. ③ (다)는 한 종류만 분해하였고, ○를 분해된 것으로 거꾸로 읽었다. ④ (나)가 분해한 영양소와 분해하지 못한 영양소를 맞바꾸었다. ⑤ (다)는 지방을 분해하였다."}, {"id": "동물과에너지:B-031", "sub": "B", "type_id": "B11", "review_group": "RG10", "role": "main", "difficulty": "중", "format": "5지선다", "stem": "그림은 작은창자 안쪽 벽에 있는 융털의 구조를 나타낸 것이다. A와 B는 각각 모세혈관과 암죽관 중 하나이다. 이에 대한 설명으로 옳은 것은?", "figure_svg": "<svg style=\"background:#fff\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 280 270\" fill=\"none\" stroke=\"#000\" stroke-width=\"1.5\" font-size=\"13\" font-family=\"'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif\"><text x=\"70\" y=\"16\" fill=\"#000\" stroke=\"none\" font-size=\"11\">작은창자 안쪽 공간<\/text><path d=\"M60,255 L60,95 Q60,30 130,30 Q200,30 200,95 L200,255\"/><path d=\"M120,255 L120,95 Q130,72 140,95 L140,255\" stroke-dasharray=\"5 3\"/><path d=\"M82,255 C72,205 96,185 82,135 C72,95 108,58 130,52 C152,58 188,95 178,135 C164,185 188,205 178,255\" stroke-width=\"2.5\" stroke-opacity=\"0.55\"/><path d=\"M82,205 L120,195 M82,150 L120,140 M140,140 L178,150 M140,195 L178,205\" stroke-width=\"1\" stroke-opacity=\"0.55\"/><line x1=\"84\" y1=\"170\" x2=\"22\" y2=\"170\" stroke-width=\"1\"/><text x=\"8\" y=\"174\" fill=\"#000\" stroke=\"none\">A<\/text><line x1=\"140\" y1=\"225\" x2=\"240\" y2=\"225\" stroke-width=\"1\"/><text x=\"246\" y=\"229\" fill=\"#000\" stroke=\"none\">B<\/text><\/svg>", "choices": ["포도당은 B로 흡수된다.", "지방산과 모노글리세리드는 A로 흡수된다.", "녹말은 분해되지 않은 채로 A로 흡수된다.", "소화된 영양소는 모두 A로만 흡수된다.", "아미노산과 무기염류는 A로 흡수된다."], "answer": [5], "explanation": "A는 융털에 그물처럼 퍼진 모세혈관, B는 가운데에 있는 암죽관이다. ① 포도당은 수용성이므로 A로 흡수된다. ② 지방산과 모노글리세리드는 지용성이므로 B로 흡수된다. ③ 녹말처럼 큰 영양소는 포도당으로 분해된 뒤 흡수된다. ④ 영양소는 A와 B 두 통로로 나뉘어 흡수된다. ⑤ 옳다. 수용성인 아미노산과 무기염류는 모세혈관(A)으로 흡수된다.", "stimulus_group": "SG-B-융털그림"}, {"id": "동물과에너지:B-032", "sub": "B", "type_id": "B12", "review_group": "RG10", "role": "main", "difficulty": "중", "format": "서술형", "stem": "작은창자 안쪽 벽에는 많은 주름이 있고, 주름 표면에는 융털이 빽빽하게 나 있다.<br>(1) 이러한 구조가 영양소 흡수에 유리한 까닭을 <u>표면적<\/u>이라는 말을 넣어 서술하시오.<br>(2) 호흡계에서 이와 같은 원리로 기체 교환에 유리한 구조의 이름을 쓰시오.", "answer": "(1) 주름과 융털 때문에 영양소와 닿는 작은창자 안쪽 벽의 표면적이 매우 넓어지므로 영양소를 효율적으로 흡수할 수 있다. (2) 허파꽈리", "scoring": "총 3점. (1) 2점: '표면적이 넓어진다' 1점 + '영양소와 닿는 면이 넓어 흡수가 효율적이다' 1점. '벽이 얇아서'처럼 표면적과 무관한 까닭만 쓰면 0점. (2) 1점: 허파꽈리('폐포' 인정).", "explanation": "융털·허파꽈리는 모두 수가 많아 표면적을 넓혀 물질 교환을 효율적으로 하는 구조이다."}, {"id": "동물과에너지:B-033", "sub": "B", "type_id": "B12", "review_group": "RG10", "role": "reserve", "difficulty": "하", "format": "5지선다", "stem": "작은창자와 큰창자에 대한 설명으로 옳지 <u>않은<\/u> 것은?", "choices": ["작은창자 안쪽 벽에는 주름과 융털이 있다.", "작은창자에서는 영양소의 최종 소화와 흡수가 일어난다.", "큰창자에서는 소화 효소가 분비되지 않는다.", "큰창자에서는 작은창자를 지나고 남은 물이 흡수된다.", "포도당과 아미노산 같은 영양소는 대부분 큰창자에서 흡수된다."], "answer": [5], "explanation": "①~④는 옳다. ⑤ 영양소는 작은창자의 융털에서 흡수되며, 큰창자에서는 소화가 일어나지 않고 남은 물이 흡수된다."}, {"id": "동물과에너지:B-034", "sub": "F", "type_id": "F05", "review_group": "RG10", "role": "reserve", "difficulty": "하", "format": "5지선다", "stem": "다음 중 표면적을 넓혀 물질의 흡수나 교환에 유리하게 하는 구조가 <u>아닌<\/u> 것은?", "choices": ["작은창자 안쪽 벽의 융털", "작은창자 안쪽 벽의 주름", "폐를 이루는 수많은 허파꽈리", "코 안의 털과 끈끈한 액체", "식물 뿌리 표면에 수없이 나 있는 뿌리털"], "answer": [4], "explanation": "①②③⑤는 표면적을 넓혀 물질의 흡수나 기체 교환을 돕는다. ⑤ 뿌리털도 흙과 닿는 면적을 넓혀 물과 무기염류를 잘 흡수하게 한다. ④ 코 안의 털과 끈끈한 액체는 먼지와 세균을 걸러 내는 구조로, 표면적과는 관계가 없다."}, {"id": "동물과에너지:B-035", "sub": "B", "type_id": "B11", "review_group": "RG10", "role": "reserve", "difficulty": "상", "format": "보기형(ㄱㄴㄷ)", "stem": "그림은 융털의 구조를 나타낸 것이다. A는 모세혈관, B는 암죽관이다. 어떤 사람의 융털에서 B의 기능에만 이상이 생겼다고 할 때, 이에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?", "bogi": ["ㄱ. 지방이 소화되어 생긴 산물의 흡수가 원활하지 않다.", "ㄴ. 포도당의 흡수가 크게 줄어든다.", "ㄷ. 만약 B가 아닌 A의 기능에 이상이 생긴다면 아미노산의 흡수가 원활하지 않을 것이다."], "figure_svg": "<svg style=\"background:#fff\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 280 270\" fill=\"none\" stroke=\"#000\" stroke-width=\"1.5\" font-size=\"13\" font-family=\"'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif\"><text x=\"70\" y=\"16\" fill=\"#000\" stroke=\"none\" font-size=\"11\">작은창자 안쪽 공간<\/text><path d=\"M60,255 L60,95 Q60,30 130,30 Q200,30 200,95 L200,255\"/><path d=\"M120,255 L120,95 Q130,72 140,95 L140,255\" stroke-dasharray=\"5 3\"/><path d=\"M82,255 C72,205 96,185 82,135 C72,95 108,58 130,52 C152,58 188,95 178,135 C164,185 188,205 178,255\" stroke-width=\"2.5\" stroke-opacity=\"0.55\"/><path d=\"M82,205 L120,195 M82,150 L120,140 M140,140 L178,150 M140,195 L178,205\" stroke-width=\"1\" stroke-opacity=\"0.55\"/><line x1=\"84\" y1=\"170\" x2=\"22\" y2=\"170\" stroke-width=\"1\"/><text x=\"8\" y=\"174\" fill=\"#000\" stroke=\"none\">A<\/text><line x1=\"140\" y1=\"225\" x2=\"240\" y2=\"225\" stroke-width=\"1\"/><text x=\"246\" y=\"229\" fill=\"#000\" stroke=\"none\">B<\/text><\/svg>", "choices": ["ㄱ", "ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "answer": [3], "explanation": "ㄱ. 옳다. 지용성인 지방산과 모노글리세리드는 암죽관(B)으로 흡수된다. ㄴ. 옳지 않다. 포도당은 수용성이라 모세혈관(A)으로 흡수되므로 B의 이상과 관계가 적다. ㄷ. 옳다. 수용성인 아미노산은 모세혈관(A)으로 흡수된다. 따라서 옳은 것은 ㄱ, ㄷ이다.", "stimulus_group": "SG-B-융털그림"}, {"id": "동물과에너지:C-001", "sub": "C", "type_id": "C01", "review_group": "RG11", "role": "main", "difficulty": "하", "format": "5지선다", "stem": "그림은 사람의 심장 구조를 앞에서 본 모습을 단순하게 나타낸 것이다. A~D는 심장의 네 방이고, ㉠~㉣은 심장과 연결된 혈관이며 화살표는 혈액이 흐르는 방향이다.<br>이에 대한 설명으로 옳은 것은?", "figure_svg": "<svg style=\"background:#fff\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 260\" fill=\"none\" stroke=\"#000\" stroke-width=\"1.5\" font-size=\"13\" font-family=\"'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#000\" stroke=\"none\"/><\/marker><\/defs><rect x=\"110\" y=\"60\" width=\"70\" height=\"60\" rx=\"8\"/><rect x=\"190\" y=\"60\" width=\"70\" height=\"60\" rx=\"8\"/><rect x=\"110\" y=\"130\" width=\"70\" height=\"95\" rx=\"10\" stroke-width=\"3\"/><rect x=\"190\" y=\"130\" width=\"70\" height=\"95\" rx=\"10\" stroke-width=\"5\"/><text x=\"140\" y=\"96\" fill=\"#000\" stroke=\"none\">A<\/text><text x=\"220\" y=\"96\" fill=\"#000\" stroke=\"none\">C<\/text><text x=\"140\" y=\"182\" fill=\"#000\" stroke=\"none\">B<\/text><text x=\"220\" y=\"182\" fill=\"#000\" stroke=\"none\">D<\/text><line x1=\"40\" y1=\"80\" x2=\"108\" y2=\"80\" marker-end=\"url(#ar)\" stroke-width=\"3\"/><text x=\"30\" y=\"72\" fill=\"#000\" stroke=\"none\">㉠<\/text><line x1=\"110\" y1=\"200\" x2=\"42\" y2=\"200\" marker-end=\"url(#ar)\" stroke-width=\"3\"/><text x=\"30\" y=\"192\" fill=\"#000\" stroke=\"none\">㉡<\/text><line x1=\"330\" y1=\"80\" x2=\"262\" y2=\"80\" marker-end=\"url(#ar)\" stroke-width=\"3\"/><text x=\"322\" y=\"72\" fill=\"#000\" stroke=\"none\">㉢<\/text><line x1=\"260\" y1=\"200\" x2=\"328\" y2=\"200\" marker-end=\"url(#ar)\" stroke-width=\"3\"/><text x=\"322\" y=\"192\" fill=\"#000\" stroke=\"none\">㉣<\/text><text x=\"185\" y=\"250\" fill=\"#000\" stroke=\"none\" font-size=\"11\" text-anchor=\"middle\">그림의 왼쪽이 몸의 오른쪽이다.<\/text><\/svg>", "choices": ["A는 폐정맥과 연결되어 폐에서 오는 혈액을 받는다.", "B는 대동맥을 통해 온몸으로 혈액을 내보낸다.", "D는 네 방 가운데 벽이 가장 두껍다.", "A와 C는 수축하여 심장 밖으로 혈액을 내보내는 곳이다.", "심방은 동맥과, 심실은 정맥과 연결되어 있다."], "answer": [3], "explanation": "① A(우심방)는 대정맥(㉠)과 연결되어 온몸을 돌고 온 혈액을 받는다. 폐정맥과 연결된 것은 C(좌심방)이다. ② B(우심실)는 폐동맥(㉡)으로 혈액을 내보낸다. 대동맥과 연결된 것은 D(좌심실)이다. ③ 옳다. D(좌심실)는 온몸으로 혈액을 내보내야 하므로 벽이 가장 두껍다. ④ A와 C는 심방으로 정맥에서 혈액을 받아들이는 곳이며, 심장 밖으로 내보내는 곳은 심실이다. ⑤ 심방은 정맥과, 심실은 동맥과 연결된다.", "stimulus_group": "SG-C-심장그림"}, {"id": "동물과에너지:C-002", "sub": "C", "type_id": "C01", "review_group": "RG11", "role": "main", "difficulty": "중", "format": "보기형(ㄱㄴㄷ)", "stem": "그림은 사람의 심장 구조를 앞에서 본 모습을 단순하게 나타낸 것이다. A~D는 심장의 네 방이고, ㉠~㉣은 심장과 연결된 혈관이며 화살표는 혈액이 흐르는 방향이다.<br>이에 대한 설명으로 옳은 것만을 &lt;보기&gt;에서 있는 대로 고른 것은?", "bogi": ["ㄱ. ㉠과 ㉢은 혈액이 심장으로 들어오는 혈관이다.", "ㄴ. B가 수축하면 혈액은 ㉡을 통해 폐로 나간다.", "ㄷ. A와 B 사이에서 혈액은 B에서 A 쪽으로 흐른다."], "figure_svg": "<svg style=\"background:#fff\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 260\" fill=\"none\" stroke=\"#000\" stroke-width=\"1.5\" font-size=\"13\" font-family=\"'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#000\" stroke=\"none\"/><\/marker><\/defs><rect x=\"110\" y=\"60\" width=\"70\" height=\"60\" rx=\"8\"/><rect x=\"190\" y=\"60\" width=\"70\" height=\"60\" rx=\"8\"/><rect x=\"110\" y=\"130\" width=\"70\" height=\"95\" rx=\"10\" stroke-width=\"3\"/><rect x=\"190\" y=\"130\" width=\"70\" height=\"95\" rx=\"10\" stroke-width=\"5\"/><text x=\"140\" y=\"96\" fill=\"#000\" stroke=\"none\">A<\/text><text x=\"220\" y=\"96\" fill=\"#000\" stroke=\"none\">C<\/text><text x=\"140\" y=\"182\" fill=\"#000\" stroke=\"none\">B<\/text><text x=\"220\" y=\"182\" fill=\"#000\" stroke=\"none\">D<\/text><line x1=\"40\" y1=\"80\" x2=\"108\" y2=\"80\" marker-end=\"url(#ar)\" stroke-width=\"3\"/><text x=\"30\" y=\"72\" fill=\"#000\" stroke=\"none\">㉠<\/text><line x1=\"110\" y1=\"200\" x2=\"42\" y2=\"200\" marker-end=\"url(#ar)\" stroke-width=\"3\"/><text x=\"30\" y=\"192\" fill=\"#000\" stroke=\"none\">㉡<\/text><line x1=\"330\" y1=\"80\" x2=\"262\" y2=\"80\" marker-end=\"url(#ar)\" stroke-width=\"3\"/><text x=\"322\" y=\"72\" fill=\"#000\" stroke=\"none\">㉢<\/text><line x1=\"260\" y1=\"200\" x2=\"328\" y2=\"200\" marker-end=\"url(#ar)\" stroke-width=\"3\"/><text x=\"322\" y=\"192\" fill=\"#000\" stroke=\"none\">㉣<\/text><text x=\"185\" y=\"250\" fill=\"#000\" stroke=\"none\" font-size=\"11\" text-anchor=\"middle\">그림의 왼쪽이 몸의 오른쪽이다.<\/text><\/svg>", "choices": ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "answer": [3], "explanation": "ㄱ. 옳다. ㉠(대정맥)은 우심방으로, ㉢(폐정맥)은 좌심방으로 혈액이 들어오는 정맥이다. ㄴ. 옳다. B(우심실)가 수축하면 혈액이 ㉡(폐동맥)을 통해 폐로 나간다. ㄷ. 혈액은 심방에서 심실 쪽(A→B)으로 흐른다. 심방이 받아들이고 심실이 내보낸다.", "stimulus_group": "SG-C-심장그림"}, {"id": "동물과에너지:C-003", "sub": "C", "type_id": "C01", "review_group": "RG11", "role": "main", "difficulty": "중", "format": "서술형", "stem": "사람의 심장에서 심실의 벽은 심방의 벽보다 두껍고, 네 방 가운데 좌심실의 벽이 가장 두껍다. (1) 심실의 벽이 심방보다 두꺼운 까닭과 (2) 좌심실의 벽이 우심실보다 두꺼운 까닭을 각 방이 하는 일과 관련지어 서술하시오.", "answer": "(1) 심방은 정맥에서 들어오는 혈액을 받아 바로 아래 심실로 보내지만, 심실은 혈액을 동맥을 통해 심장 밖으로 세게 내보내야 하므로 벽이 두껍다. (2) 좌심실은 대동맥을 통해 온몸으로 혈액을 내보내고, 우심실은 폐동맥을 통해 가까운 폐로만 혈액을 내보낸다. 온몸으로 혈액을 보내려면 더 큰 힘이 필요하므로 좌심실의 벽이 가장 두껍다.", "scoring": "총 3점. (1) 1점: 심실은 혈액을 동맥을 통해 심장 밖으로 세게 내보낸다(심방은 받아서 심실로 보냄). (2) 2점: '좌심실은 대동맥을 통해 온몸으로 혈액을 보낸다' 1점 + '우심실은 폐로만 보내므로 좌심실에 더 큰 힘이 필요하다' 1점. 심방이 혈액을 심장 밖으로 내보낸다고 쓰면 (1) 0점.", "explanation": "심방은 혈액을 받아들이고 심실은 내보내는 곳이다. 혈액을 보내는 거리와 범위가 넓을수록 큰 압력이 필요하므로 온몸순환을 시작하는 좌심실의 벽이 가장 두껍다."}, {"id": "동물과에너지:C-004", "sub": "C", "type_id": "C01", "review_group": "RG11", "role": "reserve", "difficulty": "하", "format": "단답형", "stem": "그림은 사람의 심장 구조를 앞에서 본 모습을 단순하게 나타낸 것이다. A~D는 심장의 네 방이고, ㉠~㉣은 심장과 연결된 혈관이며 화살표는 혈액이 흐르는 방향이다.<br>(1) 온몸을 돌고 온 혈액이 가장 먼저 들어오는 방의 기호와 이름을 쓰시오.<br>(2) 폐에서 오는 혈액이 들어오는 혈관의 기호와 이름을 쓰시오.", "figure_svg": "<svg style=\"background:#fff\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 260\" fill=\"none\" stroke=\"#000\" stroke-width=\"1.5\" font-size=\"13\" font-family=\"'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#000\" stroke=\"none\"/><\/marker><\/defs><rect x=\"110\" y=\"60\" width=\"70\" height=\"60\" rx=\"8\"/><rect x=\"190\" y=\"60\" width=\"70\" height=\"60\" rx=\"8\"/><rect x=\"110\" y=\"130\" width=\"70\" height=\"95\" rx=\"10\" stroke-width=\"3\"/><rect x=\"190\" y=\"130\" width=\"70\" height=\"95\" rx=\"10\" stroke-width=\"5\"/><text x=\"140\" y=\"96\" fill=\"#000\" stroke=\"none\">A<\/text><text x=\"220\" y=\"96\" fill=\"#000\" stroke=\"none\">C<\/text><text x=\"140\" y=\"182\" fill=\"#000\" stroke=\"none\">B<\/text><text x=\"220\" y=\"182\" fill=\"#000\" stroke=\"none\">D<\/text><line x1=\"40\" y1=\"80\" x2=\"108\" y2=\"80\" marker-end=\"url(#ar)\" stroke-width=\"3\"/><text x=\"30\" y=\"72\" fill=\"#000\" stroke=\"none\">㉠<\/text><line x1=\"110\" y1=\"200\" x2=\"42\" y2=\"200\" marker-end=\"url(#ar)\" stroke-width=\"3\"/><text x=\"30\" y=\"192\" fill=\"#000\" stroke=\"none\">㉡<\/text><line x1=\"330\" y1=\"80\" x2=\"262\" y2=\"80\" marker-end=\"url(#ar)\" stroke-width=\"3\"/><text x=\"322\" y=\"72\" fill=\"#000\" stroke=\"none\">㉢<\/text><line x1=\"260\" y1=\"200\" x2=\"328\" y2=\"200\" marker-end=\"url(#ar)\" stroke-width=\"3\"/><text x=\"322\" y=\"192\" fill=\"#000\" stroke=\"none\">㉣<\/text><text x=\"185\" y=\"250\" fill=\"#000\" stroke=\"none\" font-size=\"11\" text-anchor=\"middle\">그림의 왼쪽이 몸의 오른쪽이다.<\/text><\/svg>", "answer": "(1) A, 우심방 (2) ㉢, 폐정맥", "scoring": "총 2점. (1) A, 우심방 1점 (2) ㉢, 폐정맥 1점. 각각 기호와 이름이 모두 맞아야 함. '허파정맥'도 인정.", "explanation": "온몸을 돌고 온 혈액은 대정맥(㉠)을 거쳐 우심방(A)으로 들어온다. 폐에서 산소를 받은 혈액은 폐정맥(㉢)을 거쳐 좌심방(C)으로 들어온다.", "stimulus_group": "SG-C-심장그림"}, {"id": "동물과에너지:C-005", "sub": "C", "type_id": "C01", "review_group": "RG11", "role": "reserve", "difficulty": "중", "format": "5지선다", "stem": "표는 사람 심장의 네 방에 대해 연결된 혈관과 하는 일을 정리한 것이다. ㉮~㉲ 중 옳지 <u>않은<\/u> 것은?", "table": {"h": ["심장의 방", "연결된 혈관", "하는 일"], "r": [["우심방", "㉮ 대정맥", "온몸에서 오는 혈액을 받는다."], ["우심실", "폐동맥", "㉯ 폐로 혈액을 내보낸다."], ["좌심방", "㉰ 폐정맥", "폐에서 오는 혈액을 받는다."], ["좌심실", "㉱ 대동맥", "㉲ 혈액을 받아 좌심방으로 보낸다."]]}, "choices": ["㉮", "㉯", "㉰", "㉱", "㉲"], "answer": [5], "explanation": "㉮ 우심방은 대정맥과 연결된다. ㉯ 우심실은 폐동맥으로 혈액을 내보낸다. ㉰ 좌심방은 폐정맥과 연결된다. ㉱ 좌심실은 대동맥과 연결된다. ㉲ 좌심실은 좌심방에서 받은 혈액을 대동맥을 통해 온몸으로 내보낸다. 혈액은 심실에서 심방으로 거꾸로 흐르지 않으므로 옳지 않다."}, {"id": "동물과에너지:C-006", "sub": "C", "type_id": "C02", "review_group": "RG12", "role": "main", "difficulty": "하", "format": "5지선다", "stem": "사람의 심장 안에서 판막이 있는 곳을 옳게 짝지은 것은?", "choices": ["좌심방과 우심방 사이, 좌심실과 우심실 사이", "심방과 심실 사이, 심실과 동맥 사이", "심방과 정맥 사이, 심실과 정맥 사이", "심방과 심실 사이, 심실과 정맥 사이", "심방과 동맥 사이, 심실과 동맥 사이"], "answer": [2], "explanation": "① 좌우 심방 사이와 좌우 심실 사이는 벽으로 막혀 있고 판막이 없다. ② 옳다. 심장의 판막은 심방과 심실 사이, 심실과 동맥 사이에 있다. ③ 심방과 정맥 사이에는 판막이 없고, 심실은 정맥이 아니라 동맥과 연결된다. ④ 심실은 정맥과 연결되지 않는다. ⑤ 심방은 동맥이 아니라 정맥과 연결된다."}, {"id": "동물과에너지:C-007", "sub": "C", "type_id": "C02", "review_group": "RG12", "role": "main", "difficulty": "중", "format": "보기형(ㄱㄴㄷ)", "stem": "그림은 사람의 심장을 단순하게 나타낸 것이다. (가)는 심방과 심실 사이의 판막이고, (나)는 심실과 동맥 사이의 판막이다. A~D는 심장의 네 방, ㉠~㉣은 연결된 혈관이다.<br>심실이 수축하는 순간에 대한 설명으로 옳은 것만을 &lt;보기&gt;에서 있는 대로 고른 것은?", "bogi": ["ㄱ. (가)는 닫혀 있다.", "ㄴ. (나)는 닫혀 있어 혈액이 B에서 ㉡으로 나가지 못한다.", "ㄷ. (가)가 열려 혈액이 B에서 A로 되돌아간다."], "figure_svg": "<svg style=\"background:#fff\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 260\" fill=\"none\" stroke=\"#000\" stroke-width=\"1.5\" font-size=\"13\" font-family=\"'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#000\" stroke=\"none\"/><\/marker><\/defs><rect x=\"110\" y=\"60\" width=\"70\" height=\"60\" rx=\"8\"/><rect x=\"190\" y=\"60\" width=\"70\" height=\"60\" rx=\"8\"/><rect x=\"110\" y=\"130\" width=\"70\" height=\"95\" rx=\"10\" stroke-width=\"3\"/><rect x=\"190\" y=\"130\" width=\"70\" height=\"95\" rx=\"10\" stroke-width=\"5\"/><text x=\"140\" y=\"96\" fill=\"#000\" stroke=\"none\">A<\/text><text x=\"220\" y=\"96\" fill=\"#000\" stroke=\"none\">C<\/text><text x=\"140\" y=\"182\" fill=\"#000\" stroke=\"none\">B<\/text><text x=\"220\" y=\"182\" fill=\"#000\" stroke=\"none\">D<\/text><line x1=\"40\" y1=\"80\" x2=\"108\" y2=\"80\" marker-end=\"url(#ar)\" stroke-width=\"3\"/><text x=\"30\" y=\"72\" fill=\"#000\" stroke=\"none\">㉠<\/text><line x1=\"110\" y1=\"200\" x2=\"42\" y2=\"200\" marker-end=\"url(#ar)\" stroke-width=\"3\"/><text x=\"30\" y=\"192\" fill=\"#000\" stroke=\"none\">㉡<\/text><line x1=\"330\" y1=\"80\" x2=\"262\" y2=\"80\" marker-end=\"url(#ar)\" stroke-width=\"3\"/><text x=\"322\" y=\"72\" fill=\"#000\" stroke=\"none\">㉢<\/text><line x1=\"260\" y1=\"200\" x2=\"328\" y2=\"200\" marker-end=\"url(#ar)\" stroke-width=\"3\"/><text x=\"322\" y=\"192\" fill=\"#000\" stroke=\"none\">㉣<\/text><path d=\"M130,122 L140,132 M160,122 L150,132\" stroke-width=\"2\"/><path d=\"M210,122 L220,132 M240,122 L230,132\" stroke-width=\"2\"/><text x=\"84\" y=\"134\" fill=\"#000\" stroke=\"none\" font-size=\"11\">(가)<\/text><line x1=\"100\" y1=\"130\" x2=\"128\" y2=\"127\" stroke-width=\"0.8\"/><path d=\"M104,190 L96,197 M104,210 L96,203\" stroke-width=\"2\"/><path d=\"M266,190 L274,197 M266,210 L274,203\" stroke-width=\"2\"/><text x=\"70\" y=\"228\" fill=\"#000\" stroke=\"none\" font-size=\"11\">(나)<\/text><line x1=\"84\" y1=\"218\" x2=\"98\" y2=\"206\" stroke-width=\"0.8\"/><text x=\"185\" y=\"250\" fill=\"#000\" stroke=\"none\" font-size=\"11\" text-anchor=\"middle\">그림의 왼쪽이 몸의 오른쪽이다.<\/text><\/svg>", "choices": ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "answer": [1], "explanation": "ㄱ. 옳다. 심실이 수축하면 심방과 심실 사이 판막 (가)가 닫혀 혈액이 심방으로 거꾸로 흐르는 것을 막는다. ㄴ. 심실이 수축할 때 심실과 동맥 사이 판막 (나)는 열려 B(우심실)의 혈액이 ㉡(폐동맥)으로 나간다. ㄷ. 심실이 수축할 때 (가)는 닫혀 있으므로 혈액은 심방으로 되돌아가지 않는다.", "stimulus_group": "SG-C-심장그림"}, {"id": "동물과에너지:C-008", "sub": "C", "type_id": "C05", "review_group": "RG12", "role": "main", "difficulty": "중", "format": "5지선다", "stem": "다음은 팔의 혈관을 관찰한 실험이다.<br>[과정] (1) 팔꿈치 위쪽을 고무관으로 가볍게 묶고 주먹을 쥐었다 폈다 하면, 묶은 곳보다 손 쪽의 혈관이 부풀어 오르고 군데군데 ㉮, ㉯처럼 마디가 볼록하게 보인다. (2) 손가락으로 ㉯ 바로 손 쪽 부분을 누른 채, 다른 손가락으로 혈관을 팔꿈치 쪽으로 쓸어 올리면 ㉮와 ㉯ 사이의 혈관이 납작해진다. (3) (2)에서 누른 손가락을 떼면 손 쪽에서 혈액이 들어와 다시 부푼다.<br>이 실험에 대한 설명으로 옳은 것은? (단, 이 혈관은 정맥이다.)", "figure_svg": "<svg style=\"background:#fff\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 380 175\" fill=\"none\" stroke=\"#000\" stroke-width=\"1.5\" font-size=\"13\" font-family=\"'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#000\" stroke=\"none\"/><\/marker><\/defs><rect x=\"20\" y=\"60\" width=\"340\" height=\"60\" rx=\"28\" fill=\"#000\" fill-opacity=\"0.05\"/><text x=\"24\" y=\"50\" fill=\"#000\" stroke=\"none\" font-size=\"11\">팔꿈치 쪽(심장 쪽)<\/text><text x=\"356\" y=\"50\" fill=\"#000\" stroke=\"none\" font-size=\"11\" text-anchor=\"end\">손 쪽<\/text><rect x=\"60\" y=\"56\" width=\"10\" height=\"68\" fill=\"#000\" fill-opacity=\"0.5\" stroke=\"none\"/><text x=\"40\" y=\"142\" fill=\"#000\" stroke=\"none\" font-size=\"11\">고무관으로 묶은 곳<\/text><path d=\"M80,90 L340,90\" stroke-width=\"4\"/><ellipse cx=\"160\" cy=\"90\" rx=\"7\" ry=\"6\" fill=\"#000\" fill-opacity=\"0.4\"/><ellipse cx=\"260\" cy=\"90\" rx=\"7\" ry=\"6\" fill=\"#000\" fill-opacity=\"0.4\"/><text x=\"155\" y=\"80\" fill=\"#000\" stroke=\"none\" font-size=\"12\">㉮<\/text><text x=\"255\" y=\"80\" fill=\"#000\" stroke=\"none\" font-size=\"12\">㉯<\/text><text x=\"190\" y=\"165\" fill=\"#000\" stroke=\"none\" font-size=\"11\" text-anchor=\"middle\">(㉮, ㉯는 혈관이 마디처럼 볼록하게 보이는 곳)<\/text><\/svg>", "choices": ["㉮, ㉯에는 동맥에서와 같은 판막이 있어 혈액이 손 쪽으로 흐르게 한다.", "정맥에 판막이 있는 까닭은 정맥의 벽이 동맥보다 두껍기 때문이다.", "㉮, ㉯의 판막은 혈액이 심장 쪽으로만 흐르게 하여 거꾸로 흐르는 것을 막는다.", "정맥은 혈압이 매우 높아 혈액이 터져 나오지 않도록 판막이 있다.", "(2)에서 혈관이 납작해진 것은 판막이 혈액을 손 쪽으로 밀어냈기 때문이다."], "answer": [3], "explanation": "① 혈관 중 판막이 있는 것은 정맥이며, 정맥 판막은 혈액이 심장 쪽으로 흐르게 한다. ② 정맥 벽은 동맥보다 얇다. 판막은 벽 두께가 아니라 낮은 혈압 때문에 필요하다. ③ 옳다. 쓸어 올린 혈액이 판막 때문에 손 쪽으로 되돌아오지 못해 ㉮와 ㉯ 사이가 납작해진다. 판막은 혈액이 심장 쪽으로만 흐르게 한다. ④ 정맥은 세 혈관 중 혈압이 가장 낮아 혈액이 거꾸로 흐를 수 있어 판막이 있다. ⑤ (2)에서는 손가락으로 혈액을 팔꿈치(심장) 쪽으로 밀어 올렸고, 판막이 손 쪽으로의 역류를 막아 납작한 상태가 유지되었다."}, {"id": "동물과에너지:C-009", "sub": "C", "type_id": "C05", "review_group": "RG12", "role": "reserve", "difficulty": "중", "format": "서술형", "stem": "동맥·모세혈관·정맥 가운데 판막이 있는 혈관의 이름을 쓰고, 이 혈관에 판막이 필요한 까닭을 혈압과 관련지어 서술하시오.", "answer": "정맥. 정맥은 세 혈관 가운데 혈압이 가장 낮아 혈액이 거꾸로 흐를 수 있으므로, 판막이 혈액이 거꾸로 흐르는 것을 막아 심장 쪽으로만 흐르게 한다.", "scoring": "총 3점. 정맥 1점 + 혈압이 낮다(가장 낮다) 1점 + 혈액이 거꾸로 흐르는 것을 막는다 1점. 동맥이라고 쓰면 0점. '벽이 두꺼워서'를 까닭으로 쓰면 혈압 부분 0점.", "explanation": "혈압은 동맥>모세혈관>정맥이다. 정맥은 혈압이 낮아 특히 다리처럼 심장보다 아래에 있는 부분에서 혈액이 거꾸로 흐르기 쉬우므로 판막이 있다."}, {"id": "동물과에너지:C-010", "sub": "C", "type_id": "C02", "review_group": "RG12", "role": "reserve", "difficulty": "중", "format": "순서배열", "stem": "다음은 심장이 한 번 뛰는 동안 일어나는 일을 순서 없이 나타낸 것이다. 심방과 심실이 모두 이완된 (다)에서 시작하여 순서대로 옳게 나열한 것은?<br>(가) 심방이 수축하여 혈액이 심실로 들어간다.<br>(나) 심실이 수축하고, 심방과 심실 사이 판막이 닫히며 혈액이 동맥으로 나간다.<br>(다) 심방과 심실이 모두 이완하고, 정맥의 혈액이 심방으로 들어온다.", "choices": ["(다)-(가)-(나)", "(다)-(나)-(가)", "(가)-(다)-(나)", "(나)-(다)-(가)", "(가)-(나)-(다)"], "answer": [1], "explanation": "심방과 심실이 이완한 동안 정맥의 혈액이 심방으로 들어오고(다), 심방이 수축하여 혈액을 심실로 보내며(가), 이어서 심실이 수축하면 방실 판막이 닫히고 혈액이 동맥으로 나간다(나). 따라서 (다)-(가)-(나)이다. ② 심실이 심방보다 먼저 수축하는 순서는 옳지 않다. ③ 시작을 (다)로 정했으므로 맞지 않는다."}, {"id": "동물과에너지:C-011", "sub": "C", "type_id": "C03", "review_group": "RG13", "role": "main", "difficulty": "하", "format": "5지선다", "stem": "그림은 사람의 세 가지 혈관 A~C의 단면을 나타낸 것이다. A는 벽이 두껍고 탄력이 크며, B는 한 겹의 세포층으로 되어 있고, C는 A보다 벽이 얇고 안쪽에 판막이 있다.<br>이에 대한 설명으로 옳은 것은?", "figure_svg": "<svg style=\"background:#fff\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 380 180\" fill=\"none\" stroke=\"#000\" stroke-width=\"1.5\" font-size=\"13\" font-family=\"'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#000\" stroke=\"none\"/><\/marker><\/defs><circle cx=\"70\" cy=\"80\" r=\"42\" fill=\"#000\" fill-opacity=\"0.25\"/><circle cx=\"70\" cy=\"80\" r=\"22\" fill=\"white\" stroke-width=\"1.2\"/><text x=\"66\" y=\"150\" fill=\"#000\" stroke=\"none\">A<\/text><circle cx=\"190\" cy=\"80\" r=\"11\" stroke-width=\"1\"/><text x=\"186\" y=\"150\" fill=\"#000\" stroke=\"none\">B<\/text><circle cx=\"310\" cy=\"80\" r=\"40\" fill=\"#000\" fill-opacity=\"0.18\"/><circle cx=\"310\" cy=\"80\" r=\"32\" fill=\"white\" stroke-width=\"1.2\"/><path d=\"M282,62 Q300,80 310,80 M338,62 Q320,80 310,80\" stroke-width=\"2\"/><text x=\"306\" y=\"150\" fill=\"#000\" stroke=\"none\">C<\/text><text x=\"190\" y=\"172\" fill=\"#000\" stroke=\"none\" font-size=\"11\" text-anchor=\"middle\">(혈관을 자른 단면, 크기 비율은 실제와 다름)<\/text><\/svg>", "choices": ["A에는 판막이 있어 혈액이 거꾸로 흐르는 것을 막는다.", "세 혈관 가운데 혈압은 C에서 가장 높다.", "A는 산소가 많은 혈액이 흐르는 혈관이라는 뜻이다.", "심장에서 나온 혈액은 C → B → A 순으로 흐른다.", "B에서 혈액과 조직 세포 사이에 물질 교환이 일어난다."], "answer": [5], "explanation": "A는 동맥, B는 모세혈관, C는 정맥이다. ① 판막이 있는 혈관은 정맥(C)이다. ② 혈압은 동맥(A)에서 가장 높고 정맥(C)에서 가장 낮다. ③ 동맥은 심장에서 나가는 혈액이 흐르는 혈관이며 산소량으로 정하지 않는다. ④ 혈액은 동맥(A) → 모세혈관(B) → 정맥(C) 순으로 흐른다. ⑤ 옳다. 모세혈관(B)은 벽이 한 겹의 세포층으로 얇아 조직 세포와 물질 교환이 일어난다."}, {"id": "동물과에너지:C-012", "sub": "C", "type_id": "C04", "review_group": "RG13", "role": "main", "difficulty": "상", "format": "보기형(ㄱㄴㄷ)", "stem": "그래프는 사람의 세 가지 혈관 (가)~(다)에서 혈압과 혈류 속도를 상댓값으로 비교한 것이다. (가)~(다)는 각각 동맥, 모세혈관, 정맥 중 하나이다.<br>이에 대한 설명으로 옳은 것만을 &lt;보기&gt;에서 있는 대로 고른 것은?", "bogi": ["ㄱ. (나)의 벽은 한 겹의 세포층으로 되어 있다.", "ㄴ. (다)에는 혈액이 거꾸로 흐르는 것을 막는 판막이 있다.", "ㄷ. 혈관 벽의 두께도 (가) > (나) > (다) 순이다."], "figure_svg": "<svg xmlns:xlink=\"http://www.w3.org/1999/xlink\" width=\"388.8pt\" height=\"180pt\" viewBox=\"0 0 388.8 180\" xmlns=\"http://www.w3.org/2000/svg\" version=\"1.1\" style=\"background:#fff\">\n <metadata>\n  <rdf:RDF xmlns:dc=\"http://purl.org/dc/elements/1.1/\" xmlns:cc=\"http://creativecommons.org/ns#\" xmlns:rdf=\"http://www.w3.org/1999/02/22-rdf-syntax-ns#\">\n   <cc:Work>\n    <dc:type rdf:resource=\"http://purl.org/dc/dcmitype/StillImage\"/>\n    <dc:date>2026-10-26T20:07:41.642626<\/dc:date>\n    <dc:format>image/svg+xml<\/dc:format>\n    <dc:creator>\n     <cc:Agent>\n      <dc:title>Matplotlib v3.10.3, https://matplotlib.org/<\/dc:title>\n     <\/cc:Agent>\n    <\/dc:creator>\n   <\/cc:Work>\n  <\/rdf:RDF>\n <\/metadata>\n <defs>\n  <style type=\"text/css\">*{stroke-linejoin: round; stroke-linecap: butt}<\/style>\n <\/defs>\n <g id=\"figure_1\">\n  <g id=\"patch_1\">\n   <path d=\"M 0 180 \nL 388.8 180 \nL 388.8 0 \nL 0 0 \nz\n\" style=\"fill: #ffffff\"/>\n  <\/g>\n  <g id=\"axes_1\">\n   <g id=\"patch_2\">\n    <path d=\"M 11.88 130.935 \nL 159.302182 130.935 \nL 159.302182 26.145 \nL 11.88 26.145 \nz\n\" style=\"fill: #ffffff\"/>\n   <\/g>\n   <g id=\"patch_3\">\n    <path d=\"M 25.70083 130.935 \nL 53.342489 130.935 \nL 53.342489 37.3725 \nL 25.70083 37.3725 \nz\n\" clip-path=\"url(#pd4b44a4cdc)\" style=\"fill: #bfbfbf; stroke: #000000; stroke-width: 1.2; stroke-linejoin: miter\"/>\n   <\/g>\n   <g id=\"patch_4\">\n    <path d=\"M 71.770261 130.935 \nL 99.41192 130.935 \nL 99.41192 87.89625 ,'Noto Sans KR',sans-serif'Malgun Gothic'; text-anchor: middle\" x=\"349.278341\" y=\"143.023594\" transform=\"rotate(-0 349.278341 143.023594)\">(다)<\/text>\n     <\/g>\n    <\/g>\n   <\/g>\n   <g id=\"matplotlib.axis_4\"/>\n   <g id=\"patch_12\">\n    <path d=\"M 229.497818 130.935 \nL 229.497818 26.145 \n\" style=\"fill: none; stroke: #000000; stroke-linejoin: miter; stroke-linecap: square\"/>\n   <\/g>\n   <g id=\"patch_13\">\n    <path d=\"M 229.497818 130.935 \nL 376.92 130.935 \n\" style=\"fill: none; stroke: #000000; stroke-linejoin: miter; stroke-linecap: square\"/>\n   <\/g>\n   <g id=\"text_8\">\n    <text style=\"font-size: 9px; font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif'Malgun Gothic'; text-anchor: middle\" x=\"211.807156\" y=\"158.920031\" transform=\"rotate(-0 211.807156 158.920031)\">(막대 높이는 상댓값)<\/text>\n   <\/g>\n   <g id=\"text_9\">\n    <text style=\"font-size: 11px; font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif'Malgun Gothic'; text-anchor: start\" x=\"229.497818\" y=\"20.145\" transform=\"rotate(-0 229.497818 20.145)\">혈류 속도<\/text>\n   <\/g>\n  <\/g>\n <\/g>\n <defs>\n  <clipPath id=\"pd4b44a4cdc\">\n   <rect x=\"11.88\" y=\"26.145\" width=\"147.422182\" height=\"104.79\"/>\n  <\/clipPath>\n  <clipPath id=\"pdbf6c02d61\">\n   <rect x=\"229.497818\" y=\"26.145\" width=\"147.422182\" height=\"104.79\"/>\n  <\/clipPath>\n <\/defs>\n<\/svg>\n", "choices": ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "answer": [3], "explanation": "혈압이 가장 높고 혈류가 가장 빠른 (가)는 동맥, 혈류가 가장 느린 (나)는 모세혈관, 혈압이 가장 낮은 (다)는 정맥이다. ㄱ. 옳다. 모세혈관은 한 겹의 세포층으로 되어 있다. ㄴ. 옳다. 정맥에는 판막이 있다. ㄷ. 벽 두께는 동맥 > 정맥 > 모세혈관, 즉 (가) > (다) > (나) 순이다. 혈압 순서와 벽 두께 순서는 서로 다르다."}, {"id": "동물과에너지:C-013", "sub": "C", "type_id": "C03", "review_group": "RG13", "role": "main", "difficulty": "상", "format": "보기형(ㄱㄴㄷ)", "stem": "표는 사람의 세 가지 혈관 X~Z의 특징을 나타낸 것이다. X~Z는 각각 동맥, 모세혈관, 정맥 중 하나이다.<br>이에 대한 설명으로 옳은 것만을 &lt;보기&gt;에서 있는 대로 고른 것은?", "bogi": ["ㄱ. 세 혈관을 벽이 두꺼운 순서로 나열하면 혈압이 높은 순서와 같다.", "ㄴ. 혈액이 Y에서 Z로 가면서 흐르는 속도가 느려지는 것은 조직 세포와의 물질 교환에 유리하다.", "ㄷ. 팔의 X를 고무줄로 묶으면 묶은 곳보다 손 쪽의 X가 부풀어 오른다."], "table": {"h": ["혈관", "특징"], "r": [["X", "세 혈관 가운데 혈압이 가장 낮고, 군데군데 판막이 있다."], ["Y", "세 혈관 가운데 벽이 가장 두껍고 혈압이 가장 높다."], ["Z", "세 혈관 가운데 혈액이 가장 느리게 흐른다."]]}, "choices": ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "answer": [4], "explanation": "X는 정맥, Y는 동맥, Z는 모세혈관이다. ㄱ. 벽 두께는 Y(동맥) > X(정맥) > Z(모세혈관)이고, 혈압은 Y(동맥) > Z(모세혈관) > X(정맥)이므로 두 순서는 다르다. ㄴ. 옳다. 모세혈관에서 혈액이 천천히 흐르면 물질 교환할 시간이 충분하다. ㄷ. 옳다. 정맥의 혈액은 손 쪽에서 심장 쪽으로 흐르므로 묶은 곳에서 막혀 손 쪽 혈관에 혈액이 모여 부푼다."}, {"id": "동물과에너지:C-014", "sub": "C", "type_id": "C03", "review_group": "RG13", "role": "main", "difficulty": "중", "format": "서술형", "stem": "혈액과 조직 세포 사이의 물질 교환은 동맥이나 정맥이 아닌 모세혈관에서 일어난다. 모세혈관이 물질 교환에 유리한 까닭을 <u>혈관 벽의 구조<\/u>와 <u>혈액이 흐르는 속도<\/u>를 모두 포함하여 서술하시오.", "answer": "모세혈관은 벽이 한 겹의 세포층으로 매우 얇아 물질이 쉽게 드나들 수 있고, 세 혈관 가운데 혈액이 가장 느리게 흘러 조직 세포와 물질을 주고받을 시간이 충분하기 때문이다.", "scoring": "총 2점. 벽이 한 겹의 세포층으로 얇다 1점 + 혈액이 가장 느리게 흘러 물질을 주고받을 시간이 충분하다 1점. '가늘어서'만 쓰거나 혈압이 가장 높아서라고 쓰면 해당 부분 0점.", "explanation": "얇은 벽은 물질의 이동 거리를 줄이고, 느린 흐름은 교환 시간을 늘린다. 온몸에 그물처럼 퍼져 있어 조직 세포 가까이에 있다는 점을 덧붙여도 좋다."}, {"id": "동물과에너지:C-015", "sub": "C", "type_id": "C03", "review_group": "RG13", "role": "reserve", "difficulty": "중", "format": "단답형", "stem": "동맥, 모세혈관, 정맥을 (1) 혈압이 높은 것부터, (2) 혈액이 빠르게 흐르는 것부터 각각 순서대로 쓰시오.", "answer": "(1) 동맥 > 모세혈관 > 정맥 (2) 동맥 > 정맥 > 모세혈관", "scoring": "총 2점. (1)(2) 각 1점. 각각 세 혈관의 순서가 모두 맞아야 함.", "explanation": "혈압은 심장에서 멀어질수록 낮아져 동맥 > 모세혈관 > 정맥 순이다. 혈류 속도는 동맥이 가장 빠르고 모세혈관이 가장 느리다."}, {"id": "동물과에너지:C-016", "sub": "C", "type_id": "C03", "review_group": "RG13", "role": "reserve", "difficulty": "중", "format": "5지선다", "stem": "동맥과 정맥에 대한 설명으로 옳은 것은?", "choices": ["동맥은 산소가 많은 혈액이, 정맥은 산소가 적은 혈액이 흐르는 혈관이다.", "정맥에서 혈액이 가장 빠르게 흐른다.", "정맥의 벽은 동맥보다 두껍고 탄력이 크다.", "동맥은 심장에서 나가는 혈액이, 정맥은 심장으로 들어오는 혈액이 흐르는 혈관이다.", "혈액은 정맥 → 모세혈관 → 동맥 순으로 흐른다."], "answer": [4], "explanation": "① 동맥과 정맥은 혈액이 흐르는 방향으로 구분한다. 폐동맥에는 산소가 적은 혈액이 흐른다. ② 혈액은 동맥에서 가장 빠르게 흐른다. ③ 동맥의 벽이 더 두껍고 탄력이 커서 높은 혈압을 견딘다. ④ 옳다. ⑤ 심장에서 나온 혈액은 동맥 → 모세혈관 → 정맥 순으로 흐른다."}, {"id": "동물과에너지:C-017", "sub": "C", "type_id": "C06", "review_group": "RG14", "role": "main", "difficulty": "하", "format": "5지선다", "stem": "그림은 사람의 혈액을 현미경으로 관찰했을 때 보이는 혈구 A~C를 나타낸 것이다. A는 가운데가 오목한 원반 모양이고, B는 핵이 있으며, C는 일정한 모양이 없는 작은 조각이다.<br>이에 대한 설명으로 옳은 것은?", "figure_svg": "<svg style=\"background:#fff\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 380 160\" fill=\"none\" stroke=\"#000\" stroke-width=\"1.5\" font-size=\"13\" font-family=\"'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#000\" stroke=\"none\"/><\/marker><\/defs><circle cx=\"70\" cy=\"70\" r=\"30\" fill=\"#000\" fill-opacity=\"0.3\"/><circle cx=\"70\" cy=\"70\" r=\"13\" fill=\"#000\" fill-opacity=\"0.12\" stroke=\"none\"/><text x=\"66\" y=\"130\" fill=\"#000\" stroke=\"none\">A<\/text><circle cx=\"190\" cy=\"70\" r=\"42\" fill=\"#000\" fill-opacity=\"0.08\"/><path d=\"M172,62 q8,-14 18,0 q8,-14 18,0 q4,14 -9,16 q-9,12 -18,0 q-12,0 -9,-16 z\" stroke-width=\"1\" fill=\"#000\"/><text x=\"186\" y=\"130\" fill=\"#000\" stroke=\"none\">B<\/text><path d=\"M300,60 l7,-4 l5,6 l-6,5 z\" stroke-width=\"1\" fill=\"#000\"/><path d=\"M318,78 l6,-3 l3,6 l-6,3 z\" stroke-width=\"1\" fill=\"#000\"/><path d=\"M296,84 l5,0 l2,5 l-6,1 z\" stroke-width=\"1\" fill=\"#000\"/><text x=\"306\" y=\"130\" fill=\"#000\" stroke=\"none\">C<\/text><text x=\"190\" y=\"152\" fill=\"#000\" stroke=\"none\" font-size=\"11\" text-anchor=\"middle\">(현미경으로 본 혈구, 크기 비율은 대략 나타냄)<\/text><\/svg>", "choices": ["A에는 헤모글로빈이 있어 산소를 운반한다.", "A에는 핵이 있다.", "B는 혈구 가운데 수가 가장 많다.", "C는 몸속에 들어온 세균을 잡아먹는다.", "B는 혈구 가운데 크기가 가장 작다."], "answer": [1], "explanation": "A는 적혈구, B는 백혈구, C는 혈소판이다. ① 옳다. ② 적혈구에는 핵이 없다. 혈구 중 핵이 있는 것은 백혈구뿐이다. ③ 혈구 중 수가 가장 많은 것은 적혈구(A)이다. ④ 세균을 잡아먹는 것은 백혈구(B)이고, 혈소판(C)은 혈액 응고에 관여한다. ⑤ 백혈구는 혈구 가운데 크기가 가장 크다."}, {"id": "동물과에너지:C-018", "sub": "C", "type_id": "C06", "review_group": "RG14", "role": "main", "difficulty": "중", "format": "보기형(ㄱㄴㄷ)", "stem": "그림은 굳지 않게 처리한 혈액을 시험관에 넣고 원심분리기로 돌린 뒤의 모습이다. 위층 A는 연한 노란색 액체이고, 아래층 B는 붉은색 층이다.<br>이에 대한 설명으로 옳은 것만을 &lt;보기&gt;에서 있는 대로 고른 것은?", "bogi": ["ㄱ. A는 혈장이며 대부분이 물이다.", "ㄴ. A는 영양소와 이산화 탄소, 노폐물 등을 녹여 운반한다.", "ㄷ. 혈액에서 B가 차지하는 부피가 A보다 크다."], "figure_svg": "<svg style=\"background:#fff\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 330 235\" fill=\"none\" stroke=\"#000\" stroke-width=\"1.5\" font-size=\"13\" font-family=\"'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#000\" stroke=\"none\"/><\/marker><\/defs><path d=\"M90,20 L90,200 Q90,225 115,225 Q140,225 140,200 L140,20\"/><rect x=\"91\" y=\"40\" width=\"48\" height=\"95\" fill=\"#000\" fill-opacity=\"0.08\" stroke=\"none\"/><path d=\"M91,140 L139,140 L139,200 Q139,224 115,224 Q91,224 91,200 Z\" fill=\"#000\" fill-opacity=\"0.5\" stroke=\"none\"/><line x1=\"91\" y1=\"40\" x2=\"139\" y2=\"40\" stroke-width=\"1\"/><line x1=\"91\" y1=\"138\" x2=\"139\" y2=\"138\" stroke-width=\"1\"/><line x1=\"145\" y1=\"88\" x2=\"180\" y2=\"88\" stroke-width=\"1\"/><text x=\"186\" y=\"92\" fill=\"#000\" stroke=\"none\" font-size=\"12\">A (연한 노란색 액체)<\/text><line x1=\"145\" y1=\"185\" x2=\"180\" y2=\"185\" stroke-width=\"1\"/><text x=\"186\" y=\"189\" fill=\"#000\" stroke=\"none\" font-size=\"12\">B (붉은색 층)<\/text><\/svg>", "choices": ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "answer": [3], "explanation": "ㄱ. 옳다. 위층의 연한 노란색 액체 A는 혈장이며 대부분이 물이다. ㄴ. 옳다. 혈장은 영양소, 이산화 탄소, 노폐물 등을 운반한다. ㄷ. 그림에서 A(혈장)가 B(혈구)보다 많은 부피를 차지한다. 혈장은 혈액의 절반 이상을 차지한다."}, {"id": "동물과에너지:C-019", "sub": "C", "type_id": "C06", "review_group": "RG14", "role": "main", "difficulty": "하", "format": "단답형", "stem": "다음 설명에 해당하는 혈액 성분의 이름을 각각 쓰시오.<br>(가) 혈구 가운데 유일하게 핵이 있으며, 크기가 가장 크다.<br>(나) 붉은 색소를 가지고 있어 혈액이 붉게 보이게 한다.<br>(다) 혈액의 액체 성분으로, 이산화 탄소를 녹여 운반한다.", "answer": "(가) 백혈구 (나) 적혈구 (다) 혈장", "scoring": "총 3점. (가) 백혈구, (나) 적혈구, (다) 혈장 각 1점.", "explanation": "(가) 백혈구는 핵이 있고 가장 크다. (나) 적혈구의 헤모글로빈이 붉은색을 띠며 적혈구가 많아 혈액이 붉게 보인다. (다) 혈장은 액체 성분으로 영양소, 이산화 탄소, 노폐물을 운반한다."}, {"id": "동물과에너지:C-020", "sub": "C", "type_id": "C06", "review_group": "RG14", "role": "main", "difficulty": "중", "format": "보기형(ㄱㄴㄷ)", "stem": "표는 혈액을 이루는 성분 (가)~(라)의 특징을 나타낸 것이다. (가)~(라)는 각각 혈장, 적혈구, 백혈구, 혈소판 중 하나이다.<br>이에 대한 설명으로 옳은 것만을 &lt;보기&gt;에서 있는 대로 고른 것은?", "bogi": ["ㄱ. 산소는 주로 (가)에 녹아 운반된다.", "ㄴ. (다)는 몸속에 들어온 세균을 잡아먹는다.", "ㄷ. (라)가 부족하면 상처가 났을 때 피가 잘 멈추지 않는다."], "table": {"h": ["성분", "혈구인가?", "핵", "특징"], "r": [["(가)", "아니요(액체 성분)", "-", "혈액 부피의 절반 이상을 차지한다."], ["(나)", "예", "없음", "혈구 가운데 수가 가장 많다."], ["(다)", "예", "있음", "혈구 가운데 크기가 가장 크다."], ["(라)", "예", "없음", "혈구 가운데 크기가 가장 작다."]]}, "choices": ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "answer": [4], "explanation": "(가)는 혈장, (나)는 적혈구, (다)는 백혈구, (라)는 혈소판이다. ㄱ. 산소는 적혈구(나)가 운반한다. 혈장은 영양소, 이산화 탄소, 노폐물 등을 운반한다. ㄴ. 옳다. 백혈구는 식균 작용을 한다. ㄷ. 옳다. 혈소판은 혈액 응고에 관여하므로 부족하면 출혈이 잘 멈추지 않는다."}, {"id": "동물과에너지:C-021", "sub": "C", "type_id": "C06", "review_group": "RG14", "role": "reserve", "difficulty": "중", "format": "서술형", "stem": "혈액이 붉은색으로 보이는 까닭을 <u>혈구의 이름<\/u>과 <u>그 혈구에 들어 있는 물질<\/u>을 포함하여 서술하시오.", "answer": "적혈구에는 붉은 색소인 헤모글로빈이 들어 있고, 혈구 가운데 적혈구의 수가 가장 많기 때문에 혈액이 붉게 보인다.", "scoring": "총 2점. 적혈구 1점 + 붉은 색소인 헤모글로빈이 들어 있다 1점(헤모글로빈 이름 없이 '붉은 색소'만 쓰면 인정하지 않음). '혈구 가운데 적혈구 수가 가장 많다'는 덧붙여 써도 감점·가점 없음. 백혈구나 혈장을 쓰면 0점.", "explanation": "학교 관례에 따라 '적혈구가 많고 적혈구에 붉은 헤모글로빈이 있기 때문'을 정답으로 한다."}, {"id": "동물과에너지:C-022", "sub": "C", "type_id": "C06", "review_group": "RG14", "role": "reserve", "difficulty": "하", "format": "5지선다", "stem": "혈장에 대한 설명으로 옳지 <u>않은<\/u> 것은?", "choices": ["혈액의 액체 성분이다.", "혈장의 대부분은 물이다.", "영양소와 노폐물을 운반한다.", "혈장 속 가장 많은 성분은 단백질이다.", "원심분리하면 혈구보다 위쪽에 모인다."], "answer": [4], "explanation": "① 혈장은 혈액의 액체 성분이다. ② 혈장의 대부분은 물이다. ③ 혈장은 영양소, 이산화 탄소, 노폐물 등을 운반한다. ④ 혈장에 가장 많은 성분은 물이므로 옳지 않다. ⑤ 혈장은 연한 노란색 액체로 위층에 모인다."}, {"id": "동물과에너지:C-023", "sub": "C", "type_id": "C07", "review_group": "RG15", "role": "main", "difficulty": "중", "format": "5지선다", "stem": "표는 학생 갑~병의 혈액 검사 결과를 나타낸 것이다. 값은 혈구 종류마다 건강한 사람의 평균을 100으로 놓은 상댓값이며, 정상 범위는 80~120이다.<br>이에 대한 해석으로 옳은 것은? (단, 제시된 혈구 외의 조건은 모두 정상이다.)", "table": {"h": ["구분", "적혈구", "백혈구", "혈소판"], "r": [["갑", "55", "100", "95"], ["을", "105", "190", "110"], ["병", "98", "90", "35"]]}, "choices": ["갑은 백혈구 수가 적어 빈혈 증상이 나타날 수 있다.", "을은 몸에 세균이 침입하여 염증이 생겼을 가능성이 있다.", "병은 적혈구가 부족하여 산소 운반 능력이 떨어진다.", "몸에 염증이 생기면 백혈구 수가 줄어드는데, 이에 해당하는 학생은 병이다.", "갑은 혈소판 수치가 정상 범위를 벗어나 상처에서 피가 잘 멈추지 않는다."], "answer": [2], "explanation": "① 갑은 적혈구가 정상 범위보다 적어 빈혈이 나타날 수 있다. 백혈구는 정상이다. ② 옳다. 을은 백혈구가 정상 범위보다 많으므로 세균 침입에 따른 염증이 의심된다. ③ 병의 적혈구는 정상 범위이며, 혈소판이 적어 피가 잘 멈추지 않을 수 있다. ④ 염증이 생기면 백혈구가 늘어난다. 병의 백혈구는 정상 범위이다. ⑤ 갑의 혈소판은 95로 정상 범위 안이다."}, {"id": "동물과에너지:C-024", "sub": "C", "type_id": "C07", "review_group": "RG15", "role": "main", "difficulty": "상", "format": "보기형(ㄱㄴㄷ)", "stem": "표는 평지에 사는 사람 A와, 공기 중 산소가 희박한 고산지대에서 오래 살아온 사람 B의 같은 부피 혈액 속 적혈구 수를 상댓값으로 나타낸 것이다.<br>이에 대한 설명으로 옳은 것만을 &lt;보기&gt;에서 있는 대로 고른 것은? (단, 두 사람의 적혈구 하나에 들어 있는 헤모글로빈의 양은 같다.)", "bogi": ["ㄱ. B의 적혈구 수가 많은 것은 산소가 희박한 환경에 적응한 결과로 볼 수 있다.", "ㄴ. 평지에 살던 A가 고산지대로 옮겨 가 오랫동안 살면 적혈구 수가 지금보다 늘어날 것이다.", "ㄷ. 같은 부피의 혈액이 운반할 수 있는 산소의 양은 B가 A보다 적다."], "table": {"h": ["구분", "사는 곳", "적혈구 수(상댓값)"], "r": [["A", "평지", "100"], ["B", "고산지대", "140"]]}, "choices": ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "answer": [3], "explanation": "ㄱ. 옳다. 산소가 희박한 곳에서는 산소를 운반하는 적혈구가 많아지도록 적응한다. ㄴ. 옳다. 평지 사람도 고산지대에 오래 머물면 적혈구 수가 늘어난다. ㄷ. 헤모글로빈 양이 같은 적혈구가 B에 더 많으므로, 같은 부피 혈액이 운반할 수 있는 산소의 양은 B가 더 많다."}, {"id": "동물과에너지:C-025", "sub": "C", "type_id": "C07", "review_group": "RG15", "role": "main", "difficulty": "중", "format": "서술형", "stem": "어떤 사람이 혈액 검사에서 다른 혈구는 정상이고 적혈구 수만 정상 범위보다 적게 나왔다. 이 사람에게 나타날 수 있는 증상을 한 가지 쓰고, 그 까닭을 적혈구의 기능과 관련지어 서술하시오.", "answer": "쉽게 피로하거나 어지럽고 숨이 찰 수 있다(빈혈). 적혈구는 산소를 운반하는데, 적혈구가 적으면 조직 세포에 산소가 충분히 공급되지 않아 세포호흡으로 얻는 에너지가 부족해지기 때문이다.", "scoring": "총 3점. 증상 1점(쉽게 피로함·어지러움·숨참 등 하나, '빈혈'은 질환 이름이므로 '빈혈'만 쓰면 0점) + 적혈구는 산소를 운반한다 1점 + 조직 세포에 산소가 충분히 공급되지 않는다 1점. 적혈구가 세균을 막거나 혈액 응고를 한다고 쓰면 0점.", "explanation": "적혈구의 헤모글로빈이 산소를 운반한다. 적혈구가 부족하면 산소 공급이 줄어 빈혈 증상이 나타난다."}, {"id": "동물과에너지:C-026", "sub": "C", "type_id": "C08", "review_group": "RG15", "role": "reserve", "difficulty": "상", "format": "5지선다", "stem": "그래프는 주변의 산소 농도에 따라 산소와 결합한 헤모글로빈의 비율을 나타낸 것이다. P와 Q는 각각 폐의 모세혈관과 조직 세포 주변의 모세혈관 중 하나의 산소 농도이다.<br>이에 대한 설명으로 옳지 <u>않은<\/u> 것은?", "figure_svg": "<svg xmlns:xlink=\"http://www.w3.org/1999/xlink\" width=\"316.8pt\" height=\"208.8pt\" viewBox=\"0 0 316.8 208.8\" xmlns=\"http://www.w3.org/2000/svg\" version=\"1.1\" style=\"background:#fff\">\n <metadata>\n  <rdf:RDF xmlns:dc=\"http://purl.org/dc/elements/1.1/\" xmlns:cc=\"http://creativecommons.org/ns#\" xmlns:rdf=\"http://www.w3.org/1999/02/22-rdf-syntax-ns#\">\n   <cc:Work>\n    <dc:type rdf:resource=\"http://purl.org/dc/dcmitype/StillImage\"/>\n    <dc:date>2026-10-26T20:07:43.976125<\/dc:date>\n    <dc:format>image/svg+xml<\/dc:format>\n    <dc:creator>\n     <cc:Agent>\n      <dc:title>Matplotlib v3.10.3, https://matplotlib.org/<\/dc:title>\n     <\/cc:Agent>\n    <\/dc:creator>\n   <\/cc:Work>\n  <\/rdf:RDF>\n <\/metadata>\n <defs>\n  <style type=\"text/css\">*{stroke-linejoin: round; stroke-linecap: butt}<\/style>\n <\/defs>\n <g id=\"figure_1\">\n  <g id=\"patch_1\">\n   <path d=\"M 0 208.8 \nL 316.8 208.8 \nL 316.8 0 \nL 0 0 \nz\n\" style=\"fill: #ffffff\"/>\n  <\/g>\n  <g id=\"axes_1\">\n   <g id=\"patch_2\">\n    <path d=\"M 11.88 170.22 \nL 304.92 170.22 \nL 304.92 30.4788 \nL 11.88 30.4788 \nz\n\" style=\"fill: #ffffff\"/>\n   <\/g>\n   <g id=\"matplotlib.axis_1\">\n    <g id=\"xtick_1\">\n     <g id=\"line2d_1\"/>\n     <g id=\"text_1\">\n e: 11px; font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif'Malgun Gothic'; text-anchor: start\" x=\"11.88\" y=\"20.891271\" transform=\"rotate(-0 11.88 20.891271)\">산소와 결합한 헤모글로빈의 비율<\/text>\n   <\/g>\n   <g id=\"text_5\">\n    <text style=\"font-size: 11px; font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif'Malgun Gothic'; text-anchor: end\" x=\"71.883429\" y=\"143.083179\" transform=\"rotate(-0 71.883429 143.083179)\">P<\/text>\n   <\/g>\n   <g id=\"text_6\">\n    <text style=\"font-size: 11px; font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif'Malgun Gothic'; text-anchor: end\" x=\"249.102857\" y=\"34.329015\" transform=\"rotate(-0 249.102857 34.329015)\">Q<\/text>\n   <\/g>\n  <\/g>\n <\/g>\n <defs>\n  <clipPath id=\"p10e4427ce5\">\n   <rect x=\"11.88\" y=\"30.4788\" width=\"293.04\" height=\"139.7412\"/>\n  <\/clipPath>\n <\/defs>\n<\/svg>\n", "choices": ["헤모글로빈은 적혈구에 들어 있다.", "Q는 폐의 모세혈관의 산소 농도에 해당한다.", "헤모글로빈은 산소 농도가 낮은 곳에서 산소와 잘 결합한다.", "혈액이 Q에서 P로 가면 헤모글로빈에서 떨어져 나온 산소가 조직 세포로 이동한다.", "산소 농도가 높을수록 산소와 결합한 헤모글로빈의 비율이 높다."], "answer": [3], "explanation": "① 헤모글로빈은 적혈구 속 붉은 색소이다. ② 폐의 모세혈관은 산소 농도가 높으므로 Q에 해당한다. ③ 그래프에서 산소 농도가 낮을수록 결합 비율이 낮으므로, 헤모글로빈은 산소가 많은 곳에서 결합하고 적은 곳에서 산소를 내놓는다. 옳지 않다. ④ 조직(P)에서는 헤모글로빈에서 떨어진 산소가 확산하여 조직 세포로 들어간다. ⑤ 그래프에서 확인할 수 있다.", "textbook_tags": {"mode": "include_only", "books": ["비상"]}}, {"id": "동물과에너지:C-027", "sub": "C", "type_id": "C07", "review_group": "RG15", "role": "reserve", "difficulty": "중", "format": "단답형", "stem": "다음은 서로 다른 두 사람의 혈액 검사 결과를 간단히 적은 것이다. 각 사람에게서 정상 범위를 벗어난 혈구의 이름을 쓰시오.<br>(가) 감기에 걸려 열이 나는데, 세균과 싸우는 혈구가 정상보다 많이 늘어 있었다.<br>(나) 작은 상처에도 피가 오래 멈추지 않았는데, 혈액을 굳게 하는 데 관여하는 혈구가 정상보다 적었다.", "answer": "(가) 백혈구 (나) 혈소판", "scoring": "총 2점. (가) 백혈구 1점, (나) 혈소판 1점.", "explanation": "(가) 세균이 들어오면 식균 작용을 하는 백혈구가 늘어난다. (나) 혈소판이 부족하면 혈액이 잘 응고되지 않는다."}, {"id": "동물과에너지:C-028", "sub": "C", "type_id": "C09", "review_group": "RG16", "role": "main", "difficulty": "하", "format": "5지선다", "stem": "허파순환에서 혈액이 흐르는 경로를 옳게 나타낸 것은?", "choices": ["좌심실 → 폐동맥 → 폐의 모세혈관 → 폐정맥 → 우심방", "우심실 → 폐동맥 → 폐의 모세혈관 → 폐정맥 → 좌심방", "좌심실 → 대동맥 → 온몸의 모세혈관 → 대정맥 → 우심방", "우심실 → 폐정맥 → 폐의 모세혈관 → 폐동맥 → 좌심방", "우심방 → 대정맥 → 폐의 모세혈관 → 폐정맥 → 좌심실"], "answer": [2], "explanation": "① 허파순환은 좌심실이 아니라 우심실에서 시작하고 좌심방으로 돌아온다. ② 옳다. ③ 온몸순환의 경로이다. ④ 우심실과 연결된 혈관은 폐동맥이고, 좌심방으로 들어오는 혈관은 폐정맥이다. ⑤ 순환은 심실에서 동맥으로 혈액이 나가며 시작한다."}, {"id": "동물과에너지:C-029", "sub": "C", "type_id": "C09", "review_group": "RG16", "role": "main", "difficulty": "중", "format": "순서배열", "stem": "그림은 사람의 혈액 순환 경로를 나타낸 것이다. A~D는 심장의 네 방이고, ㉠~㉣은 혈관이다.<br>온몸순환 경로를 그림의 기호로 옳게 나타낸 것은?", "figure_svg": "<svg style=\"background:#fff\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 380 350\" fill=\"none\" stroke=\"#000\" stroke-width=\"1.5\" font-size=\"13\" font-family=\"'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#000\" stroke=\"none\"/><\/marker><\/defs><rect x=\"120\" y=\"10\" width=\"140\" height=\"40\" rx=\"6\"/><text x=\"190\" y=\"35\" fill=\"#000\" stroke=\"none\" font-size=\"12\" text-anchor=\"middle\">폐의 모세혈관<\/text><rect x=\"120\" y=\"300\" width=\"140\" height=\"40\" rx=\"6\"/><text x=\"190\" y=\"325\" fill=\"#000\" stroke=\"none\" font-size=\"12\" text-anchor=\"middle\">온몸의 모세혈관<\/text><rect x=\"140\" y=\"110\" width=\"50\" height=\"45\" rx=\"6\"/><rect x=\"200\" y=\"110\" width=\"50\" height=\"45\" rx=\"6\"/><rect x=\"140\" y=\"163\" width=\"50\" height=\"70\" rx=\"8\" stroke-width=\"2.5\"/><rect x=\"200\" y=\"163\" width=\"50\" height=\"70\" rx=\"8\" stroke-width=\"4\"/><text x=\"160\" y=\"138\" fill=\"#000\" stroke=\"none\">A<\/text><text x=\"220\" y=\"138\" fill=\"#000\" stroke=\"none\">C<\/text><text x=\"160\" y=\"203\" fill=\"#000\" stroke=\"none\">B<\/text><text x=\"220\" y=\"203\" fill=\"#000\" stroke=\"none\">D<\/text><path d=\"M140,205 L80,205 L80,30 L118,30\" marker-end=\"url(#ar)\" stroke-width=\"2.5\"/><text x=\"62\" y=\"90\" fill=\"#000\" stroke=\"none\">㉡<\/text><path d=\"M118,320 L40,320 L40,132 L72,132\" stroke-width=\"2.5\"/><path d=\"M88,132 L138,132\" marker-end=\"url(#ar)\" stroke-width=\"2.5\"/><text x=\"22\" y=\"240\" fill=\"#000\" stroke=\"none\">㉠<\/text><path d=\"M262,30 L300,30 L300,132 L252,132\" marker-end=\"url(#ar)\" stroke-width=\"2.5\"/><text x=\"306\" y=\"90\" fill=\"#000\" stroke=\"none\">㉢<\/text><path d=\"M250,205 L340,205 L340,320 L262,320\" marker-end=\"url(#ar)\" stroke-width=\"2.5\"/><text x=\"346\" y=\"270\" fill=\"#000\" stroke=\"none\">㉣<\/text><text x=\"195\" y=\"260\" fill=\"#000\" stroke=\"none\" font-size=\"10\" text-anchor=\"middle\">(그림의 왼쪽이 몸의 오른쪽)<\/text><\/svg>", "choices": ["B → ㉡ → 폐의 모세혈관 → ㉢ → C", "D → ㉣ → 온몸의 모세혈관 → ㉠ → A", "A → ㉠ → 온몸의 모세혈관 → ㉣ → D", "C → ㉢ → 온몸의 모세혈관 → ㉠ → B", "D → ㉣ → 온몸의 모세혈관 → ㉠ → C"], "answer": [2], "explanation": "온몸순환은 좌심실(D) → 대동맥(㉣) → 온몸의 모세혈관 → 대정맥(㉠) → 우심방(A)이다. ① 허파순환 경로이다. ③ 방향이 거꾸로이다. ④ 좌심방(C)은 혈액을 받는 방이며 온몸순환을 시작하지 않는다. ⑤ 온몸을 돌고 온 혈액은 좌심방이 아니라 우심방(A)으로 들어온다.", "stimulus_group": "SG-C-순환경로그림"}, {"id": "동물과에너지:C-030", "sub": "C", "type_id": "C09", "review_group": "RG16", "role": "main", "difficulty": "중", "format": "보기형(ㄱㄴㄷ)", "stem": "사람의 온몸순환과 허파순환에 대한 설명으로 옳은 것만을 &lt;보기&gt;에서 있는 대로 고른 것은?", "bogi": ["ㄱ. 온몸순환은 우심실에서 시작하여 좌심방으로 돌아온다.", "ㄴ. 허파순환을 거치는 동안 혈액 속 산소의 양이 늘어난다.", "ㄷ. 두 순환은 심장을 통해 이어져 있어, 혈액은 온몸순환과 허파순환을 번갈아 거친다."], "choices": ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "answer": [4], "explanation": "ㄱ. 온몸순환은 좌심실에서 시작하여 우심방으로 돌아온다. ㄴ. 옳다. 허파순환에서 정맥혈이 폐에서 산소를 받아 동맥혈이 된다. ㄷ. 옳다. 온몸순환을 마친 혈액은 우심방→우심실로 가서 허파순환을 시작하고, 허파순환을 마친 혈액은 좌심방→좌심실로 가서 다시 온몸순환을 시작한다."}, {"id": "동물과에너지:C-031", "sub": "C", "type_id": "C09", "review_group": "RG16", "role": "reserve", "difficulty": "상", "format": "서술형", "stem": "온몸순환과 허파순환의 역할을 각각 쓰고, 각 순환을 거치는 동안 혈액이 동맥혈과 정맥혈 중 무엇에서 무엇으로 바뀌는지 서술하시오.", "answer": "온몸순환은 온몸의 조직 세포에 산소와 영양소를 공급하고 이산화 탄소와 노폐물을 받아 오는 순환으로, 동맥혈이 정맥혈로 바뀐다. 허파순환은 폐에서 이산화 탄소를 내보내고 산소를 받아 오는 순환으로, 정맥혈이 동맥혈로 바뀐다.", "scoring": "총 4점. 역할 2점(온몸순환·허파순환 각 1점) + 혈액 변화 2점(온몸순환 동맥혈→정맥혈 1점, 허파순환 정맥혈→동맥혈 1점). '허파순환' 대신 '폐순환' 인정. 두 순환의 혈액 변화를 맞바꾸면 혈액 변화 0점.", "explanation": "온몸순환에서는 조직 세포에 산소를 주고 이산화 탄소를 받으며, 허파순환에서는 폐에서 산소를 받고 이산화 탄소를 내보낸다."}, {"id": "동물과에너지:C-032", "sub": "C", "type_id": "C09", "review_group": "RG16", "role": "reserve", "difficulty": "하", "format": "단답형", "stem": "다음은 온몸순환 경로이다. ㉠과 ㉡에 알맞은 혈관의 이름을 쓰시오.<br>좌심실 → ( ㉠ ) → 온몸의 모세혈관 → ( ㉡ ) → 우심방", "answer": "㉠ 대동맥 ㉡ 대정맥", "scoring": "총 2점. ㉠ 대동맥 1점, ㉡ 대정맥 1점.", "explanation": "좌심실에서 나간 혈액은 대동맥을 거쳐 온몸의 모세혈관으로 가고, 대정맥을 거쳐 우심방으로 돌아온다."}, {"id": "동물과에너지:C-033", "sub": "C", "type_id": "C10", "review_group": "RG17", "role": "main", "difficulty": "상", "format": "보기형(ㄱㄴㄷ)", "stem": "그림은 사람의 혈액 순환 경로를 나타낸 것이다. A~D는 심장의 네 방이고, ㉠~㉣은 혈관이다.<br>이에 대한 설명으로 옳은 것만을 &lt;보기&gt;에서 있는 대로 고른 것은?", "bogi": ["ㄱ. ㉡과 ㉢ 가운데 산소가 더 많은 혈액이 흐르는 혈관은 ㉡이다.", "ㄴ. B에는 정맥혈이 흐른다.", "ㄷ. ㉢과 ㉣에는 모두 동맥혈이 흐른다."], "figure_svg": "<svg style=\"background:#fff\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 380 350\" fill=\"none\" stroke=\"#000\" stroke-width=\"1.5\" font-size=\"13\" font-family=\"'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#000\" stroke=\"none\"/><\/marker><\/defs><rect x=\"120\" y=\"10\" width=\"140\" height=\"40\" rx=\"6\"/><text x=\"190\" y=\"35\" fill=\"#000\" stroke=\"none\" font-size=\"12\" text-anchor=\"middle\">폐의 모세혈관<\/text><rect x=\"120\" y=\"300\" width=\"140\" height=\"40\" rx=\"6\"/><text x=\"190\" y=\"325\" fill=\"#000\" stroke=\"none\" font-size=\"12\" text-anchor=\"middle\">온몸의 모세혈관<\/text><rect x=\"140\" y=\"110\" width=\"50\" height=\"45\" rx=\"6\"/><rect x=\"200\" y=\"110\" width=\"50\" height=\"45\" rx=\"6\" <g id=\"patch_4\">\n    <path d=\"M 71.6 128.9736 \nL 378.81 128.9736 \n\" style=\"fill: none; stroke: #000000; stroke-linejoin: miter; stroke-linecap: square\"/>\n   <\/g>\n   <g id=\"text_9\">\n    <text style=\"font-size: 8px; font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif'Malgun Gothic'; text-anchor: middle\" x=\"225.205\" y=\"168.74568\" transform=\"rotate(-0 225.205 168.74568)\">혈액이 흐르는 경로: 좌심실 → (가) → X → (나) → 우심방·우심실 → (다) → Y → (라) → 좌심방<\/text>\n   <\/g>\n  <\/g>\n <\/g>\n <defs>\n  <clipPath id=\"pc3b3c48b94\">\n   <rect x=\"71.6\" y=\"17.4\" width=\"307.21\" height=\"111.5736\"/>\n  <\/clipPath>\n <\/defs>\n<\/svg>\n", "choices": ["ㄱ, ㄴ", "ㄴ, ㄷ", "ㄷ, ㄹ", "ㄱ, ㄴ, ㄹ", "ㄴ, ㄷ, ㄹ"], "answer": [5], "explanation": "X를 지나며 산소량이 줄었으므로 X는 온몸 조직의 모세혈관, Y를 지나며 늘었으므로 Y는 폐의 모세혈관이다. 따라서 (가)는 대동맥, (나)는 대정맥, (다)는 폐동맥, (라)는 폐정맥이다. ㄱ. X에서 산소가 줄었으므로 온몸 조직의 모세혈관이다. ㄴ. 옳다. (다) 폐동맥에는 온몸을 돌고 온 정맥혈이 흐른다. ㄷ. 옳다. (라) 폐정맥의 혈액은 폐에서 이산화 탄소를 내보냈으므로 (나) 대정맥의 혈액보다 이산화 탄소가 적다. ㄹ. 옳다. (나)는 대정맥이므로 팔과 다리에서 (나)로 혈액을 모아 오는 혈관은 정맥이고, 팔다리의 정맥에는 판막이 있다."}, {"id": "동물과에너지:C-035", "sub": "C", "type_id": "C10", "review_group": "RG17", "role": "main", "difficulty": "상", "format": "서술형", "stem": "폐동맥은 이름에 '동맥'이 들어가지만 산소가 적은 정맥혈이 흐른다. (1) 이 혈관을 '동맥'이라고 부르는 까닭과 (2) 이 혈관에 정맥혈이 흐르는 까닭을 서술하시오.", "answer": "(1) 동맥과 정맥은 혈액이 흐르는 방향으로 구분하는데, 폐동맥은 심장(우심실)에서 나가는 혈액이 흐르므로 동맥이다. (2) 폐동맥의 혈액은 온몸을 돌며 조직 세포에 산소를 주고 이산화 탄소를 받아 우심방·우심실로 돌아온 혈액이 폐로 가는 것이므로, 산소가 적은 정맥혈이다.", "scoring": "총 2점. (1) 1점: 동맥·정맥은 혈액이 흐르는 방향으로 구분하며 폐동맥은 심장(우심실)에서 나가는 혈액이 흐른다. (2) 1점: 온몸을 돌고 온 혈액이 폐로 가는 중이라 산소가 적다. '산소가 많아서 동맥'이라고 쓰면 (1) 0점.", "explanation": "동맥·정맥은 산소량이 아니라 혈류 방향으로 이름 붙인다. 폐동맥은 우심실에서 나가지만 그 혈액은 온몸순환을 마친 정맥혈이다."}, {"id": "동물과에너지:C-036", "sub": "C", "type_id": "C10", "review_group": "RG17", "role": "reserve", "difficulty": "중", "format": "단답형", "stem": "그림은 사람의 혈액 순환 경로를 나타낸 것이다. A~D는 심장의 네 방이고, ㉠~㉣은 혈관이다. 동맥혈이 흐르는 곳의 기호를 <u>모두<\/u> 쓰시오.", "figure_svg": "<svg style=\"background:#fff\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 380 350\" fill=\"none\" stroke=\"#000\" stroke-width=\"1.5\" font-size=\"13\" font-family=\"'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#000\" stroke=\"none\"/><\/marker><\/defs><rect x=\"120\" y=\"10\" width=\"140\" height=\"40\" rx=\"6\"/><text x=\"190\" y=\"35\" fill=\"#000\" stroke=\"none\" font-size=\"12\" text-anchor=\"middle\">폐의 모세혈관<\/text><rect x=\"120\" y=\"300\" width=\"140\" height=\"40\" rx=\"6\"/><text x=\"190\" y=\"325\" fill=\"#000\" stroke=\"none\" font-size=\"12\" text-anchor=\"middle\">온몸의 모세혈관<\/text><rect x=\"140\" y=\"110\" width=\"50\" height=\"45\" rx=\"6\"/><rect x=\"200\" y=\"110\" width=\"50\" height=\"45\" rx=\"6\"/><rect x=\"140\" y=\"163\" width=\"50\" height=\"70\" rx=\"8\" stroke-width=\"2.5\"/><rect x=\"200\" y=\"163\" width=\"50\" height=\"70\" rx=\"8\" stroke-width=\"4\"/><text x=\"160\" y=\"138\" fill=\"#000\" stroke=\"none\">A<\/text><text x=\"220\" y=\"138\" fill=\"#000\" stroke=\"none\">C<\/text><text x=\"160\" y=\"203\" fill=\"#000\" stroke=\"none\">B<\/text><text x=\"220\" y=\"203\" fill=\"#000\" stroke=\"none\">D<\/text><path d=\"M140,205 L80,205 L80,30 L118,30\" marker-end=\"url(#ar)\" stroke-width=\"2.5\"/><text x=\"62\" y=\"90\" fill=\"#000\" stroke=\"none\">㉡<\/text><path d=\"M118,320 L40,320 L40,132 L72,132\" stroke-width=\"2.5\"/><path d=\"M88,132 L138,132\" marker-end=\"url(#ar)\" stroke-width=\"2.5\"/><text x=\"22\" y=\"240\" fill=\"#000\" stroke=\"none\">㉠<\/text><path d=\"M262,30 L300,30 L300,132 L252,132\" marker-end=\"url(#ar)\" stroke-width=\"2.5\"/><text x=\"306\" y=\"90\" fill=\"#000\" stroke=\"none\">㉢<\/text><path d=\"M250,205 L340,205 L340,320 L262,320\" marker-end=\"url(#ar)\" stroke-width=\"2.5\"/><text x=\"346\" y=\"270\" fill=\"#000\" stroke=\"none\">㉣<\/text><text x=\"195\" y=\"260\" fill=\"#000\" stroke=\"none\" font-size=\"10\" text-anchor=\"middle\">(그림의 왼쪽이 몸의 오른쪽)<\/text><\/svg>", "answer": "C, D, ㉢, ㉣", "scoring": "총 1점. C, D, ㉢, ㉣ 네 기호를 모두 쓰고 다른 기호를 넣지 않아야 정답.", "explanation": "폐에서 산소를 받은 혈액은 폐정맥(㉢) → 좌심방(C) → 좌심실(D) → 대동맥(㉣)으로 흐르므로 이곳에 동맥혈이 흐른다. 오른쪽 심장(A, B), 대정맥(㉠), 폐동맥(㉡)에는 정맥혈이 흐른다.", "stimulus_group": "SG-C-순환경로그림"}, {"id": "동물과에너지:C-037", "sub": "C", "type_id": "C10", "review_group": "RG17", "role": "reserve", "difficulty": "하", "format": "5지선다", "stem": "다음 중 산소가 가장 많은 혈액이 흐르는 곳은?", "choices": ["대정맥", "우심방", "폐동맥", "폐정맥", "우심실"], "answer": [4], "explanation": "폐정맥에는 폐에서 산소를 받은 동맥혈이 흐른다. 대정맥, 우심방, 우심실, 폐동맥에는 온몸을 돌고 온 정맥혈이 흐른다."}, {"id": "동물과에너지:C-038", "sub": "C", "type_id": "C11", "review_group": "RG29", "role": "main", "difficulty": "하", "format": "단답형", "stem": "손목이나 목에 손가락을 대면 혈관이 규칙적으로 뛰는 것을 느낄 수 있다. 이것을 맥박이라고 한다. (1) 맥박을 느낄 수 있는 혈관의 종류를 쓰고, (2) 맥박을 일으키는 심장의 방을 쓰시오.", "answer": "(1) 동맥 (2) 좌심실(또는 심실)", "scoring": "총 2점. (1) '동맥' 1점. (2) '좌심실' 또는 '심실' 1점(발문이 '심장의 방'이므로 둘 다 정답). 정맥, 우심실, 심방, 좌심방을 쓰면 해당 문항 0점.", "explanation": "좌심실이 수축하여 대동맥으로 혈액을 세게 내보낼 때마다 동맥이 규칙적으로 뛰는 것이 맥박이다. 따라서 맥박 수는 심장 박동 수와 같다."}, {"id": "동물과에너지:C-039", "sub": "C", "type_id": "C11", "review_group": "RG29", "role": "main", "difficulty": "중", "format": "보기형(ㄱㄴㄷ)", "stem": "표는 학생 A와 B가 활동을 바꾸어 가며 1분 동안의 맥박 수를 측정한 결과이다.<br>이에 대한 설명으로 옳은 것만을 &lt;보기&gt;에서 있는 대로 고른 것은?", "bogi": ["ㄱ. 두 학생 모두 운동이 격렬할수록 맥박 수가 많아졌다.", "ㄴ. 줄넘기 직후 학생 B의 심장은 1분에 약 150번 뛰었다.", "ㄷ. 맥박 수가 늘어난 것은 근육에 산소와 영양소를 더 빨리 공급하기 위해서이다."], "table": {"h": ["활동", "학생 A(회/분)", "학생 B(회/분)"], "r": [["의자에 앉아 쉬기", "72", "78"], ["3분 동안 제자리 걷기 직후", "96", "104"], ["3분 동안 줄넘기 직후", "138", "150"]]}, "choices": ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "answer": [5], "explanation": "ㄱ. 옳다. 쉬기 < 제자리 걷기 < 줄넘기 순으로 맥박 수가 많아졌다. ㄴ. 옳다. 맥박 수는 심장 박동 수와 같으므로 약 150번 뛰었다. ㄷ. 옳다. 운동하면 근육의 세포호흡이 늘어 더 많은 산소와 영양소가 필요하므로 심장 박동이 빨라진다."}, {"id": "동물과에너지:C-040", "sub": "C", "type_id": "C11", "review_group": "RG29", "role": "reserve", "difficulty": "중", "format": "서술형", "stem": "어떤 학생이 1분 동안 손목의 맥박 수와 청진기로 들은 심장 박동 수를 동시에 세었더니 두 값이 같았다. 맥박 수와 심장 박동 수가 같은 까닭을 맥박이 생기는 과정과 관련지어 서술하시오.", "answer": "맥박은 심실(좌심실)이 수축하여 혈액을 동맥으로 세게 내보낼 때마다 동맥 벽이 늘어났다 줄어들며 뛰는 것이다. 심장이 한 번 뛸 때마다 맥박이 한 번 생기므로 맥박 수와 심장 박동 수가 같다.", "scoring": "총 2점. 심실(좌심실)이 수축하여 혈액을 동맥으로 내보낼 때 동맥 벽이 뛴다 1점 + 심장이 한 번 뛸 때 맥박이 한 번 생긴다 1점. 정맥에서 맥박이 생긴다고 쓰면 0점.", "explanation": "맥박의 원인은 심실의 수축이다. 그래서 맥박을 재면 심장 박동 수를 알 수 있다."}, {"id": "동물과에너지:C-041", "sub": "C", "type_id": "C11", "review_group": "RG29", "role": "reserve", "difficulty": "하", "format": "5지선다", "stem": "맥박에 대한 설명으로 옳은 것은?", "choices": ["1분 동안의 맥박 수는 1분 동안의 심장 박동 수와 같다.", "맥박은 정맥에서만 느낄 수 있다.", "맥박은 우심방이 수축할 때 생긴다.", "건강한 사람의 맥박 수는 활동과 관계없이 항상 일정하다.", "운동을 하면 맥박 수가 줄어든다."], "answer": [1], "explanation": "① 옳다. ② 맥박은 동맥에서 느낀다. ③ 맥박은 심실(좌심실)이 수축하여 혈액을 동맥으로 내보낼 때 생긴다. ④ 맥박 수는 활동에 따라 달라진다. ⑤ 운동을 하면 맥박 수가 늘어난다."}, {"id": "동물과에너지:C-042", "sub": "C", "type_id": "C11", "review_group": "RG29", "role": "reserve", "difficulty": "상", "format": "5지선다", "stem": "표는 한 학생이 활동 (가)~(다)를 한 직후 손목에서 <u>15초 동안<\/u> 센 맥박 수이다.<br>이에 대한 설명으로 옳은 것은?", "table": {"h": ["활동", "15초 동안의 맥박 수(회)"], "r": [["(가) 누워서 쉬기", "17"], ["(나) 계단 오르기 5분", "28"], ["(다) 빠르게 달리기 5분", "37"]]}, "choices": ["(가) 직후 1분 동안의 심장 박동 수는 약 17회이다.", "(나) 직후의 맥박 수는 1분에 약 112회이다.", "(다) 직후의 맥박 수는 (가) 직후의 약 4배이다.", "맥박 수가 가장 적은 (가)에서 근육의 세포호흡이 가장 활발하다.", "(다) 직후 1분 동안의 심장 박동 수는 맥박 수보다 많다."], "answer": [2], "explanation": "① 15초 값에 4를 곱해야 하므로 1분에 약 68회이다. ② 옳다. 28 × 4 = 112회이다. ③ (다)는 37, (가)는 17로 약 2.2배이다. ④ 맥박이 많을수록 근육의 세포호흡이 활발하므로 (다)에서 가장 활발하다. ⑤ 맥박은 심실이 수축할 때마다 생기므로 맥박 수와 심장 박동 수는 같다."}, {"id": "동물과에너지:D-001", "sub": "D", "type_id": "D01", "review_group": "RG18", "role": "main", "difficulty": "하", "format": "5지선다", "stem": "그림은 사람의 호흡 기관을 나타낸 것이다. A는 숨관, B는 숨관가지, C는 폐(허파), D는 가로막, E는 갈비뼈이다.<br>이에 대한 설명으로 옳은 것은?", "figure_svg": "<svg style=\"background:#fff\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 380 280\" fill=\"none\" stroke=\"#000\" stroke-width=\"1.5\" font-size=\"13\" font-family=\"'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#000\" stroke=\"none\"/><\/marker><\/defs><path d=\"M185,20 L185,95 M199,20 L199,95\"/><line x1=\"205\" y1=\"50\" x2=\"240\" y2=\"40\" stroke-width=\"1\"/><text x=\"244\" y=\"44\" fill=\"#000\" stroke=\"none\">A<\/text><path d=\"M185,95 L150,130 M199,95 L234,130\" stroke-width=\"3\"/><line x1=\"232\" y1=\"118\" x2=\"262\" y2=\"108\" stroke-width=\"1\"/><text x=\"266\" y=\"112\" fill=\"#000\" stroke=\"none\">B<\/text><path d=\"M175,90 C120,70 85,120 90,200 C92,235 130,240 170,225 Z\" fill=\"#000\" fill-opacity=\"0.12\"/><path d=\"M209,90 C264,70 299,120 294,200 C292,235 254,240 214,225 Z\" fill=\"#000\" fill-opacity=\"0.12\"/><line x1=\"120\" y1=\"170\" x2=\"60\" y2=\"170\" stroke-width=\"1\"/><text x=\"44\" y=\"174\" fill=\"#000\" stroke=\"none\">C<\/text><path d=\"M70,250 Q192,200 314,250\" stroke-width=\"3\"/><line x1=\"300\" y1=\"245\" x2=\"330\" y2=\"262\" stroke-width=\"1\"/><text x=\"334\" y=\"268\" fill=\"#000\" stroke=\"none\">D<\/text><path d=\"M70,95 Q60,115 72,130\" stroke-width=\"2\"/><path d=\"M314,95 Q324,115 312,130\" stroke-width=\"2\"/><path d=\"M70,130 Q60,150 72,165\" stroke-width=\"2\"/><path d=\"M314,130 Q324,150 312,165\" stroke-width=\"2\"/><path d=\"M70,165 Q60,185 72,200\" stroke-width=\"2\"/><path d=\"M314,165 Q324,185 312,200\" stroke-width=\"2\"/><path d=\"M70,200 Q60,220 72,235\" stroke-width=\"2\"/><path d=\"M314,200 Q324,220 312,235\" stroke-width=\"2\"/><line x1=\"64\" y1=\"115\" x2=\"30\" y2=\"105\" stroke-width=\"1\"/><text x=\"14\" y=\"104\" fill=\"#000\" stroke=\"none\">E<\/text><\/svg>", "choices": ["A의 안쪽 벽에는 섬모와 끈끈한 액체가 있어 먼지나 세균을 거른다.", "C는 근육으로 되어 있어 스스로 수축하고 이완한다.", "숨을 들이쉴 때 공기는 코 → B → A → C 순으로 이동한다.", "호흡계는 이산화 탄소를 흡수하고 산소를 내보낸다.", "E는 C 속에 있는 작은 공기주머니로, 기체 교환이 일어나는 곳이다."], "answer": [1], "explanation": "① 옳다. 숨관 안쪽의 섬모와 점액은 먼지와 세균을 걸러 낸다. ② 폐에는 근육이 없어 스스로 움직이지 못하고, 갈비뼈와 가로막의 움직임에 따라 부피가 변한다. ③ 공기는 코 → 숨관(A) → 숨관가지(B) → 폐(C) 순으로 이동한다. ④ 호흡계는 산소를 흡수하고 이산화 탄소를 내보낸다. ⑤ E는 갈비뼈이며, 폐 속 작은 공기주머니는 허파꽈리이다."}, {"id": "동물과에너지:D-002", "sub": "D", "type_id": "D01", "review_group": "RG18", "role": "main", "difficulty": "중", "format": "서술형", "stem": "폐(허파)는 수많은 허파꽈리로 이루어져 있다. 허파꽈리의 구조가 기체 교환에 유리한 점을 <u>두 가지<\/u> 서술하시오.", "answer": "① 폐가 수많은 작은 허파꽈리로 나뉘어 있어 공기와 닿는 표면적이 매우 넓다. ② 허파꽈리의 벽이 한 겹의 얇은 세포층으로 되어 있고 모세혈관이 둘러싸고 있어 기체가 쉽게 확산된다.", "scoring": "총 2점. 인정 근거 ①공기와 닿는 표면적이 넓다 ②벽이 한 겹의 얇은 세포층이다 ③모세혈관이 둘러싸고 있다 가운데 서로 다른 두 가지를 각 1점(근거 없이 '작아서 좋다'만 쓰면 0점). 허파꽈리에 근육이 있어 기체를 밀어낸다고 쓰면 0점.", "explanation": "표면적이 넓을수록, 벽이 얇을수록 확산이 잘 일어난다. 허파꽈리를 둘러싼 모세혈관은 기체를 주고받은 혈액을 바로 실어 나른다."}, {"id": "동물과에너지:D-003", "sub": "D", "type_id": "D01", "review_group": "RG18", "role": "main", "difficulty": "하", "format": "순서배열", "stem": "숨을 들이쉴 때 콧속으로 들어온 공기가 이동하는 경로를 순서대로 옳게 나열한 것은?<br>(가) 숨관가지 (나) 허파꽈리 (다) 숨관 (라) 코", "choices": ["(라)-(가)-(다)-(나)", "(라)-(다)-(가)-(나)", "(라)-(다)-(나)-(가)", "(다)-(라)-(가)-(나)", "(라)-(나)-(가)-(다)"], "answer": [2], "explanation": "공기는 코 → 숨관 → 숨관가지 → 폐 속의 허파꽈리 순으로 이동한다. 숨관가지는 숨관이 두 갈래로 갈라져 폐 속으로 들어가 점점 가늘어지며, 끝에 허파꽈리가 있다."}, {"id": "동물과에너지:D-004", "sub": "D", "type_id": "D01", "review_group": "RG18", "role": "reserve", "difficulty": "중", "format": "보기형(ㄱㄴㄷ)", "stem": "폐(허파)와 허파꽈리에 대한 설명으로 옳은 것만을 &lt;보기&gt;에서 있는 대로 고른 것은?", "bogi": ["ㄱ. 허파꽈리의 벽은 한 겹의 얇은 세포층으로 되어 있다.", "ㄴ. 허파꽈리는 근육이 있어 스스로 부풀었다 줄어들며 공기를 들이쉰다.", "ㄷ. 폐가 하나의 큰 주머니일 때보다 수많은 허파꽈리로 나뉘어 있을 때 공기와 닿는 표면적이 넓다."], "choices": ["ㄱ", "ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "answer": [3], "explanation": "ㄱ. 옳다. ㄴ. 폐와 허파꽈리에는 근육이 없어 스스로 움직이지 못한다. 갈비뼈와 가로막의 움직임으로 흉강의 부피가 변하면서 공기가 드나든다. ㄷ. 옳다. 같은 부피라도 작은 주머니로 많이 나뉠수록 표면적이 넓어진다."}, {"id": "동물과에너지:D-005", "sub": "D", "type_id": "D01", "review_group": "RG18", "role": "reserve", "difficulty": "하", "format": "단답형", "stem": "다음 설명의 ㉠과 ㉡에 알맞은 말을 쓰시오.<br>숨을 들이쉬고 내쉴 때 폐(허파)의 부피가 변하는 것은 폐를 둘러싼 ( ㉠ )와(과) 그 아래에 있는 근육으로 된 막인 ( ㉡ )이(가) 움직이기 때문이다.", "answer": "㉠ 갈비뼈 ㉡ 가로막", "scoring": "총 2점. ㉠ 갈비뼈 1점('갈비뼈와 갈비뼈 사이 근육'도 인정), ㉡ 가로막 1점('횡격막'도 인정).", "explanation": "폐에는 근육이 없으므로 갈비뼈와 가로막이 움직여 흉강의 부피가 변하고, 이에 따라 폐의 부피가 변한다."}, {"id": "동물과에너지:D-006", "sub": "D", "type_id": "D02", "review_group": "RG19", "role": "main", "difficulty": "중", "format": "5지선다", "stem": "그래프는 들숨과 날숨에 들어 있는 기체 A~C의 양을 상댓값으로 비교한 것이다. A~C는 각각 질소, 산소, 이산화 탄소 중 하나이다.<br>이에 대한 설명으로 옳은 것은?", "figure_svg": "<svg xmlns:xlink=\"http://www.w3.org/1999/xlink\" width=\"302.4pt\" height=\"201.6pt\" viewBox=\"0 0 302.4 201.6\" xmlns=\"http://www.w3.org/2000/svg\" version=\"1.1\" style=\"background:#fff\">\n <metadata>\n  <rdf:RDF xmlns:dc=\"http://purl.org/dc/elements/1.1/\" xmlns:cc=\"http://creativecommons.org/ns#\" xmlns:rdf=\"http://www.w3.org/1999/02/22-rdf-syntax-ns#\">\n   <cc:Work>\n    <dc:type rdf:resource=\"http://purl.org/dc/dcmitype/StillImage\"/>\n    <dc:date>2026-10-26T20:07:47.677913<\/dc:date>\n    <dc:format>image/svg+xml<\/dc:format>\n    <dc:creator>\n     <cc:Agent>\n      <dc:title>Matplotlib v3.10.3, https://matplotlib.org/<\/dc:title>\n     <\/cc:Agent>\n    <\/dc:creator>\n   <\/cc:Work>\n  <\/rdf:RDF>\n <\/metadata>\n <defs>\n  <style type=\"text/css\">*{stroke-linejoin: round; stroke-linecap: butt}<\/style>\n <\/defs>\n <g id=\"figure_1\">\n  <g id=\"patch_1\">\n   <path d=\"M 0 201.6 \nL 302.4 201.6 \nL 302.4 0 \nL 0 0 \nz\n\" style=\"fill: #ffffff\"/>\n  <\/g>\n  <g id=\"axes_1\">\n   <g id=\"patch_2\">\n    <path d=\"M 34.82 156.24288 \nL 290.52 156.24288 \nL 290.52 17.51625 \nL 34.82 17.51625 \nz\n\" style=\"fill: #ffffff\"/>\n   <\/g>\n   <g id=\"patch_3\">\n    <path d=\"M 55.595625 156.24288 \nL 82.76375 156.24288 \nL 82.76375 45.261576 \nL 55.595625 45.261576 \nz\n\" clip-path=\"url(#p0fc7cd2fa0)\" style=\"fill: #ffffff; stroke: #000000; stroke-width: 1.2; stroke-linejoin: miter\"/>\n   <\/g>\n   <g i 86)\">B<\/text>\n     <\/g>\n    <\/g>\n    <g id=\"xtick_3\">\n     <g id=\"line2d_3\"/>\n     <g id=\"text_3\">\n      <text style=\"font-size: 11px; font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif'Malgun Gothic'; text-anchor: middle\" x=\"242.57625\" y=\"168.094286\" transform=\"rotate(-0 242.57625 168.094286)\">C<\/text>\n     <\/g>\n    <\/g>\n   <\/g>\n   <g id=\"matplotlib.axis_2\">\n    <g id=\"text_4\">\n     <text style=\"font-size: 11px; font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif'Malgun Gothic'; text-anchor: end\" x=\"44.82\" y=\"14.915781\" transform=\"rotate(-0 44.82 14.915781)\">상대량<\/text>\n    <\/g>\n   <\/g>\n   <g id=\"patch_9\">\n    <path d=\"M 34.82 156.24288 \nL 34.82 17.51625 \n\" style=\"fill: none; stroke: #000000; stroke-linejoin: miter; stroke-linecap: square\"/>\n   <\/g>\n   <g id=\"patch_10\">\n    <path d=\"M 34.82 156.24288 \nL 290.52 156.24288 \n\" style=\"fill: none; stroke: #000000; stroke-linejoin: miter; stroke-linecap: square\"/>\n   <\/g>\n   <g id=\"text_5\">\n    <text style=\"font-size: 8px; font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif'Malgun Gothic'; text-anchor: middle\" x=\"162.67\" y=\"184.685391\" transform=\"rotate(-0 162.67 184.685391)\">(막대 높이는 상댓값이며, 실제 비율과 다름)<\/text>\n   <\/g>\n   <g id=\"legend_1\">\n    <g id=\"patch_11\">\n     <path d=\"M 233.52 34.108438 \nL 253.52 34.108438 \nL 253.52 27.108438 \nL 233.52 27.108438 \nz\n\" style=\"fill: #ffffff; stroke: #000000; stroke-width: 1.2; stroke-linejoin: miter\"/>\n    <\/g>\n    <g id=\"text_6\">\n     <text style=\"font-size: 10px; font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif'Malgun Gothic'; text-anchor: start\" x=\"261.52\" y=\"34.108438\" transform=\"rotate(-0 261.52 34.108438)\">들숨<\/text>\n    <\/g>\n    <g id=\"patch_12\">\n     <path d=\"M 233.52 49.064688 \nL 253.52 49.064688 \nL 253.52 42.064688 \nL 233.52 42.064688 \nz\n\" style=\"fill: #737373; stroke: #000000; stroke-width: 1.2; stroke-linejoin: miter\"/>\n    <\/g>\n    <g id=\"text_7\">\n     <text style=\"font-size: 10px; font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif'Malgun Gothic'; text-anchor: start\" x=\"261.52\" y=\"49.064688\" transform=\"rotate(-0 261.52 49.064688)\">날숨<\/text>\n    <\/g>\n   <\/g>\n  <\/g>\n <\/g>\n <defs>\n  <clipPath id=\"p0fc7cd2fa0\">\n   <rect x=\"34.82\" y=\"17.51625\" width=\"255.7\" height=\"138.72663\"/>\n  <\/clipPath>\n <\/defs>\n<\/svg>\n", "choices": ["A는 산소이다.", "날숨에는 B가 전혀 들어 있지 않다.", "C는 조직 세포에서 세포호흡 결과 생긴 기체가 날숨으로 나온 것이다.", "C는 날숨보다 들숨에 더 많다.", "B는 들숨보다 날숨에 더 많다."], "answer": [3], "explanation": "들숨과 날숨에서 양이 같고 가장 많은 A는 질소, 날숨에서 줄어든 B는 산소, 날숨에서 늘어난 C는 이산화 탄소이다. ① 가장 많은 기체는 질소이다. ② 날숨에도 산소(B)가 남아 있다. ③ 옳다. ④ 이산화 탄소는 날숨에 더 많다. ⑤ 산소는 들숨에 더 많다."}, {"id": "동물과에너지:D-007", "sub": "D", "type_id": "D02", "review_group": "RG19", "role": "main", "difficulty": "하", "format": "5지선다", "stem": "다음은 날숨에 들어 있는 기체를 확인하는 실험이다.<br>[과정] 같은 양의 파란색 BTB 용액(산성에서 노란색으로 변하는 지시약)을 비커 (가)와 (나)에 넣고, (가)에는 공기 펌프로 주변 공기를, (나)에는 빨대로 날숨을 같은 시간 동안 불어 넣었다.<br>[결과] (가)는 거의 변하지 않았고, (나)는 노란색으로 변하였다.<br>이 실험에 대한 설명으로 옳은 것은?", "choices": ["(나)의 색이 변한 것은 날숨 속 산소가 물에 녹았기 때문이다.", "주변 공기에는 이산화 탄소가 전혀 없다.", "날숨에는 산소가 전혀 없기 때문에 색이 변하였다.", "날숨에는 주변 공기보다 이산화 탄소가 많다.", "(나)의 색 변화는 날숨 속 질소 때문이다."], "answer": [4], "explanation": "① 색 변화는 물에 녹아 산성을 띠는 이산화 탄소 때문이다. ② 주변 공기에도 이산화 탄소가 적은 양 들어 있다. (가)가 거의 변하지 않은 것은 그 양이 매우 적기 때문이다. ③ 날숨에도 산소가 남아 있으며, 산소는 색 변화의 원인이 아니다. ④ 옳다. ⑤ 질소는 들숨과 날숨에 비슷한 양이 들어 있어 차이를 만들지 않는다."}, {"id": "동물과에너지:D-008", "sub": "D", "type_id": "D02", "review_group": "RG19", "role": "main", "difficulty": "상", "format": "서술형", "stem": "다음은 들숨과 날숨을 비교하는 실험이다.<br>[과정] 맑은 석회수(이산화 탄소와 만나면 뿌옇게 흐려지는 용액)를 같은 양씩 넣은 시험관 (가), (나)를 준비하고, (가)에는 주사기로 주변 공기를, (나)에는 빨대로 날숨을 같은 부피만큼 불어 넣었다.<br>[결과] (나)의 석회수만 뚜렷하게 뿌옇게 흐려졌다.<br>(나)에서만 석회수가 뚜렷하게 흐려진 까닭을 날숨이 만들어지는 과정과 관련지어 서술하시오.", "answer": "몸속 조직 세포에서 세포호흡으로 생긴 이산화 탄소가 혈액에 실려 폐로 운반되고, 허파꽈리에서 확산되어 날숨으로 나가므로 날숨에는 들이쉰 공기보다 이산화 탄소가 많다. 그래서 날숨을 불어 넣은 (나)의 석회수만 뚜렷하게 흐려졌다.", "scoring": "총 3점. 날숨에는 이산화 탄소가 많다 1점 + 그 이산화 탄소는 조직 세포의 세포호흡으로 생긴다 1점 + 혈액에 실려 폐로 운반되어 허파꽈리로 확산되어 날숨으로 나간다 1점. 산소 때문이라고 쓰면 0점.", "explanation": "석회수는 이산화 탄소와 반응해 뿌옇게 흐려진다. 주변 공기에도 이산화 탄소가 조금 있지만 날숨보다 훨씬 적다."}, {"id": "동물과에너지:D-009", "sub": "D", "type_id": "D02", "review_group": "RG19", "role": "reserve", "difficulty": "상", "format": "5지선다", "stem": "날숨은 들숨보다 산소가 적고 이산화 탄소가 많다. 이와 같은 차이가 생기는 까닭으로 옳은 것은?", "choices": ["폐(허파) 속에서 산소가 이산화 탄소로 바뀌기 때문이다.", "날숨으로 나오는 이산화 탄소는 폐의 세포에서만 만들어지기 때문이다.", "허파꽈리에서 산소는 모세혈관으로, 이산화 탄소는 모세혈관에서 허파꽈리로 확산되기 때문이다.", "숨을 내쉴 때 질소가 산소로 바뀌어 산소의 비율이 줄어들기 때문이다.", "허파꽈리가 에너지를 써서 이산화 탄소를 만들어 내기 때문이다."], "answer": [3], "explanation": "① 폐에서는 기체가 다른 기체로 바뀌지 않고 확산으로 교환된다. ② 이산화 탄소는 온몸의 조직 세포에서 세포호흡으로 생겨 혈액으로 운반된 것이다. ③ 옳다. ④ 질소는 들숨과 날숨에서 거의 변하지 않는다. ⑤ 허파꽈리의 기체 교환은 확산이며 에너지가 필요 없다."}, {"id": "동물과에너지:D-010", "sub": "D", "type_id": "D02", "review_group": "RG19", "role": "reserve", "difficulty": "하", "format": "단답형", "stem": "들숨과 날숨에 공통으로 가장 많이 들어 있는 기체의 이름을 쓰시오.", "answer": "질소", "scoring": "총 1점. 질소만 정답.", "explanation": "들숨과 날숨 모두 가장 많은 기체는 질소이며, 질소는 몸에서 쓰이지 않아 양이 거의 변하지 않는다."}, {"id": "동물과에너지:D-011", "sub": "D", "type_id": "D03", "review_group": "RG20", "role": "main", "difficulty": "하", "format": "5지선다", "stem": "표는 숨을 들이쉴 때 일어나는 변화를 정리한 것이다. ㉠~㉣에 알맞은 말을 옳게 짝지은 것은?", "table": {"h": ["갈비뼈", "가로막", "흉강의 부피", "폐 내부 압력"], "r": [["( ㉠ )", "( ㉡ )", "( ㉢ )", "대기압보다 ( ㉣ )"]]}, "choices": ["㉠ 올라감, ㉡ 내려감, ㉢ 커짐, ㉣ 낮아짐", "㉠ 내려감, ㉡ 올라감, ㉢ 커짐, ㉣ 낮아짐", "㉠ 올라감, ㉡ 내려감, ㉢ 커짐, ㉣ 높아짐", "㉠ 올라감, ㉡ 올라감, ㉢ 커짐, ㉣ 낮아짐", "㉠ 내려감, ㉡ 내려감, ㉢ 작아짐, ㉣ 높아짐"], "answer": [1], "explanation": "들숨 때 갈비뼈는 올라가고 가로막은 내려가 흉강과 폐의 부피가 커지고, 폐 내부 압력이 대기압보다 낮아져 공기가 들어온다. ② 갈비뼈와 가로막의 방향이 날숨과 바뀌었다. ③ 부피가 커지면 압력은 낮아진다. ④ 갈비뼈와 가로막은 반대 방향으로 움직인다. ⑤ 날숨 때의 흉강 변화를 섞어 쓴 것이다."}, {"id": "동물과에너지:D-012", "sub": "D", "type_id": "D05", "review_group": "RG20", "role": "main", "difficulty": "중", "format": "보기형(ㄱㄴㄷ)", "stem": "그래프는 사람이 숨을 한 번 쉬는 동안 폐(허파) 내부 압력의 변화를 대기압과 비교하여 나타낸 것이다.<br>이에 대한 설명으로 옳은 것만을 &lt;보기&gt;에서 있는 대로 고른 것은?", "bogi": ["ㄱ. A 구간에서는 가로막이 내려가고 공기가 폐 안으로 들어온다.", "ㄴ. B 구간에서는 흉강의 부피가 커진다.", "ㄷ. B 구간에서는 폐 내부 압력이 대기압보다 높아 공기가 밖으로 나간다."], "figure_svg": "<svg xmlns:xlink=\"http://www.w3.org/1999/xlink\" width=\"316.8pt\" height=\"201.6pt\" viewBox=\"0 0 316.8 201.6\" xmlns=\"http://www.w3.org/2000/svg\" version=\"1.1\" style=\"background:#fff\">\n <metadata>\n  <rdf:RDF xmlns:dc=\"http://purl.org/dc/elements/1.1/\" xmlns:cc=\"http://creativecommons.org/ns#\" xmlns:rdf=\"http://www.w3.org/1999/02/22-rdf-syntax-ns#\">\n   <cc:Work>\n    <dc:type rdf:resource=\"http://purl.org/dc/dcmitype/StillImage\"/>\n    <dc:date>2026-10-26T20:07:50.442085<\/dc:date>\n    <dc:format>image/svg+xml<\/dc:format>\n    <dc:creator>\n     <cc:Agent>\n      <dc:title>Matplotlib v3.10.3, https://matplotlib.org/<\/dc:title>\n     <\/cc:Agent>\n    <\/dc:creator>\n   <\/cc:Work>\n  <\/rdf:RDF>\n <\/metadata>\n <defs>\n  <style type=\"text/css\">*{stroke-linejoin: round; stroke-linecap: butt}<\/style>\n <\/defs>\n <g id=\"figure_1\">\n  <g id=\"patch_1\">\n   <path d=\"M 0 201.6 \nL 316.8 201.6 \nL 316.8 0 \nL 0 0 \nz\n\" style=\"fill: #ffffff\"/>\n  <\/g>\n  <g id=\"axes_1\">\n   <g id=\"patch_2\">\n    <path d=\"M 64.46 175.16 \nL 283.349308 175.16 \nL 283.349308 17.445 \nL 64.46 17.445 \nz\n\" style=\"fill: #ffffff\"/>\n   <\/g>\n   <g id=\"matplotlib.axis_1\">\n    <g id=\"text_1\">\n     <text style=\"font-size: 11px; font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif'Malgun Gothic'; text-anchor: end\" x=\"283.349308\" y=\"187.511406\" transform=\"rotate(-0 283.349308 187.511406)\">시간<\/text>\n    <\/g>\n   <\/g>\n   <g id=\"matplotlib.axis_2\">\n    <g id=\"text_2\">\n     <text style=\"font-size: 11px; font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif'Malgun Gothic'; text-anchor: end\" x=\"74.46\" y=\"14.844531\" transform=\"rotate(-0 74.4 31 \nL 170.567095 31.568731 \nL 174.967095 29.368731 \n\" style=\"fill: none; stroke: #000000; stroke-linecap: round\"/>\n   <\/g>\n   <g id=\"text_5\">\n    <text style=\"font-size: 11px; font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif'Malgun Gothic'; text-anchor: middle\" x=\"216.525956\" y=\"25.201934\" transform=\"rotate(-0 216.525956 25.201934)\">B<\/text>\n   <\/g>\n  <\/g>\n <\/g>\n <defs>\n  <clipPath id=\"p09a5f8eddf\">\n   <rect x=\"64.46\" y=\"17.445\" width=\"218.889308\" height=\"157.715\"/>\n  <\/clipPath>\n <\/defs>\n<\/svg>\n", "choices": ["ㄴ", "ㄷ", "ㄱ, ㄴ", "ㄱ, ㄷ", "ㄱ, ㄴ, ㄷ"], "answer": [4], "explanation": "A 구간은 폐 내부 압력이 대기압보다 낮은 들숨, B 구간은 대기압보다 높은 날숨이다. ㄱ. 옳다. 들숨 때 가로막이 내려가 흉강이 커지고 공기가 들어온다. ㄴ. 날숨 때 흉강과 폐의 부피는 작아진다. ㄷ. 옳다.", "stimulus_group": "SG-D-폐압력그래프"}, {"id": "동물과에너지:D-013", "sub": "D", "type_id": "D05", "review_group": "RG20", "role": "main", "difficulty": "상", "format": "서술형", "stem": "음식물 같은 이물질이 기도에 걸려 숨을 쉬지 못하는 사람을 뒤에서 감싸 안고, 명치 아래를 주먹으로 위쪽을 향해 세게 밀어 올리면 이물질이 밖으로 튀어나올 수 있다. 이 방법으로 이물질이 빠져나오는 원리를 <u>가로막<\/u>, <u>흉강의 부피<\/u>, <u>폐 내부 압력<\/u>을 모두 포함하여 서술하시오.", "answer": "명치 아래를 밀어 올리면 가로막이 위로 올라가 흉강의 부피가 갑자기 작아진다. 그러면 폐 내부 압력이 대기압보다 크게 높아져 폐 속 공기가 바깥으로 세게 밀려 나가면서 기도에 걸린 이물질이 밖으로 나온다.", "scoring": "총 3점. 가로막이 위로 올라간다 1점 + 흉강(폐)의 부피가 작아진다 1점 + 폐 내부 압력이 높아져 공기가 세게 밀려 나간다 1점. '대기압보다'라는 비교는 쓰지 않아도 됨. 가로막이 내려간다고 쓰면 해당 부분 0점.", "explanation": "날숨의 원리를 순간적으로 강하게 일으키는 응급 처치이다. 부피가 작아지면 압력이 높아진다는 관계가 핵심이다."}, {"id": "동물과에너지:D-014", "sub": "D", "type_id": "D03", "review_group": "RG20", "role": "reserve", "difficulty": "중", "format": "순서배열", "stem": "다음은 숨을 들이쉬는 과정에서 일어나는 일을 순서 없이 나타낸 것이다. 일어나는 순서대로 옳게 나열한 것은?<br>(가) 공기가 몸 밖에서 폐(허파) 안으로 들어온다.<br>(나) 흉강과 폐의 부피가 커진다.<br>(다) 갈비뼈가 올라가고 가로막이 내려간다.<br>(라) 폐 내부 압력이 대기압보다 낮아진다.", "choices": ["(다)-(나)-(라)-(가)", "(다)-(가)-(나)-(라)", "(가)-(나)-(다)-(라)", "(다)-(라)-(나)-(가)", "(라)-(다)-(나)-(가)"], "answer": [1], "explanation": "갈비뼈·가로막의 움직임(다)으로 흉강과 폐가 커지고(나), 그 결과 폐 내부 압력이 대기압보다 낮아져(라) 공기가 들어온다(가). 공기가 들어와서 폐가 커지는 것이 아니다."}, {"id": "동물과에너지:D-015", "sub": "D", "type_id": "D05", "review_group": "RG20", "role": "reserve", "difficulty": "상", "format": "보기형(ㄱㄴㄷ)", "stem": "그래프는 사람이 숨을 한 번 쉬는 동안 폐(허파) 내부 압력의 변화를 대기압과 비교하여 나타낸 것이다. P는 압력이 가장 낮을 때, Q는 압력이 낮아졌다가 다시 대기압과 같아진 때, R은 압력이 가장 높을 때이다.<br>이에 대한 설명으로 옳은 것만을 &lt;보기&gt;에서 있는 대로 고른 것은?", "bogi": ["ㄱ. P일 때는 공기가 폐 안으로 들어오고 있다.", "ㄴ. R일 때 폐 내부 압력은 대기압보다 낮다.", "ㄷ. 처음부터 Q까지 공기가 계속 들어왔으므로, 이 그래프에서 폐의 부피는 Q 무렵에 가장 크다."], "figure_svg": "<svg xmlns:xlink=\"http://www.w3.org/1999/xlink\" width=\"316.8pt\" height=\"201.6pt\" viewBox=\"0 0 316.8 201.6\" xmlns=\"http://www.w3.org/2000/svg\" version=\"1.1\" style=\"background:#fff\">\n <metadata>\n  <rdf:RDF xmlns:dc=\"http://purl.org/dc/elements/1.1/\" xmlns:cc=\"http://creativecommons.org/ns#\" xmlns:rdf=\"http://www.w3.org/1999/02/22-rdf-syntax-ns#\">\n   <cc:Work>\n    <dc:type rdf:resource=\"http://purl.org/dc/dcmitype/StillImage\"/>\n    <dc:date>2026-10-26T20:07:52.895579<\/dc:date>\n    <dc:format>image/svg+xml<\/dc:format>\n    <dc:creator>\n     <cc:Agent>\n      <dc:title>Matplotlib v3.10.3, https://matplotlib.org/<\/dc:title>\n     <\/cc:Agent>\n    <\/dc:creator>\n   <\/cc:Work>\n  <\/rdf:RDF>\n <\/metadata>\n <defs>\n  <style type=\"text/css\">*{stroke-linejoin: round; stroke-linecap: butt}<\/style>\n <\/defs>\n <g id=\"figure_1\">\n  <g id=\"patch_1\">\n   <path d=\"M 0 201.6 \nL 316.8 201.6 \nL 316.8 0 \nL 0 0 \nz\n\" style=\"fill: #ffffff\"/>\n  <\/g>\n  <g id=\"axes_1\">\n   <g id=\"patch_2\">\n    <path d=\"M 64.46 175.16 \nL 283.349308 175.16 \nL 283.349308 17.445 \nL 64.46 17.445 \nz\n\" style=\"fill: #ffffff\"/>\n   <\/g>\n   <g id=\"matplotlib.axis_1\">\n    <g id=\"text_1\">\n     <text style=\"font-size: 11px; font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif'Malgun Gothic'; text-anchor: end\" x=\"283.349308\" y=\"187.511406\" transform=\"rotate(-0 283.349308 187.511406)\">시간<\/text>\n    <\/g>\n   <\/g>\n   <g id=\"matpl
