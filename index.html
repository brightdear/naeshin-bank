 근거"}, {"points": 2, "desc": "(2) 처음과 반대쪽(새 (+)극 쪽)으로 이동"}], "accepted": ["반대 전하끼리 끌어당긴다", "그림의 오른쪽으로 이동한다"], "partial": "'노란색이라서'처럼 전하와 무관한 근거는 근거 0점."}, "explanation": "노란색 성분은 크로뮴산 이온(CrO₄²⁻)으로, 음이온이라 (+)극 쪽으로 이동한다. 이처럼 이온이 반대 극 쪽으로 이동하는 것으로 이온이 전하를 띤다는 것을 알 수 있다. 극을 바꾸면 이동 방향도 바뀐다."}, {"id": "물질의구성:G-004", "sub": "G", "type_id": "G02", "review_group": "RG19", "role": "main", "difficulty": "상", "format": "합답형", "stem": "질산 칼륨 수용액을 적신 거름종이 가운데에 세 가지 수용액을 각각 떨어뜨리고 전류를 흘려 주었더니 표와 같은 결과를 얻었다. 이에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?", "bogi": ["ㄱ. (가)와 (다)를 비교하면 파란색을 띠는 것이 황산 이온이 아니라 구리 이온임을 알 수 있다.", "ㄴ. (나)와 (다)를 비교하면 보라색을 띠는 것이 칼륨 이온이 아니라 과망가니즈산 이온임을 알 수 있다.", "ㄷ. (다)에서 칼륨 이온과 황산 이온은 이동하지 않았다.", "ㄹ. (나)에서 칼륨 이온은 (−)극 쪽으로 이동하였다."], "table": {"h": ["실험", "떨어뜨린 수용액", "관찰 결과"], "r": [["(가)", "황산 구리(Ⅱ) 수용액", "파란색이 (−)극 쪽으로 이동"], ["(나)", "과망가니즈산 칼륨 수용액", "보라색이 (+)극 쪽으로 이동"], ["(다)", "황산 칼륨 수용액", "색의 이동이 관찰되지 않음"]]}, "choices": ["ㄱ, ㄷ", "ㄴ, ㄹ", "ㄱ, ㄴ, ㄷ", "ㄱ, ㄴ, ㄹ", "ㄴ, ㄷ, ㄹ"], "answer": [4], "explanation": "황산 칼륨 수용액(칼륨 이온 + 황산 이온)은 색이 없다. ㄱ. 참. (가)와 (다)에 공통으로 황산 이온이 있는데 (다)는 색이 없으므로 파란색은 구리 이온 때문이다. ㄴ. 참. (나)와 (다)에 공통으로 칼륨 이온이 있는데 (다)는 색이 없으므로 보라색은 과망가니즈산 이온 때문이다. ㄷ. 거짓. 색이 없어 보이지 않을 뿐 칼륨 이온은 (−)극, 황산 이온은 (+)극 쪽으로 이동한다. ㄹ. 참. 칼륨 이온은 양이온이다. 따라서 ㄱ, ㄴ, ㄹ."}, {"id": "물질의구성:G-005", "sub": "G", "type_id": "G01", "review_group": "RG19", "role": "reserve", "difficulty": "하", "format": "단답형", "stem": "이온의 이동 실험에서 거름종이를 질산 칼륨 수용액에 적셔서 사용하는 까닭을 쓰시오.", "answer": "전류가 잘 흐르게 하기 위해서이다.", "scoring": {"total": 2, "rule": "아래 인정 답이면 2점, 그 밖에는 0점", "accepted": ["전류가 잘 흐르게 한다", "전기가 잘 통하게 한다", "이온이 녹아 있어 전류가 흐르게 한다"], "partial": "'색깔 이온을 공급한다', '이온의 색을 잘 보이게 한다'는 0점."}, "explanation": "질산 칼륨 수용액에는 이온이 녹아 있어 거름종이에 전류가 잘 흐른다. 질산 칼륨의 이온은 색이 없어 색깔 이온의 관찰을 방해하지 않는다."}, {"id": "물질의구성:G-006", "sub": "G", "type_id": "G02", "review_group": "RG19", "role": "reserve", "difficulty": "중", "format": "5지선다", "stem": "이온의 이동 실험 결과를 해석한 것으로 옳은 것은?", "choices": ["같은 전하를 띤 이온끼리는 서로 끌어당긴다.", "수산화 이온(OH⁻)이 녹아 있는 수용액을 떨어뜨리면 수산화 이온은 (+)극 쪽으로 이동한다.", "황산 구리(Ⅱ) 수용액에는 구리 이온 한 종류만 들어 있다.", "이온이 전극 쪽으로 이동하는 까닭은 이온이 색을 띠기 때문이다.", "염화 구리(Ⅱ) 수용액을 떨어뜨리면 파란색 성분은 (+)극 쪽으로 이동한다."], "answer": [2], "explanation": "① 반대 전하끼리 끌어당기고 같은 전하끼리는 밀어낸다. ② 옳다. 수산화 이온은 음이온이므로 (+)극 쪽으로 이동한다. ③ 구리 이온과 황산 이온이 함께 들어 있다. ④ 이온이 이동하는 것은 전하를 띠기 때문이다. ⑤ 파란색은 구리 이온(양이온)이므로 (−)극 쪽으로 이동한다."}, {"id": "물질의구성:G-007", "sub": "G", "type_id": "G03", "review_group": "RG20", "role": "main", "difficulty": "하", "format": "5지선다", "stem": "전극을 넣고 전원을 연결하였을 때 전류가 흐르는 물질은?", "choices": ["증류수", "설탕물", "고체 염화 나트륨", "염화 나트륨 수용액", "설탕을 아주 진하게 녹인 설탕물"], "answer": [4], "explanation": "이온이 녹아 있어 자유롭게 움직일 수 있어야 전류가 흐른다. ① 순수한 물에는 이온이 거의 없다. ②, ⑤ 설탕은 물에 녹아도 이온으로 나뉘지 않으므로 진하게 녹여도 전류가 흐르지 않는다. ③ 고체에서는 이온이 움직이지 못한다. ④ 옳다."}, {"id": "물질의구성:G-008", "sub": "G", "type_id": "G03", "review_group": "RG20", "role": "main", "difficulty": "중", "format": "합답형", "stem": "표는 여러 가지 물질에 전극을 넣고 전류가 흐르는지 확인한 결과이다. 이에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?", "bogi": ["ㄱ. 이온이 녹아 있는 수용액에서 전류가 흘렀다.", "ㄴ. 이온 음료에는 이온이 녹아 있다.", "ㄷ. 설탕은 물에 녹아도 이온으로 나뉘지 않는다.", "ㄹ. 고체 소금에서 전류가 흐르지 않은 것은 고체 소금에 이온이 없기 때문이다."], "table": {"h": ["물질", "증류수", "설탕물", "소금물", "이온 음료", "고체 소금"], "r": [["전류", "흐르지 않음", "흐르지 않음", "흐름", "흐름", "흐르지 않음"]]}, "choices": ["ㄱ, ㄴ", "ㄱ, ㄹ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ", "ㄱ, ㄷ, ㄹ"], "answer": [4], "explanation": "ㄱ. 참. 소금물과 이온 음료처럼 이온이 녹아 있는 수용액에서 전류가 흘렀다. ㄴ. 참. 이온 음료에서 전류가 흐른 것으로 이온이 녹아 있음을 알 수 있다. ㄷ. 참. 설탕물에서 전류가 흐르지 않았다. ㄹ. 거짓. 고체 소금에도 이온이 있지만 움직이지 못해 전류가 흐르지 않는다. 따라서 ㄱ, ㄴ, ㄷ."}, {"id": "물질의구성:G-009", "sub": "G", "type_id": "G06", "review_group": "RG20", "role": "main", "difficulty": "하", "format": "서술형", "stem": "젖은 손으로 전기 기구를 만지면 위험한 까닭을 '이온'이라는 낱말을 넣어 서술하시오.", "answer": "손에 묻은 물에는 땀 등에서 나온 이온이 녹아 있어 전류가 잘 흐르므로 감전될 수 있기 때문이다.", "scoring": {"total": 4, "criteria": [{"points": 2, "desc": "손에 묻은 물(땀)에 이온이 녹아 있다"}, {"points": 2, "desc": "전류가 잘 흘러 감전될 수 있다"}], "accepted": [], "partial": "'물 분자가 전기를 통하게 한다'처럼 이온과 무관한 설명은 0점."}, "explanation": "순수한 물은 전류가 거의 흐르지 않지만, 손에 묻은 물에는 이온이 녹아 있어 전류가 흐를 수 있다."}, {"id": "물질의구성:G-010", "sub": "G", "type_id": "G03", "review_group": "RG20", "role": "reserve", "difficulty": "중", "format": "서술형", "stem": "고체 염화 나트륨에 전극을 대면 전류가 흐르지 않지만, 염화 나트륨을 물에 녹인 수용액에서는 전류가 흐른다. 그 까닭을 이온의 움직임과 관련지어 서술하시오.", "answer": "고체 염화 나트륨에서는 나트륨 이온과 염화 이온이 움직이지 못하지만, 물에 녹으면 이온들이 자유롭게 움직일 수 있어 전류가 흐른다.", "scoring": {"total": 4, "criteria": [{"points": 2, "desc": "고체에서는 이온이 움직이지 못한다"}, {"points": 2, "desc": "수용액에서는 이온이 자유롭게 움직인다"}], "accepted": [], "partial": "'고체에는 이온이 없다'고 쓰면 0점."}, "explanation": "이온으로 이루어진 물질은 고체 상태에서도 이온으로 이루어져 있지만 이온이 제자리에 묶여 있다. 물에 녹아 이온이 움직일 수 있어야 전류가 흐른다."}, {"id": "물질의구성:G-011", "sub": "G", "type_id": "G06", "review_group": "RG20", "role": "reserve", "difficulty": "하", "format": "5지선다", "stem": "생활 속 이온과 전기에 대한 설명으로 옳은 것은?", "choices": ["이온 음료에는 이온이 녹아 있어 전류가 흐를 수 있다.", "과일 전지에서 전류가 흐르는 것은 과일 속 물 분자 때문이다.", "이온 음료 속 이온은 모두 같은 전하를 띤다.", "설탕물은 이온이 녹아 있어 전류가 흐른다.", "젖은 손에 묻은 물은 전기가 통하지 않으므로 전기 기구를 만져도 안전하다."], "answer": [1], "explanation": "① 옳다. ② 과일 즙에 녹아 있는 이온이 움직이기 때문이다. ③ 이온 음료에는 양이온과 음이온이 함께 녹아 있다. ④ 설탕은 이온으로 나뉘지 않아 전류가 흐르지 않는다. ⑤ 손에 묻은 물에는 이온이 녹아 있어 전류가 흐를 수 있어 위험하다."}, {"id": "물질의구성:G-012", "sub": "G", "type_id": "G04", "review_group": "RG21", "role": "main", "difficulty": "중", "format": "5지선다", "stem": "이온으로 이루어진 물질의 이름과 화학식을 옳게 짝지은 것은?", "choices": ["염화 마그네슘 - MgCl", "염화 칼슘 - CaCl₂", "황산 나트륨 - NaSO₄", "탄산 칼슘 - Ca₂CO₃", "질산 구리(Ⅱ) - Cu₂NO₃"], "answer": [2], "explanation": "양이온과 음이온의 전하 총합이 0이 되는 개수비로 쓴다. ① Mg²⁺:Cl⁻ = 1:2 → MgCl₂ ② 옳다. Ca²⁺:Cl⁻ = 1:2 ③ Na⁺:SO₄²⁻ = 2:1 → Na₂SO₄ ④ Ca²⁺:CO₃²⁻ = 1:1 → CaCO₃ ⑤ Cu²⁺:NO₃⁻ = 1:2 → Cu(NO₃)₂", "textbook_tags": {"mode": "include_only", "books": ["오투", "동아", "지학사"]}}, {"id": "물질의구성:G-013", "sub": "G", "type_id": "G04", "review_group": "RG21", "role": "reserve", "difficulty": "중", "format": "단답형", "stem": "표는 이온으로 이루어진 물질을 이루는 양이온과 음이온을 나타낸 것이다. (가)~(다)에 알맞은 개수비(양이온 : 음이온)를 쓰고, 황산 나트륨의 화학식을 쓰시오.", "table": {"h": ["물질", "양이온", "음이온", "개수비(양이온 : 음이온)"], "r": [["염화 칼슘", "Ca²⁺", "Cl⁻", "(가)"], ["황산 나트륨", "Na⁺", "SO₄²⁻", "(나)"], ["탄산 칼슘", "Ca²⁺", "CO₃²⁻", "(다)"]]}, "answer": "(가) 1 : 2 (나) 2 : 1 (다) 1 : 1, 황산 나트륨: Na₂SO₄", "scoring": {"total": 4, "criteria": [{"points": 1, "desc": "(가) 1 : 2"}, {"points": 1, "desc": "(나) 2 : 1"}, {"points": 1, "desc": "(다) 1 : 1"}, {"points": 1, "desc": "황산 나트륨 화학식 Na₂SO₄"}], "accepted": ["Na2SO4(숫자를 오른쪽 아래에 쓴 손글씨 표기)"], "partial": "칸마다 따로 채점. (나)를 1 : 2로 쓰거나 화학식을 NaSO₄로 쓰면 해당 칸 0점."}, "explanation": "전하 총합이 0이 되어야 한다. (가) (+2)×1 + (−1)×2 = 0 (나) (+1)×2 + (−2)×1 = 0 (다) (+2)×1 + (−2)×1 = 0. 황산 나트륨은 Na⁺ 2개와 SO₄²⁻ 1개이므로 Na₂SO₄이다.", "textbook_tags": {"mode": "include_only", "books": ["오투", "동아"]}}, {"id": "물질의구성:G-014", "sub": "G", "type_id": "G04", "review_group": "RG21", "role": "reserve", "difficulty": "상", "format": "서술형", "stem": "어느 학생이 염화 마그네슘의 화학식을 'MgCl'이라고 썼다.\n\n(1) 이 화학식이 잘못된 까닭을 마그네슘 이온(Mg²⁺)과 염화 이온(Cl⁻)의 전하를 이용하여 서술하고, 바른 화학식을 쓰시오.\n(2) 나트륨 이온(Na⁺)과 황산 이온(SO₄²⁻)으로 이루어진 물질의 화학식을 쓰고, 그 개수비를 정한 근거를 서술하시오.", "answer": "(1) 이온으로 이루어진 물질은 전하의 총합이 0이어야 하는데, Mg²⁺ 1개(+2)와 Cl⁻ 1개(−1)이면 총합이 +1이 되어 0이 아니다. Mg²⁺ 1개와 Cl⁻ 2개가 결합해야 총합이 0이 되므로 MgCl₂이다. (2) Na₂SO₄. Na⁺ 2개(+2)와 SO₄²⁻ 1개(−2)일 때 전하의 총합이 0이 되기 때문이다.", "scoring": {"total": 8, "criteria": [{"points": 1, "desc": "(1) 이온 물질은 전하의 총합이 0이어야 한다"}, {"points": 1, "desc": "(1) MgCl은 전하 총합이 +1임을 지적"}, {"points": 2, "desc": "(1) MgCl₂"}, {"points": 2, "desc": "(2) Na₂SO₄"}, {"points": 2, "desc": "(2) Na⁺ 2개(+2)와 SO₄²⁻ 1개(−2)로 총합이 0이라는 근거"}], "accepted": ["MgCl2, Na2SO4(숫자를 오른쪽 아래에 쓴 손글씨 표기)"], "partial": "Cl₂⁻, Na₂(SO₄)₂처럼 쓰면 해당 화학식 0점."}, "explanation": "이온 물질 전체는 전기적으로 중성이므로 양이온의 (+)전하 총량과 음이온의 (−)전하 총량이 같아지는 개수비로 화학식을 쓴다. 이온 2개를 나타낼 때 2Cl⁻처럼 앞에 숫자를 쓰며, 화학식에서는 원소 기호 오른쪽 아래에 개수를 쓴다.", "textbook_tags": {"mode": "include_only", "books": ["오투", "동아"]}}, {"id": "물질의구성:G-015", "sub": "G", "type_id": "G05", "review_group": "RG21", "role": "reserve", "difficulty": "상", "format": "5지선다", "stem": "그림과 같이 질산 칼륨 수용액을 적신 거름종이의 (+)극 가까운 A에 질산 칼슘 수용액을, (−)극 가까운 B에 탄산 나트륨 수용액을 떨어뜨리고 전류를 흘려 주었더니, 얼마 후 A와 B 사이에서 흰색 고체가 생겼다. 이에 대한 설명으로 옳은 것은? (단, 질산 칼슘 수용액에는 칼슘 이온(Ca²⁺)과 질산 이온이, 탄산 나트륨 수용액에는 나트륨 이온과 탄산 이온(CO₃²⁻)이 들어 있다.)", "figure_svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"560\" height=\"250\" viewBox=\"0 0 560 250\" style=\"background:#fff\" fill=\"none\" stroke=\"#000\" stroke-width=\"1.5\" font-size=\"14\" font-family=\"'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif\"><rect x=\"0\" y=\"0\" width=\"560\" height=\"250\" fill=\"#fff\" stroke=\"none\"/><rect x=\"30\" y=\"105\" width=\"500\" height=\"100\" fill=\"#fff\" stroke-width=\"1.2\"/><rect x=\"60\" y=\"118\" width=\"440\" height=\"74\" fill=\"#eee\" stroke-width=\"1.2\"/><text x=\"280\" y=\"228\" fill=\"#000\" stroke=\"none\" font-size=\"12\" text-anchor=\"middle\">유리판<\/text><line x1=\"300\" y1=\"224\" x2=\"330\" y2=\"206\" stroke-width=\"1\"/><text x=\"280\" y=\"245\" fill=\"#000\" stroke=\"none\" font-size=\"12\" text-anchor=\"middle\">질산 칼륨 수용액을 적신 거름종이<\/text><rect x=\"63\" y=\"128\" width=\"18\" height=\"54\" fill=\"#fff\" stroke-width=\"1.5\"/><rect x=\"479\" y=\"128\" width=\"18\" height=\"54\" fill=\"#fff\" stroke-width=\"1.5\"/><rect x=\"215\" y=\"12\" width=\"130\" height=\"44\" fill=\"#fff\"/><text x=\"280\" y=\"40\" fill=\"#000\" stroke=\"none\" font-size=\"13\" text-anchor=\"middle\">전원 장치<\/text><text x=\"214\" y=\"78\" fill=\"#000\" stroke=\"none\" font-size=\"13\" text-anchor=\"middle\">(+)<\/text><text x=\"346\" y=\"78\" fill=\"#000\" stroke=\"none\" font-size=\"13\" text-anchor=\"middle\">(−)<\/text><path d=\"M232,56 V90 H72 V128\" stroke-width=\"1.3\"/><path d=\"M328,56 V90 H488 V128\" stroke-width=\"1.3\"/><circle cx=\"170\" cy=\"160\" r=\"9\" fill=\"#888\" stroke=\"#000\" stroke-width=\"1\"/><text x=\"170\" y=\"146\" fill=\"#000\" stroke=\"none\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"bold\">A<\/text><circle cx=\"390\" cy=\"160\" r=\"9\" fill=\"#888\" stroke=\"#000\" stroke-width=\"1\"/><text x=\"390\" y=\"146\" fill=\"#000\" stroke=\"none\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"bold\">B<\/text><\/svg>", "choices": ["칼슘 이온은 (+)극 쪽으로 이동한다.", "질산 이온과 나트륨 이온은 색이 없으므로 이동하지 않는다.", "전극을 반대로 연결해도 두 이온은 A와 B 사이에서 만나 흰색 고체가 생긴다.", "흰색 고체는 칼슘 이온과 탄산 이온이 만나 생긴 것이다.", "흰색 고체는 나트륨 이온과 질산 이온이 만나 생긴 것이다."], "answer": [4], "explanation": "A의 칼슘 이온(양이온)은 (−)극 쪽인 B 방향으로, B의 탄산 이온(음이온)은 (+)극 쪽인 A 방향으로 이동하여 사이에서 만나 흰색 고체(탄산 칼슘)를 만든다. ① (−)극 쪽으로 이동한다. ② 무색 이온도 이동한다. ③ 극을 바꾸면 두 이온이 서로 멀어지는 방향으로 이동하므로 만나지 않는다. ④ 옳다. ⑤ 나트륨 이온은 (−)극, 질산 이온은 (+)극 쪽으로 이동해 서로 멀어지며, 흰색 고체를 만드는 것은 칼슘 이온과 탄산 이온이다.", "textbook_tags": {"mode": "include_only", "books": ["오투"]}}, {"id": "물질의구성:G-016", "sub": "G", "type_id": "G04", "review_group": "RG21", "role": "reserve", "difficulty": "중", "format": "5지선다", "stem": "염화 칼슘(CaCl₂) 수용액 속에 칼슘 이온(Ca²⁺)이 4개 들어 있을 때, 함께 들어 있는 염화 이온의 개수와 이를 나타낸 것을 옳게 짝지은 것은?", "choices": ["8개, 8Cl⁻", "4개, 4Cl⁻", "8개, Cl₈⁻", "2개, 2Cl⁻", "8개, Cl⁸⁻"], "answer": [1], "explanation": "염화 칼슘은 Ca²⁺ : Cl⁻ = 1 : 2이므로 Ca²⁺ 4개(+8)와 전하 총합이 0이 되려면 Cl⁻ 8개(−8)가 있어야 한다. 이온의 개수는 이온식 앞에 숫자를 붙여 8Cl⁻로 나타낸다. ③은 첨자로, ⑤는 전하 자리에 개수를 썼다.", "textbook_tags": {"mode": "include_only", "books": ["오투", "동아", "지학사"]}}, {"id": "물질의구성:G-017", "sub": "G", "type_id": "G04", "review_group": "RG21", "role": "main", "difficulty": "하", "format": "5지선다", "stem": "염화 칼슘(CaCl₂)은 칼슘 이온(Ca²⁺)과 염화 이온(Cl⁻)으로 이루어진 물질이다. 염화 칼슘에 대한 설명으로 옳은 것은?", "choices": ["염화 칼슘은 분자로 이루어진 물질이다.", "칼슘 이온과 염화 이온은 1 : 2의 개수비로 들어 있다.", "칼슘 이온과 염화 이온은 2 : 1의 개수비로 들어 있다.", "염화 칼슘 전체는 (+)전하를 띤다.", "칼슘 이온은 칼슘 원자가 전자 2개를 얻어 만들어진다."], "answer": [2], "explanation": "화학식 CaCl₂는 Ca²⁺ 1개당 Cl⁻ 2개가 들어 있다는 뜻이다. ① 염화 칼슘은 이온으로 이루어진 물질이다. ② 옳다. ③ 개수비를 뒤집었다. ④ Ca²⁺ 1개(+2)와 Cl⁻ 2개(−2)의 전하 총합이 0이므로 전체는 전기적으로 중성이다. ⑤ 칼슘 원자는 전자 2개를 잃어 Ca²⁺가 된다."}, {"id": "물질의구성:G-018", "sub": "G", "type_id": "G04", "review_group": "RG21", "role": "main", "difficulty": "중", "format": "단답형", "stem": "표는 이온으로 이루어진 두 물질의 화학식을 나타낸 것이다. (가)~(바)에 알맞은 이온식 또는 개수비를 쓰시오.", "table": {"h": ["물질", "화학식", "양이온", "음이온", "개수비(양이온 : 음이온)"], "r": [["염화 나트륨", "NaCl", "(가)", "(나)", "(다)"], ["염화 칼슘", "CaCl₂", "(라)", "(마)", "(바)"]]}, "answer": "(가) Na⁺ (나) Cl⁻ (다) 1 : 1 (라) Ca²⁺ (마) Cl⁻ (바) 1 : 2", "scoring": {"total": 6, "criteria": [{"points": 1, "desc": "(가) Na⁺"}, {"points": 1, "desc": "(나) Cl⁻"}, {"points": 1, "desc": "(다) 1 : 1"}, {"points": 1, "desc": "(라) Ca²⁺"}, {"points": 1, "desc": "(마) Cl⁻"}, {"points": 1, "desc": "(바) 1 : 2"}], "accepted": [], "partial": "칸마다 따로 채점. 'Ca⁺²'처럼 전하 숫자와 부호 순서를 바꾸거나 (바)를 2 : 1로 쓰면 해당 칸 0점."}, "explanation": "NaCl은 나트륨 이온(Na⁺)과 염화 이온(Cl⁻)이 1 : 1로, CaCl₂는 칼슘 이온(Ca²⁺)과 염화 이온(Cl⁻)이 1 : 2로 들어 있다. 화학식에서 원소 기호 오른쪽 아래 숫자는 그 이온의 개수를 나타낸다."}]}, {"key": "동물과에너지", "title": "Ⅵ 동물과 에너지", "subs": {"A": "영양소와 검출", "B": "소화와 흡수", "C": "순환", "D": "호흡", "E": "배설", "F": "세포호흡과 기관계 통합"}, "items": [{"id": "동물과에너지:A-001", "sub": "A", "type_id": "A01", "review_group": "RG01", "role": "main", "difficulty": "하", "format": "5지선다", "stem": "영양소에 대한 설명으로 옳은 것은?", "choices": ["무기염류는 몸속에서 필요한 만큼 만들어지므로 음식으로 섭취하지 않아도 된다.", "무기염류와 바이타민은 몸속에서 분해되어 에너지를 낸다.", "철과 칼슘은 바이타민에 속한다.", "3대 영양소는 탄수화물, 단백질, 무기염류이다.", "물은 에너지원으로 쓰이지 않지만 몸을 구성하는 성분 중 가장 많은 양을 차지한다."], "answer": [5], "explanation": "① 무기염류는 몸에서 만들지 못하므로 음식으로 섭취해야 한다. ② 무기염류와 바이타민은 에너지원으로 쓰이지 않는다. 에너지원은 탄수화물·단백질·지방이다. ③ 철과 칼슘은 무기염류이다. ④ 3대 영양소는 탄수화물, 단백질, 지방이다. 무기염류는 부영양소이다. ⑤ 옳다. 물은 에너지원이 아니지만 몸을 구성하는 성분 중 가장 많다."}, {"id": "동물과에너지:A-002", "sub": "A", "type_id": "A02", "review_group": "RG01", "role": "main", "difficulty": "중", "format": "보기형(ㄱㄴㄷ)", "stem": "그래프는 사람의 몸을 이루는 성분 (가)~(라)의 상대적인 양을 나타낸 것이다. (가)~(라)는 각각 물, 단백질, 지방, 무기염류 중 하나이며, (다)는 에너지원으로 쓰이고 같은 질량일 때 가장 많은 에너지를 내는 영양소이다. 이에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?", "bogi": ["ㄱ. (가)는 물이며, 몸속에서 물질을 운반하고 체온을 조절하는 데 관여한다.", "ㄴ. (나)는 근육, 피부, 머리카락을 이루는 주성분이다.", "ㄷ. (나)는 우리 몸에서 주로 에너지원으로 쓰이는 영양소이다."], "figure_svg": "<svg xmlns:xlink=\"http://www.w3.org/1999/xlink\" width=\"280.8pt\" height=\"187.2pt\" viewBox=\"0 0 280.8 187.2\" xmlns=\"http:/ 44.885385\" y=\"172.316406\" transform=\"rotate(-0 244.885385 172.316406)\">기타<\/text>\n     <\/g>\n    <\/g>\n   <\/g>\n   <g id=\"matplotlib.axis_2\">\n    <g id=\"text_6\">\n     <text style=\"font-size: 11px; font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif'Malgun Gothic'; text-anchor: end\" x=\"70.62\" y=\"14.915781\" transform=\"rotate(-0 70.62 14.915781)\">상대적인 양<\/text>\n    <\/g>\n   <\/g>\n   <g id=\"patch_8\">\n    <path d=\"M 60.62 160.465 \nL 60.62 17.51625 \n\" style=\"fill: none; stroke: #000000; stroke-linejoin: miter; stroke-linecap: square\"/>\n   <\/g>\n   <g id=\"patch_9\">\n    <path d=\"M 60.62 160.465 \nL 268.92 160.465 \n\" style=\"fill: none; stroke: #000000; stroke-linejoin: miter; stroke-linecap: square\"/>\n   <\/g>\n  <\/g>\n <\/g>\n <defs>\n  <clipPath id=\"p725b786195\">\n   <rect x=\"60.62\" y=\"17.51625\" width=\"208.3\" height=\"142.94875\"/>\n  <\/clipPath>\n <\/defs>\n<\/svg>\n", "choices": ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "answer": [3], "explanation": "(다)는 같은 질량일 때 에너지를 가장 많이 내는 지방이다. 몸을 이루는 성분은 물이 가장 많고 그다음이 단백질이므로 (가)는 물, (나)는 단백질, 남은 (라)는 무기염류이다. ㄱ. 옳다. 물은 물질 운반과 체온 조절에 관여한다. ㄴ. 옳다. 단백질은 근육·피부·머리카락의 주성분이다. ㄷ. 옳지 않다. 주로 에너지원으로 쓰이는 것은 탄수화물이고, 단백질은 주로 몸을 구성한다."}, {"id": "동물과에너지:A-003", "sub": "A", "type_id": "A02", "review_group": "RG01", "role": "main", "difficulty": "중", "format": "서술형", "stem": "민수는 밥과 빵을 몸에 필요한 양보다 훨씬 많이 먹는 생활을 오래 계속하였더니 몸무게가 늘었다. 밥과 빵에 많이 들어 있는 영양소의 이름을 쓰고, 이 영양소를 많이 먹으면 몸무게가 느는 까닭을 <u>영양소가 몸에 저장되는 형태<\/u>와 관련지어 서술하시오. (단, 운동량은 변하지 않았다.)", "answer": "밥과 빵에는 탄수화물(녹말)이 많이 들어 있다. 쓰고 남은 탄수화물은 주로 지방으로 바뀌어 몸에 저장되므로 몸무게가 늘어난다.", "scoring": "총 3점. 3점: 탄수화물(녹말·당 인정)을 쓰고 '쓰고 남은 탄수화물이 지방으로 바뀌어 저장된다'를 서술. 2점: 영양소 이름은 맞으나 저장 형태를 '지방'으로 쓰지 않고 '몸에 쌓인다'고만 서술. 1점: 영양소 이름만 맞음, 또는 이름은 틀렸으나 '남은 영양소가 지방으로 바뀌어 저장된다'를 서술. 남은 탄수화물이 그대로 또는 단백질로 저장된다고 쓰면 저장 부분 0점.", "explanation": "쓰고 남은 탄수화물은 그대로 쌓이는 것이 아니라 주로 지방으로 바뀌어 저장된다. 지방은 같은 질량에서 에너지를 많이 저장하는 형태이다."}, {"id": "동물과에너지:A-004", "sub": "A", "type_id": "A01", "review_group": "RG01", "role": "reserve", "difficulty": "하", "format": "단답형", "stem": "다음 설명에 해당하는 영양소의 이름을 쓰시오.<br>· 에너지원으로 쓰이지 않는다.<br>· 뼈, 이, 혈액 등을 구성하고 몸의 기능을 조절한다.<br>· 칼슘, 철, 나트륨 등이 이에 속한다.", "answer": "무기염류", "scoring": "총 1점. 무기염류('무기질'도 인정). 칼슘·철 같은 원소 이름만 쓰면 0점.", "explanation": "칼슘·철·나트륨은 무기염류이다. 무기염류는 에너지원이 아니며 뼈·이·혈액의 구성과 몸의 기능 조절에 관여한다. 바이타민으로 쓰면 오답이다."}, {"id": "동물과에너지:A-005", "sub": "A", "type_id": "A01", "review_group": "RG01", "role": "reserve", "difficulty": "상", "format": "5지선다", "stem": "표는 영양소 (가)~(다)의 특징을 나타낸 것이다. (가)~(다)는 각각 단백질, 지방, 바이타민 중 하나이다. 이에 대한 설명으로 옳지 <u>않은<\/u> 것은?", "table": {"h": ["영양소", "에너지원으로 쓰이는가", "많이 들어 있는 식품", "특징"], "r": [["(가)", "○", "살코기, 달걀흰자, 두부", "몸을 구성하는 성분 중 물 다음으로 많다."], ["(나)", "○", "버터, 식용유, 땅콩", "몸속에 저장되었다가 에너지원으로 쓰인다."], ["(다)", "×", "과일, 채소", "적은 양이 필요하지만 부족하면 결핍증이 나타난다."]]}, "choices": ["(가)는 근육과 효소를 이루는 주성분이다.", "(나)는 세포막을 이루는 성분이다.", "(다)가 부족하면 결핍증이 나타날 수 있다.", "같은 질량일 때 (가)가 (나)보다 많은 에너지를 낸다.", "(가)와 (나)는 3대 영양소에 속한다."], "answer": [4], "explanation": "(가)는 단백질, (나)는 지방, (다)는 바이타민이다. ① 옳다. 단백질은 근육·효소 등의 주성분이다. ② 옳다. 지방은 세포막을 이룬다. ③ 옳다. 바이타민이 부족하면 결핍증이 나타난다. ④ 옳지 않다. 같은 질량에서 가장 많은 에너지를 내는 것은 지방(나)이다. ⑤ 옳다. 단백질과 지방은 3대 영양소이다."}, {"id": "동물과에너지:A-006", "sub": "A", "type_id": "A03", "review_group": "RG02", "role": "reserve", "difficulty": "하", "format": "5지선다", "stem": "영양소를 검출하는 용액, 검출되는 영양소, 반응 색깔을 옳게 짝 지은 것은?", "choices": ["아이오딘-아이오딘화 칼륨 용액 – 녹말 – 청람색", "베네딕트 용액 – 단백질 – 보라색", "수단 Ⅲ 용액 – 지방 – 청람색", "수산화 나트륨 수용액 + 황산 구리 수용액 – 당 – 황적색", "베네딕트 용액 – 녹말 – 황적색"], "answer": [1], "explanation": "① 옳다. ② 단백질은 수산화 나트륨 수용액과 황산 구리 수용액으로 검출하며 보라색이 된다. ③ 수단 Ⅲ 용액은 지방과 반응하여 선홍색이 된다. ④ 두 수용액은 단백질 검출용이며, 당은 베네딕트 용액으로 검출한다. ⑤ 베네딕트 용액은 당과 반응하며 녹말에는 반응하지 않는다."}, {"id": "동물과에너지:A-007", "sub": "A", "type_id": "A03", "review_group": "RG02", "role": "main", "difficulty": "중", "format": "보기형(ㄱㄴㄷ)", "stem": "영양소 검출 실험에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?", "bogi": ["ㄱ. 베네딕트 용액으로 당을 검출할 때는 시약을 넣은 뒤 뜨거운 물에 넣어 가열한다.", "ㄴ. 아이오딘-아이오딘화 칼륨 용액으로 녹말을 검출할 때에도 가열해야 색 변화가 나타난다.", "ㄷ. 엿당 용액에 베네딕트 용액을 넣고 가열하면 황적색이 나타난다.", "ㄹ. 아이오딘-아이오딘화 칼륨 용액은 녹말과 만나기 전부터 청람색을 띤다."], "choices": ["ㄱ, ㄴ", "ㄱ, ㄷ", "ㄴ, ㄹ", "ㄱ, ㄷ, ㄹ", "ㄴ, ㄷ, ㄹ"], "answer": [2], "explanation": "ㄱ. 옳다. 가열이 필요한 것은 당 검출뿐이다. ㄴ. 옳지 않다. 녹말 검출은 가열하지 않는다. ㄷ. 옳다. 베네딕트 용액은 포도당뿐 아니라 엿당 같은 당에도 반응한다. ㄹ. 옳지 않다. 이 용액은 원래 갈색 계열이며, 녹말과 반응해야 청람색이 된다."}, {"id": "동물과에너지:A-008", "sub": "A", "type_id": "A03", "review_group": "RG02", "role": "main", "difficulty": "중", "format": "서술형", "stem": "지아는 포도당 용액이 든 시험관에 베네딕트 용액(당 검출)을 몇 방울 넣고 흔든 뒤 바로 색깔을 관찰하였더니 용액이 처음의 파란색 그대로였다. 지아가 빠뜨린 과정을 쓰고, 그 과정을 거쳤을 때 예상되는 결과를 서술하시오.", "answer": "시약을 넣은 시험관을 뜨거운 물에 넣어 가열(중탕)하는 과정을 빠뜨렸다. 가열하면 포도당과 반응하여 황적색이 나타난다.", "scoring": "총 2점. 과정 1점: 뜨거운 물에 넣어 가열(중탕)한다('가열한다'만 써도 인정). 결과 1점: 황적색(적갈색·주황색 계열 표현 인정). '시간을 더 기다린다', '시약을 더 넣는다'는 과정 0점, 청람색·보라색은 결과 0점.", "explanation": "베네딕트 반응은 가열해야 색 변화가 잘 나타나는 유일한 검출 반응이다."}, {"id": "동물과에너지:A-009", "sub": "A", "type_id": "A03", "review_group": "RG02", "role": "main", "difficulty": "하", "format": "단답형", "stem": "달걀흰자 용액에 들어 있는 단백질을 검출하려고 한다. 이때 차례로 넣는 두 가지 수용액의 이름과, 단백질이 있을 때 나타나는 색깔을 쓰시오.", "answer": "수산화 나트륨 수용액, 황산 구리 수용액 / 보라색", "scoring": "총 2점. 수용액 1점: 수산화 나트륨 수용액과 황산 구리 수용액을 둘 다 씀(넣는 순서는 채점하지 않음, '황산 구리(Ⅱ)' 표기 인정). 색 1점: 보라색.", "explanation": "단백질은 수산화 나트륨 수용액과 황산 구리 수용액을 넣어 보라색이 나타나는지 확인한다. 가열하지 않는다."}, {"id": "동물과에너지:A-010", "sub": "A", "type_id": "A03", "review_group": "RG02", "role": "reserve", "difficulty": "중", "format": "5지선다", "stem": "다음은 영양소 검출에 대해 학생들이 나눈 대화이다. 옳게 말한 학생은?", "choices": ["가은: 지방을 검출하려면 수단 Ⅲ 용액을 넣은 뒤 가열해야 해.", "나래: 베네딕트 용액은 포도당에만 반응하니까 엿당은 검출할 수 없어.", "다온: 단백질에 베네딕트 용액을 넣고 가열하면 보라색이 나타나.", "라희: 녹말 용액에 아이오딘-아이오딘화 칼륨 용액을 떨어뜨리면 청람색이 나타나.", "마루: 지방이 든 시료에 수단 Ⅲ 용액을 넣으면 청람색이 나타나."], "answer": [4], "explanation": "① 지방 검출은 가열하지 않는다. ② 베네딕트 용액은 엿당 등 다른 당에도 반응한다. ③ 단백질은 수산화 나트륨 수용액과 황산 구리 수용액으로 검출한다. ④ 옳다. ⑤ 지방은 수단 Ⅲ 용액과 반응하여 선홍색이 된다."}, {"id": "동물과에너지:A-011", "sub": "A", "type_id": "A04", "review_group": "RG03", "role": "main", "difficulty": "중", "format": "5지선다", "stem": "표는 시료 A~C와 증류수에 여러 가지 검출 용액을 넣었을 때의 결과를 나타낸 것이다. (단, 베네딕트 용액을 넣은 시험관은 가열하였다.) 이에 대한 설명으로 옳은 것은?", "table": {"h": ["시료", "아이오딘-아이오딘화 칼륨 용액", "베네딕트 용액(가열)", "수산화 나트륨 수용액 + 황산 구리 수용액", "수단 Ⅲ 용액"], "r": [["A", "청람색", "변화 없음", "보라색", "변화 없음"], ["B", "변화 없음", "황적색", "변화 없음", "변화 없음"], ["C", "변화 없음", "변화 없음", "보라색", "선홍색"], ["증류수", "변화 없음", "변화 없음", "변화 없음", "변화 없음"]]}, "choices": ["A에는 녹말과 단백질이 들어 있다.", "B에는 당과 지방이 들어 있다.", "C에 들어 있는 영양소는 단백질 한 가지뿐이다.", "증류수에서도 색 변화가 나타나야 실험이 올바르게 된 것이다.", "지방이 들어 있는 시료는 A와 C이다."], "answer": [1], "explanation": "① 옳다. A는 청람색(녹말)과 보라색(단백질) 반응을 보였다. ② B는 황적색(당) 반응만 나타났고 선홍색 반응은 없으므로 지방이 들어 있다고 판정할 수 없다. ③ C는 보라색과 선홍색이 나타났으므로 단백질과 지방이 들어 있다. ④ 증류수는 영양소가 없어 색 변화가 없어야 하며, 비교 기준이 된다. ⑤ 선홍색이 나타난 시료는 C뿐이다."}, {"id": "동물과에너지:A-012", "sub": "A", "type_id": "A05", "review_group": "RG03", "role": "main", "difficulty": "상", "format": "5지선다", "stem": "용액 (가)~(다)는 녹말, 포도당, 단백질 중 서로 다른 한 가지 영양소만 들어 있다. 표는 두 용액씩 같은 양을 섞은 혼합 용액으로 검출 실험을 한 결과이다. (단, 베네딕트 용액을 넣은 시험관은 가열하였고, ○는 반응이 나타남, ×는 나타나지 않음을 뜻한다.) 이에 대한 설명으로 옳은 것은?", "table": {"h": ["혼합 용액", "아이오딘-아이오딘화 칼륨 용액", "베네딕트 용액", "수산화 나트륨 수용액 + 황산 구리 수용액"], "r": [["(가) + (나)", "○", "×", "○"], ["(나) + (다)", "×", "○", "○"]]}, "choices": ["(가)는 포도당 용액이다.", "(나)는 녹말 용액이다.", "(다)에 아이오딘-아이오딘화 칼륨 용액을 넣으면 청람색이 나타난다.", "(가)와 (다)를 섞은 용액에 베네딕트 용액을 넣고 가열하면 황적색이 나타난다.", "(나)와 (다)를 섞은 용액에 수단 Ⅲ 용액을 넣으면 선홍색이 나타난다."], "answer": [4], "explanation": "두 혼합 용액에 모두 들어간 것은 (나)이고, 두 혼합 용액 모두에서 나타난 반응은 단백질 반응뿐이므로 (나)는 단백질이다. (가)+(나)에서 녹말 반응이 나타났으므로 (가)는 녹말, (나)+(다)에서 당 반응이 나타났으므로 (다)는 포도당이다. ① (가)는 녹말이다. ② (나)는 단백질이다. ③ (다)는 포도당이므로 청람색이 나타나지 않는다. ④ 옳다. (다)의 포도당이 반응한다. ⑤ 세 용액 어디에도 지방이 없다."}, {"id": "동물과에너지:A-013", "sub": "A", "type_id": "A04", "review_group": "RG03", "role": "main", "difficulty": "중", "format": "서술형", "stem": "표는 두유와 증류수에 같은 검출 용액을 넣었을 때의 결과이다.<br>(1) 두유에 들어 있다고 판정할 수 있는 영양소를 모두 쓰시오.<br>(2) 두유와 함께 증류수로도 같은 실험을 하는 까닭을 서술하시오.", "table": {"h": ["시료", "아이오딘-아이오딘화 칼륨 용액(녹말 검출)", "베네딕트 용액(당 검출, 가열)", "수산화 나트륨 수용액 + 황산 구리 수용액(단백질 검출)", "수단 Ⅲ 용액(지방 검출)"], "r": [["두유", "변화 없음", "황적색", "보라색", "선홍색"], ["증류수", "변화 없음", "변화 없음", "변화 없음", "변화 없음"]]}, "answer": "(1) 당, 단백질, 지방 (2) 증류수에는 영양소가 없어 색이 변하지 않으므로, 두유의 결과와 비교하여 두유에서 나타난 색 변화가 영양소 때문임을 확인하는 기준(대조군)으로 삼기 위해서이다.", "scoring": "총 3점. (1) 1점: 당, 단백질, 지방 세 가지를 모두 씀('당' 대신 '포도당' 인정), 녹말을 포함하면 0점. (2) 2점: '증류수에는 영양소가 없어 색이 변하지 않는다' 1점 + '두유의 결과와 비교하는 기준(대조군)이다' 1점. '대조군이기 때문'처럼 용어만 쓰면 0점.", "explanation": "반응이 나타난 시약에 해당하는 영양소만 들어 있다고 판정한다. 증류수 시험관은 시약 자체의 색과 비교하는 기준이다."}, {"id": "동물과에너지:A-014", "sub": "A", "type_id": "A05", "review_group": "RG03", "role": "reserve", "difficulty": "상", "format": "보기형(ㄱㄴㄷ)", "stem": "용액 A~C는 녹말, 단백질, 지방 중 서로 다른 한 가지 영양소만 들어 있다. 표는 두 용액씩 섞은 혼합 용액으로 검출 실험을 한 결과이다. (단, ○는 반응이 나타남, ×는 나타나지 않음을 뜻한다.) 이에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?", "bogi": ["ㄱ. B에 들어 있는 영양소는 입에서 처음 소화되기 시작한다.", "ㄴ. C에 들어 있는 영양소는 위에서 펩신에 의해 아미노산까지 모두 분해된다.", "ㄷ. A에 들어 있는 영양소는 작은창자에서 쓸개즙의 도움을 받아 처음 소화된다."], "table": {"h": ["혼합 용액", "아이오딘-아이오딘화 칼륨 용액", "수산화 나트륨 수용액 + 황산 구리 수용액", "수단 Ⅲ 용액"], "r": [["A + B", "○", "×", "○"], ["B + C", "○", "○", "×"]]}, "choices": ["ㄱ", "ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "answer": [3], "explanation": "두 혼합 용액에 공통으로 들어간 B의 성분은 두 결과 모두에서 나타난 녹말이다. A+B에서 지방 반응이 나타났으므로 A는 지방, B+C에서 단백질 반응이 나타났으므로 C는 단백질이다. ㄱ. 옳다. 녹말은 입에서 침의 아밀레이스로 처음 분해된다. ㄴ. 옳지 않다. 펩신은 단백질을 더 작은 단백질로 분해할 뿐이고, 아미노산까지의 분해는 작은창자의 단백질 소화 효소가 한다. ㄷ. 옳다. 지방은 작은창자에서 처음 소화되며, 쓸개즙이 지방을 작은 알갱이로 만들어 소화를 돕는다. 따라서 옳은 것은 ㄱ, ㄷ이다."}, {"id": "동물과에너지:A-015", "sub": "A", "type_id": "A04", "review_group": "RG03", "role": "reserve", "difficulty": "하", "format": "단답형", "stem": "어떤 음식물 즙으로 검출 실험을 한 결과가 다음과 같았다. 이 음식물에 들어 있다고 판정할 수 있는 영양소를 모두 쓰시오. (단, 베네딕트 용액을 넣은 시험관은 가열하였다.)", "table": {"h": ["시료", "아이오딘-아이오딘화 칼륨 용액", "베네딕트 용액(가열)", "수산화 나트륨 수용액 + 황산 구리 수용액", "수단 Ⅲ 용액"], "r": [["음식물 즙", "청람색", "황적색", "변화 없음", "변화 없음"]]}, "answer": "녹말, 당", "scoring": "총 1점. 녹말, 당 두 가지를 모두 써야 정답('당' 대신 '포도당' 인정). 하나만 쓰거나 다른 영양소를 더하면 0점.", "explanation": "청람색은 녹말, 황적색은 당이 있다는 뜻이다. 반응이 없는 단백질과 지방은 들어 있다고 판정할 수 없다."}, {"id": "동물과에너지:A-016", "sub": "A", "type_id": "A01", "review_group": "RG01", "role": "main", "difficulty": "중", "format": "5지선다", "stem": "표는 영양소 A~C의 특징을 나타낸 것이다. A~C는 각각 탄수화물, 지방, 물 중 하나이다. 이에 대한 설명으로 옳은 것은?", "table": {"h": ["영양소", "에너지원으로 쓰이는가?", "특징"], "r": [["A", "예", "같은 질량일 때 3대 영양소 가운데 가장 많은 에너지를 낸다."], ["B", "아니요", "사람의 몸을 이루는 성분 가운데 가장 많다."], ["C", "예", "밥, 빵, 감자에 많이 들어 있다."]]}, "choices": ["A~C 가운데 3대 영양소에 속하는 것은 C뿐이다.", "B는 에너지를 내지 않으므로 영양소에 속하지 않는다.", "사람의 몸을 이루는 성분 가운데 B 다음으로 많은 것은 A이다.", "C를 필요한 양보다 많이 먹으면 쓰고 남은 C는 주로 A로 바뀌어 몸에 저장된다.", "A는 근육, 피부, 머리카락을 이루는 주성분이다."], "answer": [4], "explanation": "A는 같은 질량일 때 에너지를 가장 많이 내는 지방, B는 에너지원이 아니면서 몸에 가장 많은 물, C는 밥·빵·감자에 많은 탄수화물이다. ① 탄수화물(C)과 지방(A)이 모두 3대 영양소이다. ② 물은 에너지를 내지 않지만 영양소 6가지에 속한다. ③ 몸을 이루는 성분은 물 다음으로 단백질이 많다. ④ 옳다. 쓰고 남은 탄수화물은 주로 지방으로 바뀌어 저장된다. ⑤ 근육·피부·머리카락의 주성분은 단백질이다."}, {"id": "동물과에너지:B-001", "sub": "B", "type_id": "B01", "review_group": "RG04", "role": "main", "difficulty": "하", "format": "5지선다", "stem": "소화에 대한 설명으로 옳지 <u>않은<\/u> 것은?", "choices": ["소화는 크기가 큰 영양소를 흡수할 수 있을 만큼 작게 분해하는 과정이다.", "이로 음식물을 잘게 부수는 과정도 소화에 포함된다.", "무기염류와 바이타민은 크기가 작아 소화 과정 없이 흡수된다.", "소화는 영양소를 분해하여 생명 활동에 필요한 에너지를 얻는 과정이다.", "녹말은 소화 과정을 거쳐 포도당으로 분해된 뒤 흡수된다."], "answer": [4], "explanation": "① 옳다. ② 옳다. 잘게 부수고 섞는 과정도 소화이다. ③ 옳다. ④ 옳지 않다. 에너지를 얻는 과정은 세포호흡이며, 소화는 흡수할 수 있게 영양소를 작게 분해하는 과정이다. ⑤ 옳다."}, {"id": "동물과에너지:B-002", "sub": "B", "type_id": "B02", "review_group": "RG04", "role": "main", "difficulty": "중", "format": "5지선다", "stem": "그림과 같이 셀로판 주머니에 녹말 용액과 포도당 용액을 섞어 넣고 물이 든 비커에 담가 두었다. 일정 시간이 지난 뒤 비커의 물을 두 시험관에 덜어 실험한 결과는 표와 같았다. 이에 대한 설명으로 옳은 것은?", "table": {"h": ["시험관", "넣은 용액", "결과"], "r": [["㉠", "아이오딘-아이오딘화 칼륨 용액(녹말 검출)", "변화 없음"], ["㉡", "베네딕트 용액(당 검출)을 넣고 가열", "황적색"]]}, "figure_svg": "<svg style=\"background:#fff\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 290 265\" fill=\"none\" stroke=\"#000\" stroke-width=\"1.5\" font-size=\"13\" font-family=\"'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif\"><path d=\"M40,40 L40,220 Q40,230 50,230 L170,230 Q180,230 180,220 L180,40\"/><path d=\"M40,75 L70,75 M150,75 L180,75\" stroke-dasharray=\"4 3\" stroke-width=\"1\"/><path d=\"M70,28 L70,165 Q70,195 110,195 Q150,195 150,165 L150,28\" fill=\"#000\" fill-opacity=\"0.12\"/><path d=\"M66,40 L154,40\" stroke-width=\"2.5\"/><text x=\"80\" y=\"130\" fill=\"#000\" stroke=\"none\" font-size=\"10\">녹말+포도당<\/text><text x=\"142\" y=\"215\" fill=\"#000\" stroke=\"none\" font-size=\"11\">물<\/text><text x=\"96\" y=\"252\" fill=\"#000\" stroke=\"none\"><\/text><line x1=\"150\" y1=\"110\" x2=\"212\" y2=\"110\" stroke-width=\"1\"/><text x=\"215\" y=\"114\" fill=\"#000\" stroke=\"none\" font-size=\"10\">셀로판 주머니<\/text><\/svg>", "choices": ["녹말은 셀로판 주머니의 막을 통과하여 비커의 물로 나왔다.", "포도당은 셀로판 막을 통과하지 못하였다.", "실험 후 셀로판 주머니 안의 용액에서는 녹말이 검출되지 않는다.", "녹말이 흡수되려면 포도당처럼 크기가 작은 물질로 분해되어야 함을 추론할 수 있다.", "㉡에서 가열하지 않아도 같은 결과를 얻을 수 있다."], "answer": [4], "explanation": "비커 물에서 당만 검출되었으므로 크기가 작은 포도당만 막을 통과하였다. ① 녹말은 막을 통과하지 못했다. ② 포도당은 막을 통과했다. ③ 녹말은 주머니 안에 그대로 남아 있으므로 주머니 안에서는 검출된다. ④ 옳다. 셀로판 막은 세포막처럼 작은 물질만 통과시키는 막의 모형이므로, 녹말은 작게 분해되어야 흡수될 수 있다. ⑤ 베네딕트 반응은 가열해야 색 변화가 잘 나타난다."}, {"id": "동물과에너지:B-003", "sub": "B", "type_id": "B02", "review_group": "RG04", "role": "main", "difficulty": "상", "format": "서술형", "stem": "그림과 같이 셀로판 주머니 (가)에는 녹말 용액과 침을, (나)에는 녹말 용액과 증류수를 넣고, 체온과 비슷한 온도의 물이 든 비커에 각각 담가 두었다. 충분한 시간이 지난 뒤 각 비커의 물에 베네딕트 용액(당 검출)을 넣고 가열하였다. (가)와 (나) 비커 물의 결과를 각각 예상하고, 그렇게 예상한 까닭을 서술하시오. (단, 셀로판 막은 엿당과 포도당은 통과시키고 녹말은 통과시키지 않는다.)", "figure_svg": "<svg style=\"background:#fff\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 265\" fill=\"none\" stroke=\"#000\" stroke-width=\"1.5\" font-size=\"13\" font-family=\"'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif\"><path d=\"M20,40 L20,220 Q20,230 30,230 L150,230 Q160,230 160,220 L160,40\"/><path d=\"M20,75 L50,75 M130,75 L160,75\" stroke-dasharray=\"4 3\" stroke-width=\"1\"/><path d=\"M50,28 L50,165 Q50,195 90,195 Q130,195 130,165 L130,28\" fill=\"#000\" fill-opacity=\"0.12\"/><path d=\"M46,40 L134,40\" stroke-width=\"2.5\"/><text x=\"70\" y=\"130\" fill=\"#000\" stroke=\"none\" font-size=\"10\">녹말+침<\/text><text x=\"122\" y=\"215\" fill=\"#000\" stroke=\"none\" font-size=\"11\">물<\/text><text x=\"76\" y=\"252\" fill=\"#000\" stroke=\"none\">(가)<\/text><path d=\"M220,40 L220,220 Q220,230 230,230 L350,230 Q360,230 360,220 L360,40\"/><path d=\"M220,75 L250,75 M330,75 L360,75\" stroke-dasharray=\"4 3\" stroke-width=\"1\"/><path d=\"M250,28 L250,165 Q250,195 290,195 Q330,195 330,165 L330,28\" fill=\"#000\" fill-opacity=\"0.12\"/><path d=\"M246,40 L334,40\" stroke-width=\"2.5\"/><text x=\"260\" y=\"130\" fill=\"#000\" stroke=\"none\" font-size=\"10\">녹말+증류수<\/text><text x=\"322\" y=\"215\" fill=\"#000\" stroke=\"none\" font-size=\"11\">물<\/text><text x=\"276\" y=\"252\" fill=\"#000\" stroke=\"none\">(나)<\/text><\/svg>", "answer": "(가) 비커 물에서는 황적색이 나타나고, (나) 비커 물에서는 색 변화가 없다. (가)에서는 침 속 아밀레이스가 녹말을 엿당으로 분해하고, 크기가 작은 엿당이 셀로판 막을 통과하여 비커 물로 나오기 때문이다. (나)에서는 녹말이 분해되지 않아 막을 통과하지 못하므로 비커 물에 당이 없다.", "scoring": "총 3점. 결과 1점: (가) 황적색, (나) 변화 없음을 모두 맞힘. 분해 1점: 침(아밀레이스)이 녹말을 엿당(당)으로 분해한다. 막 통과 1점: 엿당은 셀로판 막을 통과하고 녹말은 통과하지 못한다. (나)에서도 황적색이 나타난다고 쓰면 결과 0점.", "explanation": "소화가 필요한 까닭(큰 영양소는 막을 통과하지 못함)과 침의 작용을 함께 묻는 확장 문항이다. 막의 통과 조건을 단서로 주어 범위 밖 지식이 필요 없다."}, {"id": "동물과에너지:B-004", "sub": "B", "type_id": "B01", "review_group": "RG04", "role": "reserve", "difficulty": "중", "format": "보기형(ㄱㄴㄷ)", "stem": "소화에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?", "bogi": ["ㄱ. 위가 움직여 음식물과 위액을 섞어 주는 것도 소화에 포함된다.", "ㄴ. 흡수된 영양소를 혈액이 온몸의 세포로 운반하는 과정도 소화에 해당한다.", "ㄷ. 무기염류는 소화 효소에 의해 더 작게 분해된 뒤에 흡수된다."], "choices": ["ㄱ", "ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "answer": [1], "explanation": "ㄱ. 옳다. 섞고 잘게 부수는 과정도 소화이다. ㄴ. 옳지 않다. 영양소 운반은 순환계의 역할이다. ㄷ. 옳지 않다. 무기염류는 크기가 작아 분해되지 않고 그대로 흡수된다."}, {"id": "동물과에너지:B-005", "sub": "B", "type_id": "B02", "review_group": "RG04", "role": "reserve", "difficulty": "하", "format": "단답형", "stem": "셀로판 주머니에 녹말 용액과 포도당 용액을 넣고 물이 든 비커에 담가 두었다. 일정 시간 뒤 비커의 물을 검사하였을 때 검출되는 영양소를 쓰고, 이 실험에서 셀로판 막이 나타내는 것을 쓰시오.", "answer": "포도당 / 소화관(작은창자) 안쪽 벽", "scoring": "총 2점. (1) 검출되는 영양소: '포도당' 1점(녹말을 함께 쓰면 0점). (2) 셀로판 막이 나타내는 것: '소화관 벽', '소화관(작은창자) 안쪽 벽', '작은창자 벽', '융털 표면의 막' 중 하나면 1점. '세포막'만 쓰면 0점(이 실험의 셀로판 막은 영양소가 흡수되는 소화관 벽의 모형).", "explanation": "크기가 작은 포도당은 셀로판 막을 통과하고, 크기가 큰 녹말은 통과하지 못한다. 셀로판 막은 영양소가 흡수되는 소화관(작은창자) 안쪽 벽의 모형이다."}, {"id": "동물과에너지:B-006", "sub": "B", "type_id": "B03", "review_group": "RG05", "role": "main", "difficulty": "하", "format": "5지선다", "stem": "그림은 사람의 소화 기관을 나타낸 것이다. A~G 중 음식물이 직접 지나가는 기관만을 있는 대로 고른 것은?", "figure_svg": "<svg style=\"background:#fff\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 385\" fill=\"none\" stroke=\"#000\" stroke-width=\"1.5\" font-size=\"13\" font-family=\"'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif\"><text x=\"150\" y=\"14\" fill=\"#000\" stroke=\"none\" font-size=\"11\">입 쪽<\/text><path d=\"M168,20 L168,112 M180,20 L180,108\"/><path d=\"M60,95 Q110,72 160,92 L156,118 Q135,150 92,150 Q62,145 60,95 Z\" fill=\"#000\" fill-opacity=\"0.12\"/><path d=\"M178,108 Q230,92 246,128 Q252,170 214,180 Q196,184 190,170 Q206,160 204,140 Q198,124 180,120 Z\" fill=\"#000\" fill-opacity=\"0.12\"/><ellipse cx=\"128\" cy=\"158\" rx=\"11\" ry=\"8\" fill=\"#000\" fill-opacity=\"0.3\"/><ellipse cx=\"228\" cy=\"197\" rx=\"22\" ry=\"7\" fill=\"#000\" fill-opacity=\"0.2\"/><path d=\"M108,330 L100,330 Q92,330 92,320 L92,222 Q92,212 102,212 L236,212 Q246,212 246,222 L246,318 Q246,330 234,334 L184,344 L178,366\" stroke-width=\"12\" stroke-opacity=\"0.35\"/><path d=\"M196,178 Q190,215 150,226 Q110,232 120,250 Q140,264 200,252 Q232,248 222,270 Q205,288 140,280 Q108,278 118,298 Q130,314 200,304 Q222,302 214,320 Q200,330 108,328\" stroke-width=\"5\" stroke-opacity=\"0.6\"/><text x=\"176\" y=\"382\" fill=\"#000\" stroke=\"none\" font-size=\"11\">항문 쪽<\/text><line x1=\"180\" y1=\"50\" x2=\"215\" y2=\"50\" stroke-width=\"1\"/><text x=\"220\" y=\"54\" fill=\"#000\" stroke=\"none\">A<\/text><line x1=\"95\" y1=\"110\" x2=\"40\" y2=\"110\" stroke-width=\"1\"/><text x=\"26\" y=\"114\" fill=\"#000\" stroke=\"none\">B<\/text><line x1=\"242\" y1=\"140\" x2=\"275\" y2=\"140\" stroke-width=\"1\"/><text x=\"280\" y=\"144\" fill=\"#000\" stroke=\"none\">C<\/text><line x1=\"117\" y1=\"162\" x2=\"40\" y2=\"178\" stroke-width=\"1\"/><text x=\"26\" y=\"182\" fill=\"#000\" stroke=\"none\">D<\/text><line x1=\"250\" y1=\"197\" x2=\"280\" y2=\"197\" stroke-width=\"1\"/><text x=\"285\" y=\"201\" fill=\"#000\" stroke=\"none\">E<\/text><line x1=\"252\" y1=\"285\" x2=\"285\" y2=\"285\" stroke-width=\"1\"/><text x=\"290\" y=\"289\" fill=\"#000\" stroke=\"none\">F<\/text><line x1=\"150\" y1=\"280\" x2=\"40\" y2=\"280\" stroke-width=\"1\"/><text x=\"26\" y=\"284\" fill=\"#000\" stroke=\"none\">G<\/text><\/svg>", "choices": ["A, B, C, D", "A, C, E, G", "A, C, F, G", "B, D, E, F", "A, C, G"], "answer": [3], "explanation": "A는 식도, B는 간, C는 위, D는 쓸개, E는 이자, F는 큰창자, G는 작은창자이다. 음식물은 입 → 식도(A) → 위(C) → 작은창자(G) → 큰창자(F) → 항문으로 지나간다. 간·쓸개·이자는 음식물이 지나가지 않는다. ①②는 간·쓸개·이자를 소화관으로 보았고, ④는 소화관과 그 밖의 기관을 맞바꾸었으며, ⑤는 큰창자를 빠뜨렸다.", "stimulus_group": "SG-B-소화기관그림"}, {"id": "동물과에너지:B-007", "sub": "B", "type_id": "B04", "review_group": "RG05", "role": "main", "difficulty": "중", "format": "보기형(ㄱㄴㄷ)", "stem": "그림은 사람의 소화 기관을 나타낸 것이다. 이에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?", "bogi": ["ㄱ. C에서 분비되는 염산은 음식물 속 세균을 없애고 단백질 소화 효소의 작용을 돕는다.", "ㄴ. F에서는 소화 효소가 분비되어 남은 영양소를 분해한다.", "ㄷ. E에서 만든 소화액은 G로 분비된다.", "ㄹ. B는 지방 분해 효소가 들어 있는 소화액을 만든다."], "figure_svg": "<svg style=\"background:#fff\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 385\" fill=\"none\" stroke=\"#000\" stroke-width=\"1.5\" font-size=\"13\" font-family=\"'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif\"><text x=\"150\" y=\"14\" fill=\"#000\" stroke=\"none\" font-size=\"11\">입 쪽<\/text><path d=\"M168,20 L168,112 M180,20 L180,108\"/><path d=\"M60,95 Q110,72 160,92 L156,118 Q135,150 92,150 Q62,145 60,95 Z\" fill=\"#000\" fill-opacity=\"0.12\"/><path d=\"M178,108 Q230,92 246,128 Q252,170 214,180 Q196,184 190,170 Q206,160 204,140 Q198,124 180,120 Z\" fill=\"#000\" fill-opacity=\"0.12\"/><ellipse cx=\"128\" cy=\"158\" rx=\"11\" ry=\"8\" fill=\"#000\" fill-opacity=\"0.3\"/><ellipse cx=\"228\" cy=\"197\" rx=\"22\" ry=\"7\" fill=\"#000\" fill-opacity=\"0.2\"/><path d=\"M108,330 L100,330 Q92,330 92,320 L92,222 Q92,212 102,212 L236,212 Q246,212 246,222 L246,318 Q246,330 234,334 L184,344 L178,366\" stroke-width=\"12\" stroke-opacity=\"0.35\"/><path d=\"M196,178 Q190,215 150,226 Q110,232 120,250 Q140,264 200,252 Q232,248 222,270 Q205,288 140,280 Q108,278 118,298 Q130,314 200,304 Q222,302 214,320 Q200,330 108,328\" stroke-width=\"5\" stroke-opacity=\"0.6\"/><text x=\"176\" y=\"382\" fill=\"#000\" stroke=\"none\" font-size=\"11\">항문 쪽<\/text><line x1=\"180\" y1=\"50\" x2=\"215\" y2=\"50\" stroke-width=\"1\"/><text x=\"220\" y=\"54\" fill=\"#000\" stroke=\"none\">A<\/text><line x1=\"95\" y1=\"110\" x2=\"40\" y2=\"110\" stroke-width=\"1\"/><text x=\"26\" y=\"114\" fill=\"#000\" stroke=\"none\">B<\/text><line x1=\"242\" y1=\"140\" x2=\"275\" y2=\"140\" stroke-width=\"1\"/><text x=\"280\" y=\"144\" fill=\"#000\" stroke=\"none\">C<\/text><line x1=\"117\" y1=\"162\" x2=\"40\" y2=\"178\" stroke-width=\"1\"/><text x=\"26\" y=\"182\" fill=\"#000\" stroke=\"none\">D<\/text><line x1=\"250\" y1=\"197\" x2=\"280\" y2=\"197\" stroke-width=\"1\"/><text x=\"285\" y=\"201\" fill=\"#000\" stroke=\"none\">E<\/text><line x1=\"252\" y1=\"285\" x2=\"285\" y2=\"285\" stroke-width=\"1\"/><text x=\"290\" y=\"289\" fill=\"#000\" stroke=\"none\">F<\/text><line x1=\"150\" y1=\"280\" x2=\"40\" y2=\"280\" stroke-width=\"1\"/><text x=\"26\" y=\"284\" fill=\"#000\" stroke=\"none\">G<\/text><\/svg>", "choices": ["ㄱ, ㄴ", "ㄱ, ㄷ", "ㄴ, ㄹ", "ㄱ, ㄷ, ㄹ", "ㄴ, ㄷ, ㄹ"], "answer": [2], "explanation": "ㄱ. 옳다. 위(C)의 염산은 살균 작용을 하고 펩신의 작용을 돕는다. ㄴ. 옳지 않다. 큰창자(F)에서는 소화 효소가 분비되지 않으며 소화가 일어나지 않는다. ㄷ. 옳다. 이자(E)에서 만든 이자액은 작은창자(G)로 분비된다. ㄹ. 옳지 않다. 간(B)이 만드는 쓸개즙에는 소화 효소가 없다.", "stimulus_group": "SG-B-소화기관그림"}, {"id": "동물과에너지:B-008", "sub": "B", "type_id": "B03", "review_group": "RG05", "role": "main", "difficulty": "하", "format": "순서배열", "stem": "그림은 사람의 소화 기관을 나타낸 것이다. 입으로 들어온 음식물이 항문으로 나갈 때까지 지나가는 기관을 순서대로 기호로 나열하시오. (단, 음식물이 지나가지 않는 기관은 쓰지 않는다.)", "figure_svg": "<svg style=\"background:#fff\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 385\" fill=\"none\" stroke=\"#000\" stroke-width=\"1.5\" font-size=\"13\" font-family=\"'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif\"><text x=\"150\" y=\"14\" fill=\"#000\" stroke=\"none\" font-size=\"11\">입 쪽<\/text><path d=\"M168,20 L168,112 M180,20 L180,108\"/><path d=\"M60,95 Q110,72 160,92 L156,118 Q135,150 92,150 Q62,145 60,95 Z\" fill=\"#000\" fill-opacity=\"0.12\"/><path d=\"M178,108 Q230,92 246,128 Q252,170 214,180 Q196,184 190,170 Q206,160 204,140 Q198,124 180,120 Z\" fill=\"#000\" fill-opacity=\"0.12\"/><ellipse cx=\"128\" cy=\"158\" rx=\"11\" ry=\"8\" fill=\"#000\" fill-opacity=\"0.3\"/><ellipse cx=\"228\" cy=\"197\" rx=\"22\" ry=\"7\" fill=\"#000\" fill-opacity=\"0.2\"/><path d=\"M108,330 L100,330 Q92,330 92,320 L92,222 Q92,212 102,212 L236,212 Q246,212 246,222 L246,318 Q246,330 234,334 L184,344 L178,366\" stroke-width=\"12\" stroke-opacity=\"0.35\"/><path d=\"M196,178 Q190,215 150,226 Q110,232 120,250 Q140,264 200,252 Q232,248 222,270 Q205,288 140,280 Q108,278 118,298 Q130,314 200,304 Q222,302 214,320 Q200,330 108,328\" stroke-width=\"5\" stroke-opacity=\"0.6\"/><text x=\"176\" y=\"382\" fill=\"#000\" stroke=\"none\" font-size=\"11\">항문 쪽<\/text><line x1=\"180\" y1=\"50\" x2=\"215\" y2=\"50\" stroke-width=\"1\"/><text x=\"220\" y=\"54\" fill=\"#000\" stroke=\"none\">A<\/text><line x1=\"95\" y1=\"110\" x2=\"40\" y2=\"110\" stroke-width=\"1\"/><text x=\"26\" y=\"114\" fill=\"#000\" stroke=\"none\">B<\/text><line x1=\"242\" y1=\"140\" x2=\"275\" y2=\"140\" stroke-width=\"1\"/><text x=\"280\" y=\"144\" fill=\"#000\" stroke=\"none\">C<\/text><line x1=\"117\" y1=\"162\" x2=\"40\" y2=\"178\" stroke-width=\"1\"/><text x=\"26\" y=\"182\" fill=\"#000\" stroke=\"none\">D<\/text><line x1=\"250\" y1=\"197\" x2=\"280\" y2=\"197\" stroke-width=\"1\"/><text x=\"285\" y=\"201\" fill=\"#000\" stroke=\"none\">E<\/text><line x1=\"252\" y1=\"285\" x2=\"285\" y2=\"285\" stroke-width=\"1\"/><text x=\"290\" y=\"289\" fill=\"#000\" stroke=\"none\">F<\/text><line x1=\"150\" y1=\"280\" x2=\"40\" y2=\"280\" stroke-width=\"1\"/><text x=\"26\" y=\"284\" fill=\"#000\" stroke=\"none\">G<\/text><\/svg>", "answer": "A → C → G → F", "scoring": "총 1점. A → C → G → F. 앞에 '입', 뒤에 '항문'을 덧붙여 써도 정답. B, D, E 중 하나라도 넣거나 순서가 바뀌면 0점.", "explanation": "입 → 식도(A) → 위(C) → 작은창자(G) → 큰창자(F) → 항문. 간(B), 쓸개(D), 이자(E)는 음식물이 지나가지 않는 기관이다.", "stimulus_group": "SG-B-소화기관그림"}, {"id": "동물과에너지:B-009", "sub": "B", "type_id": "B04", "review_group": "RG05", "role": "reserve", "difficulty": "중", "format": "서술형", "stem": "위액에는 단백질 소화 효소와 함께 강한 산성을 띠는 염산이 들어 있다. 위액 속 염산이 하는 일을 <u>두 가지<\/u> 서술하시오.", "answer": "① 음식물에 섞여 들어온 세균을 없앤다(살균 작용). ② 위의 단백질 소화 효소(펩신)가 잘 작용하도록 돕는다.", "scoring": "총 2점. 살균 작용(세균을 없앤다) 1점 + 펩신(단백질 소화 효소)의 작용을 돕는다 1점. '염산이 단백질을 분해한다'고 쓰면 해당 항목 0점.", "explanation": "염산 자체가 영양소를 분해하는 것이 아니라, 효소의 작용을 돕고 세균을 없앤다."}, {"id": "동물과에너지:B-010", "sub": "B", "type_id": "B04", "review_group": "RG05", "role": "reserve", "difficulty": "중", "format": "5지선다", "stem": "그림은 사람의 소화 기관을 나타낸 것이다. 이에 대한 설명으로 옳은 것은?", "figure_svg": "<svg style=\"background:#fff\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 385\" fill=\"none\" stroke=\"#000\" stroke-width=\"1.5\" font-size=\"13\" font-family=\"'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif\"><text x=\"150\" y=\"14\" fill=\"#000\" stroke=\"none\" font-size=\"11\">입 쪽<\/text><path d=\"M168,20 L168,112 M180,20 L180,108\"/><path d=\"M60,95 Q110,72 160,92 L156,118 Q135,150 92,150 Q62,145 60,95 Z\" fill=\"#000\" fill-opacity=\"0.12\"/><path d=\"M178,108 Q230,92 246,128 Q252,170 214,180 Q196,184 190,170 Q206,160 204,140 Q198,124 180,120 Z\" fill=\"#000\" fill-opacity=\"0.12\"/><ellipse cx=\"128\" cy=\"158\" rx=\"11\" ry=\"8\" fill=\"#000\" fill-opacity=\"0.3\"/><ellipse cx=\"228\" cy=\"197\" rx=\"22\" ry=\"7\" fill=\"#000\" fill-opacity=\"0.2\"/><path d=\"M108,330 L100,330 Q92,330 92,320 L92,222 Q92,212 102,212 L236,212 Q246,212 246,222 L246,318 Q246,330 234,334 L184,344 L178,366\" stroke-width=\"12\" stroke-opacity=\"0.35\"/><path d=\"M196,178 Q190,215 150,226 Q110,232 120,250 Q140,264 200,252 Q232,248 222,270 Q205,288 140,280 Q108,278 118,298 Q130,314 200,304 Q222,302 214,320 Q200,330 108,328\" stroke-width=\"5\" stroke-opacity=\"0.6\"/><text x=\"176\" y=\"382\" fill=\"#000\" stroke=\"none\" font-size=\"11\">항문 쪽<\/text><line x1=\"180\" y1=\"50\" x2=\"215\" y2=\"50\" stroke-width=\"1\"/><text x=\"220\" y=\"54\" fill=\"#000\" stroke=\"none\">A<\/text><line x1=\"95\" y1=\"110\" x2=\"40\" y2=\"110\" stroke-width=\"1\"/><text x=\"26\" y=\"114\" fill=\"#000\" stroke=\"none\">B<\/text><line x1=\"242\" y1=\"140\" x2=\"275\" y2=\"140\" stroke-width=\"1\"/><text x=\"280\" y=\"144\" fill=\"#000\" stroke=\"none\">C<\/text><line x1=\"117\" y1=\"162\" x2=\"40\" y2=\"178\" stroke-width=\"1\"/><text x=\"26\" y=\"182\" fill=\"#000\" stroke=\"none\">D<\/text><line x1=\"250\" y1=\"197\" x2=\"280\" y2=\"197\" stroke-width=\"1\"/><text x=\"285\" y=\"201\" fill=\"#000\" stroke=\"none\">E<\/text><line x1=\"252\" y1=\"285\" x2=\"285\" y2=\"285\" stroke-width=\"1\"/><text x=\"290\" y=\"289\" fill=\"#000\" stroke=\"none\">F<\/text><line x1=\"150\" y1=\"280\" x2=\"40\" y2=\"280\" stroke-width=\"1\"/><text x=\"26\" y=\"284\" fill=\"#000\" stroke=\"none\">G<\/text><\/svg>", "choices": ["A에서 녹말 소화 효소가 분비된다.", "D에서 쓸개즙이 만들어진다.", "음식물 속 세균을 없애는 산성 물질은 G에서 분비된다.", "E의 내부에서 음식물의 소화가 일어난다.", "G에서 영양소의 최종 소화와 흡수가 함께 일어난다."], "answer": [5], "explanation": "① 식도(A)에서는 소화 효소가 분비되지 않는다. ② 쓸개즙은 간(B)에서 만들어지고 쓸개(D)에 저장된다. ③ 염산은 위(C)에서 분비된다. ④ 이자(E)는 이자액을 만들어 작은창자로 내보낼 뿐, 소화는 소화관 안에서 일어난다. ⑤ 옳다. 작은창자(G)에서 최종 소화와 흡수가 일어난다.", "stimulus_group": "SG-B-소화기관그림"}, {"id": "동물과에너지:B-011", "sub": "B", "type_id": "B05", "review_group": "RG06", "role": "reserve", "difficulty": "하", "format": "5지선다", "stem": "쓸개즙에 대한 설명으로 옳은 것은?", "choices": ["쓸개에서 만들어진다.", "지방을 분해하는 효소가 들어 있다.", "간에서 만들어져 쓸개에 저장되었다가 작은창자로 분비된다.", "단백질의 소화를 돕는다.", "위로 분비되어 위액과 함께 음식물을 소화한다."], "answer": [3], "explanation": "① 쓸개즙은 간에서 만들어진다. ② 쓸개즙에는 소화 효소가 없다. ③ 옳다. ④ 쓸개즙은 지방의 소화를 돕는다. ⑤ 쓸개즙은 작은창자로 분비된다."}, {"id": "동물과에너지:B-012", "sub": "B", "type_id": "B05", "review_group": "RG06", "role": "main", "difficulty": "상", "format": "보기형(ㄱㄴㄷ)", "stem": "그림은 간(A), 쓸개(B), 이자(C)와 작은창자(D)가 관으로 연결된 모습을 나타낸 것이다. 어떤 사람의 X 부분이 막혔다고 할 때, 이에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은? (단, 이자액이 나오는 관은 X와 따로 연결되어 있어 영향을 받지 않는다.)", "bogi": ["ㄱ. 작은창자에서 지방의 소화가 원활하게 일어나지 않는다.", "ㄴ. A에서 쓸개즙이 만들어지지 않는다.", "ㄷ. 라이페이스가 지방 덩어리를 작은 알갱이로 만들어 주므로 지방 소화에는 영향이 없다."], "figure_svg": "<svg style=\"background:#fff\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 330 225\" fill=\"none\" stroke=\"#000\" stroke-width=\"1.5\" font-size=\"13\" font-family=\"'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif\"><path d=\"M20,30 Q110,0 200,35 Q170,90 90,95 Q30,95 20,30 Z\" fill=\"#000\" fill-opacity=\"0.12\"/><ellipse cx=\"110\" cy=\"120\" rx=\"16\" ry=\"11\" fill=\"#000\" fill-opacity=\"0.3\"/><path d=\"M110,92 L110,109 M110,131 L110,180\"/><ellipse cx=\"235\" cy=\"128\" rx=\"48\" ry=\"12\" fill=\"#000\" fill-opacity=\"0.2\"/><path d=\"M205,138 L205,180\"/><path d=\"M15,180 L315,180 M15,206 L315,206\" stroke-width=\"2\"/><text x=\"104\" y=\"162\" fill=\"#000\" stroke=\"none\" font-size=\"16\">×<\/text><line x1=\"120\" y1=\"157\" x2=\"150\" y2=\"157\" stroke-width=\"1\"/><text x=\"155\" y=\"161\" fill=\"#000\" stroke=\"none\">X<\/text><text x=\"205\" y=\"30\" fill=\"#000\" stroke=\"none\">A<\/text><text x=\"70\" y=\"124\" fill=\"#000\" stroke=\"none\">B<\/text><text x=\"290\" y=\"112\" fill=\"#000\" stroke=\"none\">C<\/text><text x=\"150\" y=\"222\" fill=\"#000\" stroke=\"none\">D<\/text><\/svg>", "choices": ["ㄱ", "ㄴ", "ㄷ", "ㄱ, ㄴ", "ㄱ, ㄷ"], "answer": [1], "explanation": "X가 막히면 쓸개즙이 작은창자로 나오지 못한다. ㄱ. 옳다. 쓸개즙이 지방을 작은 알갱이로 만들어 주지 못하므로 지방 소화가 원활하지 않다. ㄴ. 옳지 않다. 관이 막힌 것이므로 간에서 쓸개즙을 만드는 것과는 관계가 없다. ㄷ. 옳지 않다. 지방 덩어리를 작게 만드는 것은 쓸개즙이며, 라이페이스는 지방을 화학적으로 분해하는 효소이다."}, {"id": "동물과에너지:B-013", "sub": "B", "type_id": "B05", "review_group": "RG06", "role": "main", "difficulty": "중", "format": "서술형", "stem": "쓸개즙에는 소화 효소가 없지만 지방의 소화를 돕는다. 쓸개즙이 지방의 소화를 돕는 방법을 서술하고, 이자액 속 라이페이스가 하는 일과 비교하여 쓰시오.", "answer": "쓸개즙은 지방 덩어리를 작은 알갱이로 만들어 라이페이스가 잘 작용하도록 돕는다. 라이페이스는 지방을 지방산과 모노글리세리드로 분해하는 효소이다.", "scoring": "총 2점. 쓸개즙 1점: 지방 덩어리를 작은 알갱이로 만들어 소화를 돕는다. 라이페이스 1점: 지방을 지방산과 모노글리세리드로 분해한다(산물 없이 '지방을 분해한다'만 쓰면 0점). 쓸개즙이 지방을 화학적으로 분해한다고 쓰면 쓸개즙 부분 0점.", "explanation": "쓸개즙은 효소 없이 물리적으로 지방을 잘게 나누고, 라이페이스는 화학적으로 분해한다."}, {"id": "동물과에너지:B-014", "sub": "B", "type_id": "B05", "review_group": "RG06", "role": "main", "difficulty": "하", "format": "단답형", "stem": "다음 ㉠~㉢에 알맞은 기관의 이름을 쓰시오.<br>쓸개즙은 ( ㉠ )에서 만들어져 ( ㉡ )에 저장되었다가 ( ㉢ )(으)로 분비되어 지방의 소화를 돕는다.", "answer": "㉠ 간, ㉡ 쓸개, ㉢ 작은창자", "scoring": "총 3점. 빈칸당 1점. ㉠ 간, ㉡ 쓸개, ㉢ 작은창자('십이지장'도 인정).", "explanation": "쓸개즙은 간에서 생성, 쓸개에 저장, 작은창자로 분비된다."}, {"id": "동물과에너지:B-015", "sub": "B", "type_id": "B05", "review_group": "RG06", "role": "reserve", "difficulty": "중", "format": "5지선다", "stem": "다음은 간과 쓸개즙에 대해 학생들이 나눈 대화이다. 옳게 말한 학생은?", "choices": ["가람: 간은 소화와는 관계가 없는 기관이야.", "나윤: 쓸개즙에 들어 있는 효소가 지방을 분해해.", "다현: 쓸개즙은 녹말 같은 탄수화물의 소화를 도와.", "라온: 간에서 만든 쓸개즙은 효소가 없지만 지방의 소화를 도와.", "마음: 지방 덩어리를 작은 알갱이로 만드는 것은 라이페이스야."], "answer": [4], "explanation": "① 간은 쓸개즙을 만들어 지방 소화를 돕는 소화계 기관이다. ② 쓸개즙에는 효소가 없다. ③ 쓸개즙은 지방의 소화를 돕는다. ④ 옳다. ⑤ 지방을 작은 알갱이로 만드는 것은 쓸개즙이다."}, {"id": "동물과에너지:B-016", "sub": "B", "type_id": "B06", "review_group": "RG07", "role": "reserve", "difficulty": "중", "format": "5지선다", "stem": "소화 효소, 그 효소가 들어 있는 소화액을 만드는 기관, 분해하는 영양소를 옳게 짝 지은 것은?", "choices": ["펩신 – 이자 – 단백질", "트립신 – 위 – 단백질", "아밀레이스 – 위 – 단백질", "라이페이스 – 위 – 지방", "아밀레이스 – 침샘 – 녹말"], "answer": [5], "explanation": "① 펩신은 위에서 만들어지는 위액 속 효소이다. ② 트립신은 이자에서 만들어진다. ③ 아밀레이스는 위에서 나오지 않으며 단백질을 분해하지 않는다. ④ 라이페이스는 이자에서 만들어진다. ⑤ 옳다. 침샘에서 만든 침의 아밀레이스는 녹말을 분해한다."}, {"id": "동물과에너지:B-017", "sub": "B", "type_id": "B06", "review_group": "RG07", "role": "main", "difficulty": "상", "format": "보기형(ㄱㄴㄷ)", "stem": "표는 소화액 (가)~(다)가 녹말, 단백질, 지방을 분해하는지를 나타낸 것이다. (가)~(다)는 각각 침, 위액, 이자액 중 하나이다. (○: 분해함, ×: 분해하지 못함) 이에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?", "bogi": ["ㄱ. (가)는 침이며, 녹말을 엿당으로 분해한다.", "ㄴ. (나)에는 트립신이 들어 있다.", "ㄷ. (다)는 이자에서 만들어져 작은창자로 분비된다.", "ㄹ. (나)에 들어 있는 효소는 단백질을 아미노산까지 분해한다."], "table": {"h": ["소화액", "녹말", "단백질", "지방"], "r": [["(가)", "○", "×", "×"], ["(나)", "×", "○", "×"], ["(다)", "○", "○", "○"]]}, "choices": ["ㄱ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄴ, ㄹ", "ㄱ, ㄷ, ㄹ"], "answer": [2], "explanation": "세 영양소를 모두 분해하는 (다)는 이자액, 녹말만 분해하는 (가)는 침, 단백질만 분해하는 (나)는 위액이다. ㄱ. 옳다. ㄴ. 옳지 않다. 위액에는 펩신이 들어 있고, 트립신은 이자액에 들어 있다. ㄷ. 옳다. ㄹ. 옳지 않다. 펩신은 단백질을 더 작은 단백질로 분해하며, 아미노산까지의 분해는 작은창자의 단백질 소화 효소가 한다."}, {"id": "동물과에너지:B-018", "sub": "B", "type_id": "B06", "review_group": "RG07", "role": "main", "difficulty": "중", "format": "서술형", "stem": "이자액에는 3대 영양소를 분해하는 효소가 모두 들어 있다. 이자액에 들어 있는 소화 효소 세 가지의 이름을 쓰고, 각 효소가 분해하는 영양소를 짝 지어 서술하시오.", "answer": "아밀레이스 – 녹말, 트립신 – 단백질, 라이페이스 – 지방", "scoring": "총 3점. 효소-영양소 한 쌍당 1점(아밀레이스–녹말, 트립신–단백질, 라이페이스–지방). '녹말' 대신 '탄수화물' 인정. 펩신을 이자액 효소로 쓰면 그 쌍 0점.", "explanation": "이자액에는 녹말(아밀레이스), 단백질(트립신), 지방(라이페이스) 소화 효소가 모두 들어 있다."}, {"id": "동물과에너지:B-019", "sub": "B", "type_id": "B06", "review_group": "RG07", "role": "reserve", "difficulty": "중", "format": "5지선다", "stem": "소화 효소에 대한 설명으로 옳지 <u>않은<\/u> 것은?", "choices": ["한 가지 효소는 특정한 영양소만 분해한다.", "단백질 소화 효소는 위액뿐 아니라 이자액에도 들어 있다.", "아밀레이스는 침과 이자액에 들어 있다.", "작은창자의 탄수화물 소화 효소는 엿당을 포도당으로 분해한다.", "작은창자의 탄수화물 소화 효소는 아밀레이스이며, 녹말을 직접 포도당으로 분해한다."], "answer": [5], "explanation": "①~④는 옳다. ⑤ 작은창자의 탄수화물 소화 효소는 아밀레이스와 다른 효소로, 엿당을 포도당으로 분해한다."}, {"id": "동물과에너지:B-020", "sub": "B", "type_id": "B06", "review_group": "RG07", "role": "main", "difficulty": "하", "format": "단답형", "stem": "위액에 들어 있으며 단백질을 분해하는 소화 효소의 이름을 쓰고, 위액 속에서 이 효소의 작용을 돕는 물질의 이름을 쓰시오.", "answer": "펩신 / 염산", "scoring": "총 2점. 펩신 1점, 염산 1점('위산'도 인정).", "explanation": "위액의 펩신은 단백질을 분해하며, 염산은 펩신의 작용을 돕고 살균 작용을 한다."}, {"id": "동물과에너지:B-021", "sub": "B", "type_id": "B07", "review_group": "RG08", "role": "main", "difficulty": "중", "format": "보기형(ㄱㄴㄷ)", "stem": "그래프는 음식물 속 영양소 (가)~(다)가 소화 기관을 지나는 동안 소화되지 않고 남아 있는 양을 나타낸 것이다. (가)~(다)는 각각 녹말, 단백질, 지방 중 하나이다. 이에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?", "bogi": ["ㄱ. (가)는 녹말이다.", "ㄴ. (나)의 소화에 관여하는 효소는 위와 작은창자에서 작용한다.", "ㄷ. (다)는 위에서 처음 분해되기 시작한다."], "figure_svg": "<svg xmlns:xlink=\"http://www.w3.org/1999/xlink\" width=\"331.2pt\" height=\"201.6pt\" viewBox=\"0 0 331.2 201.6\" xmlns=\"http://www.w3.org/2000/svg\" version=\"1.1\" style=\"background:#fff\">\n <metadata>\n  <rdf:RDF xmlns:dc=\"http://purl.org/dc/elements/1.1/\" xmlns:cc=\"http://creativecommons.org/ns#\" xmlns:rdf=\"http://www.w3.org/1999/02/22-rdf-syntax-ns#\">\n   <cc:Work>\n    <dc:type rdf:resource=\"http://purl.org/dc/dcmitype/StillImage\"/>\n    <dc:date>2026-10-26T20:07:38.964570<\/dc:date>\n    <dc:format>image/svg+xml<\/dc:format>\n    <dc:creator>\n     <cc:Agent>\n      <dc:title>Matplotlib v3.10.3, https://matplotlib.org/<\/dc:title>\n     <\/cc:Agent>\n    <\/dc:creator>\n   <\/cc:Work>\n  <\/rdf:RDF>\n <\/metadata>\n <defs>\n  <style type=\"text/css\">*{stroke-linejoin: round; stroke-linecap: butt}<\/style>\n <\/defs>\n <g id=\"figure_1\">\n  <g id=\"patch_1\">\n   <path d=\"M 0 201.6 \nL 331.2 201.6 \nL 331.2 0 \nL 0 0 \nz\n\" style=\"fill: #ffffff\"/>\n  <\/g>\n  <g id=\"axes_1\">\n   <g id=\"patch_2\">\n    <path d=\"M 78.32 175.66 \nL 319.32 175.66 \nL 319.32 17.99625 \nL 78.32 17.99625 \nz\n\" style=\"fill: #ffffff\"/>\n   <\/g>\n   <g id=\"matplotlib.axis_1\">\n dasharray=\"3 4\" stroke-width=\"0.8\"/><line x1=\"255\" y1=\"22\" x2=\"255\" y2=\"168\" stroke-dasharray=\"3 4\" stroke-width=\"0.8\"/><text x=\"80\" y=\"16\" fill=\"#000\" stroke=\"none\" font-size=\"12\">입<\/text><text x=\"185\" y=\"16\" fill=\"#000\" stroke=\"none\" font-size=\"12\">위<\/text><text x=\"315\" y=\"16\" fill=\"#000\" stroke=\"none\" font-size=\"12\">작은창자<\/text><text x=\"2\" y=\"59\" fill=\"#000\" stroke=\"none\" font-size=\"12\">녹말<\/text><line x1=\"40\" y1=\"54\" x2=\"100\" y2=\"54\"/><path d=\"M94,50 L100,54 L94,58\"/><text x=\"66\" y=\"48\" fill=\"#000\" stroke=\"none\" font-size=\"12\">A<\/text><text x=\"104\" y=\"59\" fill=\"#000\" stroke=\"none\" font-size=\"12\">엿당<\/text><line x1=\"135\" y1=\"54\" x2=\"267\" y2=\"54\"/><line x1=\"267\" y1=\"54\" x2=\"322\" y2=\"54\"/><path d=\"M316,50 L322,54 L316,58\"/><text x=\"290\" y=\"48\" fill=\"#000\" stroke=\"none\" font-size=\"12\">B<\/text><text x=\"327\" y=\"59\" fill=\"#000\" stroke=\"none\" font-size=\"12\">포도당<\/text><text x=\"2\" y=\"104\" fill=\"#000\" stroke=\"none\" font-size=\"12\">단백질<\/text><line x1=\"45\" y1=\"99\" x2=\"140\" y2=\"99\"/><line x1=\"140\" y1=\"99\" x2=\"180\" y2=\"99\"/><path d=\"M174,95 L180,99 L174,103\"/><text x=\"156\" y=\"93\" fill=\"#000\" stroke=\"none\" font-size=\"12\">C<\/text><text x=\"184\" y=\"103\" fill=\"#000\" stroke=\"none\" font-size=\"10\">작아진 단백질<\/text><line x1=\"267\" y1=\"99\" x2=\"322\" y2=\"99\"/><path d=\"M316,95 L322,99 L316,103\"/><text x=\"290\" y=\"93\" fill=\"#000\" stroke=\"none\" font-size=\"12\">D<\/text><text x=\"327\" y=\"104\" fill=\"#000\" stroke=\"none\" font-size=\"12\">아미노산<\/text><text x=\"2\" y=\"149\" fill=\"#000\" stroke=\"none\" font-size=\"12\">지방<\/text><line x1=\"35\" y1=\"144\" x2=\"267\" y2=\"144\"/><line x1=\"267\" y1=\"144\" x2=\"322\" y2=\"144\"/><path d=\"M316,140 L322,144 L316,148\"/><text x=\"290\" y=\"138\" fill=\"#000\" stroke=\"none\" font-size=\"12\">E<\/text><text x=\"325\" y=\"148\" fill=\"#000\" stroke=\"none\" font-size=\"9\">지방산+모노글리세리드<\/text><\/svg>", "choices": ["A는 위에서 분비되는 위액에 들어 있다.", "B는 녹말을 직접 포도당으로 분해하는 아밀레이스이다.", "C는 이자에서 만들어져 작은창자로 분비된다.", "D가 작용하여 생긴 산물은 융털의 모세혈관으로 흡수된다.", "E는 쓸개즙에 들어 있는 효소이다."], "answer": [4], "explanation": "A는 입에서 작용하는 침의 아밀레이스, B는 작은창자의 탄수화물 소화 효소, C는 위의 펩신, D는 작은창자의 단백질 소화 효소, E는 라이페이스이다. ① A는 침에 들어 있다. ② B는 엿당을 포도당으로 분해하며 아밀레이스가 아니다. ③ C는 위에서 만들어진다. ④ 옳다. D의 산물인 아미노산은 수용성이므로 융털의 모세혈관으로 흡수된다. ⑤ 쓸개즙에는 효소가 없으며, E는 이자액에 들어 있다."}, {"id": "동물과에너지:B-023", "sub": "B", "type_id": "B07", "review_group": "RG08", "role": "main", "difficulty": "상", "format": "서술형", "stem": "달걀흰자에 들어 있는 단백질이 아미노산으로 분해될 때까지의 과정을 <u>소화가 일어나는 기관<\/u>과 <u>작용하는 소화 효소(또는 소화액)<\/u>를 포함하여 순서대로 서술하시오.", "answer": "단백질은 먼저 위에서 위액의 펩신에 의해 크기가 작은 단백질로 분해된다(염산이 펩신의 작용을 돕는다). 작은창자에서 이자액의 트립신이 단백질을 더 작게 분해하고, 작은창자의 단백질 소화 효소가 이를 최종 산물인 아미노산으로 분해한다.", "scoring": "총 3점. 단계당 1점: ① 위에서 펩신(위액)이 단백질을 작게 분해, ② 작은창자에서 트립신(이자액)이 분해, ③ 작은창자의 단백질 소화 효소가 아미노산으로 분해. 펩신이나 트립신이 아미노산까지 분해한다고 쓰면 해당 단계 0점, 단계의 순서가 바뀌면 바뀐 단계 0점.", "explanation": "단백질은 위에서 처음 분해되고 작은창자에서 최종 분해된다."}, {"id": "동물과에너지:B-024", "sub": "B", "type_id": "B07", "review_group": "RG08", "role": "reserve", "difficulty": "하", "format": "단답형", "stem": "표의 ㉠~㉣에 알맞은 말을 쓰시오.", "table": {"h": ["영양소", "처음 소화되는 기관", "최종 산물"], "r": [["녹말", "입", "㉠"], ["단백질", "㉡", "아미노산"], ["지방", "㉢", "㉣"]]}, "answer": "㉠ 포도당, ㉡ 위, ㉢ 작은창자, ㉣ 지방산, 모노글리세리드", "scoring": "총 4점. 빈칸당 1점. ㉣은 지방산과 모노글리세리드를 모두 써야 1점(하나만 쓰면 0점).", "explanation": "녹말은 입에서 처음 소화되어 최종적으로 포도당, 단백질은 위에서 처음 소화되어 아미노산, 지방은 작은창자에서 처음 소화되어 지방산과 모노글리세리드가 된다."}, {"id": "동물과에너지:B-025", "sub": "B", "type_id": "B07", "review_group": "RG08", "role": "reserve", "difficulty": "중", "format": "5지선다", "stem": "그래프는 어떤 영양소 X가 소화 기관을 지나는 동안 소화되지 않고 남아 있는 양을 나타낸 것이다. X와 X의 최종 산물을 옳게 짝 지은 것은? (단, X는 녹말, 단백질, 지방 중 하나이다.)", "figure_svg": "<svg xmlns:xlink=\"http://www.w3.org/1999/xlink\" width=\"331.2pt\" height=\"201.6pt\" viewBox=\"0 0 331.2 201.6\" xmlns=\"http://www.w3.org/2000/svg\" version=\"1.1\" s
