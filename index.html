<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>중2 과학 기말 연습</title>
<style>
:root{--bg:#f4f5f2;--paper:#fff;--ink:#1c1f23;--muted:#6b7177;--line:#dde0dc;--accent:#1f6f8b;--accent-soft:#e3f0f4;--ok:#2e7d4f;--ok-soft:#e5f3ea;--bad:#b3412f;--bad-soft:#f8e7e3;--warn:#9a6b12}
@media (prefers-color-scheme:dark){:root{--bg:#121417;--paper:#1b1e22;--ink:#e7e8e5;--muted:#9aa1a6;--line:#2e3237;--accent:#6cc0dd;--accent-soft:#1d3139;--ok:#6fcf97;--ok-soft:#173324;--bad:#ef8a78;--bad-soft:#3a1f1a;--warn:#e0b45c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 "Pretendard","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 96px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 16px}
h1{font-size:20px;margin:0}
h2{font-size:17px;margin:0 0 10px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:10px 14px}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.ghost{background:transparent}
button:disabled{opacity:.45;cursor:default}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.muted{color:var(--muted);font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
select{font:inherit;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:8px}
.bar>span{display:block;height:100%;background:var(--accent)}
.unit-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);margin-right:6px}
.qmeta{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.stem{white-space:pre-wrap;font-weight:600;margin:0 0 10px}
.passage{white-space:pre-wrap;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;font-size:15px}
.bogi{border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:8px 0;font-size:15px}
.bogi .t{font-size:13px;color:var(--muted);margin-bottom:2px}
.bogi div{white-space:pre-wrap;margin:3px 0}
.fig{background:#fff;border-radius:10px;padding:8px;margin:10px 0;overflow-x:auto;text-align:center}
.fig svg{max-width:100%;height:auto}
table{border-collapse:collapse;width:100%;font-size:14px;margin:8px 0}
th,td{border:1px solid var(--line);padding:6px;text-align:center}
th{background:var(--accent-soft)}
.choices{display:grid;gap:8px;margin-top:12px}
.choice{display:flex;gap:10px;text-align:left;align-items:flex-start;padding:12px}
.choice .no{font-weight:700;color:var(--accent);min-width:20px}
.choice.sel{border-color:var(--accent);background:var(--accent-soft)}
.choice.right{border-color:var(--ok);background:var(--ok-soft)}
.choice.wrong{border-color:var(--bad);background:var(--bad-soft)}
textarea{width:100%;min-height:96px;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);margin-top:12px}
.feedback{margin-top:14px;padding:12px;border-radius:10px;white-space:pre-wrap;font-size:15px}
.feedback.ok{background:var(--ok-soft)}
.feedback.bad{background:var(--bad-soft)}
.feedback.self{background:var(--accent-soft)}
.feedback b{display:block;margin-bottom:4px}
.foot{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.foot .in{max-width:720px;margin:0 auto;display:flex;gap:8px}
.foot button{flex:1}
.score{font-size:40px;font-weight:700;margin:4px 0}
.list div{padding:6px 0;border-bottom:1px solid var(--line);font-size:15px}
.hidden{display:none}
</style>
</head>

er": [3], "scoring": {"total": 3, "rule": "정답을 고르면 3점, 그 밖에는 0점"}, "explanation": "① 철은 Fe, F는 플루오린이다. ② 나트륨은 Na, N은 질소이다. ③ 옳다. 칼륨의 원소 기호는 K이다. ④ 염소는 Cl, C는 탄소이다. ⑤ 헬륨은 He, H는 수소이다."}, {"id": "물질의구성:B-002", "sub": "B", "type_id": "B01", "review_group": "RG04", "role": "main", "difficulty": "중", "format": "보기형(ㄱㄴㄷㄹ)", "stem": "원소 기호에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?", "bogi": ["ㄱ. 원소 이름의 첫 글자를 알파벳 대문자로 나타낸다.", "ㄴ. 첫 글자가 같은 원소가 있으면 중간 글자를 골라 대문자로 덧붙인다.", "ㄷ. 나라마다 쓰는 언어가 다르므로 원소 기호도 나라마다 다르다.", "ㄹ. 오늘날 쓰는 원소 기호는 베르셀리우스가 제안한 방법을 바탕으로 한다."], "choices": ["ㄱ, ㄴ", "ㄱ, ㄹ", "ㄴ, ㄷ", "ㄷ, ㄹ", "ㄱ, ㄴ, ㄹ"], "answer": [2], "scoring": {"total": 3, "rule": "정답을 고르면 3점, 그 밖에는 0점"}, "explanation": "ㄱ. 옳다. ㄴ. 덧붙이는 글자는 소문자로 쓴다(예: Ca, Cl, Cu). ㄷ. 원소 기호는 세계 공통의 약속이므로 언어가 달라도 같은 기호를 쓴다. ㄹ. 옳다. 오늘날 원소 기호는 베르셀리우스가 알파벳으로 나타내자고 제안한 방법을 바탕으로 한다. 따라서 ㄱ, ㄹ이 옳다."}, {"id": "물질의구성:B-003", "sub": "B", "type_id": "B03", "review_group": "RG04", "role": "main", "difficulty": "중", "format": "서술형", "stem": "새로 발견된 원소의 이름을 가상으로 '카늄(Kanium)'이라고 정하였다. 학생 A는 이 원소의 기호를 이름의 첫 글자를 따서 'K'로 하자고 제안하였다.<br>(1) 학생 A의 제안이 옳지 않은 까닭을 서술하시오.<br>(2) 원소 기호를 정하는 규칙에 맞게 이 원소의 기호를 한 가지 쓰시오.", "answer": "(1) K는 이미 칼륨의 원소 기호로 쓰이고 있기 때문이다. (2) Ka(또는 Kn, Ki, Ku, Km)", "scoring": {"total": 5, "criteria": [{"points": 3, "desc": "(1) K가 이미 칼륨의 기호라서 겹친다는 내용"}, {"points": 2, "desc": "(2) K 뒤에 이름 속 다른 글자를 소문자로 덧붙인 두 글자 기호"}], "accepted": ["(1) 다른 원소(칼륨)와 기호가 같아진다", "(2) Ka, Kn, Ki, Ku, Km 중 하나"], "partial": "(1)에서 칼륨을 밝히지 않고 '이미 쓰는 기호와 겹친다'만 쓰면 2점. (2)에서 KA처럼 둘째 글자를 대문자로 쓰면 0점."}, "explanation": "원소 기호는 이름의 첫 글자를 대문자로 쓰되, 첫 글자가 같은 원소가 이미 있으면 중간 글자를 소문자로 덧붙여 구별한다. K는 칼륨의 기호이므로 새 원소는 Ka처럼 두 글자로 나타내야 한다."}, {"id": "물질의구성:B-004", "sub": "B", "type_id": "B04", "review_group": "RG04", "role": "reserve", "difficulty": "하", "format": "순서배열", "stem": "다음은 원소를 나타내는 방법이 바뀌어 온 과정의 일부이다. 시대 순서대로 기호를 나열하시오.<br>(가) 돌턴은 원 안에 점, 선, 글자 등을 넣은 기호로 원소를 나타냈다.<br>(나) 베르셀리우스는 원소 이름의 알파벳 첫 글자로 원소를 나타내자고 제안하였다.<br>(다) 연금술사들은 그림으로 물질을 나타냈다.", "answer": "(다) → (가) → (나)", "scoring": {"total": 3, "criteria": [{"points": 3, "desc": "(다) → (가) → (나)를 모두 바르게 나열"}], "accepted": ["다-가-나"], "partial": "부분 점수 없음"}, "explanation": "연금술사의 그림 → 돌턴의 원 모양 기호 → 베르셀리우스의 알파벳 기호 순으로 바뀌었다. 오늘날 원소 기호는 베르셀리우스의 방법을 바탕으로 한다.", "textbook_tags": {"mode": "include_only", "books": ["오투", "비상", "천재(임성숙)", "지학사"]}}, {"id": "물질의구성:B-005", "sub": "B", "type_id": "B02", "review_group": "RG04", "role": "reserve", "difficulty": "하", "format": "단답형", "stem": "표의 ㉠~㉤에 알맞은 원소 이름이나 원소 기호를 쓰시오.", "table": {"h": ["원소 이름", "질소", "㉡", "마그네슘", "㉣", "구리"], "r": [["원소 기호", "㉠", "Ne", "㉢", "Si", "㉤"]]}, "answer": "㉠ N, ㉡ 네온, ㉢ Mg, ㉣ 규소, ㉤ Cu", "scoring": {"total": 5, "criteria": [{"points": 1, "desc": "칸마다 1점"}], "accepted": ["㉣ 실리콘도 인정"], "partial": "기호의 대소문자가 틀리면(MG, NE 등) 해당 칸 0점"}, "explanation": "질소 N, 네온 Ne, 마그네슘 Mg, 규소 Si, 구리 Cu이다. 두 글자 기호의 두 번째 글자는 소문자로 쓴다."}, {"id": "물질의구성:B-006", "sub": "B", "type_id": "B05", "review_group": "RG05", "role": "main", "difficulty": "하", "format": "5지선다", "stem": "암모니아의 화학식은 NH₃이다. 암모니아 분자 1개에 대한 설명으로 옳은 것은?", "choices": ["질소 원자 1개와 수소 원자 3개로 이루어져 있다.", "4가지 원소로 이루어져 있다.", "원자 3개로 이루어져 있다.", "수소 원자 1개와 질소 원자 3개로 이루어져 있다.", "화학식의 3은 암모니아 분자가 3개라는 뜻이다."], "answer": [1], "scoring": {"total": 3, "rule": "정답을 고르면 3점, 그 밖에는 0점"}, "explanation": "① 옳다. ② 질소와 수소 2가지 원소로 이루어져 있다. ③ 원자는 질소 1개와 수소 3개로 모두 4개이다. ④ 수소가 3개, 질소가 1개이다. ⑤ 원소 기호 오른쪽 아래의 3은 분자 1개 속 수소 원자의 수이다."}, {"id": "물질의구성:B-007", "sub": "B", "type_id": "B05", "review_group": "RG05", "role": "main", "difficulty": "중", "format": "보기형(ㄱㄴㄷㄹ)", "stem": "표는 몇 가지 물질의 이름과 화학식을 나타낸 것이다. 이에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?", "bogi": ["ㄱ. 분자 1개를 이루는 원자 수가 가장 많은 것은 과산화 수소이다.", "ㄴ. 한 종류의 원소로만 이루어진 것은 오존이다.", "ㄷ. 이산화 탄소와 오존은 분자 1개를 이루는 원자 수가 같다.", "ㄹ. 메테인 분자 1개에는 수소 원자가 4개 있다."], "table": {"h": ["물질", "이산화 탄소", "과산화 수소", "메테인", "오존"], "r": [["화학식", "CO₂", "H₂O₂", "CH₄", "O₃"]]}, "choices": ["ㄱ, ㄴ", "ㄱ, ㄹ", "ㄴ, ㄷ", "ㄱ, ㄷ, ㄹ", "ㄴ, ㄷ, ㄹ"], "answer": [5], "scoring": {"total": 3, "rule": "정답을 고르면 3점, 그 밖에는 0점"}, "explanation": "분자 1개의 원자 수는 CO₂ 3개, H₂O₂ 4개, CH₄ 5개, O₃ 3개이다. ㄱ. 원자 수가 가장 많은 것은 메테인(5개)이다. ㄴ. 오존은 산소 한 종류로만 이루어져 있다. 나머지는 두 종류의 원소로 이루어져 있다. ㄷ. 이산화 탄소와 오존은 모두 원자 3개로 이루어져 있다. ㄹ. CH₄의 4는 분자 1개 속 수소 원자 수이다. 따라서 ㄴ, ㄷ, ㄹ이 옳다."}, {"id": "물질의구성:B-008", "sub": "B", "type_id": "B06", "review_group": "RG05", "role": "main", "difficulty": "하", "format": "5지선다", "stem": "물질의 이름과 화학식을 옳게 짝지은 것은?", "choices": ["물 – H₂O₂", "메테인 – CH₄", "오존 – O₂", "일산화 탄소 – CO₂", "과산화 수소 – H₂O"], "answer": [2], "scoring": {"total": 3, "rule": "정답을 고르면 3점, 그 밖에는 0점"}, "explanation": "① 물은 H₂O이고, H₂O₂는 과산화 수소이다. ② 옳다. 메테인은 탄소 원자 1개와 수소 원자 4개로 이루어져 CH₄이다. ③ 오존은 O₃이고, O₂는 산소이다. ④ 일산화 탄소는 CO이고, CO₂는 이산화 탄소이다. ⑤ 과산화 수소는 H₂O₂이고, H₂O는 물이다."}, {"id": "물질의구성:B-009", "sub": "B", "type_id": "B09", "review_group": "RG05", "role": "main", "difficulty": "하", "format": "5지선다", "stem": "과산화 수소의 화학식 H₂O₂만으로 알 수 없는 것은?", "choices": ["물질의 종류", "물질을 이루는 원소의 종류", "분자 1개를 이루는 원자의 종류와 수", "원소인지 화합물인지의 구별", "분자 속 원자들이 배열된 모양"], "answer": [5], "scoring": {"total": 3, "rule": "정답을 고르면 3점, 그 밖에는 0점"}, "explanation": "화학식으로는 어떤 물질인지, 어떤 원소로 이루어져 있는지, 분자 1개 속 원자의 종류와 수를 알 수 있다. 원소 기호가 두 종류이므로 화합물이라는 것도 알 수 있다. 그러나 원자들이 어떤 모양으로 배열되어 있는지는 화학식만으로 알 수 없다."}, {"id": "물질의구성:B-010", "sub": "B", "type_id": "B06", "review_group": "RG05", "role": "reserve", "difficulty": "하", "format": "서술형", "stem": "다음은 학생이 물질의 화학식을 쓴 것이다. 각각 잘못된 점을 쓰고 바르게 고쳐 쓰시오.<br>(가) 이산화 탄소: Co₂<br>(나) 물: H₂O₁<br>(다) 암모니아: NH³", "answer": "(가) 탄소와 산소의 기호는 각각 대문자로 시작해야 한다 → CO₂ (나) 원자가 1개일 때는 1을 쓰지 않는다 → H₂O (다) 원자 수는 오른쪽 아래에 작게 쓴다 → NH₃", "scoring": {"total": 6, "criteria": [{"points": 2, "desc": "(가) 잘못된 점 1점 + CO₂ 1점"}, {"points": 2, "desc": "(나) 잘못된 점 1점 + H₂O 1점"}, {"points": 2, "desc": "(다) 잘못된 점 1점 + NH₃ 1점"}], "accepted": ["(가) Co는 다른 원소(코발트)의 기호가 된다", "(다) 첨자를 위에 썼다"], "partial": "칸마다 독립 채점"}, "explanation": "(가) CO₂는 C와 O 두 원소의 기호이므로 둘 다 대문자로 시작한다. Co로 쓰면 한 원소의 기호처럼 보인다. (나) 원자 수 1은 생략한다. (다) 원자 수는 원소 기호의 오른쪽 아래에 작게 쓴다."}, {"id": "물질 nts": 1, "desc": "㉠ 원자핵"}, {"points": 1, "desc": "㉡ 전자"}, {"points": 1, "desc": "㉢ 중성자"}], "accepted": [], "partial": "칸마다 따로 채점하며, 틀린 칸만 0점."}, "explanation": "원자는 원자핵과 전자로 이루어지고, 원자핵은 양성자와 중성자로 이루어진다. 전자는 원자핵 주위를 움직인다."}, {"id": "물질의구성:C-005", "sub": "C", "type_id": "C02", "review_group": "RG07", "role": "reserve", "difficulty": "하", "format": "5지선다", "stem": "원자가 전기적으로 중성인 것과 관련된 설명으로 옳지 <u>않은<\/u> 것은?", "choices": ["원자는 양성자 수와 전자 수가 같다.", "양성자와 전자는 띠는 전하의 부호가 서로 반대이다.", "양성자 1개의 전하량 크기는 전자 1개의 전하량 크기보다 크다.", "원자핵의 전하량과 전자 전체의 전하량을 더하면 0이다.", "중성자는 전하를 띠지 않으므로 원자 전체의 전하에 영향을 주지 않는다."], "answer": [3], "explanation": "③ 양성자 1개와 전자 1개의 전하량은 크기가 같고 부호만 반대이다. 그래서 양성자 수와 전자 수가 같은 원자는 전체 전하가 0이 된다. ①, ②, ④, ⑤는 옳은 설명이다."}, {"id": "물질의구성:C-006", "sub": "C", "type_id": "C03", "review_group": "RG08", "role": "main", "difficulty": "하", "format": "5지선다", "stem": "표는 원자 3가지의 구성 입자에 대한 자료이다. ㉠~㉢에 알맞은 값을 옳게 짝지은 것은?", "table": {"h": ["원자", "원자 번호", "양성자 수", "전자 수", "원자핵의 전하량"], "r": [["질소", "7", "㉠", "7", "+7"], ["마그네슘", "12", "12", "㉡", "+12"], ["염소", "㉢", "17", "17", "+17"]]}, "choices": ["㉠ 7, ㉡ 12, ㉢ 34", "㉠ 7, ㉡ −12, ㉢ 17", "㉠ 7, ㉡ 12, ㉢ 35", "㉠ 14, ㉡ 12, ㉢ 17", "㉠ 7, ㉡ 12, ㉢ 17"], "answer": [5], "explanation": "원자에서 원자 번호 = 양성자 수 = 전자 수이고, 원자핵의 전하량은 +(양성자 수)이다. 따라서 ㉠ 7, ㉡ 12, ㉢ 17이다. ① 원자 번호를 양성자 수와 전자 수를 더한 값으로 잘못 계산한 것이다. ② 전자 수는 개수이므로 음수가 될 수 없다. 전자 전체의 전하량(−12)과 혼동한 것이다. ③, ④ 원자 번호를 원자핵 속 입자 수(양성자 수와 중성자 수의 합)와 혼동한 것이다."}, {"id": "물질의구성:C-007", "sub": "C", "type_id": "C03", "review_group": "RG08", "role": "main", "difficulty": "중", "format": "단답형", "stem": "다음은 원자 A~C에 대한 자료이다.<br>· A는 전자를 8개 가지고 있다.<br>· B의 원자핵 속에는 양성자가 13개 있다.<br>· C의 원자핵의 전하량은 +19이다.<br>A의 원자 번호, B의 전자 수, C의 전자 수를 모두 더한 값을 쓰시오. (단, A~C는 임의의 원소 기호이다.)", "answer": "40", "scoring": {"total": 3, "rule": "40만 정답 3점, 그 밖에는 0점"}, "explanation": "원자는 양성자 수와 전자 수가 같고, 원자 번호는 양성자 수와 같다. A: 전자 8개 → 원자 번호 8. B: 양성자 13개 → 전자 13개. C: 원자핵 전하량 +19 → 양성자 19개 → 전자 19개. 8 + 13 + 19 = 40이다."}, {"id": "물질의구성:C-008", "sub \" fill=\"#000\">−<\/text><circle cx=\"532.5\" cy=\"98.2\" r=\"7\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"1.5\"/><text x=\"532.5\" y=\"102.7\" font-size=\"13\" text-anchor=\"middle\" fill=\"#000\">−<\/text><circle cx=\"544.1\" cy=\"66.3\" r=\"7\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"1.5\"/><text x=\"544.1\" y=\"70.8\" font-size=\"13\" text-anchor=\"middle\" fill=\"#000\">−<\/text><circle cx=\"555.8\" cy=\"34.5\" r=\"7\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"1.5\"/><text x=\"555.8\" y=\"39.0\" font-size=\"13\" text-anchor=\"middle\" fill=\"#000\">−<\/text><text x=\"576.0\" y=\"152.0\" font-size=\"14\" text-anchor=\"middle\" fill=\"#000\">⑤ 산소<\/text><\/svg>", "choices": ["헬륨", "리튬", "탄소", "질소", "산소"], "answer": [4], "explanation": "원자는 양성자 수와 전자 수가 같으므로 원자핵의 전하량이 +n이면 전자도 n개여야 한다. ① 헬륨 +2, 전자 2개 ② 리튬 +3, 전자 3개 ③ 탄소 +6, 전자 6개 ⑤ 산소 +8, 전자 8개로 옳다. ④ 질소는 원자핵의 전하량이 +7인데 전자가 6개뿐이므로 원자 모형이 아니다. 질소 원자 모형에는 전자 7개를 그려야 한다."}, {"id": "물질의구성:C-009", "sub": "C", "type_id": "C04", "review_group": "RG08", "role": "main", "difficulty": "상", "format": "서술형", "stem": "그림은 어떤 학생이 원자를 나타내려고 그린 모형이다. 이 모형은 원자 모형으로 옳지 않다. (단, ⊖는 전자이다.)<br>(1) 이 모형이 원자 모형으로 옳지 않은 까닭을 서술하시오.<br>(2) 원자핵의 전하량만 고쳐서 원자 모형으로 만들 때와 전자 수만 고쳐서 원자 모형으로 만들 때, 각각 어떤 원소의 원자 모형이 되는지 원소 이름을 쓰시오.", "figure_svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 240 170\" width=\"240\" height=\"170\" style=\"background:#fff\" font-family=\"'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif\" font-size=\"14\" fill=\"#000\" stroke=\"none\"><rect x=\"0\" y=\"0\" width=\"240\" height=\"170\" fill=\"#fff\"/><circle cx=\"120\" cy=\"85\" r=\"17\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"1.8\"/><text x=\"120\" y=\"90\" font-size=\"14\" text-anchor=\"middle\" fill=\"#000\" font-weight=\"bold\">+8<\/text><circle cx=\"120.0\" cy=\"33.0\" r=\"7\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"1.5\"/><text x=\"120.0\" y=\"37.5\" font-size=\"13\" text-anchor=\"middle\" fill=\"#000\">−<\/text><circle cx=\"153.4\" cy=\"45.2\" r=\"7\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"1.5\"/><text x=\"153.4\" y=\"49.7\" font-size=\"13\" text-anchor=\"middle\" fill=\"#000\">−<\/text><circle cx=\"171.2\" cy=\"76.0\" r=\"7\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"1.5\"/><text x=\"171.2\" y=\"80.5\" font-size=\"13\" text-anchor=\"middle\" fill=\"#000\">−<\/text><circle cx=\"165.0\" cy=\"111.0\" r=\"7\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"1.5\"/><text x=\"165.0\" y=\"115.5\" font-size=\"13\" text-anchor=\"middle\" fill=\"#000\">−<\/text><circle cx=\"137.8\" cy=\"133.9\" r=\"7\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"1.5\"/><text x=\"137.8\" y=\"138.4\" font-size=\"13\" text-anchor=\"middle\" fill=\"#000\">−<\/text><circle cx=\"102.2\" cy=\"133.9\" r=\"7\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"1.5\"/><text x=\"102.2\" y=\"138.4\" font-size=\"13\" text-anchor=\"middle\" fill=\"#000\">−<\/text><circle cx=\"75.0\" cy=\"111.0\" r=\"7\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"1.5\"/><text x=\"75.0\" y=\"115.5\" font-size=\"13\" text-anchor=\"middle\" fill=\"#000\">−<\/text><circle cx=\"68.8\" cy=\"76.0\" r=\"7\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"1.5\"/><text x=\"68.8\" y=\"80.5\" font-size=\"13\" text-anchor=\"middle\" fill=\"#000\">−<\/text><circle cx=\"86.6\" cy=\"45.2\" r=\"7\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"1.5\"/><text x=\"86.6\" y=\"49.7\" font-size=\"13\" text-anchor=\"middle\" fill=\"#000\">−<\/text><\/svg>", "answer": "(1) 원자는 양성자 수와 전자 수가 같아야 하는데, 이 모형은 원자핵의 전하량이 +8(양성자 8개)이고 전자는 9개여서 서로 같지 않다. (2) 원자핵의 전하량을 +9로 고치면 플루오린, 전자를 8개로 고치면(1개 지우면) 산소 원자 모형이 된다.", "scoring": {"total": 8, "criteria": [{"points": 4, "desc": "(1) 원자핵 전하량 +8(양성자 8개)과 전자 9개가 같지 않다는 점을 수치와 함께 서술"}, {"points": 2, "desc": "(2) 원자핵 전하량만 고칠 때: 플루오린"}, {"points": 2, "desc": "(2) 전자 수만 고칠 때: 산소"}], "accepted": ["원자핵 전하량을 +9로 고치면 플루오린, 전자를 1개 지우면 산소"], "partial": "(1) 수치 없이 '같지 않다'만 쓰거나 양성자 수·전자 수를 틀린 값으로 쓰면 2점. (2) 두 원소를 서로 바꿔 쓰면 해당 칸 0점."}, "explanation": "원자 모형은 원자핵의 +n과 전자 n개가 같아야 한다. 전자 9개에 맞추려면 원자핵을 +9로 고쳐야 하므로 원자 번호 9인 플루오린이 되고, 원자핵 +8에 맞추려면 전자를 8개로 줄여야 하므로 원자 번호 8인 산소가 된다."}, {"id": "물질의구성:C-010", "sub": "C", "type_id": "C03", "review_group": "RG08", "role": "reserve", "difficulty": "하", "format": "5지선다", "stem": "표는 원자 (가)~(다)에 대해 알려진 정보를 나타낸 것이다. 이에 대한 설명으로 옳은 것은?", "table": {"h": ["원자", "알려진 정보"], "r": [["(가)", "전자 3개"], ["(나)", "원자핵의 전하량 +10"], ["(다)", "양성자 16개"]]}, "choices": ["(가)의 원자핵의 전하량은 −3이다.", "(나)의 전자는 10개이다.", "(다)의 원자 번호는 32이다.", "원자 번호가 가장 큰 것은 (나)이다.", "(가)는 전자 수만 알려져 있으므로 원자핵의 전하량을 알 수 없다."], "answer": [2], "explanation": "(가)는 원자 번호 3, (나)는 10, (다)는 16이다. ① 원자핵의 전하량은 +3이다. −3은 전자 전체의 전하량이다. ② 옳다. 원자핵 전하량이 +10이면 양성자 10개이므로 전자도 10개이다. ③ 원자 번호는 양성자 수와 같은 16이다. 양성자 수와 전자 수를 더하면 안 된다. ④ 원자 번호가 가장 큰 것은 (다)이다. ⑤ 원자는 전자 수와 양성자 수가 같으므로 전자 수로 원자핵의 전하량(+3)을 알 수 있다."}, {"id": "물질의구성:C-011", "sub": "C", "type_id": "C03", "review_group": "RG08", "role": "reserve", "difficulty": "중", "format": "순서 배열", "stem": "다음은 원자 (가)~(라)에 대한 설명이다. 원자 번호가 작은 것부터 순서대로 옳게 나열한 것은?<br>(가) 원자핵의 전하량이 +8이다.<br>(나) 원자핵 주위에 전자 3개가 있다.<br>(다) 원자핵 속에 양성자가 12개 있다.<br>(라) 원자 모형으로 나타내려면 원자핵 주위에 전자 5개를 그려야 한다.", "choices": ["(나)-(라)-(가)-(다)", "(나)-(가)-(라)-(다)", "(라)-(나)-(가)-(다)", "(가)-(나)-(다)-(라)", "(다)-(가)-(라)-(나)"], "answer": [1], "explanation": "원자 번호는 (가) 8, (나) 3(전자 3개 → 양성자 3개), (다) 12, (라) 5(전자 5개 → 양성자 5개)이다. 작은 것부터 (나) 3 - (라) 5 - (가) 8 - (다) 12이다."}, {"id": "물질의구성:C-012", "sub": "C", "type_id": "C06", "review_group": "RG09", "role": "main", "difficulty": "하", "format": "5지선다", "stem": "원자에 대한 설명으로 옳은 것은?", "choices": ["원자는 맨눈으로 볼 수 있을 만큼 크다.", "원자 모형은 원자의 실제 크기와 모양을 그대로 나타낸 것이다.", "원자핵은 원자 부피의 대부분을 차지한다.", "원자는 원자핵과 전자로 이루어져 있다.", "원자는 전체적으로 (+)전하를 띤다."], "answer": [4], "explanation": "① 원자는 매우 작아 맨눈으로 볼 수 없다. ② 원자 모형은 원자를 이해하기 쉽게 나타낸 것으로 실제 모습과 다르다. ③ 원자핵은 원자 크기에 비해 매우 작아 원자의 대부분은 빈 공간이다. ④ 옳다. ⑤ 원자는 양성자 수와 전자 수가 같아 전기적으로 중성이다."}, {"id": "물질의구성:C-013", "sub": "C", "type_id": "C06", "review_group": "RG09", "role": "main", "difficulty": "중", "format": "합답형", "stem": "다음은 원자의 크기를 비유한 글이다.<br>원자를 학교 운동장만 한 크기로 크게 늘린다면, 원자핵은 운동장 한가운데 놓인 작은 구슬 정도의 크기가 된다. 그런데 이 작은 원자핵이 원자 질량의 대부분을 차지한다.<br>이 글을 통해 알 수 있는 것만을 <보기>에서 있는 대로 고른 것은?", "bogi": ["ㄱ. 원자의 대부분은 빈 공간이다.", "ㄴ. 전자의 질량은 원자핵에 비해 매우 작다.", "ㄷ. 원자핵은 원자 부피의 대부분을 차지한다."], "choices": ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "answer": [3], "explanation": "ㄱ. 옳다. 운동장만 한 원자 속 원자핵이 구슬 정도이므로 원자의 대부분은 빈 공간이다. ㄴ. 옳다. 원자 질량의 대부분을 원자핵이 차지하므로 원자핵 주위의 전자는 질량이 매우 작다. ㄷ. 원자핵은 원자 크기에 비해 매우 작다."}, {"id": "물질의구성:C-014", "sub": "C", "type_id": "C06", "review_group": "RG09", "role": "main", "difficulty": "하", "format": "5지선다", "stem": "다음은 원자 모형을 보며 학생들이 나눈 대화이다.<br>민지: 원자는 매우 작아서 눈으로 볼 수 없기 때문에 모형으로 나타내는 거야.<br>준호: 실제 비율대로 그린다면 원자핵은 거의 보이지 않을 만큼 작게 그려야 해.<br>서연: 원자 모형은 원자의 실제 색깔과 모양을 그대로 보여 주는 그림이야.<br>태윤: 원자는 맨눈으로는 안 보이지만 학교 실험실의 광학 현미경으로는 하나하나 볼 수 있어.<br>옳게 말한 학생만을 있는 대로 고른 것은?", "choices": ["민지, 준호", "민지, 서연", "준호, 태윤", "민지, 준호, 서연", "서연, 태윤"], "answer": [1], "explanation": "민지: 옳다. 준호: 옳다. 원자핵은 원자 크기에 비해 매우 작다. 서연: 원자 모형은 이해를 돕기 위해 나타낸 것으로 실제 색깔이나 모양과 다르다. 태윤: 원자는 매우 작아 학교 실험실의 광학 현미경으로도 볼 수 없다."}, {"id": "물질의구성:C-015", "sub": "C", "type_id": "C05", "review_group": "RG09", "role": "reserve", "difficulty": "중", "format": "5지선다", "stem": "표는 원자 A~C의 구성 입자 수를 나타낸 것이다. 이에 대한 설명으로 옳은 것은? (단, A~C는 임의의 원소 기호이다.)", "table": {"h": ["원자", "양성자 수", "중성자 수", "전자 수"], "r": [["A", "4", "5", "4"], ["B", "5", "5", "5"], ["C", "6", "6", "㉠"]]}, "choices": ["A와 B는 중성자 수가 같으므로 같은 원소이다.", "B의 원자 번호는 10이다.", "㉠은 12이다.", "A의 원자핵 속에 들어 있는 입자는 모두 9개이다.", "원자 번호만 알면 그 원자의 중성자 수도 알 수 있다."], "answer": [4], "explanation": "① 원소의 종류는 양성자 수로 정해진다. A(양성자 4개)와 B(양성자 5개)는 다른 원소이다. ② 원자 번호는 양성자 수와 같은 5이다. ③ 전자 수는 양성자 수와 같은 6이다. ④ 옳다. 원자핵은 양성자 4개와 중성자 5개로 이루어져 9개이다. ⑤ 표에서 B와 C처럼 원자 번호와 중성자 수의 관계는 일정하지 않으므로 원자 번호만으로 중성자 수를 알 수 없다.", "textbook_tags": {"mode": "include_only", "books": ["동아", "천재(정대홍)", "천재(임성숙)", "지학사"]}}, {"id": "물질의구성:C-016", "sub": "C", "type_id": "C05", "review_group": "RG09", "role": "reserve", "difficulty": "중", "format": "서술형", "stem": "어떤 원자 X의 원자핵 속에는 입자가 모두 7개 들어 있고, 원자핵 주위에는 전자 3개가 움직이고 있다.<br>(1) 원자 X의 원소 이름과 중성자 수를 쓰시오.<br>(2) (1)에서 중성자 수를 구한 과정을 서술하시오.", "answer": "(1) 리튬, 중성자 4개 (2) 원자는 양성자 수와 전자 수가 같으므로 양성자는 3개이다. 원자핵은 양성자와 중성자로 이루어져 있으므로 중성자 수는 7 − 3 = 4이다.", "scoring": "(1) 원소 이름 2점, 중성자 수 2점. (2) 4점: 양성자 수 = 전자 수(3개)를 근거로 쓰고, 원자핵 입자 수에서 양성자 수를 빼는 과정을 모두 서술. 계산만 쓰고 근거가 없으면 2점.", "explanation": "전자 3개 → 양성자 3개 → 원자 번호 3인 리튬. 원자핵 입자 7개 = 양성자 3개 + 중성자 4개.", "textbook_tags": {"mode": "include_only", "books": ["동아", "천재(정대홍)", "천재(임성숙)"]}}, {"id": "물질의구성:D-001", "sub": "D", "type_id": "D01", "review_group": "RG10", "role": "main", "difficulty": "하", "format": "5지선다", "stem": "주기율표에 대한 설명으로 옳은 것은?", "choices": ["가로줄을 족, 세로줄을 주기라고 한다.", "원소를 원소 기호의 알파벳 순서대로 배열한 표이다.", "7개의 족과 18개의 주기로 이루어져 있다.", "같은 족에 속한 원소들은 화학적 성질이 비슷하다.", "같은 주기에 속한 원소들은 화학적 성질이 비슷하다."], "answer": [4], "explanation": "① 가로줄은 주기, 세로줄은 족이다. ② 주기율표는 원소를 원자 번호 순서대로 배열한 것이다. ③ 7개의 주기와 18개의 족으로 이루어져 있다. ④ 옳다. ⑤ 화학적 성질이 비슷한 것은 같은 족 원소들이다."}, {"id": "물질의구성:D-002", "sub": "D", "type_id": "D01", "review_group": "RG10", "role": "main", "difficulty": "하", "format": "단답형", "stem": "다음은 주기율표에 대한 설명이다. ㉠~㉣에 알맞은 말을 각각 쓰시오.<br>현재의 주기율표는 원소를 ( ㉠ )이/가 커지는 순서대로 배열한 것으로, 가로줄을 ( ㉡ ), 세로줄을 ( ㉢ )(이)라고 한다. 같은 ( ㉢ )에 속한 원소들은 화학적 성질이 비슷하므로, 주기율표에서 원소의 위치를 알면 그 원소의 ( ㉣ )을/를 예측할 수 있다.", "answer": "㉠ 원자 번호(양성자 수), ㉡ 주기, ㉢ 족, ㉣ 성질", "scoring": "㉠~㉣ 각 1점. ㉠은 '양성자 수'도 정답. ㉣은 '화학적 성질'도 정답.", "explanation": "주기율표는 원자 번호(양성자 수) 순서로 배열하며 가로줄은 주기, 세로줄은 족이다. 같은 족 원소는 성질이 비슷해 위치로 성질을 예측할 수 있다."}, {"id": "물질의구성:D-003", "sub": "D", "type_id": "D01", "review_group": "RG10", "role": "main", "difficulty": "중", "format": "합답형", "stem": "그림은 주기율표의 일부를 나타낸 것이다. 이에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?", "bogi": ["ㄱ. (가) 방향의 가로줄을 족이라고 한다.", "ㄴ. (나) 방향으로 같은 줄에 있는 He, Ne, Ar은 화학적 성질이 비슷하다.", "ㄷ. 같은 가로줄에서는 (가) 방향으로 갈수록 원자 번호가 커진다."], "figure_svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\ or=\"middle\" fill=\"#000\" font-weight=\"bold\">(나)<\/text><\/svg>", "choices": ["ㄱ", "ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "answer": [4], "explanation": "ㄱ. 가로줄은 주기이다. ㄴ. 옳다. He, Ne, Ar은 같은 18족이므로 화학적 성질이 비슷하다. ㄷ. 옳다. 주기율표는 원자 번호 순서로 배열되어 있어 같은 주기에서 오른쪽으로 갈수록 원자 번호가 커진다(예: Li 3 → Ne 10)."}, {"id": "물질의구성:D-004", "sub": "D", "type_id": "D02", "review_group": "RG10", "role": "reserve", "difficulty": "중", "format": "서술형", "stem": "다음은 초기의 주기율표가 만들어진 과정에 대한 설명이다.<br>한 과학자는 당시 알려진 원소들을 원자의 질량 순서로 늘어놓다가, 성질이 비슷한 원소가 일정한 간격을 두고 되풀이하여 나타난다는 것을 발견하였다. 그는 성질이 비슷한 원소가 같은 세로줄에 오도록 배열하면서 표의 몇 곳을 빈칸으로 남겨 두었다.<br>(1) 이 과학자가 표에 빈칸을 남겨 둔 까닭을 서술하시오.<br>(2) 현재의 주기율표는 원소를 무엇의 순서로 배열하는지 쓰시오.", "answer": "(1) 아직 발견되지 않은 원소가 들어갈 자리라고 생각했기 때문이다(빈칸에 들어갈 원소의 성질을 예측할 수 있었다). (2) 원자 번호(양성자 수)", "scoring": "(1) 5점: '아직 발견되지 않은 원소의 자리'를 쓰면 5점, 성질 예측까지 쓰면 만점 유지. '표를 보기 좋게 하려고'는 0점. (2) 3점: 원자 번호 또는 양성자 수.", "explanation": "초기 주기율표는 원자의 질량 순으로 배열하면서 성질이 비슷한 원소를 같은 세로줄에 두었고, 맞는 원소가 없는 칸은 미발견 원소의 자리로 비워 두었다. 이후 원자 번호(양성자 수) 순으로 정리되었다.", "textbook_tags": {"mode": "include_only", "books": ["동아", "천재(정대홍)", "천재(임성숙)"]}}, {"id": "물질의구성:D-005", "sub": "D", "type_id": "D01", "review_group": "RG10", "role": "reserve", "difficulty": "중", "format": "5지선다", "stem": "표는 학생이 주기율표에 대한 설명을 읽고 옳으면 O, 옳지 않으면 X로 표시한 것이다. 학생이 <u>옳게 표시한<\/u> 것만을 있는 대로 고른 것은?", "table": {"h": ["", "설명", "표시"], "r": [["(가)", "주기율표의 세로줄을 족이라고 한다.", "O"], ["(나)", "주기율표에는 원소뿐만 아니라 화합물도 배열되어 있다.", "O"], ["(다)", "같은 주기에 있는 원소들은 화학적 성질이 비슷하다.", "X"], ["(라)", "현재의 주기율표는 원소를 원자 번호 순서대로 배열한 것이다.", "X"]]}, "choices": ["(가), (나)", "(가), (다)", "(나), (라)", "(가), (다), (라)", "(나), (다), (라)"], "answer": [2], "explanation": "(가) 세로줄은 족이므로 O가 옳은 표시이다. (나) 주기율표는 원소만 배열하므로 X가 옳은데 O로 표시했다. (다) 성질이 비슷한 것은 같은 족이므로 X가 옳은 표시이다. (라) 옳은 설명이므로 O여야 하는데 X로 표시했다. 옳게 표시한 것은 (가), (다)이다."}, {"id": "물질의구성:D-006", "sub": "D", "type_id": "D03", "review_group": "RG11", "role": "main", "difficulty": "중", "format": "합답형", "stem": "그림은 주기율표의 일부에 원소 A~E의 위치를 나타낸 것이다. 이에 대한 설명으로 옳은 =\"middle\" fill=\"#000\">17<\/text><text x=\"463.0\" y=\"30.0\" font-size=\"13\" text-anchor=\"middle\" fill=\"#000\">18<\/text><text x=\"42.0\" y=\"64.0\" font-size=\"13\" text-anchor=\"middle\" fill=\"#000\">1<\/text><rect x=\"58\" y=\"40\" width=\"54\" height=\"38\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"1.2\"/><text x=\"85.0\" y=\"64.0\" font-size=\"14\" text-anchor=\"middle\" fill=\"#000\" font-weight=\"bold\">a<\/text><rect x=\"436\" y=\"40\" width=\"54\" height=\"38\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"1.2\"/><text x=\"463.0\" y=\"64.0\" font-size=\"14\" text-anchor=\"middle\" fill=\"#000\" font-weight=\"bold\">b<\/text><text x=\"42.0\" y=\"102.0\" font-size=\"13\" text-anchor=\"middle\" fill=\"#000\">2<\/text><rect x=\"58\" y=\"78\" width=\"54\" height=\"38\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"1.2\"/><text x=\"85.0\" y=\"102.0\" font-size=\"14\" text-anchor=\"middle\" fill=\"#000\" font-weight=\"bold\">c<\/text><rect x=\"112\" y=\"78\" width=\"54\" height=\"38\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"1.2\"/><rect x=\"166\" y=\"78\" width=\"54\" height=\"38\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"1.2\"/><rect x=\"220\" y=\"78\" width=\"54\" height=\"38\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"1.2\"/><rect x=\"274\" y=\"78\" width=\"54\" height=\"38\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"1.2\"/><rect x=\"328\" y=\"78\" width=\"54\" height=\"38\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"1.2\"/><rect x=\"382\" y=\"78\" width=\"54\" height=\"38\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"1.2\"/><rect x=\"436\" y=\"78\" width=\"54\" height=\"38\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"1.2\"/><text x=\"463.0\" y=\"102.0\" font-size=\"14\" text-anchor=\"middle\" fill=\"#000\" font-weight=\"bold\">d<\/text><text x=\"42.0\" y=\"140.0\" font-size=\"13\" text-anchor=\"middle\" fill=\"#000\">3<\/text><rect x=\"58\" y=\"116\" width=\"54\" height=\"38\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"1.2\"/><text x=\"85.0\" y=\"140.0\" font-size=\"14\" text-anchor=\"middle\" fill=\"#000\" font-weight=\"bold\">e<\/text><rect x=\"112\" y=\"116\" width=\"54\" height=\"38\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"1.2\"/><rect x=\"166\" y=\"116\" width=\"54\" height=\"38\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"1.2\"/><rect x=\"220\" y=\"116\" width=\"54\" height=\"38\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"1.2\"/><rect x=\"274\" y=\"116\" width=\"54\" height=\"38\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"1.2\"/><rect x=\"328\" y=\"116\" width=\"54\" height=\"38\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"1.2\"/><rect x=\"382\" y=\"116\" width=\"54\" height=\"38\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"1.2\"/><text x=\"409.0\" y=\"140.0\" font-size=\"14\" text-anchor=\"middle\" fill=\"#000\" font-weight=\"bold\">f<\/text><rect x=\"436\" y=\"116\" width=\"54\" height=\"38\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"1.2\"/><text x=\"463.0\" y=\"140.0\" font-size=\"14\" text-anchor=\"middle\" fill=\"#000\" font-weight=\"bold\">g<\/text><text x=\"42.0\" y=\"178.0\" font-size=\"13\" text-anchor=\"middle\" fill=\"#000\">4<\/text><rect x=\"58\" y=\"154\" width=\"54\" height=\"38\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"1.2\"/><text x=\"85.0\" y=\"178.0\" font-size=\"14\" text-anchor=\"middle\" fill=\"#000\" font-weight=\"bold\">h<\/text><rect x=\"112\" y=\"154\" width=\"54\" height=\"38\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"1.2\"/><text x=\"42.0\" y=\"30.0\" font-size=\"11\" text-anchor=\"middle\" fill=\"#000\">주기<\/text><text x=\"506.0\" y=\"30.0\" font-size=\"11\" text-anchor=\"start\" fill=\"#000\">족<\/text><\/svg>", "choices": ["X: a, Y: c, Z: d", "X: c, Y: e, Z: g", "X: c, Y: h, Z: g", "X: e, Y: h, Z: g", "X: c, Y: e, Z: f"], "answer": [2], "explanation": "(나)에서 X는 수소를 제외한 1족 원소(c, e, h)이다. (가)에서 Y는 X와 같은 1족이면서 원자 번호가 더 크므로 e 또는 h이다. (라)에서 Z는 18족 원소이고, (다)에서 Y와 같은 주기이다. Y가 h(4주기)이면 같은 주기의 18족 원소는 원자 번호가 20보다 커서 조건에 맞지 않는다. 따라서 Y는 e(3주기), Z는 g(3주기 18족), X는 Y보다 원자 번호가 작은 1족 고체인 c이다. ① a(수소)는 실온에서 기체이다. ③, ④ h와 g는 주기가 달라 (다)를 만족하지 않는다. ⑤ f는 17족으로 18족의 성질을 갖지 않는다."}, {"id": "물질의구성:D-009", "sub": "D", "type_id": "D04", "review_group": "RG11", "role": "reserve", "difficulty": "상", "format": "서술형", "stem": "다음은 원소 A와 B에 대한 설명이다.<br>· A는 2주기 원소이고, 실온에서 기체이며 다른 물질과 거의 반응하지 않는다.<br>· B는 A와 화학적 성질이 비슷하고, 원자 번호가 A보다 8 크다.<br>(1) A와 B의 원소 이름을 각각 쓰시오.<br>(2) B의 원자 번호를 구하고, 그렇게 판단한 과정을 주기율표에서의 위치와 관련지어 서술하시오. (단, A와 B는 임의의 원소 기호이다.)", "answer": "(1) A: 네온, B: 아르곤 (2) 18. A는 다른 물질과 거의 반응하지 않는 기체이므로 18족이고 2주기에 있으므로 원자 번호 10인 네온이다. B는 A와 성질이 비슷하므로 같은 18족이고, 원자 번호가 10 + 8 = 18이므로 3주기 18족의 아르곤이다.", "scoring": "(1) 각 2점. (2) 원자 번호 18 2점, 'A가 18족 2주기 → 원자 번호 10', 'B는 같은 족 → 원자 번호 18' 두 단계를 모두 쓰면 4점, 하나만 쓰면 2점.", "explanation": "성질이 비슷하다는 것은 같은 족이라는 뜻이다. 2주기 18족(Ne, 10)에서 같은 족 아래 칸(3주기)은 원자 번호가 8 크다."}, {"id": "물질의구성:D-010", "sub": "D", "type_id": "D03", "review_group": "RG11", "role": "reserve", "difficulty": "상", "format": "5지선다", "stem": "표는 원소 (가)~(마)의 원자 번호를 나타낸 것이다. 화학적 성질이 비슷할 것으로 예상되는 두 원소를 옳게 짝지은 것은?", "table": {"h": ["원소", "(가)", "(나)", "(다)", "(라)", "(마)"], "r": [["원자 번호", "8", "10", "12", "17", "20"]]}, "choices": ["(가), (나)", "(나), (라)", "(다), (마)", "(가), (라)", "(다), (라)"], "answer": [3], "explanation": "(가) 산소는 2주기 16족, (나) 네온은 2주기 18족, (다) 마그네슘은 3주기 2족, (라) 염소는 3주기 17족, (마) 칼슘은 4주기 2족이다. 화학적 성질이 비슷한 것은 같은 족인 (다)와 (마)이다. ①, ⑤는 같은 주기일 뿐 족이 다르고, ②, ④는 주기와 족이 모두 다르다."}, {"id": "물질의구성:D-011", "sub": "D", "type_id": "D05", "review_group": "RG12", "role": "main", "difficulty": "하", "format": "5지선다", "stem": "다음은 나트륨의 성질을 알아보는 실험이다.<br>[실험] (가) 석유 속에 보관된 나트륨을 꺼내 칼로 자르고 단면을 관찰한다. (나) 잠시 뒤 단면을 다시 관찰한다. (다) 작은 나트륨 조각을 물에 넣고, 발생하는 기체를 모아 성냥불을 가까이 한다.<br>[결과] (가) 칼로 쉽게 잘리고 단면은 은백색 광택을 띤다. (나) 단면의 광택이 사라진다. (다) 나트륨이 물과 활발하게 반응하고, 모은 기체는 소리를 내며 탄다.<br>이 실험에 대한 설명으로 옳은 것은?", "choices": ["나트륨은 단단하여 칼로 자르기 어렵다.", "나트륨의 단면은 공기 중에서 광택이 계속 유지된다.", "(다)에서 발생한 기체는 산소이다.", "나트륨은 공기 중의 산소, 물과 활발하게 반응한다.", "나트륨은 물속에 넣어 보관하는 것이 안전하다."], "answer": [4], "explanation": "① 나트륨은 칼로 쉽게 잘릴 만큼 무르다. ② 공기 중의 산소와 반응하여 곧 광택을 잃는다. ③ 성냥불을 대면 소리를 내며 타는 기체는 수소이다. ④ 옳다. ⑤ 물과 활발하게 반응하므로 석유와 같은 기름 속에 보관한다."}, {"id": "물질의구성:D-012", "sub": "D", "type_id": "D06", "review_group": "RG12", "role": "main", "difficulty": "하", "format": "짝짓기", "stem": "다음은 18족 원소 (가)~(다)의 쓰임이다. (가)~(다)에 해당하는 원소를 옳게 짝지은 것은?<br>(가) 공기보다 가볍고 다른 물질과 반응하지 않아 비행선이나 풍선을 띄우는 데 쓴다.<br>(나) 전류가 흐르면 특유의 빛을 내어 광고판 조명에 쓴다.<br>(다) 전구나 형광등 속에 넣어 내부 물질이 반응하지 않도록 한다.", "choices": ["(가) 네온, (나) 아르곤, (다) 헬륨", "(가) 네온, (나) 헬륨, (다) 아르곤", "(가) 아르곤, (나) 네온, (다) 헬륨", "(가) 헬륨, (나) 아르곤, (다) 네온", "(가) 헬륨, (나) 네온, (다) 아르곤"], "answer": [5], "explanation": "헬륨은 공기보다 가볍고 반응하지 않아 비행선·풍선에, 네온은 광고판 조명에, 아르곤은 전구·형광등 충전용으로 쓰인다."}, {"id": "물질의구성:D-013", "sub": "D", "type_id": "D05", "review_group": "RG12", "role": "main", "difficulty": "중", "format": "서술형", "stem": "표는 원소 (가)와 (나)의 성질을 조사한 결과이다. (가)와 (나)는 각각 주기율표의 1족과 18족 원소 중 하나이며, (가)는 수소가 아니다.<br>(1) (가)와 (나)는 각각 몇 족 원소인지 쓰시오.<br>(2) (가)를 보관하는 방법을 쓰고, 그렇게 보관하는 까닭을 서술하시오.", "table": {"h": ["원소", "실온에서의 상태", "칼로 자를 때", "물에 넣었을 때"], "r": [["(가)", "고체", "쉽게 잘린다.", "기체가 발생하며 활발하게 반응한다."], ["(나)", "기체", "-", "변화가 없다."]]}, "answer": "(1) (가) 1족, (나) 18족 (2) 석유(또는 액체 파라핀 같은 기름) 속에 넣어 보관한다. (가)는 공기 중의 산소나 물과 활발하게 반응하므로 산소, 물과 닿지 않게 하기 위해서이다.", "scoring": "(1) 각 2점. (2) 보관 방법 2점, 까닭 4점(산소와 물 중 하나만 쓰면 2점). 물속에 보관한다고 쓰면 (2) 0점.", "explanation": "(가)는 무르고 물과 활발히 반응하는 고체이므로 1족, (나)는 반응하지 않는 기체이므로 18족이다. 1족 금속은 산소·물과 반응하지 않도록 석유 속에 보관한다."}, {"id": "물질의구성:D-014", "sub": "D", "type_id": "D06", "review_group": "RG12", "role": "reserve", "difficulty": "중", "format": "합답형", "stem": "헬륨, 네온, 아르곤에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?", "bogi": ["ㄱ. 헬륨은 공기보다 무겁지만 다른 물질과 반응을 잘 하므로 비행선에 쓰인다.", "ㄴ. 실온에서 기체 상태로 존재한다.", "ㄷ. 다른 물질과 거의 반응하지 않는다.", "ㄹ. 원자 2개가 결합한 분자로 존재한다."], "choices": ["ㄱ, ㄴ", "ㄴ, ㄷ", "ㄷ, ㄹ", "ㄱ, ㄴ, ㄹ", "ㄴ, ㄷ, ㄹ"], "answer": [2], "explanation": "ㄱ. 헬륨은 공기보다 가볍고 다른 물질과 반응하지 않아 안전하므로 비행선에 쓰인다. ㄴ, ㄷ. 옳다. 18족 원소는 실온에서 기체이고 다른 물질과 거의 반응하지 않는다. ㄹ. 18족 원소는 원자가 하나씩 독립적으로 존재한다."}, {"id": "물질의구성:D-015", "sub": "D", "type_id": "D05", "review_group": "RG12", "role": "reserve", "difficulty": "상", "format": "합답형", "stem": "다음은 칼륨에 대한 실험 결과이다.<br>· 석유 속에서 꺼낸 칼륨은 칼로 쉽게 잘렸다.<br>· 작은 칼륨 조각을 물에 넣었더니 활발하게 반응하며 기체가 발생하였고, 이 기체에 성냥불을 가까이 하자 소리를 내며 탔다.<br>칼륨에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?", "bogi": ["ㄱ. 물과 반응하여 발생한 기체는 수소이다.", "ㄴ. 리튬과 같은 족 원소로, 실온에서 고체 상태의 금속이다.", "ㄷ. 수소와 같은 족 원소이므로 수소처럼 실온에서 기체로 존재한다.", "ㄹ. 물과 활발하게 반응하므로 물속에 넣어 보관해서는 안 된다."], "choices": ["ㄱ, ㄷ", "ㄴ, ㄹ", "ㄱ, ㄴ, ㄷ", "ㄱ, ㄴ, ㄹ", "ㄴ, ㄷ, ㄹ"], "answer": [4], "explanation": "ㄱ. 옳다. 성냥불을 대면 소리를 내며 타는 기체는 수소이다. ㄴ. 옳다. 칼륨은 리튬, 나트륨과 같은 1족 금속이다. ㄷ. 수소는 1족이지만 다른 1족 원소와 성질이 달라 실온에서 기체이다. 칼륨은 실온에서 고체이다. ㄹ. 옳다."}, {"id": "물질의구성:D-016", "sub": "D", "type_id": "D07", "review_group": "RG13", "role": "main", "difficulty": "중", "format": "5지선다", "stem": "그림은 원소 4가지를 분류 기준 (가)에 따라 분류한 것이다. (가)로 가장 적절한 것은?", "figure_svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 560 200\" width=\"560\" height=\"200\" style=\"background:#fff\" font-family=\"'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif\" font-size=\"14\" fill=\"#000\" stroke=\"none\"><rect x=\"0\" y=\"0\" width=\"560\" height=\"200\" fill=\"#fff\"/><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#000\"/><\/marker><\/defs><rect x=\"150\" y=\"10\" width=\"260\" height=\"34\" rx=\"6\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"1.3\"/><text x=\"280.0\" y=\"32.0\" font-size=\"13\" text-anchor=\"middle\" fill=\"#000\">리튬, 나트륨, 헬륨, 네온<\/text><line x1=\"280.0\" y1=\"44.0\" x2=\"280.0\" y2=\"66.0\" stroke=\"#000\" stroke-width=\"1.2\" marker-end=\"url(#ah)\"/><rect x=\"230\" y=\"68\" width=\"100\" height=\"36\" rx=\"6\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"1.3\"/><text x=\"280.0\" y=\"91.0\" font-size=\"15\" text-anchor=\"middle\" fill=\"#000\">(가)<\/text><line x1=\"255.0\" y1=\"104.0\" x2=\"160.0\" y2=\"150.0\" stroke=\"#000\" stroke-width=\"1.2\" marker-end=\"url(#ah)\"/><text x=\"190.0\" y=\"122.0\" font-size=\"13\" text-anchor=\"middle\" fill=\"#000\">예<\/text><line x1=\"305.0\" y1=\"104.0\" x2=\"400.0\" y2=\"150.0\" stroke=\"#000\" stroke-width=\"1.2\" marker-end=\"url(#ah)\"/><text x=\"372.0\" y=\"122.0\" font-size=\"13\" text-anchor=\"middle\" fill=\"#000\">아니요<\/text><rect x=\"90\" y=\"152\" width=\"140\" height=\"34\" rx=\"6\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"1.3\"/><text x=\"160.0\" y=\"174.0\" font-size=\"13\" text-anchor=\"middle\" fill=\"#000\">헬륨, 네온<\/text><rect x=\"330\" y=\"152\" width=\"140\" height=\"34\" rx=\"6\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"1.3\"/><text x=\"400.0\" y=\"174.0\" font-size=\"13\" text-anchor=\"middle\" fill=\"#000\">리튬, 나트륨<\/text><\/svg>", "choices": ["실온에서 고체인가?", "물과 반응하여 수소 기체를 발생하는가?", "다른 물질과 거의 반응하지 않는가?", "칼로 자를 수 있을 만큼 무른가?", "원자 번호가 10 이하인가?"], "answer": [3], "explanation": "'예'에 18족인 헬륨과 네온, '아니요'에 1족인 리튬과 나트륨이 있다. ③ 18족 원소는 다른 물질과 거의 반응하지 않으므로 '예', 1족 원소는 반응성이 커서 '아니요'이다. ①, ②, ④는 리튬과 나트륨이 '예'가 되어 분류 결과가 반대가 된다. ⑤ 리튬(3), 헬륨(2), 네온(10)은 '예', 나트륨(11)만 '아니요'가 된다."}, {"id": "물질의구성:D-017", "sub": "D", "type_id": "D07", "review_group": "RG13", "role": "main", "difficulty": "중", "format": "서술형", "stem": "민호는 원소 X를 관찰하여 다음 결과를 얻었다.<br>· 석유 속에서 꺼내 칼로 자르니 쉽게 잘렸다.<br>· 자른 단면은 처음에 광택이 있었으나 공기 중에 두자 곧 광택을 잃었다.<br>민호의 결론: X는 ① 실온에서 고체이고, ② 공기와 닿으면 표면이 변하며, ③ 물과 활발하게 반응하여 수소 기체를 발생시킨다.<br>민호의 결론 ①~③ 중 이 관찰 결과만으로 내릴 수 <u>없는<\/u> 것을 고르고, 그 까닭을 서술하시오.", "answer": "③. 민호는 X를 물에 넣는 실험을 하지 않았으므로, 물과의 반응이나 수소 기체 발생은 이 관찰 결과로 확인할 수 없다.", "scoring": "③을 고르면 3점, 까닭(물과 반응시키는 실험을 하지 않았다/관찰 자료에 물과의 반응 결과가 없다) 5점. ③ 외의 것을 고르면 0점. '1족 원소는 원래 물과 반응한다'처럼 사실 지식만 쓰면 까닭 0점.", "explanation": "결론은 관찰한 결과에 근거해야 한다. 칼로 잘림(고체·무름)과 광택을 잃음(공기와 반응)은 관찰했지만, 물과의 반응은 관찰하지 않았다."}, {"id": "물질의구성:D-018", "sub": "D", "type_id": "D08", "review_group": "RG13", "role": "main", "difficulty": "상", "format": "합답형", "stem": "표는 주기율표 1족에 속한 원소 3가지의 성질을 조사한 것이다. 이에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?", "bogi": ["ㄱ. 리튬과 나트륨은 같은 주기 원소이므로 성질이 비슷하다.", "ㄴ. 수소는 1족에 속하지만 리튬, 나트륨과 성질이 다르다.", "ㄷ. 리튬과 나트륨은 물속에 넣어 보관해야 한다.", "ㄹ. 리튬과 나트륨이 물과 반응할 때 발생한 기체에 성냥불을 가까이 하면 소리를 내며 탄다."], "table": {"h": ["원소", "실온에서의 상태", "칼로 자를 때", "물에 넣었을 때"], "r": [["수소", "기체", "-", "변화가 없다."], ["리튬", "고체", "쉽게 잘린다.", "기체가 발생한다."], ["나트륨", "고체", "쉽게 잘린다.", "기체가 발생한다."]]}, "choices": ["ㄱ, ㄴ", "ㄱ, ㄷ", "ㄴ, ㄹ", "ㄷ, ㄹ", "ㄴ, ㄷ, ㄹ"], "answer": [3], "explanation": "ㄱ. 리튬(2주기)과 나트륨(3주기)은 주기가 다르고, 성질이 비슷한 까닭은 같은 족이기 때문이다. ㄴ. 옳다. 수소는 실온에서 기체인 비금속이다. ㄷ. 리튬과 나트륨은 물과 활발하게 반응하므로 석유와 같은 기름 속에 보관한다. ㄹ. 옳다. 발생한 기체는 수소이다."}, {"id": "물질의구성:D-019", "sub": "D", "type_id": "D08", "review_group": "RG13", "role": "reserve", "difficulty": "중", "format": "합답형", "stem": "다음은 주기율표 17족에 속하는 플루오린과 염소에 대한 설명이다. 옳은 것만을 <보기>에서 있는 대로 고른 것은?", "bogi": ["ㄱ. 원자 2개가 결합한 분자로 존재한다.", "ㄴ. 다른 물질과 거의 반응하지 않는다.", "ㄷ. 같은 족에 속하므로 화학적 성질이 비슷하다."], "choices": ["ㄱ", "ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "answer": [3], "explanation": "ㄱ. 옳다. 17족 원소는 원자 2개가 결합한 물질로 존재한다. ㄴ. 다른 물질과 거의 반응하지 않는 것은 18족 원소의 성질이다. 17족 원소는 반응성이 크다. ㄷ. 옳다.", "textbook_tags": {"mode": "include_only", "books": ["오투"]}}, {"id": "물질의구성:D-020", "sub": "D", "type_id": "D08", "review_group": "RG13", "role": "reserve", "difficulty": "상", "format": "5지선다", "stem": "그림은 원소 5가지를 분류하는 과정을 나타낸 것이다. A~C에 해당하는 원소에 대한 설명으로 옳은 것은?", "figure_svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 560 252\" width=\"560\" height=\"252\" style=\"background:#fff\" font-family=\"'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif\" font-size=\"14\" fill=\"#000\" stroke=\"none\"><rect x=\"0\" y=\"0\" width=\"560\" height=\"252\" fill=\"#fff\"/><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#000\"/><\/marker><\/defs><rect x=\"140\" y=\"8\" width=\"320\" height=\"34\" rx=\"6\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"1.3\"/><text x=\"300.0\" y=\"30.0\" font-size=\"13\" text-anchor=\"middle\" fill=\"#000\">수소, 리튬, 나트륨, 헬륨, 아르곤<\/text><line x1=\"300.0\" y1=\"42.0\" x2=\"300.0\" y2=\"62.0\" stroke=\"#000\" stroke-width=\"1.2\" marker-end=\"url(#ah)\"/><rect x=\"205\" y=\"64\" width=\"190\" height=\"34\" rx=\"6\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"1.3\"/><text x=\"300.0\" y=\"86.0\" font-size=\"13\" text-anchor=\"middle\" fill=\"#000\">실온에서 기체인가?<\/text><line x1=\"245.0\" y1=\"98.0\" x2=\"165.0\" y2=\"136.0\" stroke=\"#000\" stroke-width=\"1.2\" marker-end=\"url(#ah)\"/><text x=\"190.0\" y=\"116.0\" font-size=\"13\" text-anchor=\"middle\" fill=\"#000\">예<\/text><line x1=\"355.0\" y1=\"98.0\" x2=\"445.0\" y2=\"136.0\" stroke=\"#000\" stroke-width=\"1.2\" marker-end=\"url(#ah)\"/><text x=\"420.0\" y=\"116.0\" font-size=\"13\" text-anchor=\"middle\" fill=\"#000\">아니요<\/text><rect x=\"40\" y=\"138\" width=\"250\" height=\"34\" rx=\"6\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"1.3\"/><text x=\"165.0\" y=\"160.0\" font-size=\"13\" text-anchor=\"middle\" fill=\"#000\">다른 물질과 거의 반응하지 않는가?<\/text><rect x=\"400\" y=\"138\" width=\"90\" height=\"34\" rx=\"6\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"1.3\"/><text x=\"445.0\" y=\"160.0\" font-size=\"15\" text-anchor=\"middle\" fill=\"#000\">C<\/text><line x1=\"110.0\" y1=\"172.0\" x2=\"80.0\" y2=\"208.0\" stroke=\"#000\" stroke-width=\"1.2\" marker-end=\"url(#ah)\"/><text x=\"80.0\" y=\"192.0\" font-size=\"13\" text-anchor=\"middle\" fill=\"#000\">예<\/text><line x1=\"220.0\" y1=\"172.0\" x2=\"250.0\" y2=\"208.0\" stroke=\"#000\" stroke-width=\"1.2\" marker-end=\"url(#ah)\"/><text x=\"262.0\" y=\"192.0\" font-size=\"13\" text-anchor=\"middle\" fill=\"#000\">아니요<\/text><rect x=\"40\" y=\"210\" width=\"80\" height=\"32\" rx=\"6\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"1.3\"/><text x=\"80.0\" y=\"231.0\" font-size=\"15\" text-anchor=\"middle\" fill=\"#000\">A<\/text><rect x=\"210\" y=\"210\" width=\"80\" height=\"32\" rx=\"6\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"1.3\"/><text x=\"250.0\" y=\"231.0\" font-size=\"15\" text-anchor=\"middle\" fill=\"#000\">B<\/text><\/svg>", "choices": ["A에는 리튬이 해당한다.", "B에 해당하는 원소는 주기율표의 1족에 속한다.", "C에 해당하는 원소는 물과 반응하여 산소 기체를 발생한다.", "A에 해당하는 원소는 2가지이고, 두 원소는 같은 주기에 있다.", "B에 해당하는 원소는 C에 해당하는 원소와 같은 족이므로 성질이 비슷하다."], "answer": [2], "explanation": "실온에서 기체인 것은 수소, 헬륨, 아르곤이고, 이 중 다른 물질과 거의 반응하지 않는 헬륨, 아르곤이 A, 수소가 B이다. 리튬, 나트륨은 C이다. ① 리튬은 C이다. ② 옳다. 수소는 1족에 속한다. ③ 1족 금속이 물과 반응하면 수소 기체가 발생한다. ④ 헬륨은 1주기, 아르곤은 3주기이다. ⑤ 수소는 리튬, 나트륨과 같은 1족이지만 성질이 다르다."}, {"id": "물질의구성:E-001", "sub": "E", "type_id": "E01", "review_group": "RG14", "role": "main", "difficulty": "하", "format": "5지선다", "stem": "다음은 물질을 이루는 입자와 성분에 대한 설명이다. ㉠~㉢에 알맞은 말을 옳게 짝지은 것은?<br>· ( ㉠ ): 물질을 이루는 기본 입자<br>· ( ㉡ ): 물질을 이루는 기본 성분으로, 원자의 종류를 뜻한다.<br>· ( ㉢ ): 원자가 결합하여 독립적으로 존재하며, 물질의 성질을 나타내는 가장 작은 입자", "choices": ["㉠ 원소, ㉡ 분자, ㉢ 원자", "㉠ 원소, ㉡ 원자, ㉢ 분자", "㉠ 분자, ㉡ 원소, ㉢ 원자", "㉠ 원자, ㉡ 분자, ㉢ 원소", "㉠ 원자, ㉡ 원소, ㉢ 분자"], "answer": [5], "explanation": "물질을 이루는 기본 입자는 원자, 물질을 이루는 기본 성분(원자의 종류)은 원소, 물질의 성질을 나타내는 가장 작은 입자는 분자이다."}, {"id": "물질의구성:E-002", "sub": "E", "type_id": "E02", "review_group": "RG14", "role": "main", "difficulty": "중", "format": "5지선다", "stem": "그림은 산소와 오존의 분자 모형을 나타낸 것이다. 이에 대한 설명으로 옳은 것은?", "figure_svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 470 180\" width=\"470\" height=\"180\" style=\"background:#fff\" font-family=\"'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif\" font-size=\"14\" fill=\"#000\" stroke=\"none\"><rect x=\"0\" y=\"0\" width=\"470\" height=\"180\" fill=\"#fff\"/><circle cx=\"90.0\" cy=\"70.0\" r=\"22\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"1.5\"/><circle cx=\"126.0\" cy=\"70.0\" r=\"22\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"1.5\"/><text x=\"108.0\" y=\"126.0\" font-size=\"14\" text-anchor=\"middle\" fill=\"#000\">(가) 산소<\/text><circle cx=\"300.0\" cy=\"82.0\" r=\"22\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"1.5\"/><circle cx=\"336.0\" cy=\"56.0\" r=\"22\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"1.5\"/><circle cx=\"372.0\" cy=\"82.0\" r=\"22\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"1.5\"/><text x=\"336.0\" y=\"126.0\" font-size=\"14\" text-anchor=\"middle\" fill=\"#000\">(나) 오존<\/text><circle cx=\"190.0\" cy=\"160.0\" r=\"10\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"1.5\"/><text x=\"208.0\" y=\"165.0\" font-size=\"13\" text-anchor=\"start\" fill=\"#000\">산소 원자<\/text><\/svg>", "choices": ["(가)와 (나)는 같은 종류의 원자로 이루어져 있으므로 성질이 같다.", "(가)와 (나)는 분자 1개를 이루는 원자의 수가 달라 서로 다른 물질이다.", "(나)를 원자로 나누어도 오존의 성질은 그대로 남아 있다.", "분자는 항상 서로 다른 종류의 원자가 결합하여 만들어진다.", "(나) 분자 2개에는 산소 원자가 모두 3개 들어 있다."], "answer": [2], "explanation": "(가)는 O₂, (나)는 O₃이다. ① 같은 종류의 원자로 이루어져 있어도 결합한 원자 수가 다르면 다른 분자이며 성질도 다르다. ② 옳다. ③ 분자가 원자로 나뉘면 그 물질의 성질을 잃는다. ④ (가), (나)처럼 같은 종류의 원자끼리 결합한 분자도 있다. ⑤ O₃ 분자 2개에는 산소 원자가 3 × 2 = 6개 들어 있다."}, {"id": "물질의구성:E-003", "sub": "E", "type_id": "E02", "review_group": "RG14", "role": "main", "difficulty": "상", "format": "서술형", "stem": "그림은 일산화 탄소와 이산화 탄소의 분자 모형을 나타낸 것이다. 일산화 탄소는 독성이 강한 기체이고, 이산화 탄소는 석회수를 뿌옇게 흐리게 하는 기체이다.<br>(1) (가)와 (나) 분자 1개를 이루는 원자의 수를 각각 쓰시오.<br>(2) (가)와 (나)는 같은 종류의 원자로 이루어져 있지만 성질이 다르다. 그 까닭을 분자와 관련지어 서술하시오.", "figure_svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 470 176\" width=\"470\" height=\"176\" style=\"background:#fff\" font-family=\"'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif\" font-size=\"14\" fill=\"#000\" stroke=\"none\"><rect x=\"0\" y=\"0\" width=\"470\" height=\"176\" fill=\"#fff\"/><circle cx=\"80.0\" cy=\"66.0\" r=\"22\" fill=\"#000\" stroke=\"#000\" stroke-width=\"1.5\"/><circle cx=\"116.0\" cy=\"66.0\" r=\"22\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"1.5\"/><text x=\"98.0\" y=\"118.0\" font-size=\"14\" text-anchor=\"middle\" fill=\"#000\">(가) 일산화 탄소<\/text><circle cx=\"290.0\" cy=\"66.0\" r=\"22\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"1.5\"/><circle cx=\"326.0\" cy=\"66.0\" r=\"22\" fill=\"#000\" stroke=\"#000\" stroke-width=\"1.5\"/><circle cx=\"362.0\" cy=\"66.0\" r=\"22\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"1.5\"/><text x=\"326.0\" y=\"118.0\" font-size=\"14\" text-anchor=\"middle\" fill=\"#000\">(나) 이산화 탄소<\/text><circle cx=\"120.0\" cy=\"154.0\" r=\"10\" fill=\"#000\" stroke=\"#000\" stroke-width=\"1.5\"/><text x=\"138.0\" y=\"159.0\" font-size=\"13\" text-anchor=\"start\" fill=\"#000\">탄소 원자<\/text><circle cx=\"270.0\" cy=\"154.0\" r=\"10\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"1.5\"/><text x=\"288.0\" y=\"159.0\" font-size=\"13\" text-anchor=\"start\" fill=\"#000\">산소 원자<\/text><\/svg>", "answer": "(1) (가) 2개, (나) 3개 (2) 분자는 물질의 성질을 나타내는 가장 작은 입자인데, (가)와 (나)는 결합한 원자의 수(산소 원자 수)가 달라 서로 다른 분자이기 때문이다.", "scoring": {"total": 10, "criteria": [{"points": 2, "desc": "(1) (가) 2개"}, {"points": 2, "desc": "(1) (나) 3개"}, {"points": 3, "desc": "(2) 결합한 원자의 수(또는 원자의 배열·결합 방법)가 다르다"}, {"points": 3, "desc": "(2) 서로 다른 분자이므로 성질이 다르다(분자는 물질의 성질을 나타내는 가장 작은 입자)"}], "accepted": ["'분자는 물질의 성질을 나타내는 가장 작은 입자'라는 정의 문구가 없어도 '원자 수가 달라 서로 다른 분자이므로 성질이 다르다'처럼 분자와 성질을 연결하면 3점 인정", "원자의 배열(결합 방법)이 다르다(TD15)"], "partial": "원자 수 차이만 쓰고 분자·성질 연결이 없으면 (2) 3점. '원소가 달라서'라고 쓰면 (2) 0점."}, "explanation": "CO와 CO₂는 모두 탄소와 산소로 이루어져 있지만 분자를 이루는 산소 원자의 수가 다르다. 분자가 다르면 물질의 성질도 다르다."}, {"id": "물질의구성:E-004", "sub": "E", "type_id": "E02", "review_group": "RG14", "role": "reserve", "difficulty": "중", "format": "합답형", "stem": "표는 물과 과산화 수소를 비교한 것이다. 이에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?", "bogi": ["ㄱ. 두 물질을 이루는 원소의 종류는 같다.", "ㄴ. 분자 1개를 이루는 원자의 수는 과산화 수소가 물보다 1개 많다.", "ㄷ. 과산화 수소 분자가 수소 원자와 산소 원자로 나뉘면 소독 작용을 하는 성질을 잃는다."], "table": {"h": ["물질", "화학식", "성질"], "r": [["물", "H₂O", "상처에 발라도 거품이 생기지 않는다."], ["과산화 수소", "H₂O₂", "상처에 바르면 거품이 생기며 소독 작용을 한다."]]}, "choices": ["ㄱ", "ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "answer": [5], "explanation": "ㄱ. 옳다. 두 물질 모두 수소와 산소로 이루어져 있다. ㄴ. 옳다. H₂O는 원자 3개, H₂O₂는 원자 4개이다. ㄷ. 옳다. 분자가 원자로 나뉘면 그 물질의 성질을 잃는다. 이처럼 원소의 종류가 같아도 원자 수가 다르면 다른 분자이고 성질도 다르다."}, {"id": "물질의구성:E-005", "sub": "E", "type_id": "E01", "review_group": "RG14", "role": "reserve", "difficulty": "하", "format": "단답형", "stem": "그림은 암모니아의 분자 모형을 나타낸 것이다.<br>(1) 암모니아를 이루는 원소는 몇 가지인지 쓰시오.<br>(2) 암모니아 분자 1개를 이루는 원자는 모두 몇 개인지 쓰시오.", "figure_svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 330 172\" width=\"330\" height=\"172\" style=\"background:#fff\" font-family=\"'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif\" font-size=\"14\" fill=\"#000\" stroke=\"none\"><rect x=\"0\" y=\"0\" width=\"330\" height=\"172\" fill=\"#fff\"/><circle cx=\"114.0\" cy=\"100.0\" r=\"14\" fill=\"#d0d0d0\" stroke=\"#000\" stroke-width=\"1.5\"/><circle cx=\"186.0\" cy=\"100.0\" r=\"14\" fill=\"#d0d0d0\" stroke=\"#000\" stroke-width=\"1.5\"/><circle cx=\"150.0\" cy=\"38.0\" r=\"14\" fill=\"#d0d0d0\" stroke=\"#000\" stroke-width=\"1.5\"/><circle cx=\"150.0\" cy=\"78.0\" r=\"24\" fill=\"#8a8a8a\" stroke=\"#000\" stroke-width=\"1.5\"/><circle cx=\"60.0\" cy=\"150.0\" r=\"10\" fill=\"#8a8a8a\" stroke=\"#000\" stroke-width=\"1.5\"/><text x=\"78.0\" y=\"155.0\" font-size=\"13\" text-anchor=\"start\" fill=\"#000\">질소 원자<\/text><circle cx=\"210.0\" cy=\"150.0\" r=\"8\" fill=\"#d0d0d0\" stroke=\"#000\" stroke-width=\"1.5\"/><text x=\"226.0\" y=\"155.0\" font-size=\"13\" text-anchor=\"start\" fill=\"#000\">수소 원자<\/text><\/svg>", "answer": "(1) 2가지 (2) 4개", "scoring": "각 문항 1점.", "explanation": "암모니아(NH₃)는 질소와 수소 두 가지 원소로 이루어져 있고, 분자 1개는 질소 원자 1개와 수소 원자 3개, 모두 4개의 원자로 이루어져 있다."}, {"id": "물질의구성:E-006", "sub": "E", "type_id": "E03", "review_group": "RG15", "role": "main", "difficulty": "하", "format": "5지선다", "stem": "다음 물질을 이루는 입자의 종류에 따라 분류하려고 한다.<br>헬륨, 물, 염화 나트륨, 이산화 탄소, 네온<br>분류한 결과로 옳은 것은?", "choices": ["원자: 헬륨, 네온 / 분자: 물, 이산화 탄소 / 이온: 염화 나트륨", "원자: 헬륨 / 분자: 네온, 물, 이산화 탄소 / 이온: 염화 나트륨", "원자: 헬륨, 네온 / 분자: 물, 염화 나트륨 / 이온: 이산화 탄소", "원자: 헬륨, 네온 / 분자: 물, 이산화 탄소, 염화 나트륨 / 이온: 없음", "원자: 없음 / 분자: 헬륨, 네온, 물, 이산화 탄소 / 이온: 염화 나트륨"], "answer": [1], "explanation": "헬륨, 네온은 원자가 독립적으로 존재하는 물질, 물과 이산화 탄소는 분자로 이루어진 물질, 염화 나트륨은 이온으로 이루어진 물질이다. ② 네온도 원자로 존재한다. ③ 염화 나트륨은 이온, 이산화 탄소는 분자로 이루어진 물질이다. ④ 염화 나트륨은 분자로 존재하지 않는다. ⑤ 18족 원소는 원자가 결합하지 않고 하나씩 존재한다."}, {"id": "물질의구성:E-007", "sub": "E", "type_id": "E03", "review_group": "RG15", "role": "main", "difficulty": "상", "format": "합답형", "stem": "그림 (가)~(다)는 물질을 이루는 입자의 배열을 모형으로 나타낸 것이다. 이에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은? (단, (다)의 +, −는 각각 양이온과 음이온이다.)", "bogi": ["ㄱ. 네온은 (가)와 같이 원자가 하나씩 독립적으로 존재한다.", "ㄴ. 염화 나트륨은 (다)와 같이 양이온과 음이온이 규칙적으로 배열되어 있어 분자로 존재하지 않는다.", "ㄷ. 이산화 탄소는 (다)와 같은 방식으로 이루어진 물질이다.", "ㄹ. (나)의 입자 하나를 원자로 나누어도 그 물질의 성질은 그대로 남는다."], "figure_svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 560 196\" width=\"560\" height=\"196\" style=\"background:#fff\" font-family=\"'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif\" font-size=\"14\" fill=\"#000\" stroke=\"none\"><rect x=\"0\" y=\"0\" width=\"560\" height=\"196\" fill=\"#fff\"/><rect x=\"12\" y=\"10\" width=\"170\" height=\"150\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"1.2\"/><text x=\"97.0\" y=\"182.0\" font-size=\"14\" text-anchor=\"middle\" fill=\"#000\">(가)<\/text><rect x=\"198\" y=\"10\" width=\"170\" height=\"150\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"1.2\"/><text x=\"283.0\" y=\"182.0\" font-size=\"14\" text-anchor=\"middle\" fill=\"#000\">(나)<\/text><rect x=\"384\" y=\"10\" width=\"170\" height=\"150\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"1.2\"/><text x=\"469.0\" y=\"182.0\" font-size=\"14\" text-anchor=\"middle\" fill=\"#000\">(다)<\/text><circle cx=\"50.0\" cy=\"45.0\" r=\"11\" fill=\"#d0d0d0\" stroke=\"#000\" stroke-width=\"1.5\"/><circle cx=\"120.0\" cy=\"40.0\" r=\"11\" fill=\"#d0d0d0\" stroke=\"#000\" stroke-width=\"1.5\"/><circle cx=\"85.0\" cy=\"95.0\" r=\"11\" fill=\"#d0d0d0\" stroke=\"#000\" stroke-width=\"1.5\"/><circle cx=\"40.0\" cy=\"130.0\" r=\"11\" fill=\"#d0d0d0\" stroke=\"#000\" stroke-wi \"6\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"1.3\"/><text x=\"60.0\" y=\"222.0\" font-size=\"15\" text-anchor=\"middle\" fill=\"#000\">A<\/text><rect x=\"180\" y=\"202\" width=\"60\" height=\"30\" rx=\"6\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"1.3\"/><text x=\"210.0\" y=\"222.0\" font-size=\"15\" text-anchor=\"middle\" fill=\"#000\">B<\/text><rect x=\"330\" y=\"202\" width=\"60\" height=\"30\" rx=\"6\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"1.3\"/><text x=\"360.0\" y=\"222.0\" font-size=\"15\" text-anchor=\"middle\" fill=\"#000\">C<\/text><rect x=\"470\" y=\"202\" width=\"60\" height=\"30\" rx=\"6\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"1.3\"/><text x=\"500.0\" y=\"222.0\" font-size=\"15\" text-anchor=\"middle\" fill=\"#000\">D<\/text><\/svg>", "choices": ["ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄷ, ㄹ", "ㄱ, ㄴ, ㄹ", "ㄴ, ㄷ, ㄹ"], "answer": [3], "explanation": "A는 원자가 독립적으로 존재하는 원소(헬륨, 네온), B는 같은 종류의 원자로 이루어진 분자(O₂, O₃, H₂), C는 이온으로 이루어진 화합물(염화 나트륨), D는 두 종류 이상의 원자로 이루어진 분자(물, 이산화 탄소)이다. ㄱ. 옳다. ㄴ. C는 두 종류 이상의 원소로 이루어진 화합물이다. ㄷ. 옳다. ㄹ. 옳다. 오존은 산소 원자 3개로 이루어진 분자로 원소이다."}, {"id": "물질의구성:E-009", "sub": "E", "type_id": "E03", "review_group": "RG15", "role": "reserve", "difficulty": "중", "format": "서술형", "stem": "염화 나트륨은 화학식을 NaCl로 나타내지만 분자로 이루어진 물질이 아니다. 그 까닭을 염화 나트륨을 이루는 입자와 관련지어 서술하시오.", "answer": "염화 나트륨은 나트륨 이온(Na⁺)과 염화 이온(Cl⁻)이 규칙적으로 배열하여 이루어진 물질로, 독립적으로 존재하는 분자 단위가 없기 때문이다.", "scoring": {"total": 4, "criteria": [{"points": 2, "desc": "양이온과 음이온(나트륨 이온과 염화 이온)으로 이루어졌다"}, {"points": 2, "desc": "독립된 분자 단위가 없다(이온이 규칙적으로 배열되어 있다)"}], "accepted": ["'NaCl은 이온의 개수비(1 : 1)를 나타낸다'를 덧붙인 답"], "partial": "이루는 입자를 원자나 분자로 잘못 쓰면 0점."}, "explanation": "이온으로 이루어진 물질은 양이온과 음이온이 많이 모여 규칙적으로 배열되어 있어 분자처럼 독립된 입자 단위가 없다."}, {"id": "물질의구성:E-010", "sub": "E", "type_id": "E03", "review_group": "RG15", "role": "reserve", "difficulty": "중", "format": "2개 고르기", "stem": "다음 중 분자로 이루어진 물질이 <u>아닌<\/u> 것을 <u>두 가지<\/u> 고르시오.", "choices": ["물", "구리", "이산화 탄소", "염화 나트륨", "수소"], "answer": [2, 4], "explanation": "물, 이산화 탄소, 수소(H₂)는 분자로 이루어진 물질이다. 구리는 독립된 분자를 이루지 않으며, 염화 나트륨은 나트륨 이온과 염화 이온으로 이루어진 물질이다."}, {"id": "물질의구성:F-001", "sub": "F", "type_id": "F01", "review_group": "RG16", "role": "main", "difficulty": "하", "format": "5지선다", "stem": "이온에 대한 설명으로 옳은 것은?", "choices": ["원자가 양성자를 잃으면 양이온이 된다.", "원자가 전자를 얻으면 음이온이 된다.", "이온은 전기적으로 중성인 입자이다.", "원자가 이온이 되면 원소의 종류가 바뀐다.", "원자가 전자를 잃으면 음이온이 된다."], "answer": [2], "explanation": "① 이온이 될 때 이동하는 것은 전자이며 양성자 수는 변하지 않는다. ② 옳다. 원자가 전자를 얻으면 (−)전하를 띠는 음이온이 된다. ③ 전기적으로 중성인 것은 원자이고, 이온은 전하를 띤다. ④ 양성자 수가 그대로이므로 원소의 종류는 바뀌지 않는다. ⑤ 전자를 잃으면 양이온이 된다."}, {"id": "물질의구성:F-002", "sub": "F", "type_id": "F02", "review_group": "RG16", "role": "main", "difficulty": "중", "format": "합답형", "stem": "그림은 어떤 원자가 이온이 되는 과정을 모형으로 나타낸 것이다. 이에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?", "bogi": ["ㄱ. 원자가 전자 2개를 잃었다.", "ㄴ. 이온이 되어도 원자핵의 전하량은 +8로 변하지 않는다.", "ㄷ. 이온은 (−)전하량의 총합이 (+)전하량보다 크다."], "figure_svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"470\" height=\"215\" viewBox=\"0 0 470 215\" style=\"background:#fff\" fill=\"none\" stroke=\"#000\" stroke-width=\"1.5\" font-size=\"14\" font-family=\"'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif\"><rect x=\"0\" y=\"0\" width=\"470\" height=\"215\" fill=\"#fff\" stroke=\"none\"/><circle cx=\"110\" cy=\"100\" r=\"58\" stroke-dasharray=\"4 4\" stroke-width=\"1\"/><circle cx=\"110\" cy=\"100\" r=\"19\" fill=\"#fff\"/><text x=\"110\" y=\"105\" fill=\"#000\" stroke=\"none\" font-size=\"14\" text-anchor=\"middle\" font-weight=\"bold\">+8<\/text><circle cx=\"110.0\" cy=\"42.0\" r=\"5\" fill=\"#000\" stroke=\"none\"/><circle cx=\"151.0\" cy=\"59.0\" r=\"5\" fill=\"#000\" stroke=\"none\"/><circle cx=\"168.0\" cy=\"100.0\" r=\"5\" fill=\"#000\" stroke=\"none\"/><circle cx=\"151.0\" cy=\"141.0\" r=\"5\" fill=\"#000\" stroke=\"none\"/><circle cx=\"110.0\" cy=\"158.0\" r=\"5\" fill=\"#000\" stroke=\"none\"/><circle cx=\"69.0\" cy=\"141.0\" r=\"5\" fill=\"#000\" stroke=\"none\"/><circle cx=\"52.0\" cy=\"100.0\" r=\"5\" fill=\"#000\" stroke=\"none\"/><circle cx=\"69.0\" cy=\"59.0\" r=\"5\" fill=\"#000\" stroke=\"none\"/><line x1=\"195\" y1=\"100\" x2=\"265\" y2=\"100\" stroke-width=\"2\"/><polygon points=\"275,100 263,94 263,106\" fill=\"#000\" stroke=\"none\"/><circle cx=\"360\" cy=\"100\" r=\"58\" stroke-dasharray=\"4 4\" stroke-width=\"1\"/><circle cx=\"360\" cy=\"100\" r=\"19\" fill=\"#fff\"/><text x=\"360\" y=\"105\" fill=\"#000\" stroke=\"none\" font-size=\"14\" text-anchor=\"middle\" font-weight=\"bold\">+8<\/text><circle cx=\"360.0\" cy=\"42.0\" r=\"5\" fill=\"#000\" stroke=\"none\"/><circle cx=\"394.1\" cy=\"53.1\" r=\"5\" fill=\"#000\" stroke=\"none\"/><circle cx=\"415.2\" cy=\"82.1\" r=\"5\" fill=\"#000\" stroke=\"none\"/><circle cx=\"415.2\" cy=\"117.9\" r=\"5\" fill=\"#000\" stroke=\"none\"/><circle cx=\"394.1\" cy=\"146.9\" r=\"5\" fill=\"#000\" stroke=\"none\"/><circle cx=\"360.0\" cy=\"158.0\" r=\"5\" fill=\"#000\" stroke=\"none\"/><circle cx=\"325.9\" cy=\"146.9\" r=\"5\" fill=\"#000\" stroke=\"none\"/><circle cx=\"304.8\" cy=\"117.9\" r=\"5\" fill=\"#000\" stroke=\"none\"/><circle cx=\"304.8\" cy=\"82.1\" r=\"5\" fill=\"#000\" stroke=\"none\"/><circle cx=\"325.9\" cy=\"53.1\" r=\"5\" fill=\"#000\" stroke=\"none\"/><text x=\"110\" y=\"192\" fill=\"#000\" stroke=\"none\" font-size=\"14\" text-anchor=\"middle\">원자<\/text><text x=\"360\" y=\"192\" fill=\"#000\" stroke=\"none\" font-size=\"14\" text-anchor=\"middle\">이온<\/text><circle cx=\"420\" cy=\"18\" r=\"5\" fill=\"#000\" stroke=\"none\"/><text x=\"430\" y=\"23\" fill=\"#000\" stroke=\"none\" font-size=\"13\" text-anchor=\"start\">: 전자<\/text><\/svg>", "choices": ["ㄱ", "ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "answer": [4], "explanation": "원자의 전자는 8개, 이온의 전자는 10개이다. ㄱ. 거짓. 전자 2개를 얻었다. ㄴ. 참. 이온이 될 때 전자만 이동하므로 원자핵 전하량은 +8 그대로이다. ㄷ. 참. 이온의 (+)전하량은 +8, 전자 10개의 (−)전하량은 −10이므로 (−)전하량이 더 크고, 이 이온은 음이온(2−)이다. 따라서 ㄴ, ㄷ."}, {"id": "물질의구성:F-003", "sub": "F", "type_id": "F01", "review_group": "RG16", "role": "main", "difficulty": "중", "format": "서술형", "stem": "나트륨 원자(Na)가 나트륨 이온(Na⁺)이 되는 과정을 <u>전자의 이동<\/u>으로 서술하고, 이때 변하지 않는 것을 두 가지 쓰시오.", "answer": "나트륨 원자가 전자 1개를 잃어 (+)전하를 띠는 양이온(Na⁺)이 된다. 변하지 않는 것: 양성자 수(원자핵의 전하량), 원소의 종류 (중성자 수도 인정)", "scoring": {"total": 5, "criteria": [{"points": 2, "desc": "전자 1개를 잃는다"}, {"points": 1, "desc": "(+)전하를 띠는 양이온이 된다"}, {"points": 1, "desc": "변하지 않는 것 첫째"}, {"points": 1, "desc": "변하지 않는 것 둘째"}], "accepted": ["변하지 않는 것: 양성자 수, 원자핵의 전하량, 원자 번호(이 셋은 같은 것이라 한 가지로 셈), 원소의 종류, 중성자 수"], "partial": "잃는 전자 수 없이 '전자를 잃는다'만 쓰면 1점. 양성자를 잃는다고 쓰거나 전자를 얻는다고 쓰면 과정(3점) 0점."}, "explanation": "원자는 전자를 잃거나 얻어 이온이 되며, 원자핵(양성자·중성자)은 변하지 않는다. 그래서 양성자 수와 원자핵 전하량, 원소의 종류가 그대로 유지된다. 양성자 수(11)는 그대로이고 전자는 11개에서 10개가 된다."}, {"id": "물질의구성:F-004", "sub": "F", "type_id": "F02", "review_group": "RG16", "role": "reserve", "difficulty": "하", "format": "5지선다", "stem": "그림은 원자가 이온이 되는 과정을 모형으로 나타낸 것이다. 이에 대한 설명으로 옳은 것은?", "figure_svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"470\" height=\"215\" viewBox=\"0 0 470 215\" style=\"background:#fff\" fill=\"none\" stroke=\"#000\" stroke-width=\"1.5\" font-size=\"14\" font-family=\"'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif\"><rect x=\"0\" y=\"0\" width=\"470\" height=\"215\" fill=\"#fff\" stroke=\"none\"/><circle cx=\"110\" cy=\"100\" r=\"58\" stroke-dasharray=\"4 4\" stroke-width=\"1\"/><circle cx=\"110\" cy=\"100\" r=\"19\" fill=\"#fff\"/><text x=\"110\" y=\"105\" fill=\"#000\" stroke=\"none\" font-size=\"14\" text-anchor=\"middle\" font-weight=\"bold\">+3<\/text><circle cx=\"110.0\" cy=\"42.0\" r=\"5\" fill=\"#000\" stroke=\"none\"/><circle cx=\"160.2\" cy=\"129.0\" r=\"5\" fill=\"#000\" stroke=\"none\"/><circle cx=\"59.8\" cy=\"129.0\" r=\"5\" fill=\"#000\" stroke=\"none\"/><line x1=\"195\" y1=\"100\" x2=\"265\" y2=\"100\" stroke-width=\"2\"/><polygon points=\"275,100 263,94 263,106\" fill=\"#000\" stroke=\"none\"/><circle cx=\"360\" cy=\"100\" r=\"58\" stroke-dasharray=\"4 4\" stroke-width=\"1\"/><circle cx=\"360\" cy=\"100\" r=\"19\" fill=\"#fff\"/><text x=\"360\" y=\"105\" fill=\"#000\" stroke=\"none\" font-size=\"14\" text-anchor=\"middle\" font-weight=\"bold\">+3<\/text><circle cx=\"360.0\" cy=\"42.0\" r=\"5\" fill=\"#000\" stroke=\"none\"/><circle cx=\"360.0\" cy=\"158.0\" r=\"5\" fill=\"#000\" stroke=\"none\"/><text x=\"110\" y=\"192\" fill=\"#000\" stroke=\"none\" font-size=\"14\" text-anchor=\"middle\">원자<\/text><text x=\"360\" y=\"192\" fill=\"#000\" stroke=\"none\" font-size=\"14\" text-anchor=\"middle\">이온<\/text><circle cx=\"420\" cy=\"18\" r=\"5\" fill=\"#000\" stroke=\"none\"/><text x=\"430\" y=\"23\" fill=\"#000\" stroke=\"none\" font-size=\"13\" text-anchor=\"start\">: 전자<\/text><\/svg>", "choices": ["이온이 된 후 전자 수는 3개이다.", "원자핵의 전하량이 +3에서 +2로 줄었다.", "이온은 (−)전하량이 (+)전하량보다 크다.", "이온이 되면서 원자핵 속 중성자 수도 줄었다.", "원자가 전자 1개를 잃어 양이온이 되었다."], "answer": [5], "explanation": "원자핵 전하량은 +3으로 그대로이고 전자는 3개에서 2개로 줄었다. ① 이온의 전자는 2개이다. ② 원자핵 전하량은 변하지 않는다. ③ (+)전하량 +3이 (−)전하량 −2보다 크다. ④ 원자핵은 변하지 않는다. ⑤ 옳다."}, {"id": "물질의구성:F-005", "sub": "F", "type_id": "F02", "review_group": "RG16", "role": "reserve", "difficulty": "상", "format": "합답형", "stem": "표는 원자 A, B와 각 원자가 만든 이온의 원자핵 전하량과 전자 수를 나타낸 것이다. 이에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은? (단, A, B는 임의의 원소 기호이다.)", "bogi": ["ㄱ. A는 전자 1개를 얻어 음이온이 된다.", "ㄴ. A 이온과 B 이온은 전자 수가 같다.", "ㄷ. B 이온은 (+)전하량이 (−)전하량보다 크다.", "ㄹ. A 이온과 B 이온은 전자 수가 같으므로 같은 원소의 이온이다."], "table": {"h": ["입자", "A 원자", "A 이온", "B 원자", "B 이온"], "r": [["원자핵 전하량", "+9", "+9", "+11", "+11"], ["전자 수", "9", "10", "11", "10"]]}, "choices": ["ㄱ, ㄴ", "ㄱ, ㄴ, ㄷ", "ㄱ, ㄷ, ㄹ", "ㄴ, ㄷ, ㄹ", "ㄱ, ㄴ, ㄷ, ㄹ"], "answer": [2], "explanation": "ㄱ. 참. A는 전자가 9개에서 10개로 1개 늘어 음이온(A⁻)이 된다. ㄴ. 참. 두 이온 모두 전자 10개이다. ㄷ. 참. B 이온은 +11, 전자 10개(−10)로 (+)전하량이 더 큰 양이온(B⁺)이다. ㄹ. 거짓. 원소의 종류는 양성자 수(원자핵 전하량)로 정해지며 +9와 +11로 다르다. 따라서 ㄱ, ㄴ, ㄷ."}, {"id": "물질의구성:F-006", "sub": "F", "type_id": "F03", "review_group": "RG17", "role": "main", "difficulty": "하", "format": "5지선다", "stem": "이온식(화학식)과 이온의 이름을 옳게 짝지은 것은?", "choices": ["K⁺ - 칼슘 이온", "Cl⁻ - 염소 이온", "SO₄²⁻ - 황화 이온", "Na⁺ - 나트륨화 이온", "S²⁻ - 황화 이온"], "answer": [5], "explanation": "① K⁺는 칼륨 이온이다(칼슘 이온은 Ca²⁺). ② Cl⁻는 염화 이온이다. 음이온은 '~화 이온'이고 '소'로 끝나면 '소'를 뺀다. ③ SO₄²⁻는 황산 이온이다. ④ 양이온은 원소 이름 뒤에 '이온'만 붙여 나트륨 이온이라 한다. ⑤ 옳다."}, {"id": "물질의구성:F-007", "sub": "F", "type_id": "F03", "review_group": "RG17", "role": "main", "difficulty": "중", "format": "단답형", "stem": "표는 몇 가지 이온의 이름과 이온식을 나타낸 것이다. (가)~(라)에 알맞은 이온식 또는 이름을 쓰시오.", "table": {"h": ["이온의 이름", "이온식"], "r": [["마그네슘 이온", "(가)"], ["(나)", "F⁻"], ["황산 이온", "(다)"], ["(라)", "NO₃⁻"]]}, "answer": "(가) Mg²⁺ (나) 플루오린화 이온 (다) SO₄²⁻ (라) 질산 이온", "scoring": {"total": 4, "criteria": [{"points": 1, "desc": "(가) Mg²⁺"}, {"points": 1, "desc": "(나) 플루오린화 이온"}, {"points": 1, "desc": "(다) SO₄²⁻"}, {"points": 1, "desc": "(라) 질산 이온"}], "accepted": [], "partial": "칸마다 따로 채점. 'Mg⁺²', '플루오린 이온', 'SO₄⁻²'처럼 부호 위치나 '화'가 틀리면 해당 칸 0점."}, "explanation": "마그네슘 원자는 전자 2개를 잃어 Mg²⁺가 된다. 플루오린 원자가 전자 1개를 얻은 F⁻는 음이온이므로 '플루오린화 이온'이다. 황산 이온(SO₄²⁻)과 질산 이온(NO₃⁻)은 여러 개의 원자로 이루어진 이온이다."}, {"id": "물질의구성:F-008", "sub": "F", "type_id": "F04", "review_group": "RG17", "role": "main", "difficulty": "중", "format": "합답형", "stem": "그림은 원자 X가 X 이온이 되는 과정을 모형으로 나타낸 것이다. X와 같은 방식(잃거나 얻는 전자 수가 같고, 잃는지 얻는지도 같은 방식)으로 이온이 되는 원자만을 <보기>에서 있는 대로 고른 것은?", "bogi": ["ㄱ. 칼슘(Ca)", "ㄴ. 나트륨(Na)", "ㄷ. 황(S)"], "figure_svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"470\" height=\"215\" viewBox=\"0 0 470 215\" style=\"background:#fff\" fill=\"none\" stroke=\"#000\" stroke-width=\"1.5\" font-size=\"14\" font-family=\"'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif\"><rect x=\"0\" y=\"0\" width=\"470\" height=\"215\" fill=\"#fff\" stroke=\"none\"/><circle cx=\"110\" cy=\"100\" r=\"58\" stroke-dasharray=\"4 4\" stroke-width=\"1\"/><circle cx=\"110\" cy=\"100\" r=\"19\" fill=\"#fff\"/><text x=\"110\" y=\"105\" fill=\"#000\" stroke=\"none\" font-size=\"14\" text-anchor=\"middle\" font-weight=\"bold\">+12<\/text><circle cx "110\" y=\"192\" fill=\"#000\" stroke=\"none\" font-size=\"14\" text-anchor=\"middle\">원자 X<\/text><text x=\"360\" y=\"192\" fill=\"#000\" stroke=\"none\" font-size=\"14\" text-anchor=\"middle\">X 이온<\/text><circle cx=\"420\" cy=\"18\" r=\"5\" fill=\"#000\" stroke=\"none\"/><text x=\"430\" y=\"23\" fill=\"#000\" stroke=\"none\" font-size=\"13\" text-anchor=\"start\">: 전자<\/text><\/svg>", "choices": ["ㄱ", "ㄴ", "ㄷ", "ㄱ, ㄴ", "ㄱ, ㄷ"], "answer": [1], "explanation": "X는 전자 12개 중 2개를 잃어 X²⁺가 된다. ㄱ. 칼슘은 전자 2개를 잃어 Ca²⁺가 되므로 같은 방식이다. ㄴ. 나트륨은 전자 1개를 잃어 Na⁺가 된다. ㄷ. 황은 전자 2개를 얻어 S²⁻가 된다. 전자 수는 같지만 얻는 방식이다. 따라서 ㄱ."}, {"id": "물질의구성:F-009", "sub": "F", "type_id": "F03", "review_group": "RG17", "role": "main", "difficulty": "상", "format": "서술형", "stem": "다음은 어느 학생이 이온의 이름을 정리한 노트이다.\n\n① Na⁺: 나트륨 이온\n② S²⁻: 황산 이온\n③ Cl⁻: 염소 이온\n④ OH⁻: 수산화 이온\n\n(1) 이름을 잘못 쓴 것을 두 가지 찾아 번호를 쓰고 바르게 고치시오.\n(2) 음이온의 이름을 짓는 규칙을 서술하시오.", "answer": "(1) ② 황화 이온, ③ 염화 이온 (2) 음이온은 원소 이름 뒤에 '~화 이온'을 붙이고, 원소 이름이 '소'로 끝나면 '소'를 빼고 '~화 이온'을 붙인다.", "scoring": {"total": 6, "criteria": [{"points": 2, "desc": "(1) ②를 찾아 황화 이온으로 고침"}, {"points": 2, "desc": "(1) ③을 찾아 염화 이온으로 고침"}, {"points": 1, "desc": "(2) 원소 이름 뒤에 '~화 이온'을 붙인다"}, {"points": 1, "desc": "(2) 원소 이름이 '소'로 끝나면 '소'를 뺀다"}], "accepted": [], "partial": "번호만 찾고 이름을 잘못 고친 항목은 그 항목만 0점(예: ③을 '염소화 이온'). ②를 '황산 이온이 맞다'고 판단하면 ② 항목 0점."}, "explanation": "S²⁻는 황 원자가 전자 2개를 얻은 음이온이므로 황화 이온이다. 황산 이온은 여러 원자로 이루어진 SO₄²⁻이다. Cl⁻는 '염소'가 '소'로 끝나므로 '소'를 빼고 염화 이온이라 한다. OH⁻는 수산화 이온으로 옳다."}, {"id": "물질의구성:F-010", "sub": "F", "type_id": "F04", "review_group": "RG17", "role": "reserve", "difficulty": "하", "format": "5지선다", "stem": "이온이 만들어지는 과정을 옳게 설명한 것은?", "choices": ["O²⁻: 산소 원자가 전자 2개를 얻는다.", "Ca²⁺: 칼슘 원자가 전자 1개를 잃는다.", "Al³⁺: 알루미늄 원자가 전자 3개를 얻는다.", "Cl⁻: 염소 원자가 양성자 1개를 얻는다.", "K⁺: 칼륨 원자가 전자 2개를 잃는다."], "answer": [1], "explanation": "이온식 오른쪽 위의 숫자는 잃거나 얻은 전자 수, 부호는 전하의 종류이다. ① 옳다. ② 전자 2개를 잃는다. ③ 양이온이므로 전자 3개를 잃는다. ④ 이동하는 것은 전자이며, 전자 1개를 얻는다. ⑤ 전자 1개를 잃는다."}, {"id": "물질의구성:F-011", "sub": "F", "type_id": "F07", "review_group": "RG17", "role": "reserve", "difficulty": "중", "format": "5지선다", "stem": "칼슘 원자(Ca)가 칼슘 이온이 되는 과정을 식으로 옳게 나타낸 것은? (단, ⊖는 전자이다.)", "choices": ["Ca + 2⊖ → Ca²⁺", "Ca → Ca²⁺ + ⊖", "Ca → Ca²⁺ + 2⊖", "Ca → Ca⁺² + 2⊖", "Ca + 2⊕ → Ca²⁺"], "answer": [3], "explanation": "칼슘 원자는 전자 2개를 잃어 Ca²⁺가 되므로, 잃은 전자를 화살표 오른쪽에 쓴다: Ca → Ca²⁺ + 2⊖. ① 전자를 얻는 것으로 나타냈다. ② 잃은 전자 수가 전하 크기(2)와 다르다. ④ 이온식은 숫자 뒤에 부호를 쓴다(Ca²⁺). ⑤ 양성자를 얻는 것이 아니다.", "textbook_tags": {"mode": "include_only", "books": ["오투", "비상"]}}, {"id": "물질의구성:F-012", "sub": "F", "type_id": "F05", "review_group": "RG18", "role": "main", "difficulty": "중", "format": "5지선다", "stem": "표는 입자 (가)~(라)의 양성자 수와 전자 수를 나타낸 것이다. 이에 대한 설명으로 옳은 것은?", "table": {"h": ["입자", "(가)", "(나)", "(다)", "(라)"], "r": [["양성자 수", "8", "11", "10", "12"], ["전자 수", "10", "10", "10", "10"]]}, "choices": ["(가)는 양이온이다.", "(나)와 (다)는 전자 수가 같으므로 같은 원소이다.", "(라)는 원자가 전자 2개를 얻어 생긴 이온이다.", "(가)~(라) 중 양이온은 1가지이다.", "(다)는 전기적으로 중성이다."], "answer": [5], "explanation": "(가) 양성자<전자 → 음이온(2−), (나) 양성자>전자 → 양이온(1+), (다) 양성자=전자 → 원자, (라) 양이온(2+). ① 음이온이다. ② 원소 종류는 양성자 수로 정해지므로 다른 원소이다. ③ (라)는 전자 2개를 잃었다. ④ 양이온은 (나), (라) 2가지이다. ⑤ 옳다."}, {"id": "물질의구성:F-013", "sub": "F", "type_id": "F06", "review_group": "RG18", "role": "main", "difficulty": "하", "format": "단답형", "stem": "칼슘의 원자 번호는 20, 산소의 원자 번호는 8이다. 칼슘 이온(Ca²⁺)과 산화 이온(O²⁻)의 양성자 수와 전자 수를 각각 쓰시오.", "answer": "Ca²⁺: 양성자 20개, 전자 18개 / O²⁻: 양성자 8개, 전자 10개", "scoring": {"total": 4, "criteria": [{"points": 1, "desc": "Ca²⁺ 양성자 20개"}, {"points": 1, "desc": "Ca²⁺ 전자 18개"}, {"points": 1, "desc": "O²⁻ 양성자 8개"}, {"points": 1, "desc": "O²⁻ 전자 10개"}], "accepted": [], "partial": "값마다 따로 채점. Ca²⁺ 전자 22, O²⁻ 전자 6은 부호를 반대로 계산한 오답으로 해당 칸 0점."}, "explanation": "원자 번호 = 양성자 수이고 이온이 되어도 양성자 수는 변하지 않는다. Ca²⁺는 전자 2개를 잃어 20 − 2 = 18개, O²⁻는 전자 2개를 얻어 8 + 2 = 10개이다."}, {"id": "물질의구성:F-014", "sub": "F", "type_id": "F06", "review_group": "RG18", "role": "main", "difficulty": "상", "format": "5지선다", "stem": "표는 몇 가지 이온의 원자 번호와 전자 수를 나타낸 것이다. A + B + C + D의 값은?", "table": {"h": ["이온", "Na⁺", "Cl⁻", "Al³⁺", "S²⁻"], "r": [["원자 번호", "11", "B", "13", "D"], ["전자 수", "A", "18", "C", "18"]]}, "choices": ["53", "59", "60", "61", "67"], "answer": [1], "explanation": "양이온은 전자를 잃었으므로 전자 수 = 원자 번호 − 전하, 음이온은 전자를 얻었으므로 원자 번호 = 전자 수 − 전하 크기이다. A = 11 − 1 = 10, B = 18 − 1 = 17, C = 13 − 3 = 10, D = 18 − 2 = 16. 따라서 10 + 17 + 10 + 16 = 53."}, {"id": "물질의구성:F-015", "sub": "F", "type_id": "F06", "review_group": "RG18", "role": "main", "difficulty": "상", "format": "단답형", "stem": "다음은 원소 A, B, C와 그 이온에 대한 자료이다. (단, A~C는 임의의 원소 기호이며 원자 번호는 20 이하이다.)\n\n• C 원자의 양성자 수는 8이고, C는 전자 2개를 얻어 C²⁻이 된다.\n• B 원자의 전자 수는 C²⁻의 전자 수보다 1개 적고, B는 전자 1개를 얻어 B⁻이 된다.\n• A²⁺과 B⁻은 전자 수가 같다.\n\nA, B, C의 원자 번호를 모두 더한 값을 구하시오.", "answer": "29", "scoring": {"total": 4, "rule": "29만 정답 4점, 그 밖에는 0점"}, "explanation": "C²⁻의 전자 수는 8 + 2 = 10이다. B 원자의 전자 수는 10 − 1 = 9이므로 B의 원자 번호는 9이고, B⁻의 전자 수는 10이다. A²⁺의 전자 수도 10이므로 A 원자의 전자 수(= 원자 번호)는 10 + 2 = 12이다. 따라서 12 + 9 + 8 = 29."}, {"id": "물질의구성:F-016", "sub": "F", "type_id": "F05", "review_group": "RG18", "role": "reserve", "difficulty": "중", "format": "서술형", "stem": "어느 학생이 '플루오린화 이온(F⁻), 네온 원자(Ne), 나트륨 이온(Na⁺)은 전자 수가 모두 10개로 같으므로 같은 원소이다.'라고 말하였다. 이 말이 옳은지 판단하고, 그 까닭을 원소의 종류를 정하는 기준과 관련지어 서술하시오. (단, F, Ne, Na의 원자 번호는 각각 9, 10, 11이다.)", "answer": "옳지 않다. 원소의 종류는 양성자 수(원자 번호)로 정해지는데, 세 입자의 양성자 수는 9, 10, 11로 서로 다르므로 서로 다른 원소이다.", "scoring": {"total": 4, "criteria": [{"points": 1, "desc": "'옳지 않다'고 판단"}, {"points": 2, "desc": "원소의 종류는 양성자 수(원자 번호)로 정해진다"}, {"points": 1, "desc": "세 입자의 양성자 수가 9, 10, 11로 다르다"}], "accepted": [], "partial": "전자 수가 같아 같은 원소라고 판단하면 0점."}, "explanation": "이온이 될 때 전자 수만 변하므로 전자 수는 원소를 구별하는 기준이 될 수 없다. 양성자 수가 같아야 같은 원소이다."}, {"id": "물질의구성:F-017", "sub": "F", "type_id": "F06", "review_group": "RG18", "role": "reserve", "difficulty": "상", "format": "합답형", "stem": "다음은 이온 세 가지와 각 원소의 원자 번호이다.\n\nH⁺(1), O²⁻(8), Al³⁺(13)\n\n이에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?", "bogi": ["ㄱ. H⁺에는 전자가 없다.", "ㄴ. O²⁻의 원자핵 전하량은 +10이다.", "ㄷ. Al³⁺의 전자 수는 O²⁻의 전자 수와 같다."], "choices": ["ㄱ", "ㄱ, ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "answer": [3], "explanation": "ㄱ. 참. 수소 원자는 전자가 1개뿐이므로 1개를 잃은 H⁺에는 전자가 없다. ㄴ. 거짓. 이온이 되어도 원자핵 전하량은 +8 그대로이다. ㄷ. 참. Al³⁺ 전자 13 − 3 = 10, O²⁻ 전자 8 + 2 = 10으로 같다. 따라서 ㄱ, ㄷ."}, {"id": "물질의구성:G-001", "sub": "G", "type_id": "G01", "review_group": "RG19", "role": "main", "difficulty": "하", "format": "5지선다", "stem": "그림과 같이 질산 칼륨 수용액을 적신 거름종이의 가운데에 황산 구리(Ⅱ) 수용액(파란색)을 A에, 과망가니즈산 칼륨 수용액(보라색)을 B에 떨어뜨린 후 전류를 흘려 주었다. 이에 대한 설명으로 옳은 것은?", "figure_svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"560\" height=\"250\" viewBox=\"0 0 560 250\" style=\"background:#fff\" fill=\"none\" stroke=\"#000\" stroke-width=\"1.5\" font-size=\"14\" font-family=\"'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif\"><rect x=\"0\" y=\"0\" width=\"560\" height=\"250\" fill=\"#fff\" stroke=\"none\"/><rect x=\"30\" y=\"105\" width=\"500\" height=\"100\" fill=\"#fff\" stroke-width=\"1.2\"/><rect x=\"60\" y=\"118\" width=\"440\" height=\"74\" fill=\"#eee\" stroke-width=\"1.2\"/><text x=\"280\" y=\"228\" fill=\"#000\" stroke=\"none\" font-size=\"12\" text-anchor=\"middle\">유리판<\/text><line x1=\"300\" y1=\"224\" x2=\"330\" y2=\"206\" stroke-width=\"1\"/><text x=\"280\" y=\"245\" fill=\"#000\" stroke=\"none\" font-size=\"12\" text-anchor=\"middle\">질산 칼륨 수용액을 적신 거름종이<\/text><rect x=\"63\" y=\"128\" width=\"18\" height=\"54\" fill=\"#fff\" stroke-width=\"1.5\"/><rect x=\"479\" y=\"128\" width=\"18\" height=\"54\" fill=\"#fff\" stroke-width=\"1.5\"/><rect x=\"215\" y=\"12\" width=\"130\" height=\"44\" fill=\"#fff\"/><text x=\"280\" y=\"40\" fill=\"#000\" stroke=\"none\" font-size=\"13\" text-anchor=\"middle\">전원 장치<\/text><text x=\"214\" y=\"78\" fill=\"#000\" stroke=\"none\" font-size=\"13\" text-anchor=\"middle\">(+)<\/text><text x=\"346\" y=\"78\" fill=\"#000\" stroke=\"none\" font-size=\"13\" text-anchor=\"middle\">(−)<\/text><path d=\"M232,
